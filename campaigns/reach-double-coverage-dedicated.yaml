campaign_id: reach-double-coverage-dedicated-1f1adbf3
title: Double Coverage Podcast Dedicated Account
objective: Find self-contained, high-retention moments from the Double Coverage podcast that can perform as short-form clips while preserving the speaker context and avoiding negative portrayal.
language: en
region_code: US

# Production runs process only explicitly listed targets. Authorized channels are rights
# constraints; they do not permit implicit discovery of additional videos during `clipper run`.
targets:
  mode: explicit
  videos:
    - video_id: 2Y4LP85PTak
      url: https://www.youtube.com/watch?v=2Y4LP85PTak
      channel_id: UCf1q6dhccWr6eQEcFFnJSbA

rights:
  confirmed: true
  authorized_channels:
    - UCf1q6dhccWr6eQEcFFnJSbA

content_constraints:
  min_clip_seconds: 20
  max_clip_seconds: 45

attribution_required: true
watermark_text: null
watermark_url: "https://drive.google.com/file/d/1wn3gL5h7cUZn-8jzTfwkAvLhbleXgbL6/view?usp=sharing"
