name: Remove vision hard timeout

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - ".github/workflows/remove-vision-hard-timeout.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - name: Remove Modal hard timeout from vision workers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/modal_open_models.py")
          text = source.read_text(encoding="utf-8")
          old = '''    # Client cancellation is 360s and the independent watchdog is 420s.\n    # Keep the Modal hard ceiling close behind them; never allow 30-minute vision calls.\n    timeout=480,\n'''
          count = text.count(old)
          if count != 2:
              raise RuntimeError(f"expected two bounded vision timeout blocks, found {count}")
          text = text.replace(old, "")
          source.write_text(text, encoding="utf-8")

          tests = Path("tests/test_vision_runtime_recovery.py")
          test_text = tests.read_text(encoding="utf-8")
          old_test = '''\n\ndef test_modal_vision_workers_have_eight_minute_hard_ceiling() -> None:\n    source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")\n    for class_name in ("VisionModel", "VisionModelLarge"):\n        prefix = source.split(f"class {class_name}:", 1)[0]\n        decorator = prefix.rsplit("@app.cls(", 1)[-1]\n        assert "timeout=480" in decorator\n        assert "timeout=1800" not in decorator\n'''
          new_test = '''\n\ndef test_modal_vision_workers_have_no_hard_timeout() -> None:\n    source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")\n    for class_name in ("VisionModel", "VisionModelLarge"):\n        prefix = source.split(f"class {class_name}:", 1)[0]\n        decorator = prefix.rsplit("@app.cls(", 1)[-1]\n        assert "timeout=" not in decorator\n'''
          if old_test not in test_text:
              raise RuntimeError("expected eight-minute vision timeout regression test not found")
          tests.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8")
          PY

      - name: Verify and format
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'ruff==0.16.7'
          ruff format scripts/modal_open_models.py tests/test_vision_runtime_recovery.py
          ruff check scripts/modal_open_models.py tests/test_vision_runtime_recovery.py
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
          for class_name in ("VisionModel", "VisionModelLarge"):
              prefix = source.split(f"class {class_name}:", 1)[0]
              decorator = prefix.rsplit("@app.cls(", 1)[-1]
              if "timeout=" in decorator:
                  raise RuntimeError(f"{class_name} still has a Modal hard timeout")
          PY

      - name: Commit source change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-vision-hard-timeout.yml
          git add scripts/modal_open_models.py tests/test_vision_runtime_recovery.py
          git commit -m "fix: remove Modal vision hard timeout"
          git push origin HEAD:feat/contentrewards-campaign-factory
