name: Approved cinematic host image-to-3D

on:
  push:
    branches:
      - feat/unified-niche-tts
    paths:
      - .github/workflows/approved-host-image-to-3d.yml
      - scripts/trellis_image_to_3d.py
  workflow_dispatch:
    inputs:
      probe_only:
        type: boolean
        required: true
        default: false
        description: Probe only when explicitly requested (default generates the GLB)

permissions:
  contents: read

jobs:
  trellis2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source Gradio and GLB QA dependencies
        run: |
          python -m pip install "gradio_client>=1.12,<3" "Pillow>=11,<13" "trimesh>=4.6,<5" "numpy>=1.26,<3"
      - name: Decode pinned approved character image from repository
        if: github.event_name == 'workflow_dispatch' && inputs.probe_only == false
        run: |
          set -euo pipefail
          mkdir -p artifacts/host-3d
          base64 -d assets/character/page-to-life-host-approved-512.webp.b64 > artifacts/host-3d/source-image.webp
          echo "c3bbc6395e47c04646ad3f0ad44f13873511e4ee3189046eafbc682225e746d2  artifacts/host-3d/source-image.webp" | sha256sum -c -
      - name: Probe Space API or generate candidate GLB with ZeroGPU
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROBE_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.probe_only }}
        run: |
          set -euo pipefail
          if [[ "$PROBE_ONLY" == "true" ]]; then
            python scripts/trellis_image_to_3d.py --probe --output artifacts/host-3d
          else
            python scripts/trellis_image_to_3d.py \
              --reference artifacts/host-3d/source-image.webp \
              --output artifacts/host-3d --seed 724 --resolution 512
          fi
      - name: Upload source, mesh candidate and factual failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-to-3d-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/host-3d/
          if-no-files-found: warn
          retention-days: 14
