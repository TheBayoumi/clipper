name: Apply required visual presence policy v2

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/apply-lovable-engine-patch-v2.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply patch
        run: python scripts/apply_lovable_visual_policy_patch.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format and validate
        run: |
          ruff format src/clipper/models.py src/clipper/editorial_integrity.py src/clipper/quality_pipeline.py src/clipper/quality_batch.py src/clipper/visual_ai.py src/clipper/pipeline.py tests/test_visual_presence_policy.py
          ruff check src/clipper/models.py src/clipper/editorial_integrity.py src/clipper/quality_pipeline.py src/clipper/quality_batch.py src/clipper/visual_ai.py src/clipper/pipeline.py tests/test_visual_presence_policy.py
          mypy
          pytest -q tests/test_visual_presence_policy.py tests/test_models.py tests/test_editorial_integrity.py tests/test_quality_pipeline.py tests/test_quality_batch.py tests/test_visual_ai.py tests/test_pipeline.py
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/clipper tests/test_visual_presence_policy.py
          git commit -m 'feat: enforce required visual presence'
          git pull --rebase origin feat/contentrewards-campaign-factory
          git push origin HEAD:feat/contentrewards-campaign-factory
