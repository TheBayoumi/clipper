name: Lovable source probe

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/lovable-source-probe.yml
      - acceptance/lovable-source-probe-request.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve canonical channel identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sources = [
              {
                  "video_id": "lJX8VkZg-Vw",
                  "expected_handle": "BenAI92",
                  "expected_author": "Ben AI",
              },
              {
                  "video_id": "DZtGxNs9AVg",
                  "expected_handle": "LennysPodcast",
                  "expected_author": "Lenny's Podcast",
              },
              {
                  "video_id": "DHLczPQj9rA",
                  "expected_handle": "20VC",
                  "expected_author": "20VC with Harry Stebbings",
              },
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }

          def get_text(url: str) -> str:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8", "replace")

          def resolve_channel_id(handle: str) -> tuple[str | None, list[str]]:
              url = f"https://www.youtube.com/@{handle}"
              html = get_text(url)
              patterns = [
                  r'"channelId":"(UC[0-9A-Za-z_-]{20,})"',
                  r'"externalId":"(UC[0-9A-Za-z_-]{20,})"',
                  r'channel_id=(UC[0-9A-Za-z_-]{20,})',
                  r'https://www\.youtube\.com/channel/(UC[0-9A-Za-z_-]{20,})',
              ]
              matches = []
              for pattern in patterns:
                  matches.extend(re.findall(pattern, html))
              unique = list(dict.fromkeys(matches))
              return (unique[0] if unique else None, unique)

          rows = []
          failures = []
          for item in sources:
              video_id = item["video_id"]
              video_url = f"https://www.youtube.com/watch?v={video_id}"
              oembed_url = "https://www.youtube.com/oembed?" + urllib.parse.urlencode(
                  {"url": video_url, "format": "json"}
              )
              try:
                  oembed = json.loads(get_text(oembed_url))
                  author_name = str(oembed.get("author_name") or "")
                  author_url = str(oembed.get("author_url") or "")
              except Exception as exc:
                  author_name = ""
                  author_url = ""
                  failures.append(
                      {
                          "video_id": video_id,
                          "stage": "oembed",
                          "error": f"{type(exc).__name__}: {exc}",
                      }
                  )

              handle = item["expected_handle"]
              try:
                  channel_id, candidates = resolve_channel_id(handle)
              except Exception as exc:
                  channel_id = None
                  candidates = []
                  failures.append(
                      {
                          "video_id": video_id,
                          "stage": "channel_page",
                          "handle": handle,
                          "error": f"{type(exc).__name__}: {exc}",
                      }
                  )
              rows.append(
                  {
                      "video_id": video_id,
                      "handle": handle,
                      "expected_author": item["expected_author"],
                      "oembed_author_name": author_name,
                      "oembed_author_url": author_url,
                      "channel_id": channel_id,
                      "channel_id_candidates": candidates,
                  }
              )

          result = {"sources": rows, "failures": failures}
          Path("lovable-source-probe.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          unresolved = [row["video_id"] for row in rows if not row["channel_id"]]
          if unresolved:
              raise SystemExit(f"unresolved channel IDs: {unresolved}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lovable-source-probe
          path: lovable-source-probe.json
          if-no-files-found: error
