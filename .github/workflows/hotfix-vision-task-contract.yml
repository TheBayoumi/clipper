name: Hotfix vision telemetry task contract

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/hotfix-vision-task-contract.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply producer telemetry repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          source_path = Path("scripts/modal_open_models.py")
          source = source_path.read_text(encoding="utf-8")

          complete_old = (
              '                            "event": "vision_generation_complete",\n'
              '                            "worker_lifecycle_id": lifecycle_id,\n'
              '                            "execution_id": execution_id,\n'
              '                            "attempt": attempt,'
          )
          complete_new = (
              '                            "event": "vision_generation_complete",\n'
              '                            "worker_lifecycle_id": lifecycle_id,\n'
              '                            "execution_id": execution_id,\n'
              '                            "task": str(payload.get("task") or ""),\n'
              '                            "attempt": attempt,'
          )
          if source.count(complete_old) != 1:
              raise SystemExit(
                  f"expected one vision_generation_complete telemetry block, found {source.count(complete_old)}"
              )
          source = source.replace(complete_old, complete_new, 1)

          error_old = (
              '                            "event": "vision_inference_error",\n'
              '                            "worker_lifecycle_id": worker.lifecycle_id,\n'
              '                            "execution_id": _execution_id(payload),\n'
              '                            "model_id": model_id,'
          )
          error_new = (
              '                            "event": "vision_inference_error",\n'
              '                            "worker_lifecycle_id": worker.lifecycle_id,\n'
              '                            "execution_id": _execution_id(payload),\n'
              '                            "task": str(payload.get("task") or ""),\n'
              '                            "model_id": model_id,'
          )
          if source.count(error_old) != 1:
              raise SystemExit(
                  f"expected one vision_inference_error telemetry block, found {source.count(error_old)}"
              )
          source = source.replace(error_old, error_new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_b64 = ""  # overwritten below
          test_b64 = ""
          Path("tests/test_vision_telemetry_task_contract.py").write_bytes(base64.b64decode(test_b64))
          PY

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest ruff
          ruff format tests/test_vision_telemetry_task_contract.py
          ruff format --check scripts/modal_open_models.py
          ruff check scripts/modal_open_models.py tests/test_vision_telemetry_task_contract.py
          python -m pytest -q tests/test_vision_telemetry_task_contract.py tests/test_modal_execution_spy.py

      - name: Commit clean hotfix and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hotfix-vision-task-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "fix: preserve vision task identity in terminal telemetry"
          git push origin HEAD:feat/contentrewards-campaign-factory
