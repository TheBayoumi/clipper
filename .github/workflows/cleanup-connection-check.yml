name: Cleanup connection check

# Runs on workflow_dispatch, and on pushes to this review branch that touch this file only.
# A branch-only workflow cannot be dispatched from the UI until it is on the default branch,
# so the push trigger is what lets it run here without changing main.
# No video generation, no GPU, no Modal .remote() calls, no deploys, no publishing.
# Connection checks are read-only metadata lookups. Secret values are never printed.
on:
  workflow_dispatch:
  push:
    branches: [review/unified-tts-cleanup]
    paths: [".github/workflows/cleanup-connection-check.yml"]

permissions:
  contents: read

concurrency:
  group: cleanup-connection-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Removed modules are gone and nothing imports them
        run: |
          test ! -e src/clipper/performance.py
          test ! -e src/clipper/transcript.py
          ! grep -rnE "clipper\.(performance|transcript)\b|from clipper import .*\b(performance|transcript)\b" src scripts tests
      - name: Every clipper module imports
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import clipper
          failed = []
          for m in pkgutil.walk_packages(clipper.__path__, "clipper."):
              if m.name == "clipper.__main__":
                  continue  # importing it would execute the CLI
              try:
                  importlib.import_module(m.name)
              except Exception as exc:
                  failed.append((m.name, type(exc).__name__))
          for name, err in failed:
              print(f"IMPORT_FAILED {name} {err}")
          print(f"IMPORT_CHECK_DONE failed={len(failed)}")
          sys.exit(1 if failed else 0)
          PY
      - name: CLI entry point loads
        run: clipper --help
      - name: Ruff lint
        if: always()
        run: ruff check .
      - name: Strict mypy
        if: always()
        run: mypy
      - name: Test suite (mocked, no network, no inference) with coverage floor
        if: always()
        run: pytest

  service-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_COOKIES_PRESENT: ${{ secrets.CLIPPER_YOUTUBE_COOKIES_B64 != '' }}
      CLIPPER_MODAL_APP: clipper-open-editor
      CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client libraries only
        run: python -m pip install "modal==1.5.5" "huggingface-hub>=1.24,<2"
      - name: Secrets present (names only)
        run: |
          python - <<'PY'
          import os
          for k in ("MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET", "HF_TOKEN"):
              print(f"{k}: {'present' if os.environ.get(k) else 'MISSING'}")
          print(f"CLIPPER_YOUTUBE_COOKIES_B64: {'present' if os.environ.get('YT_COOKIES_PRESENT') == 'true' else 'MISSING'}")
          PY
      - name: Modal authentication and workspace (read-only)
        if: always()
        run: |
          python - <<'PY'
          import sys
          import modal
          try:
              ws = modal.Workspace.from_context()
              ws.hydrate()
              print("MODAL_AUTH_OK workspace_resolved=true")
          except Exception as exc:
              print(f"MODAL_AUTH_FAILED {type(exc).__name__}")
              sys.exit(1)
          PY
      - name: Deployed Modal handles exist (hydrate only, no execution)
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          import modal
          env = os.environ["MODAL_ENVIRONMENT"]
          checks = [
              (os.environ["CLIPPER_MODAL_APP"], "function", n)
              for n in ("transcribe", "align", "diarize", "editorial_schema_smoke",
                        "hf_access_smoke", "deployment_identity")
          ] + [
              (os.environ["CLIPPER_MODAL_APP"], "cls", n)
              for n in ("EditorialModel", "VisionModel", "VisionModelLarge")
          ] + [
              (os.environ["CLIPPER_MODAL_PIPELINE_APP"], "function", n)
              for n in ("acquire_source", "run_full_cycle", "deployment_identity")
          ]
          bad = 0
          for app, kind, name in checks:
              try:
                  ns = modal.Function if kind == "function" else modal.Cls
                  ns.from_name(app, name, environment_name=env).hydrate()
                  print(f"FOUND {app}/{name}")
              except Exception as exc:
                  bad += 1
                  print(f"NOT_AVAILABLE {app}/{name} {type(exc).__name__}")
          print(f"MODAL_HANDLE_CHECK_DONE unavailable={bad}")
          sys.exit(1 if bad else 0)
          PY
      - name: Hugging Face token and pyannote model access (metadata only, no download)
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ.get("HF_TOKEN") or None)
          try:
              api.whoami()
              print("HF_TOKEN_VALID")
          except Exception as exc:
              print(f"HF_TOKEN_INVALID {type(exc).__name__}")
              sys.exit(1)
          try:
              info = api.model_info("pyannote/speaker-diarization-community-1")
              print(f"HF_MODEL_ACCESS_OK revision_resolved={bool(info.sha)}")
          except Exception as exc:
              print(f"HF_MODEL_ACCESS_FAILED {type(exc).__name__}")
              sys.exit(1)
          PY

  modal-accounts:
    name: Modal account ${{ matrix.slot }} metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: primary
            token_id: MODAL_TOKEN_ID
            token_secret: MODAL_TOKEN_SECRET
            expected_workspace: ""
          - slot: backup-1
            token_id: MODAL_TOKEN_ID_2
            token_secret: MODAL_TOKEN_SECRET_2
            expected_workspace: mahmoud-bayoumi-bb
          - slot: backup-2
            token_id: MODAL_TOKEN_ID_3
            token_secret: MODAL_TOKEN_SECRET_3
            expected_workspace: thebayoumi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata client only
        run: python -m pip install "modal==1.5.5"
      - name: Authenticate and inspect deployments without execution
        env:
          MODAL_TOKEN_ID: ${{ secrets[matrix.token_id] }}
          MODAL_TOKEN_SECRET: ${{ secrets[matrix.token_secret] }}
          MODAL_ENVIRONMENT: main
          ACCOUNT_SLOT: ${{ matrix.slot }}
          EXPECTED_WORKSPACE: ${{ matrix.expected_workspace }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path
          import modal
          from modal.exception import NotFoundError

          slot = os.environ["ACCOUNT_SLOT"]
          rows = [f"## Modal {slot}: metadata only", ""]
          failed = False
          def record(message):
              rows.append(message)
              print(message)
          def finish(code):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("\n".join(rows) + "\n")
              sys.exit(code)
          if not all(os.environ.get(k) for k in ("MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET")):
              record("Authentication: NOT TESTED, credential pair missing or incomplete.")
              finish(1)
          record("Credentials: both configured (values never printed).")
          try:
              ws = modal.Workspace.from_context()
              ws.hydrate()  # WorkspaceNameLookup only
              name = ws.name
              name = name() if callable(name) else name
              record(f"Authentication: PASS. Workspace: `{name}`. Environment: `main`.")
          except Exception as exc:
              record(f"Authentication: FAILED ({type(exc).__name__}). No deployment checks attempted.")
              finish(1)
          expected = os.environ.get("EXPECTED_WORKSPACE")
          if expected and name != expected:
              record(f"Workspace identity: MISMATCH against configured `{expected}`.")
              failed = True
          elif expected:
              record("Workspace identity: matches repository configuration.")
          else:
              record("Workspace identity: observed above; no primary-name assertion configured.")

          checks = [("generic", "clipper-open-editor", "function", n)
                    for n in ("transcribe", "align", "diarize", "editorial_schema_smoke",
                              "hf_access_smoke", "deployment_identity")]
          checks += [("generic", "clipper-open-editor", "class", n)
                     for n in ("EditorialModel", "VisionModel", "VisionModelLarge")]
          checks += [("generic", "clipper-production-pipeline", "function", n)
                     for n in ("acquire_source", "run_full_cycle", "deployment_identity")]
          for script, base, function in (
              ("scripts/modal_qwen_keyframes.py", "clipper-qwen-cinematic-keyframes", "generate_keyframe"),
              ("scripts/modal_wan_s2v.py", "clipper-wan-s2v", "generate_s2v"),
          ):
              digest = hashlib.sha256(Path(script).read_bytes()).hexdigest()[:16]
              checks.append(("versioned", f"{base}-{digest}", "function", function))
          rows += ["", "| Kind | App/object | Result |", "| --- | --- | --- |"]
          found = missing = errors = 0
          for group, app, kind, name in checks:
              try:
                  cls = modal.Function if kind == "function" else modal.Cls
                  cls.from_name(app, name, environment_name="main").hydrate()
                  # Hydration is FunctionGet/ClassGet metadata, never remote/spawn/map/deploy.
                  status = "FOUND"
                  found += 1
              except NotFoundError:
                  status = "NOT FOUND in this workspace/environment"
                  missing += 1
              except Exception as exc:
                  status = f"UNVERIFIED ({type(exc).__name__})"
                  errors += 1
              record(f"| {group} {kind} | `{app}/{name}` | {status} |")
          record(f"Metadata totals: found={found}, not_found={missing}, unverified={errors}.")
          record("Missing objects are deployment inventory results, not authentication failures.")
          record("No remote functions called, no containers/GPU allocated, no deployments or video generation.")
          finish(1 if failed or errors else 0)
          PY

  one-time-second-diagnostic:
    name: One-time second-account T4 diagnostic
    if: github.run_attempt == 1 && github.event_name == 'push' && github.event.head_commit.message == 'Run one second-account T4 diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install client only
      run: python -m pip install "modal==1.5.5" "cryptography>=44,<47"
    - name: Sequential T4 CUDA calculation, stop on first failure, verify cleanup
      run: 'python - <<''MAKE_FILES''

        from pathlib import Path

        Path(''/tmp/t4_worker.py'').write_text("import json, logging, os, threading, time, traceback\nfrom pathlib import Path\nimport modal\nlogging.disable(logging.CRITICAL)\napp = modal.App(os.environ.get(''PROBE_APP_NAME'',''clipper-t4-probe-remote''))\nimage = modal.Image.from_registry(''pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime'')\n\n@app.function(image=image, gpu=''T4'', cpu=(1.0,1.0), memory=(4096,4096),\n              max_containers=1, min_containers=0, buffer_containers=0,\n              single_use_containers=True, scaledown_window=2,\n              retries=0, startup_timeout=60, timeout=15)\ndef arithmetic():\n    import time\n    import torch\n    started=time.monotonic()\n    assert torch.cuda.is_available(), ''CUDA unavailable''\n    name=torch.cuda.get_device_name(0)\n    assert ''T4'' in name, ''Unexpected GPU type''\n    x=torch.arange(1024,device=''cuda'',dtype=torch.float32)\n    y=x*2+1\n    torch.cuda.synchronize()\n    result=y.cpu()\n    assert torch.equal(result,torch.arange(1024,dtype=torch.float32)*2+1), ''Incorrect CUDA result''\n    return {''gpu'':name,''device_memory_bytes'':torch.cuda.get_device_properties(0).total_memory,\n            ''elements_checked'':1024,''first'':float(result[0]),''last'':float(result[-1]),\n            ''cuda_elapsed_seconds'':round(time.monotonic()-started,6),''cuda_result'':''PASS''}\n\n# Save the exact temporary ID even while image initialization is in progress.\ndef save_id():\n    for _ in range(600):\n        if app.app_id:\n            Path(os.environ[''PROBE_ID_PATH'']).write_text(app.app_id)\n            return\n        time.sleep(.1)\nif __name__ == ''__main__'':\n    threading.Thread(target=save_id,daemon=True).start()\n    result={}\n    try:\n        with app.run(detach=False):\n            Path(os.environ[''PROBE_ID_PATH'']).write_text(app.app_id)\n            result=arithmetic.remote()\n            result[''dashboard_url'']=app.get_dashboard_url()\n        result[''status'']=''PASS''\n    except BaseException as exc:\n        result={''status'':''FAIL'',''error_type'':type(exc).__name__,''error_message'':str(exc),''traceback'':traceback.format_exc()}\n    finally:\n        Path(os.environ[''PROBE_RESULT_PATH'']).write_text(json.dumps(result))\n")

        Path(''/tmp/t4_orchestrator.py'').write_text(''from cryptography.hazmat.primitives import serialization,hashes\nfrom cryptography.hazmat.primitives.asymmetric import padding\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\nimport base64,secrets\nPUBLIC_KEY=\''-----BEGIN PUBLIC KEY-----\\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAjgv2qP9Sl04iylmdp3pJ\\nZiLIkKHS1Ui6eUTW5j7KkR6YGWnTbSI4vrSqfh4+7vRNE5qcFNz6d8HQXj3vqzDa\\nCcqUZL5mn6avqdSkljNgK3BL2jLYECcCywqhSntwpPYSSfKs1kbV4+kWjkf7NsJU\\nkyNiU5bu03e/h5JF0uf+0AaW5QKrpMWbwesEznveeuTmw3CvdwbiWJ8l7e2sAXKb\\n4RkKPOWVwrWG/Tsjd6GWl5CmI6cKpjHeaIRn0FfUNxPCBP54FUo5sejIsAAT0PS1\\n7vJqV6qh+K7ximNPfACmswrqq+0plpMnkVXmypooQT8KH/8GLx0FQMpWh+xEJDct\\nhTDrt8IbSfCJIT66to+O0RjcuJV565nXJ/j1c2Myo7Xh4EvsMNA/UHtKMiQglagB\\nQ89dqfcV737x81RMxNtTYAN+EkPWgVdW8oaAJPfaOIZ16P28jLDnZdK81IarLOpc\\nHX/2z8DG7JbNshYE+inFgd76ez9tfi9NttLiWE5y8kIPAgMBAAE=\\n-----END PUBLIC KEY-----\\n\''\ndef emit_private(row, log_path):\n    payload=json.dumps({\''result\'':row,\''worker_log\'':Path(log_path).read_text() if Path(log_path).exists() else \''\''}).encode()\n    aes=secrets.token_bytes(32);nonce=secrets.token_bytes(12)\n    enc=AESGCM(aes).encrypt(nonce,payload,b\''modal-second-v1\'')\n    wrap=serialization.load_pem_public_key(PUBLIC_KEY.encode()).encrypt(aes,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))\n    envelope={k:base64.b64encode(v).decode() for k,v in [(\''key\'',wrap),(\''nonce\'',nonce),(\''ciphertext\'',enc)]}\n    print(\''PRIVATE_DIAGNOSTIC_V1 \''+json.dumps(envelope),flush=True)\nimport contextlib, io, json, logging, os, subprocess, sys, time, uuid\nfrom pathlib import Path\nlogging.disable(logging.CRITICAL)\nbase=os.environ.copy()\nslots=[(\''second\'',\''_2\'',\''mahmoud-bayoumi-bb\'')]\nresults=[]\n\ndef list_apps(env):\n    p=subprocess.run([sys.executable,\''-m\'',\''modal\'',\''app\'',\''list\'',\''--json\''],env=env,capture_output=True,text=True,timeout=25)\n    if p.returncode: raise RuntimeError(\''AppListUnavailable\'')\n    return json.loads(p.stdout)\n\nfor slot,suffix,expected in slots:\n    env={k:v for k,v in base.items() if not k.startswith(\''MODAL_TOKEN\'')}\n    env[\''MODAL_TOKEN_ID\'']=base.get(\''MODAL_TOKEN_ID\''+suffix,\''\'')\n    env[\''MODAL_TOKEN_SECRET\'']=base.get(\''MODAL_TOKEN_SECRET\''+suffix,\''\'')\n    env[\''MODAL_ENVIRONMENT\'']=\''main\''\n    name=\''clipper-t4-probe-\''+uuid.uuid4().hex[:16]\n    env.update(PROBE_APP_NAME=name,PROBE_ID_PATH=\''/tmp/\''+name+\''.id\'',PROBE_RESULT_PATH=\''/tmp/\''+name+\''.json\'')\n    row={\''slot\'':slot,\''status\'':\''FAIL\'',\''requested_gpu\'':\''T4\''}\n    start=time.monotonic(); appid=None; proc=None\n    try:\n        # Workspace validation isolated from every other account\''s credentials.\n        auth=subprocess.run([sys.executable,\''-c\'',"import modal,json; w=modal.Workspace.from_context();w.hydrate();n=w.name;print(json.dumps(n() if callable(n) else n))"],env=env,capture_output=True,text=True,timeout=25)\n        if auth.returncode or json.loads(auth.stdout)!=expected: raise RuntimeError(\''WorkspaceValidationFailed\'')\n        list_apps(env) # Prove cleanup/status permission before starting anything.\n        with open(\''/tmp/\''+name+\''.private-log\'',\''w\'') as log:\n            proc=subprocess.Popen([sys.executable,\''/tmp/t4_worker.py\''],env=env,stdout=log,stderr=subprocess.STDOUT)\n            try: proc.wait(timeout=180)\n            except subprocess.TimeoutExpired:\n                proc.terminate()\n                try:proc.wait(timeout=10)\n                except subprocess.TimeoutExpired:proc.kill();proc.wait()\n                row[\''error_type\'']=\''ClientDeadlineExceeded\''\n        resultpath=Path(env[\''PROBE_RESULT_PATH\''])\n        if resultpath.exists(): row.update(json.loads(resultpath.read_text()))\n    except BaseException as exc:\n        row[\''error_type\'']=type(exc).__name__\n    finally:\n        try:\n            idpath=Path(env[\''PROBE_ID_PATH\''])\n            if idpath.exists(): appid=idpath.read_text().strip()\n            apps=list_apps(env)\n            matching=[a for a in apps if a.get(\''description\'')==name or (appid and a.get(\''app_id\'')==appid)]\n            ids={a[\''app_id\''] for a in matching}\n            if appid: ids.add(appid)\n            for ident in ids:\n                p=subprocess.run([sys.executable,\''-m\'',\''modal\'',\''app\'',\''stop\'',\''--yes\'',ident],env=env,capture_output=True,text=True,timeout=25)\n                if p.returncode: raise RuntimeError(\''ExplicitStopFailed\'')\n            # Bounded status verification, not a workload retry.\n            stopped=False\n            for _ in range(5):\n                latest=list_apps(env)\n                own=[a for a in latest if a.get(\''app_id\'') in ids or a.get(\''description\'')==name]\n                if ids and own and all(str(a.get(\''state\'',\''\'')).lower()==\''stopped\'' and str(a.get(\''tasks\'',\''\''))==\''0\'' for a in own):\n                    stopped=True;break\n                if not ids and not own:\n                    stopped=True;break\n                time.sleep(2)\n            row[\''app_id\'']=appid\n            row[\''cleanup\'']=\''STOPPED_ZERO_TASKS\'' if stopped and ids else (\''NO_APP_CREATED\'' if stopped else \''UNVERIFIED\'')\n            if not stopped: row[\''status\'']=\''FAIL\''\n        except BaseException as exc:\n            row[\''cleanup\'']=\''UNVERIFIED\'';row[\''cleanup_error_type\'']=type(exc).__name__;row[\''status\'']=\''FAIL\''\n        row[\''wall_seconds\'']=round(time.monotonic()-start,3)\n        results.append(row)\n        emit_private(row,\''/tmp/\''+name+\''.private-log\'')\n    if row[\''status\'']!=\''PASS\'':\n        print(\''SECOND_ACCOUNT_COMPLETED_WITH_FAILURE. No other accounts attempted.\'',flush=True)\n        sys.exit(1)\n'')

        MAKE_FILES

        python /tmp/t4_orchestrator.py

        '
