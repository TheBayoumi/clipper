name: Cleanup connection check

# Runs on workflow_dispatch, and on pushes to this review branch that touch this file only.
# A branch-only workflow cannot be dispatched from the UI until it is on the default branch,
# so the push trigger is what lets it run here without changing main.
# No video generation, no GPU, no Modal .remote() calls, no deploys, no publishing.
# Connection checks are read-only metadata lookups. Secret values are never printed.
on:
  workflow_dispatch:
  push:
    branches: [review/unified-tts-cleanup]
    paths: [".github/workflows/cleanup-connection-check.yml"]

permissions:
  contents: read

concurrency:
  group: cleanup-connection-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Removed modules are gone and nothing imports them
        run: |
          test ! -e src/clipper/performance.py
          test ! -e src/clipper/transcript.py
          ! grep -rnE "clipper\.(performance|transcript)\b|from clipper import .*\b(performance|transcript)\b" src scripts tests
      - name: Every clipper module imports
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import clipper
          failed = []
          for m in pkgutil.walk_packages(clipper.__path__, "clipper."):
              if m.name == "clipper.__main__":
                  continue  # importing it would execute the CLI
              try:
                  importlib.import_module(m.name)
              except Exception as exc:
                  failed.append((m.name, type(exc).__name__))
          for name, err in failed:
              print(f"IMPORT_FAILED {name} {err}")
          print(f"IMPORT_CHECK_DONE failed={len(failed)}")
          sys.exit(1 if failed else 0)
          PY
      - name: CLI entry point loads
        run: clipper --help
      - name: Ruff lint
        if: always()
        run: ruff check .
      - name: Strict mypy
        if: always()
        run: mypy
      - name: Test suite (mocked, no network, no inference) with coverage floor
        if: always()
        run: pytest

  service-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YT_COOKIES_PRESENT: ${{ secrets.CLIPPER_YOUTUBE_COOKIES_B64 != '' }}
      CLIPPER_MODAL_APP: clipper-open-editor
      CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install client libraries only
        run: python -m pip install "modal==1.5.5" "huggingface-hub>=1.24,<2"
      - name: Secrets present (names only)
        run: |
          python - <<'PY'
          import os
          for k in ("MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET", "HF_TOKEN"):
              print(f"{k}: {'present' if os.environ.get(k) else 'MISSING'}")
          print(f"CLIPPER_YOUTUBE_COOKIES_B64: {'present' if os.environ.get('YT_COOKIES_PRESENT') == 'true' else 'MISSING'}")
          PY
      - name: Modal authentication and workspace (read-only)
        if: always()
        run: |
          python - <<'PY'
          import sys
          import modal
          try:
              ws = modal.Workspace.from_context()
              ws.hydrate()
              print("MODAL_AUTH_OK workspace_resolved=true")
          except Exception as exc:
              print(f"MODAL_AUTH_FAILED {type(exc).__name__}")
              sys.exit(1)
          PY
      - name: Deployed Modal handles exist (hydrate only, no execution)
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          import modal
          env = os.environ["MODAL_ENVIRONMENT"]
          checks = [
              (os.environ["CLIPPER_MODAL_APP"], "function", n)
              for n in ("transcribe", "align", "diarize", "editorial_schema_smoke",
                        "hf_access_smoke", "deployment_identity")
          ] + [
              (os.environ["CLIPPER_MODAL_APP"], "cls", n)
              for n in ("EditorialModel", "VisionModel", "VisionModelLarge")
          ] + [
              (os.environ["CLIPPER_MODAL_PIPELINE_APP"], "function", n)
              for n in ("acquire_source", "run_full_cycle", "deployment_identity")
          ]
          bad = 0
          for app, kind, name in checks:
              try:
                  ns = modal.Function if kind == "function" else modal.Cls
                  ns.from_name(app, name, environment_name=env).hydrate()
                  print(f"FOUND {app}/{name}")
              except Exception as exc:
                  bad += 1
                  print(f"NOT_AVAILABLE {app}/{name} {type(exc).__name__}")
          print(f"MODAL_HANDLE_CHECK_DONE unavailable={bad}")
          sys.exit(1 if bad else 0)
          PY
      - name: Hugging Face token and pyannote model access (metadata only, no download)
        if: always()
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ.get("HF_TOKEN") or None)
          try:
              api.whoami()
              print("HF_TOKEN_VALID")
          except Exception as exc:
              print(f"HF_TOKEN_INVALID {type(exc).__name__}")
              sys.exit(1)
          try:
              info = api.model_info("pyannote/speaker-diarization-community-1")
              print(f"HF_MODEL_ACCESS_OK revision_resolved={bool(info.sha)}")
          except Exception as exc:
              print(f"HF_MODEL_ACCESS_FAILED {type(exc).__name__}")
              sys.exit(1)
          PY

  modal-accounts:
    name: Modal account ${{ matrix.slot }} metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: primary
            token_id: MODAL_TOKEN_ID
            token_secret: MODAL_TOKEN_SECRET
            expected_workspace: ""
          - slot: backup-1
            token_id: MODAL_TOKEN_ID_2
            token_secret: MODAL_TOKEN_SECRET_2
            expected_workspace: mahmoud-bayoumi-bb
          - slot: backup-2
            token_id: MODAL_TOKEN_ID_3
            token_secret: MODAL_TOKEN_SECRET_3
            expected_workspace: thebayoumi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata client only
        run: python -m pip install "modal==1.5.5"
      - name: Authenticate and inspect deployments without execution
        env:
          MODAL_TOKEN_ID: ${{ secrets[matrix.token_id] }}
          MODAL_TOKEN_SECRET: ${{ secrets[matrix.token_secret] }}
          MODAL_ENVIRONMENT: main
          ACCOUNT_SLOT: ${{ matrix.slot }}
          EXPECTED_WORKSPACE: ${{ matrix.expected_workspace }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path
          import modal
          from modal.exception import NotFoundError

          slot = os.environ["ACCOUNT_SLOT"]
          rows = [f"## Modal {slot}: metadata only", ""]
          failed = False
          def record(message):
              rows.append(message)
              print(message)
          def finish(code):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("\n".join(rows) + "\n")
              sys.exit(code)
          if not all(os.environ.get(k) for k in ("MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET")):
              record("Authentication: NOT TESTED, credential pair missing or incomplete.")
              finish(1)
          record("Credentials: both configured (values never printed).")
          try:
              ws = modal.Workspace.from_context()
              ws.hydrate()  # WorkspaceNameLookup only
              name = ws.name
              name = name() if callable(name) else name
              record(f"Authentication: PASS. Workspace: `{name}`. Environment: `main`.")
          except Exception as exc:
              record(f"Authentication: FAILED ({type(exc).__name__}). No deployment checks attempted.")
              finish(1)
          expected = os.environ.get("EXPECTED_WORKSPACE")
          if expected and name != expected:
              record(f"Workspace identity: MISMATCH against configured `{expected}`.")
              failed = True
          elif expected:
              record("Workspace identity: matches repository configuration.")
          else:
              record("Workspace identity: observed above; no primary-name assertion configured.")

          checks = [("generic", "clipper-open-editor", "function", n)
                    for n in ("transcribe", "align", "diarize", "editorial_schema_smoke",
                              "hf_access_smoke", "deployment_identity")]
          checks += [("generic", "clipper-open-editor", "class", n)
                     for n in ("EditorialModel", "VisionModel", "VisionModelLarge")]
          checks += [("generic", "clipper-production-pipeline", "function", n)
                     for n in ("acquire_source", "run_full_cycle", "deployment_identity")]
          for script, base, function in (
              ("scripts/modal_qwen_keyframes.py", "clipper-qwen-cinematic-keyframes", "generate_keyframe"),
              ("scripts/modal_wan_s2v.py", "clipper-wan-s2v", "generate_s2v"),
          ):
              digest = hashlib.sha256(Path(script).read_bytes()).hexdigest()[:16]
              checks.append(("versioned", f"{base}-{digest}", "function", function))
          rows += ["", "| Kind | App/object | Result |", "| --- | --- | --- |"]
          found = missing = errors = 0
          for group, app, kind, name in checks:
              try:
                  cls = modal.Function if kind == "function" else modal.Cls
                  cls.from_name(app, name, environment_name="main").hydrate()
                  # Hydration is FunctionGet/ClassGet metadata, never remote/spawn/map/deploy.
                  status = "FOUND"
                  found += 1
              except NotFoundError:
                  status = "NOT FOUND in this workspace/environment"
                  missing += 1
              except Exception as exc:
                  status = f"UNVERIFIED ({type(exc).__name__})"
                  errors += 1
              record(f"| {group} {kind} | `{app}/{name}` | {status} |")
          record(f"Metadata totals: found={found}, not_found={missing}, unverified={errors}.")
          record("Missing objects are deployment inventory results, not authentication failures.")
          record("No remote functions called, no containers/GPU allocated, no deployments or video generation.")
          finish(1 if failed or errors else 0)
          PY
