name: Hotfix HILP129 final lifecycle gate

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/hotfix-hilp129-final-gate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,modal]'
      - name: Patch both final editorial lifecycle validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-pipeline.yml')
          text = path.read_text(encoding='utf-8')

          old_count = '''          call_starts = int(authoritative_counts.get("editorial_remote_call_start") or 0)
          call_terminals = int(authoritative_counts.get("editorial_remote_call_terminal") or 0)
          if call_starts <= 0 or call_terminals != call_starts:
              raise RuntimeError(
                  "live editorial acceptance lacks a closed producer-side editorial call set: "
                  f"starts={call_starts} terminals={call_terminals}"
              )
'''
          new_count = '''          call_starts = int(authoritative_counts.get("editorial_remote_call_start") or 0)
          call_terminals = int(authoritative_counts.get("editorial_remote_call_terminal") or 0)
          if call_starts <= 0:
              raise RuntimeError("live editorial acceptance observed no producer-side calls")
'''
          if text.count(old_count) != 2:
              raise RuntimeError(f'expected two legacy count gates, found {text.count(old_count)}')
          text = text.replace(old_count, new_count)

          old_ids = '''          start_ids = {
              str(event.get("invocation_id") or "")
              for event in producer_starts
          }
          terminal_ids = {
              str(event.get("invocation_id") or "")
              for event in producer_terminals
          }
          if "" in start_ids or "" in terminal_ids or start_ids != terminal_ids:
              raise RuntimeError(
                  "producer-side editorial invocation IDs are not one-to-one closed: "
                  f"starts={sorted(start_ids)} terminals={sorted(terminal_ids)}"
              )
'''
          new_ids = '''          from scripts.validate_editorial_lifecycle import validate_editorial_call_closure

          validate_editorial_call_closure(summary=summary, records=records)
'''
          if text.count(old_ids) != 2:
              raise RuntimeError(f'expected two legacy ID gates, found {text.count(old_ids)}')
          text = text.replace(old_ids, new_ids)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and lint
        run: |
          python -m ruff check --fix scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff format scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff check .
          python -m ruff format --check .
      - name: Run lifecycle and workflow regressions
        run: |
          python -m pytest --no-cov tests/test_hilp129_editorial_lifecycle_gate.py tests/test_hilp129_editorial_lifecycle_recovery.py tests/test_modal_execution_spy.py tests/test_production_workflow_contract.py
      - name: Commit clean P1 repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hotfix-hilp129-final-gate.yml
          git add .github/workflows/production-pipeline.yml scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close reconciled editorial lifecycles in HILP gate"
          git push origin HEAD:feat/contentrewards-campaign-factory
