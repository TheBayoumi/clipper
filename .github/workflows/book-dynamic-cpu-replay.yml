name: Dynamic book episode CPU-only replay

on:
  push:
    branches: [feat/unified-niche-tts]
    paths:
      - .github/workflows/book-dynamic-cpu-replay.yml
      - scripts/book_audio_timeline.py
      - scripts/book_timeline_assemble.py
      - tests/test_book_audio_timeline.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cache-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact CPU source and tests
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=9,<10' 'ruff>=0.15.22,<1' 'PyYAML>=6,<7'
          ruff format --diff scripts/book_audio_timeline.py scripts/book_timeline_assemble.py tests/test_book_audio_timeline.py
          ruff check scripts/book_audio_timeline.py scripts/book_timeline_assemble.py tests/test_book_audio_timeline.py
          ruff format --check scripts/book_audio_timeline.py scripts/book_timeline_assemble.py tests/test_book_audio_timeline.py
          python -m pytest -q -o addopts='' tests/test_book_audio_timeline.py
      - name: Install CPU FFmpeg (never Modal)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Recover only already-generated Wan shots and narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/full-book artifacts/recovery
          gh run download 40236460264 --repo "$GITHUB_REPOSITORY" \
            --name full-book-prep-40236460264 --dir artifacts/full-book
          gh run download 40244291750 --repo "$GITHUB_REPOSITORY" \
            --name full-book-shot-0-fresh-40244291750 --dir artifacts/recovery/scene-0
          for index in 1 2 3; do
            gh run download 40236460264 --repo "$GITHUB_REPOSITORY" \
              --name "full-book-shot-$index-40236460264" \
              --dir "artifacts/recovery/scene-$index"
          done
          for index in 0 1 2 3; do
            original="$(find "artifacts/recovery/scene-$index" -name wan-s2v-candidate.mp4 -type f -print -quit)"
            test -s "$original"
            target="artifacts/full-book/rendered/scene-$(printf '%02d' "$index")"
            mkdir -p "$target"
            cp -a "$(dirname "$original")/." "$target/"
            test -s "$target/model-evidence.json"
          done
          test -s artifacts/full-book/source/full-kokoro.wav
          test -s artifacts/full-book/source/plan.json
      - name: Reconstruct 37-second baseline with generalized CPU assembler
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python scripts/book_timeline_assemble.py legacy-replay \
            --legacy-plan artifacts/full-book/source/plan.json \
            --audio artifacts/full-book/source/full-kokoro.wav \
            --frames-dir artifacts/full-book/frames \
            --shot-dirs artifacts/full-book/rendered/scene-00 \
                        artifacts/full-book/rendered/scene-01 \
                        artifacts/full-book/rendered/scene-02 \
                        artifacts/full-book/rendered/scene-03 \
            --output-dir artifacts/dynamic-replay
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/dynamic-replay/clean-master-evidence.json").read_text())
          edl = json.loads(Path("artifacts/dynamic-replay/audio-locked-edl.json").read_text())
          assert evidence["single_authoritative_narration"] is True
          assert evidence["overlay_mode"] == "NONE"
          assert evidence["shot_count"] == 4
          assert edl["output"]["width"] == 1080 and edl["output"]["height"] == 1920
          assert abs(evidence["duration_seconds"] - 37.27) <= 0.12
          assert evidence["publish_eligible"] is False
          print("CPU_REPLAY_SOURCE_VERIFIED_NO_GPU", evidence["video_sha256"])
          PY
      - name: Preserve technical evidence for creative review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-book-cpu-replay-${{ github.run_id }}
          path: artifacts/dynamic-replay/
          retention-days: 14
          if-no-files-found: warn
