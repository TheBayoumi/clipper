name: MW4 MediaSilo source-size unit patch

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - scripts/_mw4_source_size_unit_patch.py
      - .github/workflows/_mw4_source_size_unit_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate canonical workflows in workspace
        run: python scripts/_mw4_source_size_unit_patch.py

      - name: Stage patched workflow blobs outside workflows directory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mw4-workflow-patch-v2/mw4-semantic-v3-1-shadow.yml .mw4-workflow-patch-v2/mw4-fullframe-retention-v3-1.yml
          git commit -m "ci(mw4): stage strict KiB source-size workflow blobs"
          git push origin HEAD:feat/mw4-fullframe-retention-v3-1
