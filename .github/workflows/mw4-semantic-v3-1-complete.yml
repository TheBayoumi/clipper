name: MW4 semantic v3.1 complete-source qualification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/mw4-semantic-v3-1-complete.yml
      - .github/mw4-v3-1-complete-trigger
      - pyproject.toml
      - campaigns/mw4-fullframe-retention-v3-1.json
      - src/clipper/cli.py
      - src/clipper/mw4.py
      - src/clipper_mw4/*.py
      - scripts/mw4_semantic_gameplay_v3_1_*.py
      - scripts/mw4_v3_1_*.py
      - scripts/mw4_fullframe_retention_v3_1.py

permissions:
  contents: read

jobs:
  discover-sources:
    name: discover-all-mediasilo-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_matrix: ${{ steps.catalog.outputs.source_matrix }}
      source_count: ${{ steps.catalog.outputs.source_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
          python -m playwright install --with-deps chromium
      - name: Verify canonical MW4 CLI architecture
        run: |
          set -euo pipefail
          clipper mw4 self-test
      - name: Discover every original video master through Clipper CLI
        id: catalog
        env:
          MEDIASILO_URL: https://app.mediasilo.com/review/6a88a6c15a183a21eeeae9e6/f/3b199368-5974-4eb1-a450-327a4e84c260
        run: |
          set -euo pipefail
          clipper mw4 discover \
            --review-url "$MEDIASILO_URL" \
            --output /tmp/source_catalog.json \
            --github-output "$GITHUB_OUTPUT" \
            --expected-count 4

  analyze:
    name: analyze-${{ matrix.source }}
    needs: discover-sources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover-sources.outputs.source_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Resolve, certify, analyze, and diagnose source through Clipper CLI
        timeout-minutes: 30
        env:
          SOURCE_KEY: ${{ matrix.source }}
          MEDIASILO_URL: https://app.mediasilo.com/review/6a88a6c15a183a21eeeae9e6/f/3b199368-5974-4eb1-a450-327a4e84c260
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          nice -n 5 clipper mw4 analyze \
            --review-url "$MEDIASILO_URL" \
            --expected-count 4 \
            --source-key "$SOURCE_KEY" \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --source-dir raw_sources \
            --output-dir "analysis/$SOURCE_KEY"
      - name: Upload verified source reel for isolated render workspaces
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-source-${{ matrix.source }}
          path: |
            raw_sources/${{ matrix.source }}.mp4
            raw_sources/${{ matrix.source }}.source_qa.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Upload analysis manifest
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-analysis-${{ matrix.source }}
          path: analysis/${{ matrix.source }}/${{ matrix.source }}_analysis_v3_1.json
          retention-days: 3
          if-no-files-found: error

  allocate:
    name: adaptive-payoff-diverse-allocation
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      render_matrix: ${{ steps.allocate.outputs.render_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
      - name: Download all analysis manifests
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-v3-1-complete-analysis-*
          path: analysis-manifests
          merge-multiple: true
      - name: Allocate canonical candidates through Clipper CLI
        id: allocate
        run: |
          set -euo pipefail
          mkdir -p allocation
          clipper mw4 allocate \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --analysis-root analysis-manifests \
            --allocation-out allocation/mw4_v3_1_allocation.json \
            --rejection-out allocation/mw4_v3_1_allocation_rejection.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload fail-closed allocation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-allocation-rejection
          path: allocation/mw4_v3_1_allocation_rejection.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload approved global allocation
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-allocation
          path: allocation/mw4_v3_1_allocation.json
          retention-days: 3
          if-no-files-found: error

  render-one:
    name: complete-${{ matrix.clip_id }}
    needs: allocate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.allocate.outputs.render_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI renderer runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download approved allocation
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-complete-allocation
          path: allocation
      - name: Download already-certified source reel
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-complete-source-${{ matrix.source }}
          path: raw_sources
      - name: Verify, render, and QA clip through Clipper CLI
        timeout-minutes: 65
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          nice -n 5 clipper mw4 render-one \
            --source-key "$SOURCE_KEY" \
            --source-dir raw_sources \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --allocation allocation/mw4_v3_1_allocation.json \
            --plan-key "${{ matrix.plan_key }}" \
            --ordinal "${{ matrix.ordinal }}" \
            --output-dir one \
            --mode production
      - name: Upload qualification video
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-video-${{ matrix.clip_id }}
          path: one/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload clip QA metadata
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-meta-${{ matrix.clip_id }}
          path: |
            one/*_clip_result_v3_1.json
            one/contact_sheets/*.jpg
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  batch-contract:
    name: complete-batch-contract
    needs: [allocate, render-one]
    if: ${{ always() && needs.allocate.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
      - name: Download approved allocation
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-complete-allocation
          path: allocation
      - name: Download clip metadata only
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-v3-1-complete-meta-*
          path: clip-meta
          merge-multiple: true
      - name: Enforce complete adaptive batch contract through Clipper CLI
        run: |
          set -euo pipefail
          clipper mw4 batch-contract \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --allocation allocation/mw4_v3_1_allocation.json \
            --clip-meta clip-meta \
            --output-dir batch
      - name: Upload batch contract
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-complete-batch-contract
          path: batch/*.json
          retention-days: 3
          if-no-files-found: error
