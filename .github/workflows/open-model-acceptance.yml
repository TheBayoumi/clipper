name: Open-model acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/open-model-acceptance.yml"
      - "scripts/modal_open_models.py"
      - "scripts/modal_endpoint_bootstrap.py"
      - "src/clipper/providers/**"
      - "src/clipper/canonical.py"
      - "src/clipper/autonomous_editor.py"
      - "src/clipper/pipeline.py"
      - "pyproject.toml"

permissions:
  contents: read
  actions: read

jobs:
  open-model-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CLIPPER_MODAL_APP: clipper-open-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required open-model credentials exist
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$HF_TOKEN"

      - name: Install lightweight client dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Ensure managed Modal editorial endpoint
        run: |
          set -euo pipefail
          BOOTSTRAP="$(python scripts/modal_endpoint_bootstrap.py --name clipper-editorial-qwen35-4b --model Qwen/Qwen3.5-4B)"
          ENDPOINT_URL="$(python -c 'import json,sys; print(json.load(sys.stdin)["endpoint_url"])' <<< "$BOOTSTRAP")"
          PROXY_ID="$(python -c 'import json,sys; print(json.load(sys.stdin)["proxy_token_id"])' <<< "$BOOTSTRAP")"
          PROXY_SECRET="$(python -c 'import json,sys; print(json.load(sys.stdin)["proxy_token_secret"])' <<< "$BOOTSTRAP")"
          MODEL_ID="$(python -c 'import json,sys; print(json.load(sys.stdin)["model_id"])' <<< "$BOOTSTRAP")"
          echo "::add-mask::$PROXY_ID"
          echo "::add-mask::$PROXY_SECRET"
          echo "CLIPPER_MODAL_EDITORIAL_ENDPOINT_URL=$ENDPOINT_URL" >> "$GITHUB_ENV"
          echo "CLIPPER_EDITORIAL_MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"
          echo "MODAL_PROXY_TOKEN_ID=$PROXY_ID" >> "$GITHUB_ENV"
          echo "MODAL_PROXY_TOKEN_SECRET=$PROXY_SECRET" >> "$GITHUB_ENV"

      - name: Deploy exact-HEAD specialized Modal workers
        run: modal deploy scripts/modal_open_models.py

      - name: Verify managed Qwen editorial endpoint and Modal embedding execution
        run: |
          mkdir -p open-evidence
          python - <<'PY'
          import json
          from pathlib import Path

          from clipper.providers.factory import editorial_and_embedding_providers

          editorial, embedding = editorial_and_embedding_providers("balanced")
          embedded = embedding.embed(["Open-weight podcast editorial acceptance"])
          completed = editorial.complete_json(
              task="episode_editorial_profile",
              payload={
                  "context": {
                      "source": "authorized acceptance smoke",
                      "word_refs": [
                          {"word_ref": "w000001", "text": "A", "start": 0.0, "end": 0.1},
                          {"word_ref": "w000002", "text": "podcast", "start": 0.1, "end": 0.4},
                          {"word_ref": "w000003", "text": "story", "start": 0.4, "end": 0.7},
                      ],
                  },
                  "campaign_constraints": {"authorized": True, "content_type": "clipping"},
              },
          )
          assert len(embedded.value) == 1
          assert completed.model.model_id == "Qwen/Qwen3.5-4B"
          assert isinstance(completed.value.get("summary"), str), completed.value
          evidence = {
              "embedding_usage": embedded.usage.to_dict(),
              "editorial_model": completed.model.to_dict(),
              "editorial_usage": completed.usage.to_dict(),
              "editorial_value": completed.value,
          }
          Path("open-evidence/provider-smoke.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Remove obsolete self-hosted Qwen 30B cache
        run: |
          modal volume rm -r clipper-hf-cache hub/models--Qwen--Qwen3-30B-A3B-Instruct-2507 || true
          modal volume rm -r clipper-hf-cache models--Qwen--Qwen3-30B-A3B-Instruct-2507 || true

      - name: Verify gated Hugging Face diarization access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import modal

          app = "clipper-open-editor"
          gated = modal.Function.from_name(app, "hf_access_smoke").remote()
          assert gated.get("ok") is True
          assert gated.get("model_id") == "pyannote/speaker-diarization-community-1"
          Path("open-evidence/hf-access.json").write_text(json.dumps(gated, indent=2) + "\n")
          print(json.dumps(gated, indent=2))
          PY

      - name: Reuse private authorized Double Coverage fixture
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_URL: ${{ secrets.CLIPPER_LIVE_FIXTURE_URL }}
          FIXTURE_SHA256: ${{ secrets.CLIPPER_LIVE_FIXTURE_SHA256 }}
        run: |
          set -euo pipefail
          rm -rf live-fixture fixture.zip
          mkdir -p live-fixture
          reused=false
          while read -r run_id; do
            test -n "$run_id" || continue
            rm -rf live-fixture/*
            if gh run download "$run_id" -n reach-source-fixture-v10 -D live-fixture; then
              reused=true
              echo "Reused private source fixture from run $run_id"
              break
            fi
          done < <(
            gh run list \
              --workflow live-campaign.yml \
              --branch feat/word-reveal-face-tracking \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          if [ "$reused" != true ]; then
            test -n "$FIXTURE_URL"
            test -n "$FIXTURE_SHA256"
            curl --fail --location --retry 3 --silent --show-error "$FIXTURE_URL" -o fixture.zip
            echo "$FIXTURE_SHA256  fixture.zip" | sha256sum --check --strict
            unzip -q fixture.zip -d live-fixture
          fi
          test -f live-fixture/fixture.json
          test -f live-fixture/source.en.vtt

      - name: Prepare private full-episode visual/audio proxy
        id: proxy
        env:
          GH_TOKEN: ${{ github.token }}
          PROXY_URL: ${{ secrets.CLIPPER_OPEN_PROXY_URL }}
          PROXY_SHA256: ${{ secrets.CLIPPER_OPEN_PROXY_SHA256 }}
        run: |
          set -euo pipefail
          rm -rf open-proxy
          mkdir -p open-proxy
          reused=false
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=reach-open-proxy-v1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "feat/word-reveal-face-tracking")] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > open-proxy.zip
            unzip -q open-proxy.zip -d open-proxy
            reused=true
            echo "Reused durable full acceptance proxy artifact $artifact_id"
          fi
          if [ "$reused" != true ]; then
            test -n "$PROXY_URL"
            test -n "$PROXY_SHA256"
            curl --fail --location --retry 3 --silent --show-error "$PROXY_URL" -o open-proxy/full-proxy.mp4
            echo "$PROXY_SHA256  open-proxy/full-proxy.mp4" | sha256sum --check --strict
          fi
          test -s open-proxy/full-proxy.mp4
          cp open-proxy/full-proxy.mp4 live-fixture/full-proxy.mp4
          python - <<'PY2'
          import hashlib
          import json
          from pathlib import Path

          root = Path("live-fixture")
          source = root / "full-proxy.mp4"
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          manifest_path = root / "fixture.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["full_media"] = {"file": "full-proxy.mp4", "sha256": digest}
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps({"full_proxy_sha256": digest, "bytes": source.stat().st_size}, indent=2))
          PY2
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Mirror full acceptance proxy into private Actions artifact storage
        if: steps.proxy.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reach-open-proxy-v1
          path: open-proxy/full-proxy.mp4
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Restore prior compatible open-model cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf prior-open-evidence
          mkdir -p open-evidence
          restored=false
          while IFS=$'\t' read -r run_id head_sha; do
            test -n "$run_id" || continue
            test "$run_id" != "$GITHUB_RUN_ID" || continue
            rm -rf prior-open-evidence
            mkdir -p prior-open-evidence
            artifact="open-model-acceptance-$head_sha"
            if gh run download "$run_id" -n "$artifact" -D prior-open-evidence; then
              if [ -d prior-open-evidence/_cache ]; then
                rm -rf open-evidence/_cache
                cp -a prior-open-evidence/_cache open-evidence/_cache
                echo "Restored model-stage cache from run $run_id ($head_sha)"
                restored=true
                break
              fi
            fi
          done < <(
            gh run list \
              --workflow open-model-acceptance.yml \
              --branch feat/word-reveal-face-tracking \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )
          echo "cache_restored=$restored"

      - name: Run full-episode open editorial analysis through Modal
        env:
          CLIPPER_SOURCE_FIXTURE_DIR: ${{ github.workspace }}/live-fixture
          CLIPPER_EDITORIAL_ENGINE: open
          CLIPPER_GROUNDING_ENGINE: open
          CLIPPER_COMPUTE_PROFILE: balanced
          CLIPPER_VISUAL_SCOUT: "true"
          CLIPPER_VISUAL_REVIEW: "false"
        run: |
          set +e
          clipper run \
            --brief campaigns/reach-double-coverage-dedicated.yaml \
            --artifact-root open-evidence \
            --no-render &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            progress="$(find open-evidence -name progress.json -type f -print -quit)"
            if [ -n "$progress" ]; then
              echo "--- $(date -u +%FT%TZ) progress ---"
              cat "$progress"
            else
              echo "$(date -u +%FT%TZ) waiting for pipeline progress artifact"
            fi
            sleep 30
          done
          wait "$pid"
          rc=$?
          progress="$(find open-evidence -name progress.json -type f -print -quit)"
          test -z "$progress" || cat "$progress"
          exit "$rc"

      - name: Run real Modal speech grounding smoke on authorized podcast audio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from clipper.cache import file_sha256
          from clipper.providers.factory import speech_providers

          root = Path("live-fixture")
          fixture = json.loads((root / "fixture.json").read_text())
          full_media = fixture.get("full_media")
          assert isinstance(full_media, dict)
          source = root / str(full_media["file"])
          source_hash = file_sha256(source)
          asr, alignment, diarization = speech_providers("balanced")
          timeline = asr.transcribe(source, video_id=fixture["video"]["video_id"], source_hash=source_hash).value
          timeline = alignment.align(source, timeline).value
          timeline = diarization.diarize(source, timeline).value
          assert timeline.words
          assert all(word.timing_mode == "aligned" for word in timeline.words)
          assert any(word.speaker_id for word in timeline.words)
          payload = timeline.to_dict()
          Path("open-evidence/speech-grounding-smoke.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps({"words": len(timeline.words), "speakers": sorted({w.speaker_id for w in timeline.words if w.speaker_id})}, indent=2))
          PY

      - name: Validate full-episode open-model planning evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = list(Path("open-evidence").glob("*/manifest.json"))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          inference = manifest["run_metadata"]["editorial_inference"]
          assert inference["engine"] == "open"
          assert inference["degraded"] is False
          assert manifest["funnel"]["story_moments"] >= 4
          assert manifest["funnel"]["selected_concepts"] >= 3
          assert manifest["funnel"]["edit_plans"] >= 3
          visual = manifest["run_metadata"]["visual_inference"]
          assert visual["scout_enabled"] is True
          assert visual.get("scout_runs")
          assert visual["scout_runs"][0]["event_count"] > 0
          assert manifest["status"] == "SUCCESS"
          print(json.dumps({"head": "${{ github.sha }}", "funnel": manifest["funnel"], "editorial_inference": inference}, indent=2))
          PY

      - name: Upload exact-HEAD open-model acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-model-acceptance-${{ github.sha }}
          path: open-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Revoke ephemeral Modal endpoint proxy token
        if: always()
        run: |
          if [ -n "${MODAL_PROXY_TOKEN_ID:-}" ]; then
            modal workspace proxy-tokens delete -y "$MODAL_PROXY_TOKEN_ID" || true
          fi

