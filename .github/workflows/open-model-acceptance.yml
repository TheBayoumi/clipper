name: Open-model acceptance

on:
  workflow_dispatch:
    inputs:
      diagnostic_degraded_diarization:
        description: Run the downstream open stack without speaker labels when gated pyannote access is unavailable
        required: false
        type: boolean
        default: false
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/open-model-acceptance.yml"
      - "scripts/modal_open_models.py"
      - "scripts/modal_endpoint_bootstrap.py"
      - "src/clipper/providers/modal_endpoint.py"
      - "src/clipper/providers/editorial_prompt.py"
      - "src/clipper/providers/**"
      - "src/clipper/canonical.py"
      - "src/clipper/autonomous_editor.py"
      - "src/clipper/fixture.py"
      - "src/clipper/pipeline.py"
      - "src/clipper/youtube.py"
      - "pyproject.toml"

concurrency:
  group: open-model-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  open-model-acceptance:
    runs-on: ubuntu-24.04
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CLIPPER_MODAL_APP: clipper-open-editor
      CLIPPER_MODAL_EDITORIAL_BACKEND: function
      CLIPPER_DIAGNOSTIC_DEGRADED_DIARIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_degraded_diarization == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required open-model credentials exist
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$HF_TOKEN"

      - name: Install lightweight client dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Terminate stale Modal acceptance containers
        run: |
          set -euo pipefail
          modal app stop "$CLIPPER_MODAL_APP" --yes || true
          modal volume rm -r clipper-media-cache /staging || true

      - name: Deploy exact-HEAD Modal open-model workers
        run: modal deploy scripts/modal_open_models.py

      - name: Verify Modal Qwen embedding and 30B editorial execution
        run: |
          mkdir -p open-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          import modal

          app = "clipper-open-editor"
          credential = modal.Function.from_name(app, "credential_smoke").remote()
          embedding = modal.Function.from_name(app, "embedding").remote(
              {"texts": ["Open-weight podcast editorial acceptance"]}
          )
          editorial = modal.Function.from_name(app, "editorial").remote(
              {
                  "task": "episode_editorial_profile",
                  "context": {
                      "source": "authorized acceptance smoke",
                      "word_refs": [
                          {"word_ref": "w000001", "text": "A", "start": 0.0, "end": 0.1},
                          {"word_ref": "w000002", "text": "podcast", "start": 0.1, "end": 0.4},
                          {"word_ref": "w000003", "text": "story", "start": 0.4, "end": 0.7},
                      ],
                  },
                  "campaign_constraints": {"authorized": True, "content_type": "clipping"},
              }
          )
          assert credential.get("ok") is True
          assert isinstance(embedding.get("vectors"), list) and len(embedding["vectors"]) == 1
          assert not editorial.get("error"), editorial
          assert editorial.get("model", {}).get("model_id") == "Qwen/Qwen3-30B-A3B-Instruct-2507"
          value = editorial.get("value")
          assert isinstance(value, dict) and isinstance(value.get("summary"), str), editorial
          evidence = {
              "credential": credential,
              "embedding_usage": embedding.get("usage"),
              "editorial_model": editorial.get("model"),
              "editorial_usage": editorial.get("usage"),
              "editorial_value": value,
          }
          Path("open-evidence/provider-smoke.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify gated Hugging Face diarization access
        if: ${{ env.CLIPPER_DIAGNOSTIC_DEGRADED_DIARIZATION != 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import modal

          app = "clipper-open-editor"
          gated = modal.Function.from_name(app, "hf_access_smoke").remote()
          assert gated.get("ok") is True
          assert gated.get("model_id") == "pyannote/speaker-diarization-community-1"
          Path("open-evidence/hf-access.json").write_text(json.dumps(gated, indent=2) + "\n")
          print(json.dumps(gated, indent=2))
          PY

      - name: Reuse private authorized Double Coverage fixture
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_URL: ${{ secrets.CLIPPER_LIVE_FIXTURE_URL }}
          FIXTURE_SHA256: ${{ secrets.CLIPPER_LIVE_FIXTURE_SHA256 }}
        run: |
          set -euo pipefail
          rm -rf live-fixture fixture.zip
          mkdir -p live-fixture
          reused=false
          while read -r run_id; do
            test -n "$run_id" || continue
            rm -rf live-fixture/*
            if gh run download "$run_id" -n reach-source-fixture-v10 -D live-fixture; then
              reused=true
              echo "Reused private source fixture from run $run_id"
              break
            fi
          done < <(
            gh run list \
              --workflow live-campaign.yml \
              --branch feat/word-reveal-face-tracking \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          if [ "$reused" != true ]; then
            test -n "$FIXTURE_URL"
            test -n "$FIXTURE_SHA256"
            curl --fail --location --retry 3 --silent --show-error "$FIXTURE_URL" -o fixture.zip
            echo "$FIXTURE_SHA256  fixture.zip" | sha256sum --check --strict
            unzip -q fixture.zip -d live-fixture
          fi
          test -f live-fixture/fixture.json
          test -f live-fixture/source.en.vtt

      - name: Acquire highest-quality full episode master inside Modal
        run: |
          set -euo pipefail
          mkdir -p open-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          import modal

          fixture = json.loads(Path("live-fixture/fixture.json").read_text())
          video = fixture["video"]
          result = modal.Function.from_name("clipper-open-editor", "acquire_source").remote(
              {"video_url": video["url"], "video_id": video["video_id"]}
          )
          assert result.get("quality_policy") == "highest_available_no_transcode", result
          assert int(result.get("bytes") or 0) > 0, result
          assert int(result.get("video", {}).get("width") or 0) > 0, result
          assert int(result.get("video", {}).get("height") or 0) > 0, result
          Path("open-evidence/source-master.json").write_text(json.dumps(result, indent=2) + "\n")
          Path("open-evidence/source-master.remote").write_text(str(result["volume_path"]) + "\n")
          suffix = Path(str(result["volume_path"])).suffix or ".mkv"
          Path("open-evidence/source-master.local").write_text(f"source-master{suffix}\n")
          print(json.dumps(result, indent=2))
          PY
          remote_path="$(tr -d '\n' < open-evidence/source-master.remote)"
          local_name="$(tr -d '\n' < open-evidence/source-master.local)"
          modal volume get --force clipper-media-cache "$remote_path" "live-fixture/$local_name"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          evidence = json.loads(Path("open-evidence/source-master.json").read_text())
          local_name = Path("open-evidence/source-master.local").read_text().strip()
          source = Path("live-fixture") / local_name
          digest = hashlib.sha256()
          with source.open("rb") as handle:
              for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          assert actual == evidence["sha256"], (actual, evidence["sha256"])
          manifest_path = Path("live-fixture/fixture.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["full_media"] = {
              "file": local_name,
              "sha256": actual,
              "quality_policy": "highest_available_no_transcode",
              "source_url": evidence["source_url"],
              "source_video": evidence["video"],
              "source_audio": evidence["audio"],
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps({"master": local_name, "sha256": actual, "bytes": source.stat().st_size}, indent=2))
          PY

      - name: Restore prior compatible open-model cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf prior-open-evidence
          mkdir -p open-evidence
          restored=false
          while IFS=$'\t' read -r run_id head_sha; do
            test -n "$run_id" || continue
            test "$run_id" != "$GITHUB_RUN_ID" || continue
            rm -rf prior-open-evidence
            mkdir -p prior-open-evidence
            artifact="open-model-acceptance-$head_sha"
            if gh run download "$run_id" -n "$artifact" -D prior-open-evidence; then
              if [ -d prior-open-evidence/_cache ]; then
                rm -rf open-evidence/_cache
                cp -a prior-open-evidence/_cache open-evidence/_cache
                echo "Restored model-stage cache from run $run_id ($head_sha)"
                restored=true
                break
              fi
            fi
          done < <(
            gh run list \
              --workflow open-model-acceptance.yml \
              --branch feat/word-reveal-face-tracking \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )
          echo "cache_restored=$restored"

      - name: Run full-episode open editorial analysis through Modal
        env:
          CLIPPER_SOURCE_FIXTURE_DIR: ${{ github.workspace }}/live-fixture
          CLIPPER_EDITORIAL_ENGINE: open
          CLIPPER_GROUNDING_ENGINE: open
          CLIPPER_COMPUTE_PROFILE: balanced
          CLIPPER_VISUAL_SCOUT: "true"
          CLIPPER_VISUAL_REVIEW: "false"
          CLIPPER_DIARIZATION_MODE: ${{ env.CLIPPER_DIAGNOSTIC_DEGRADED_DIARIZATION == 'true' && 'passthrough' || 'pyannote' }}
        run: |
          set +e
          clipper run \
            --brief campaigns/reach-double-coverage-dedicated.yaml \
            --artifact-root open-evidence \
            --no-render &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            progress="$(find open-evidence -name progress.json -type f -print -quit)"
            if [ -n "$progress" ]; then
              echo "--- $(date -u +%FT%TZ) progress ---"
              cat "$progress"
            else
              echo "$(date -u +%FT%TZ) waiting for pipeline progress artifact"
            fi
            sleep 30
          done
          wait "$pid"
          rc=$?
          progress="$(find open-evidence -name progress.json -type f -print -quit)"
          test -z "$progress" || cat "$progress"
          exit "$rc"

      - name: Run real Modal speech grounding smoke on authorized podcast audio
        env:
          CLIPPER_DIARIZATION_MODE: ${{ env.CLIPPER_DIAGNOSTIC_DEGRADED_DIARIZATION == 'true' && 'passthrough' || 'pyannote' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from clipper.cache import file_sha256
          from clipper.providers.factory import speech_providers

          root = Path("live-fixture")
          fixture = json.loads((root / "fixture.json").read_text())
          full_media = fixture.get("full_media")
          assert isinstance(full_media, dict)
          source = root / str(full_media["file"])
          source_hash = file_sha256(source)
          asr, alignment, diarization = speech_providers("balanced")
          timeline = asr.transcribe(source, video_id=fixture["video"]["video_id"], source_hash=source_hash).value
          timeline = alignment.align(source, timeline).value
          timeline = diarization.diarize(source, timeline).value
          assert timeline.words
          assert all(word.timing_mode == "aligned" for word in timeline.words)
          degraded = os.environ.get("CLIPPER_DIAGNOSTIC_DEGRADED_DIARIZATION") == "true"
          if degraded:
              assert not any(word.speaker_id for word in timeline.words)
          else:
              assert any(word.speaker_id for word in timeline.words)
          payload = timeline.to_dict()
          Path("open-evidence/speech-grounding-smoke.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps({"words": len(timeline.words), "speakers": sorted({w.speaker_id for w in timeline.words if w.speaker_id})}, indent=2))
          PY

      - name: Validate full-episode open-model planning evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_master = json.loads(Path("open-evidence/source-master.json").read_text())
          assert source_master["quality_policy"] == "highest_available_no_transcode"
          assert int(source_master["video"]["width"]) > 0
          assert int(source_master["video"]["height"]) > 0
          manifests = list(Path("open-evidence").glob("*/manifest.json"))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          inference = manifest["run_metadata"]["editorial_inference"]
          assert inference["engine"] == "open"
          assert inference["degraded"] is False
          grounding = manifest["run_metadata"]["grounding_inference"]
          diagnostic = os.environ.get("CLIPPER_DIAGNOSTIC_DEGRADED_DIARIZATION") == "true"
          assert grounding["degraded"] is diagnostic
          assert manifest["funnel"]["story_moments"] >= 4
          assert manifest["funnel"]["selected_concepts"] >= 3
          assert manifest["funnel"]["edit_plans"] >= 3
          visual = manifest["run_metadata"]["visual_inference"]
          assert visual["scout_enabled"] is True
          assert visual.get("scout_runs")
          assert visual["scout_runs"][0]["event_count"] > 0
          assert manifest["status"] == "SUCCESS"
          print(json.dumps({"head": "${{ github.sha }}", "source_master": source_master, "funnel": manifest["funnel"], "editorial_inference": inference}, indent=2))
          PY

      - name: Upload exact-HEAD open-model acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-model-acceptance-${{ github.sha }}
          path: open-evidence/
          retention-days: 14
          if-no-files-found: warn
