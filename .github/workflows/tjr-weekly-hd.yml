name: TJR Weekly HD clipping

on:
  push:
    branches: [feat/tjr-weekly-hd-actions]
    paths:
      - ".github/workflows/tjr-weekly-hd.yml"
      - "campaigns/reach-tjr-weekly.yaml"
      - "scripts/tjr_quality.py"
      - "scripts/tjr_youtube_preview.py"
      - "src/clipper/render.py"
      - "src/clipper/youtube.py"
      - "tests/test_tjr_quality.py"
      - "tests/test_tjr_youtube_preview.py"
      - "tests/test_render.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/tjr-weekly-hd.yml"
      - "campaigns/reach-tjr-weekly.yaml"
      - "scripts/tjr_quality.py"
      - "scripts/tjr_youtube_preview.py"
      - "src/clipper/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      budget_confirmed:
        description: "I checked Whop and the TJR campaign is accepting submissions with budget."
        required: true
        type: boolean
        default: false
      source_mode:
        description: "Choose public YouTube extraction or an independently verified original mirror."
        required: true
        type: choice
        options: [youtube_direct, verified_mirror]
        default: youtube_direct
      source_verified:
        description: "I verified the staged video is authentic authorized TJR footage."
        required: true
        type: boolean
        default: false
      source_video_id:
        description: "Exact 11-character video ID from the two campaign-listed YouTube channels."
        required: true
        type: string
        default: "p2LU37eat70"

permissions:
  contents: read

concurrency:
  group: tjr-hd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Validate source, policy and code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Validate campaign rules
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.tjr_quality import check_campaign_brief

          brief = check_campaign_brief(Path("campaigns/reach-tjr-weekly.yaml"))
          assert brief["required_hashtags"] == ["#TJR"]
          assert brief["watermark_url"] is None
          assert set(brief["source_channel_ids"]) == {
              "UCGHBUXjDCeiIXNdKR0HUZnA",
              "UCZen39LQJPx04GjPj7FOMcw",
          }
          print("Reach YouTube source policy: PASS")
          PY
      - name: Install FFmpeg for HD canary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Render and inspect a synthetic HD FFmpeg canary
        run: |
          set -euo pipefail
          mkdir -p /tmp/tjr-ffmpeg-canary
          ffmpeg -nostdin -v error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=30,setsar=4/3" \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac /tmp/tjr-ffmpeg-canary/source.mp4
          CLIPPER_RENDER_PRESET=medium CLIPPER_RENDER_THREADS=2 python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from clipper.models import ClipCandidate, TranscriptSegment
          from clipper.render import FFmpegRenderer

          root = Path("/tmp/tjr-ffmpeg-canary")
          source, output = root / "source.mp4", root / "output.mp4"
          FFmpegRenderer().render(
              source, output,
              ClipCandidate("synthetic-canary", 0, 2, "Synthetic QA only", 1.0),
              [TranscriptSegment(0, 2, "Synthetic QA only - do not publish")],
          )
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_streams", "-of", "json", str(output)],
              capture_output=True, text=True, check=True,
          )
          streams = json.loads(probe.stdout)["streams"]
          video = next(s for s in streams if s["codec_type"] == "video")
          assert (video["width"], video["height"]) == (1080, 1920)
          assert video["codec_name"] == "h264" and video["pix_fmt"] == "yuv420p"
          assert video.get("sample_aspect_ratio") == "1:1"
          assert any(s["codec_type"] == "audio" for s in streams)
          subprocess.run(
              ["ffmpeg", "-nostdin", "-v", "error", "-xerror", "-i",
               str(output), "-f", "null", "-"], check=True,
          )
          print("Synthetic HD render and full media decode: PASS")
          PY


  youtube_preview:
    name: Render drafts only from Reach-listed YouTube channels
    needs: tests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/tjr-weekly-hd-actions') || (github.event_name == 'workflow_dispatch' && inputs.source_mode == 'youtube_direct')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPPER_RENDER_PRESET: medium
      CLIPPER_RENDER_CRF: "18"
      CLIPPER_RENDER_THREADS: "2"
      TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require private authorized YouTube session before costly rendering
        env:
          COOKIES_B64: ${{ secrets.TJR_YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          umask 077
          COOKIE_FILE="$RUNNER_TEMP/tjr-youtube-cookies.txt"
          if [[ -z "${COOKIES_B64:-}" ]]; then
            mkdir -p tjr-youtube-artifacts/session-preflight
            echo '{"stage":"session_preflight","error":"GitHub Actions secret TJR_YOUTUBE_COOKIES_B64 is missing; no authenticated YouTube download attempted."}' > tjr-youtube-artifacts/session-preflight/source-acquisition-errors.json
            echo "::error::Add TJR_YOUTUBE_COOKIES_B64 in repository Settings > Secrets and variables > Actions before running YouTube media acquisition."
            exit 1
          fi
          if ! printf '%s' "$COOKIES_B64" | base64 --decode > "$COOKIE_FILE"; then
            echo "::error::Invalid base64 YouTube session secret."
            exit 1
          fi
          if ! grep -q -m1 -E '^# (Netscape HTTP Cookie File|HTTP Cookie File)' "$COOKIE_FILE"; then
            echo "::error::The secret must decode to a Netscape-format cookie jar."
            exit 1
          fi
          if ! awk 'BEGIN {found=0} !/^#/ && $1 ~ /(^|[.])youtube[.]com$/ {found=1} END {exit !found}' "$COOKIE_FILE"; then
            echo "::error::The cookie jar contains no youtube.com session cookies."
            exit 1
          fi
          echo "YOUTUBE_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"
          echo "Dedicated YouTube session loaded privately; media provenance and playback still require verification."
      - name: Install FFmpeg and real YouTube transcription dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -e ".[asr]"
          yt-dlp --version
      - name: Start local PO-token provider for YouTube playback
        run: |
          set -euo pipefail
          docker run --name tjr-pot-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.0
          python -m pip install -U "yt-dlp[default]" "bgutil-ytdlp-pot-provider==2.0.0"
          for attempt in $(seq 1 30); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1', 4416),timeout=2); s.close()" >/dev/null 2>&1; then break; fi
            if ! docker inspect -f '{{.State.Running}}' tjr-pot-provider | grep -qx true; then
              docker logs tjr-pot-provider
              exit 1
            fi
            sleep 2
          done
          docker ps --filter name=tjr-pot-provider
          yt-dlp --version
      - name: Check source channel IDs and acquire authentic YouTube HD original
        run: |
          set -euo pipefail
          python -m scripts.tjr_youtube_preview \
            --artifact-root tjr-youtube-artifacts \
            --brief campaigns/reach-tjr-weekly.yaml
      - name: Remove ephemeral YouTube viewer session
        if: always()
        run: rm -f "$RUNNER_TEMP/tjr-youtube-cookies.txt"
      - name: Upload verified MP4s or YouTube-source diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-real-youtube-hd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tjr-youtube-artifacts/**/clips/*.mp4
            tjr-youtube-artifacts/**/clips/*.srt
            tjr-youtube-artifacts/**/clips/*-preview.png
            tjr-youtube-artifacts/**/tjr-youtube-qa-report.json
            tjr-youtube-artifacts/**/source-acquisition-errors.json
            tjr-youtube-artifacts/**/official-source-candidates.json
            tjr-youtube-artifacts/**/transcript.json
            tjr-youtube-artifacts/**/ranked-candidates.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn



  render:
    name: Render and QA real TJR HD clips
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'verified_mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TJR_SOURCE_MEDIA_URL: ${{ secrets.TJR_SOURCE_MEDIA_URL }}
      TJR_SOURCE_MEDIA_SHA256: ${{ secrets.TJR_SOURCE_MEDIA_SHA256 }}
      TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
      TJR_BUDGET_CONFIRMED: ${{ inputs.budget_confirmed }}
      TJR_SOURCE_VERIFIED: ${{ inputs.source_verified }}
      CLIPPER_WHISPER_MODEL: small.en
      CLIPPER_WHISPER_DEVICE: cpu
      CLIPPER_WHISPER_COMPUTE_TYPE: int8
      CLIPPER_RENDER_PRESET: slow
      CLIPPER_RENDER_CRF: "18"
      CLIPPER_RENDER_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and clipper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -e ".[asr]"
          ffmpeg -version | head -n 1
      - name: Prepare verified staged TJR original (secret URL and SHA-256)
        run: |
          set -euo pipefail
          python -m scripts.tjr_quality --prepare \
            --brief campaigns/reach-tjr-weekly.yaml \
            --output-brief tjr-runtime/brief.yaml
      - name: Execute rights-gated TJR source pipeline
        run: |
          set -euo pipefail
          clipper validate --brief tjr-runtime/brief.yaml > /dev/null
          clipper run --brief tjr-runtime/brief.yaml --artifact-root tjr-artifacts
      - name: Technical acceptance and full decode
        run: |
          set -euo pipefail
          python -m scripts.tjr_quality \
            --brief tjr-runtime/brief.yaml \
            --artifact-root tjr-artifacts
          while IFS= read -r -d '' clip; do
            ffmpeg -nostdin -v error -ss 3 -i "$clip" -frames:v 1 \
              -y "${clip%.mp4}-preview.png"
          done < <(find tjr-artifacts -path '*/clips/*.mp4' -print0)
      - name: Upload clips, source manifest and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-weekly-hd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tjr-artifacts/**/manifest.json
            tjr-artifacts/**/tjr-qa-report.json
            tjr-artifacts/**/clips/*.mp4
            tjr-artifacts/**/clips/*.srt
            tjr-artifacts/**/clips/*-preview.png
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
