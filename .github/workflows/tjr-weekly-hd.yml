name: TJR Weekly HD clipping

on:
  push:
    branches: [feat/tjr-weekly-hd-actions]
    paths:
      - ".github/workflows/tjr-weekly-hd.yml"
      - "campaigns/reach-tjr-weekly.yaml"
      - "scripts/tjr_quality.py"
      - "scripts/tjr_youtube_preview.py"
      - "src/clipper/scoring.py"
      - "scripts/tjr_modal_probe.py"
      - "scripts/tjr_editorial.py"
      - "scripts/tjr_browser_probe.py"
      - "scripts/tjr_modal_runner.py"
      - "scripts/tjr_*.py"
      - "tests/test_tjr_editorial.py"
      - "tests/test_transcript.py"
      - "src/clipper/transcript.py"
      - "src/clipper/render.py"
      - "src/clipper/tiktok.py"
      - "src/clipper/source_fidelity.py"
      - "tests/test_source_fidelity.py"
      - "tests/test_tiktok.py"
      - "src/clipper/youtube.py"
      - "tests/test_tjr_quality.py"
      - "tests/test_tjr_youtube_preview.py"
      - "tests/test_tjr_browser_probe.py"
      - "tests/test_render.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/tjr-weekly-hd.yml"
      - "campaigns/reach-tjr-weekly.yaml"
      - "scripts/tjr_*.py"
      - "src/clipper/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      budget_confirmed:
        description: "I checked Whop and the TJR campaign is accepting submissions with budget."
        required: false
        type: boolean
        default: false
      source_mode:
        description: "Choose verified Modal originals, direct YouTube, or an authorized mirror."
        required: true
        type: choice
        options: [validate_only, modal_direct, youtube_direct, verified_mirror, feedback_replay]
        default: validate_only
      target_channel_id:
        description: "Exact Reach-listed YouTube channel for direct production; source video is discovered dynamically inside this channel."
        required: false
        type: string
        default: ""
      source_verified:
        description: "I verified the staged video is authentic authorized TJR footage."
        required: false
        type: boolean
        default: false
      source_video_id:
        description: "Exact source ID for verified-mirror/replay use only; direct modes discover dynamically inside target_channel_id."
        required: false
        type: string
        default: ""
      feedback_source_run_id:
        description: "Existing production run to replay and audit without downloading video anew."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tjr-hd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Validate source, policy and code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate production inputs before any real source acquisition
        if: github.event_name == 'workflow_dispatch'
        env:
          TJR_SOURCE_MODE: ${{ inputs.source_mode }}
          TJR_BUDGET_CONFIRMED: ${{ inputs.budget_confirmed }}
          TJR_SOURCE_VERIFIED: ${{ inputs.source_verified }}
          TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
          TJR_TARGET_CHANNEL_ID: ${{ inputs.target_channel_id }}
          TJR_FEEDBACK_SOURCE_RUN_ID: ${{ inputs.feedback_source_run_id }}
        run: |
          python - <<'PY'
          import os
          import re

          mode = os.environ['TJR_SOURCE_MODE']
          if mode == 'validate_only':
              print('Validation only: no real-source rendering requested')
          elif mode == 'feedback_replay':
              source_run_id = os.getenv('TJR_FEEDBACK_SOURCE_RUN_ID', '')
              if not re.fullmatch(r'[1-9][0-9]{7,14}', source_run_id):
                  raise SystemExit('feedback_replay requires a valid prior GitHub run ID')
              print(f'Replaying existing artifacts from run {source_run_id}; no paid source')
          else:
              if mode not in {'modal_direct', 'youtube_direct', 'verified_mirror'}:
                  raise SystemExit('Unknown TJR source mode')
              if os.getenv('TJR_BUDGET_CONFIRMED', '').lower() != 'true':
                  raise SystemExit('Production requires explicit confirmation of the live Whop budget')
              video_id = os.getenv('TJR_SOURCE_VIDEO_ID', '')
              target_channel_id = os.getenv('TJR_TARGET_CHANNEL_ID', '')
              approved_channels = {
                  'UCGHBUXjDCeiIXNdKR0HUZnA',
                  'UCZen39LQJPx04GjPj7FOMcw',
              }
              if video_id and not re.fullmatch(r'[A-Za-z0-9_-]{11}', video_id):
                  raise SystemExit('source_video_id must be an exact 11-character YouTube ID')
              if mode in {'modal_direct', 'youtube_direct'}:
                  if target_channel_id not in approved_channels:
                      raise SystemExit(
                          'Direct production requires exactly one Reach-listed target_channel_id'
                      )
                  if video_id:
                      raise SystemExit(
                          'Direct production discovers the newest eligible non-live source; '
                          'do not pin source_video_id'
                      )
              if mode == 'verified_mirror' and (
                  not video_id or os.getenv('TJR_SOURCE_VERIFIED', '').lower() != 'true'
              ):
                  raise SystemExit('Verified mirror requires an exact video ID and source approval')
              print(f'Production inputs valid: {mode}, target channel {target_channel_id or "n/a"}')
          PY
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Show precise formatting diff on failure
        if: failure()
        run: ruff format --diff .
      - run: mypy
      - run: pytest
      - name: Validate campaign rules
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.tjr_quality import check_campaign_brief

          brief = check_campaign_brief(Path("campaigns/reach-tjr-weekly.yaml"))
          assert brief["required_hashtags"] == ["#TJR"]
          assert brief["watermark_url"] is None
          assert set(brief["source_channel_ids"]) == {
              "UCGHBUXjDCeiIXNdKR0HUZnA",
              "UCZen39LQJPx04GjPj7FOMcw",
          }
          print("Reach YouTube source policy: PASS")
          PY
      - name: Install FFmpeg for HD canary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Render and inspect a synthetic HD FFmpeg canary
        run: |
          set -euo pipefail
          mkdir -p /tmp/tjr-ffmpeg-canary
          ffmpeg -nostdin -v error -y \
            -f lavfi -i "testsrc2=size=1280x720:rate=30,setsar=4/3" \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac /tmp/tjr-ffmpeg-canary/source.mp4
          CLIPPER_RENDER_PRESET=medium CLIPPER_RENDER_THREADS=2 python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from clipper.models import ClipCandidate, TranscriptSegment
          from clipper.render import FFmpegRenderer

          root = Path("/tmp/tjr-ffmpeg-canary")
          source, output = root / "source.mp4", root / "output.mp4"
          FFmpegRenderer().render(
              source, output,
              ClipCandidate("synthetic-canary", 0, 2, "Synthetic QA only", 1.0),
              [TranscriptSegment(0, 2, "Synthetic QA only - do not publish")],
          )
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_streams", "-of", "json", str(output)],
              capture_output=True, text=True, check=True,
          )
          streams = json.loads(probe.stdout)["streams"]
          video = next(s for s in streams if s["codec_type"] == "video")
          assert (video["width"], video["height"]) == (1080, 1920)
          assert video["codec_name"] == "h264" and video["pix_fmt"] == "yuv420p"
          assert video.get("sample_aspect_ratio") == "1:1"
          assert any(s["codec_type"] == "audio" for s in streams)
          subprocess.run(
              ["ffmpeg", "-nostdin", "-v", "error", "-xerror", "-i",
               str(output), "-f", "null", "-"], check=True,
          )
          print("Synthetic HD render and full media decode: PASS")
          PY


  youtube_preview:
    name: Render drafts only from Reach-listed YouTube channels
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'youtube_direct' && inputs.budget_confirmed
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CLIPPER_RENDER_PRESET: slow
      CLIPPER_RENDER_THREADS: "4"
      TJR_CAPTION_STYLE: B2
      TJR_RENDER_SAFETY_LIMIT: "20"
      TJR_TARGET_CHANNEL_ID: ${{ inputs.target_channel_id }}
      TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg, Chrome display, and YouTube transcription dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb x11-utils
          python -m pip install -e ".[asr]"
      - name: Mint YouTube playback tokens on the fly in a real browser
        run: |
          set -euo pipefail
          python -m pip install -U "yt-dlp[default]" "yt-dlp-getpot-wpc==1.1.2"
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          if [[ -z "$CHROME" ]]; then
            echo "::error::This runner has no Chromium-compatible browser."
            exit 1
          fi
          Xvfb :99 -screen 0 1366x768x24 -nolisten tcp > "$RUNNER_TEMP/tjr-xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "YT_DLP_WPC_BROWSER_PATH=$CHROME" >> "$GITHUB_ENV"
          export DISPLAY=:99
          for attempt in $(seq 1 20); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          python - <<'PY'
          from importlib.metadata import version
          print("yt-dlp:", version("yt-dlp"))
          print("yt-dlp-getpot-wpc:", version("yt-dlp-getpot-wpc"))
          PY
          echo "Browser token generation is enabled without account cookies."
      - name: Load optional persistent YouTube session if previously authorized
        env:
          COOKIES_B64: ${{ secrets.TJR_YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${COOKIES_B64:-}" ]]; then
            echo "No session secret required: attempting public YouTube playback with dynamic browser tokens."
            exit 0
          fi
          umask 077
          COOKIE_FILE="$RUNNER_TEMP/tjr-youtube-cookies.txt"
          printf '%s' "$COOKIES_B64" | base64 --decode > "$COOKIE_FILE"
          if ! grep -q -m1 -E '^# (Netscape HTTP Cookie File|HTTP Cookie File)' "$COOKIE_FILE"; then
            echo "::error::Invalid optional YouTube cookie jar; refusing to pass it to the downloader."
            rm -f "$COOKIE_FILE"
            exit 1
          fi
          if ! awk 'BEGIN {found=0} $1 ~ /^([.]?youtube[.]com|#HttpOnly_[.]?youtube[.]com)$/ {found=1} END {exit !found}' "$COOKIE_FILE"; then
            echo "::error::Optional jar contains no YouTube session cookies."
            rm -f "$COOKIE_FILE"
            exit 1
          fi
          echo "YOUTUBE_COOKIES_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"
          echo "Previously authorized session loaded automatically; no per-video manual setup."
      - name: Probe REAL official YouTube watch page in Chrome; acquire original if playable
        run: |
          set -euo pipefail
          ROOT="$PWD/tjr-youtube-artifacts/browser-capture"
          python -m scripts.tjr_browser_probe --root "$ROOT"
          echo "TJR_BROWSER_CAPTURE_FILE=$ROOT/browser-source.json" >> "$GITHUB_ENV"
      - name: Check source channel IDs and acquire authentic YouTube HD original
        run: |
          set -euo pipefail
          python -m scripts.tjr_youtube_preview \
            --artifact-root tjr-youtube-artifacts \
            --brief campaigns/reach-tjr-weekly.yaml
      - name: Remove ephemeral YouTube viewer session
        if: always()
        run: rm -f "$RUNNER_TEMP/tjr-youtube-cookies.txt"
      - name: Upload verified MP4s or YouTube-source diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-real-youtube-hd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tjr-youtube-artifacts/**/clips/*.mp4
            tjr-youtube-artifacts/**/clips/*.srt
            tjr-youtube-artifacts/**/clips/*.ass
            tjr-youtube-artifacts/**/clips/*.quality.json
            tjr-youtube-artifacts/**/clips/*.ssim.txt
            tjr-youtube-artifacts/**/clips/*-preview.png
            tjr-youtube-artifacts/**/clips/*-contact.png
            tjr-youtube-artifacts/**/tjr-youtube-qa-report.json
            tjr-youtube-artifacts/**/source-acquisition-errors.json
            tjr-youtube-artifacts/**/official-source-candidates.json
            tjr-youtube-artifacts/**/browser-probe.json
            tjr-youtube-artifacts/**/browser-source.json
            tjr-youtube-artifacts/**/transcript.json
            tjr-youtube-artifacts/**/ranked-candidates.json
            tjr-youtube-artifacts/**/editorial-candidate-audit.json
            tjr-youtube-artifacts/**/source-analysis-coverage.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn




  youtube_alternate_egress:
    name: Fallback YouTube original on ${{ matrix.os }}
    needs: [tests, youtube_preview]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      inputs.source_mode == 'youtube_direct' && inputs.budget_confirmed &&
      needs.tests.result == 'success' && needs.youtube_preview.result == 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare independent cookie-free YouTube transport
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . "yt-dlp[default]" "curl-cffi>=0.15,<1"
          mkdir -p tjr-alt-egress
      - name: Confirm original source and HD formats on this runner's network
        shell: bash
        env:
          ALT_EGRESS_PLATFORM: ${{ matrix.os }}
          TJR_TARGET_CHANNEL_ID: ${{ inputs.target_channel_id }}
          TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from clipper.brief import load_brief
          from scripts.tjr_youtube_preview import (
              constrain_official_sources, discover_official_uploads, verified_youtube_metadata,
          )
          report_file = Path("tjr-alt-egress/verified-transport.json")
          report = {"platform": os.environ["ALT_EGRESS_PLATFORM"], "status": "BLOCKED", "tried": []}
          try:
              candidates, failures = discover_official_uploads()
              report["discovery_failures"] = failures
              requested = os.environ.get("TJR_SOURCE_VIDEO_ID", "").strip()
              target_channel_id = os.environ.get("TJR_TARGET_CHANNEL_ID", "").strip() or None
              published_after = load_brief(
                  Path("campaigns/reach-tjr-weekly.yaml")
              ).published_after
              for video in constrain_official_sources(
                  candidates,
                  requested,
                  published_after=published_after,
                  target_channel_id=target_channel_id,
              )[:3]:
                  try:
                      info = verified_youtube_metadata(video)
                      formats = info.get("formats") or []
                      if not any(
                          isinstance(fmt, dict)
                          and int(fmt.get("height") or 0) >= 720
                          and fmt.get("vcodec") not in ("none", None)
                          for fmt in formats
                      ):
                          raise RuntimeError("No verified HD video formats")
                      report.update({"status": "ORIGINAL_HD_FORMATS_ACCESSIBLE",
                                     "video_url": video.url, "channel_id": video.channel_id})
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envfile:
                          envfile.write("TJR_SOURCE_VIDEO_ID=" + video.video_id + "\n")
                      break
                  except Exception as exc:
                      reason = "BOT_CHALLENGE" if "Sign in to confirm" in str(exc) else type(exc).__name__
                      report["tried"].append({"video_url": video.url, "reason": reason})
              if report["status"] != "ORIGINAL_HD_FORMATS_ACCESSIBLE":
                  raise RuntimeError("YouTube blocked verified originals on alternate runner")
          finally:
              report_file.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("Verified original video:", report["video_url"])
          PY
      - name: Prepare real HD rendering only if the video is accessible
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install ffmpeg -y --no-progress
              echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
            else
              brew install ffmpeg
            fi
          fi
          python -m pip install -e ".[asr]"
      - name: Render, source-verify, and fully decode real campaign MP4s
        shell: bash
        env:
          CLIPPER_RENDER_PRESET: medium
          CLIPPER_RENDER_CRF: "18"
          CLIPPER_RENDER_THREADS: "2"
        run: |
          set -euo pipefail
          TJR_CAPTION_STYLE=B2 TJR_RENDER_SAFETY_LIMIT=20 python -m scripts.tjr_youtube_preview \
            --brief campaigns/reach-tjr-weekly.yaml \
            --artifact-root tjr-alt-egress
      - name: Upload real YouTube clips or runner-specific diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-youtube-alt-${{ matrix.os }}-${{ github.run_id }}
          path: |
            tjr-alt-egress/verified-transport.json
            tjr-alt-egress/**/clips/*.mp4
            tjr-alt-egress/**/clips/*.srt
            tjr-alt-egress/**/clips/*.ass
            tjr-alt-egress/**/clips/*.quality.json
            tjr-alt-egress/**/clips/*.ssim.txt
            tjr-alt-egress/**/clips/*-preview.png
            tjr-alt-egress/**/clips/*-contact.png
            tjr-alt-egress/**/tjr-youtube-qa-report.json
            tjr-alt-egress/**/source-acquisition-errors.json
            tjr-alt-egress/**/official-source-candidates.json
            tjr-alt-egress/**/transcript.json
            tjr-alt-egress/**/editorial-candidate-audit.json
            tjr-alt-egress/**/source-analysis-coverage.json
            tjr-alt-egress/**/ranked-candidates.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn


  youtube_modal_egress:
    name: Modal originals + editorial drafts (${{ inputs.target_channel_id }})
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'modal_direct' && inputs.budget_confirmed
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TJR_MODAL_CHANNEL_ID: ${{ inputs.target_channel_id }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLIPPER_RENDER_PRESET: slow
      CLIPPER_RENDER_THREADS: "4"
      TJR_CAPTION_STYLE: B2
      TJR_RENDER_SAFETY_LIMIT: "20"
      TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare official-channel metadata and private Modal transfer
        run: |
          set -euo pipefail
          python -m pip install -e . "curl-cffi>=0.15,<1" "modal>=1,<2"
          python -m py_compile scripts/tjr_modal_probe.py
      - name: Acquire approved originals and render editorial drafts with bounded source fallback
        env:
          TJR_MODAL_EDITORIAL_MAX_SOURCES: "2"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install -e ".[asr]"
          python -m scripts.tjr_modal_runner
      - name: Upload actual YouTube MP4s, SRT captions, source provenance and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-real-original-youtube-hd-${{ inputs.target_channel_id }}-${{ github.run_id }}
          path: |
            tjr-modal-probe/verified-original-egress.json
            tjr-modal-probe/staged-original.json
            tjr-modal-artifacts/**/source-roundtrip.json
            tjr-modal-artifacts/**/verified-original-egress.json
            tjr-modal-artifacts/**/editorial-failure.json
            tjr-modal-artifacts/**/remote-cleanup-error.json
            tjr-modal-artifacts/**/clips/*.mp4
            tjr-modal-artifacts/**/clips/*.srt
            tjr-modal-artifacts/**/clips/*.ass
            tjr-modal-artifacts/**/clips/*.quality.json
            tjr-modal-artifacts/**/clips/*.ssim.txt
            tjr-modal-artifacts/**/clips/*-preview.png
            tjr-modal-artifacts/**/clips/*-contact.png
            tjr-modal-artifacts/**/editorial-candidate-audit.json
            tjr-modal-artifacts/**/source-analysis-coverage.json
            tjr-modal-artifacts/**/ranked-candidates.json
            tjr-modal-artifacts/**/tjr-youtube-qa-report.json
            tjr-modal-artifacts/**/source-acquisition-errors.json
            tjr-modal-artifacts/**/official-source-candidates.json
            tjr-modal-artifacts/**/transcript.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn


  feedback_audit:
    name: Independent review of real MP4s and production evidence
    needs:
      [tests, youtube_preview, youtube_alternate_egress, youtube_modal_egress, render]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (
        (
          contains(fromJSON('["modal_direct","youtube_direct","verified_mirror"]'),
          inputs.source_mode) &&
          inputs.budget_confirmed
        ) ||
        inputs.source_mode == 'feedback_replay'
      ) &&
      needs.tests.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download both current Modal channel artifacts, including partial failures
        if: inputs.source_mode == 'modal_direct'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tjr-real-original-youtube-hd-*
          path: tjr-feedback-input
      - name: Download direct YouTube production artifact
        if: inputs.source_mode == 'youtube_direct'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tjr-real-youtube-hd-*
          path: tjr-feedback-input
      - name: Download alternate-egress YouTube artifacts
        if: inputs.source_mode == 'youtube_direct'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tjr-youtube-alt-*
          path: tjr-feedback-input
      - name: Download verified-mirror production artifact
        if: inputs.source_mode == 'verified_mirror'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: tjr-weekly-hd-*
          path: tjr-feedback-input
      - name: Replay existing Modal production artifacts at no new media cost
        if: inputs.source_mode == 'feedback_replay'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: ${{ inputs.feedback_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: tjr-real-original-youtube-hd-*
          path: tjr-feedback-input
      - name: Replay existing direct YouTube production artifacts
        if: inputs.source_mode == 'feedback_replay'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: ${{ inputs.feedback_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: tjr-real-youtube-hd-*
          path: tjr-feedback-input
      - name: Replay existing alternate-egress production artifacts
        if: inputs.source_mode == 'feedback_replay'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: ${{ inputs.feedback_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: tjr-youtube-alt-*
          path: tjr-feedback-input
      - name: Replay existing verified-mirror production artifacts
        if: inputs.source_mode == 'feedback_replay'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: ${{ inputs.feedback_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: tjr-weekly-hd-*
          path: tjr-feedback-input
      - name: Install independent media verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Inspect every MP4, sidecar, full decode and editorial gate
        env:
          TJR_SOURCE_MODE: ${{ inputs.source_mode }}
          TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
          TJR_FEEDBACK_SOURCE_RUN_ID: ${{ inputs.feedback_source_run_id }}
        run: |
          set -euo pipefail
          EXPECTED_CHANNELS=1
          if [[ "$TJR_SOURCE_MODE" == "feedback_replay" ]]; then
            EXPECTED_CHANNELS=0
          fi
          mkdir -p tjr-feedback
          if ! python -m scripts.tjr_feedback_gate \
            --artifact-root tjr-feedback-input \
            --output tjr-feedback \
            --expected-channels "$EXPECTED_CHANNELS" \
            --full-decode; then
            if [[ ! -f tjr-feedback/feedback-report.json ]]; then
              printf '%s\n' '{"status":"AUDITOR_CRASH","automatic_publication_allowed":false}' \
                > tjr-feedback/feedback-report.json
              printf '%s\n' 'Independent evidence audit crashed; inspect this job log.' \
                > tjr-feedback/feedback-summary.md
            fi
            exit 1
          fi
      - name: Preserve immutable feedback JSON and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-feedback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tjr-feedback/
          retention-days: 30
          if-no-files-found: error
      - name: Publish concise audit to GitHub workflow
        if: always()
        run: |
          if [[ -f tjr-feedback/feedback-summary.md ]]; then
            cat tjr-feedback/feedback-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record verified feedback for the autonomous controller
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f tjr-feedback/feedback-summary.md ]]; then
            gh issue comment 7 --repo "$GITHUB_REPOSITORY" \
              --body-file tjr-feedback/feedback-summary.md
          fi


  render:
    name: Render and QA real TJR HD clips
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.source_mode == 'verified_mirror' && inputs.budget_confirmed && inputs.source_verified
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TJR_SOURCE_MEDIA_URL: ${{ secrets.TJR_SOURCE_MEDIA_URL }}
      TJR_SOURCE_MEDIA_SHA256: ${{ secrets.TJR_SOURCE_MEDIA_SHA256 }}
      TJR_SOURCE_VIDEO_ID: ${{ inputs.source_video_id }}
      TJR_BUDGET_CONFIRMED: ${{ inputs.budget_confirmed }}
      TJR_SOURCE_VERIFIED: ${{ inputs.source_verified }}
      CLIPPER_WHISPER_MODEL: small.en
      CLIPPER_WHISPER_DEVICE: cpu
      CLIPPER_WHISPER_COMPUTE_TYPE: int8
      CLIPPER_RENDER_PRESET: slow
      CLIPPER_RENDER_CRF: "18"
      CLIPPER_RENDER_THREADS: "2"
      TJR_CAPTION_STYLE: B2
      TJR_RENDER_SAFETY_LIMIT: "20"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and clipper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -e ".[asr]"
          ffmpeg -version | head -n 1
      - name: Prepare verified staged TJR original (secret URL and SHA-256)
        run: |
          set -euo pipefail
          python -m scripts.tjr_quality --prepare \
            --brief campaigns/reach-tjr-weekly.yaml \
            --output-brief tjr-runtime/brief.yaml
      - name: Download original, verify SHA-256, and stage for editorial renderer
        run: |
          set -euo pipefail
          python -m scripts.tjr_quality --stage \
            --brief tjr-runtime/brief.yaml \
            --media-output tjr-mirror-stage/original.mp4 \
            --output-manifest tjr-mirror-stage/staged-original.json
          echo "TJR_BROWSER_CAPTURE_FILE=$PWD/tjr-mirror-stage/staged-original.json" >> "$GITHUB_ENV"
          echo "TJR_REQUIRE_STAGED_ORIGINAL=1" >> "$GITHUB_ENV"
      - name: Execute shared TJR editorial selection and Style B2 rendering
        run: |
          set -euo pipefail
          python -m scripts.tjr_youtube_preview \
            --brief campaigns/reach-tjr-weekly.yaml \
            --artifact-root tjr-mirror-artifacts
      - name: Upload clips, source provenance and editorial QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tjr-weekly-hd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tjr-mirror-artifacts/**/tjr-youtube-qa-report.json
            tjr-mirror-artifacts/**/editorial-candidate-audit.json
            tjr-mirror-artifacts/**/ranked-candidates.json
            tjr-mirror-artifacts/**/source-acquisition-errors.json
            tjr-mirror-artifacts/**/official-source-candidates.json
            tjr-mirror-artifacts/**/transcript.json
            tjr-mirror-artifacts/**/source-analysis-coverage.json
            tjr-mirror-artifacts/**/clips/*.mp4
            tjr-mirror-artifacts/**/clips/*.srt
            tjr-mirror-artifacts/**/clips/*.ass
            tjr-mirror-artifacts/**/clips/*.quality.json
            tjr-mirror-artifacts/**/clips/*.ssim.txt
            tjr-mirror-artifacts/**/clips/*-preview.png
            tjr-mirror-artifacts/**/clips/*-contact.png
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
