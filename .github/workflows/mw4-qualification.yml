name: MW4 production qualification

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Optional MW4 campaign/profile override committed in this repository
        required: false
        default: ""
        type: string
      render_mode:
        description: Qualification render mode
        required: true
        default: production
        type: choice
        options:
          - production
          - shadow
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/mw4-qualification.yml
      - .github/mw4-production-trigger
      - pyproject.toml
      - campaigns/mw4-*.json
      - src/clipper_engine/profiles/mw4.json
      - src/clipper/cli.py
      - src/clipper_engine/**/*.py

concurrency:
  group: mw4-qualification-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.render_mode || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MW4_CONFIG_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.config_path || '' }}
  MW4_RENDER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.render_mode || 'production' }}

jobs:
  discover-sources:
    name: discover-all-mediasilo-sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_matrix: ${{ steps.catalog.outputs.source_matrix }}
      source_count: ${{ steps.catalog.outputs.source_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
          python -m playwright install --with-deps chromium
      - name: Verify canonical MW4 CLI architecture
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          if [[ -n "$MW4_CONFIG_PATH" ]]; then
            CONFIG_ARGS+=(--config "$MW4_CONFIG_PATH")
          fi
          clipper mw4 self-test "${CONFIG_ARGS[@]}"
      - name: Discover every configured MediaSilo video asset through Clipper CLI
        id: catalog
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          if [[ -n "$MW4_CONFIG_PATH" ]]; then
            CONFIG_ARGS+=(--config "$MW4_CONFIG_PATH")
          fi
          clipper mw4 discover \
            "${CONFIG_ARGS[@]}" \
            --output /tmp/source_catalog.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload source catalog
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-source-catalog
          path: /tmp/source_catalog.json
          retention-days: 3
          if-no-files-found: error

  analyze:
    name: analyze-${{ matrix.source }}
    needs: discover-sources
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover-sources.outputs.source_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: mw4-faster-whisper-${{ runner.os }}-base-en-v1
      - name: Install Clipper MW4 CLI analysis runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Resolve, certify, analyze, and diagnose source through Clipper CLI
        timeout-minutes: 35
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          if [[ -n "$MW4_CONFIG_PATH" ]]; then
            CONFIG_ARGS+=(--config "$MW4_CONFIG_PATH")
          fi
          nice -n 5 clipper mw4 analyze \
            "${CONFIG_ARGS[@]}" \
            --source-key "$SOURCE_KEY" \
            --source-dir raw_sources \
            --output-dir "analysis/$SOURCE_KEY"
      - name: Upload certified analysis source for isolated render workspaces
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-source-${{ matrix.source }}
          path: |
            raw_sources/${{ matrix.source }}.mp4
            raw_sources/${{ matrix.source }}.source_qa.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Upload analysis and transcript manifests
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-analysis-${{ matrix.source }}
          path: analysis/${{ matrix.source }}/*.json
          retention-days: 3
          if-no-files-found: error

  allocate:
    name: coverage-conflict-allocation
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      render_matrix: ${{ steps.allocate.outputs.render_matrix }}
      derived_clip_count: ${{ steps.allocate.outputs.derived_clip_count }}
      source_distribution: ${{ steps.allocate.outputs.source_distribution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
      - name: Download all analysis manifests
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-qualification-analysis-*
          path: analysis-manifests
          merge-multiple: true
      - name: Derive clip cardinality and render matrix through Clipper CLI
        id: allocate
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          if [[ -n "$MW4_CONFIG_PATH" ]]; then
            CONFIG_ARGS+=(--config "$MW4_CONFIG_PATH")
          fi
          mkdir -p allocation
          clipper mw4 allocate \
            "${CONFIG_ARGS[@]}" \
            --analysis-root analysis-manifests \
            --allocation-out allocation/mw4_allocation.json \
            --rejection-out allocation/mw4_allocation_rejection.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload fail-closed allocation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-allocation-rejection
          path: allocation/mw4_allocation_rejection.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload approved global allocation
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-allocation
          path: allocation/mw4_allocation.json
          retention-days: 3
          if-no-files-found: error

  render-one:
    name: ${{ inputs.render_mode || 'production' }}-${{ matrix.clip_id }}
    needs: allocate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.allocate.outputs.render_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI renderer runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Download approved allocation
        uses: actions/download-artifact@v4
        with:
          name: MW4-qualification-allocation
          path: allocation
      - name: Download already-certified analysis source
        uses: actions/download-artifact@v4
        with:
          name: MW4-qualification-source-${{ matrix.source }}
          path: raw_sources
      - name: Verify source, render, and QA clip through Clipper CLI
        timeout-minutes: 65
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          if [[ -n "$MW4_CONFIG_PATH" ]]; then
            CONFIG_ARGS+=(--config "$MW4_CONFIG_PATH")
          fi
          nice -n 5 clipper mw4 render-one \
            "${CONFIG_ARGS[@]}" \
            --source-key "$SOURCE_KEY" \
            --source-dir raw_sources \
            --allocation allocation/mw4_allocation.json \
            --plan-key "${{ matrix.plan_key }}" \
            --ordinal "${{ matrix.ordinal }}" \
            --output-dir one \
            --mode "$MW4_RENDER_MODE"
      - name: Upload qualification video
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-video-${{ matrix.clip_id }}
          path: one/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload clip QA metadata
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-meta-${{ matrix.clip_id }}
          path: |
            one/*_clip_result.json
            one/contact_sheets/*.jpg
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  batch-contract:
    name: complete-batch-contract
    needs: [allocate, render-one]
    if: ${{ always() && needs.allocate.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clipper MW4 CLI runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mw4]"
      - name: Download approved allocation
        uses: actions/download-artifact@v4
        with:
          name: MW4-qualification-allocation
          path: allocation
      - name: Download clip metadata only
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-qualification-meta-*
          path: clip-meta
          merge-multiple: true
      - name: Enforce complete adaptive batch contract through Clipper CLI
        run: |
          set -euo pipefail
          CONFIG_ARGS=()
          if [[ -n "$MW4_CONFIG_PATH" ]]; then
            CONFIG_ARGS+=(--config "$MW4_CONFIG_PATH")
          fi
          clipper mw4 batch-contract \
            "${CONFIG_ARGS[@]}" \
            --allocation allocation/mw4_allocation.json \
            --clip-meta clip-meta \
            --output-dir batch
      - name: Upload batch contract
        uses: actions/upload-artifact@v4
        with:
          name: MW4-qualification-batch-contract
          path: batch/*.json
          retention-days: 3
          if-no-files-found: error
