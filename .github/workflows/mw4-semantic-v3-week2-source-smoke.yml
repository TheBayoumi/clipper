name: MW4 semantic V3 Week2 real MP4 validation

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3
    paths:
      - .github/workflows/mw4-semantic-v3-week2-source-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  week2-real-mp4-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis and render dependencies
        run: |
          python -m pip install 'numpy==2.1.3' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Resolve and download official Week2 source
        env:
          MEDIASILO_URL: https://app.mediasilo.com/review/6a88a6c15a183a21eeeae9e6/f/3b199368-5974-4eb1-a450-327a4e84c260
        run: |
          python - <<'PY'
          import os, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          wanted = 'BestOfBeta_Week2_Stringout_1_8.28.mp4'
          holder = [None]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox','--disable-dev-shm-usage'])
              page = browser.new_page(
                  viewport={'width':1440,'height':1000},
                  user_agent=(
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                      'AppleWebKit/537.36 (KHTML, like Gecko) '
                      'Chrome/139.0.0.0 Safari/537.36'
                  ),
              )
              def handle(response):
                  if '/folders/3b199368-5974-4eb1-a450-327a4e84c260/assets' not in response.url or response.status != 200:
                      return
                  try:
                      data = response.json()
                  except Exception:
                      return
                  if isinstance(data, list) and data:
                      holder[0] = data
              page.on('response', handle)
              page.goto(os.environ['MEDIASILO_URL'], wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(25000)
              browser.close()
          if not holder[0]:
              raise RuntimeError('MediaSilo assets were not resolved')
          asset = next(item for item in holder[0] if item.get('title') == wanted)
          derivatives = {item.get('type'): item for item in asset.get('derivatives', [])}
          derivative = derivatives.get('x1080') or derivatives.get('proxy') or {}
          url = derivative.get('url') or (derivative.get('properties') or {}).get('url')
          if not url:
              raise RuntimeError('No usable Week2 derivative')
          request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          target = Path('week2.mp4')
          with urllib.request.urlopen(request, timeout=300) as src, target.open('wb') as dst:
              while True:
                  block = src.read(8*1024*1024)
                  if not block:
                      break
                  dst.write(block)
          print(f'downloaded={target.stat().st_size}')
          PY
      - name: Run Stage 1 + Stage 2 and generate a real 250 Mbps MP4
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from dataclasses import asdict
          from pathlib import Path
          import mw4_fullframe_retention_v3 as v3

          cfg = json.loads(Path('campaigns/mw4-fullframe-retention-v3.json').read_text())
          source = Path('week2.mp4')
          out = Path('real_mp4_validation')
          out.mkdir(exist_ok=True)

          timeline, plans = v3.discover_candidates(source, 'week2', cfg)
          assert len(plans) >= cfg['minimum_count_per_source']
          for plan in plans:
              assert plan.max_unexplained_low_interest_run_seconds <= 1.0
              assert plan.retention_proxy >= 0.30
              assert plan.engagement_proxy >= 0.30

          selected = next((p for p in plans if p.effect_profile == 'cold_open_teaser'), max(plans, key=lambda p: p.score))
          mp4 = out / f'MW4_V3_REAL_VALIDATION_{selected.effect_profile.upper()}_250M.mp4'
          planned_duration = v3.render_candidate(source, selected, cfg, mp4)
          qa = v3.validate_output(mp4, cfg)
          v3.create_contact_sheets(mp4, out / 'contact_sheets')

          report = {
              'source': 'official Week2 MediaSilo x1080/proxy derivative',
              'candidate_count': len(plans),
              'event_counts': v3.semantic.timeline_summary(timeline)['event_counts'],
              'selected_plan': asdict(selected),
              'planned_duration': planned_duration,
              'sha256': v3.sha256(mp4),
              'qa': qa,
          }
          (out / 'real_mp4_validation_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps({
              'file': mp4.name,
              'bytes': mp4.stat().st_size,
              'profile': selected.effect_profile,
              'story': selected.story_type,
              'duration': qa['probe']['format']['duration'],
              'bit_rate': qa['probe']['format']['bit_rate'],
              'checks': qa['checks'],
          }))
          PY
      - name: Upload real validation MP4
        uses: actions/upload-artifact@v4
        with:
          name: MW4-V3-real-MP4-validation
          path: real_mp4_validation/*.mp4
          retention-days: 1
          compression-level: 0
      - name: Upload semantic plan and visual QA sheets
        uses: actions/upload-artifact@v4
        with:
          name: MW4-V3-real-MP4-validation-QA
          path: |
            real_mp4_validation/real_mp4_validation_report.json
            real_mp4_validation/contact_sheets/*.jpg
          retention-days: 1
