name: Zodiac MediaSilo ingest

on:
  push:
    branches:
      - feat/zodiac-mediasilo-ingest
    paths:
      - "scripts/capture_mediasilo_session.py"
      - ".github/workflows/zodiac-mediasilo-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MEDIASILO_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/c8de980b-1330-4c46-971e-1013acd2ad28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser runtime
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Validate session capture
        run: python -m py_compile scripts/capture_mediasilo_session.py

      - name: Capture Gameplay Edit APIs and download UI
        run: |
          rm -rf mediasilo-session
          python scripts/capture_mediasilo_session.py \
            "$MEDIASILO_URL" \
            --folder "Gameplay Edit" \
            --output-dir mediasilo-session

      - name: Print captured API endpoints
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req=Path('mediasilo-session/requests.json')
          if req.exists():
              rows=json.loads(req.read_text())
              for row in rows:
                  print(row['status'], row['url'])
          for label, filename in (
              ('STATE','state.json'),
              ('FOLDER TEXT','Gameplay_Edit.txt'),
              ('DOWNLOAD DIALOG','download-dialog.txt'),
          ):
              print(f'\n--- {label} ---')
              p=Path('mediasilo-session') / filename
              print(p.read_text()[:12000] if p.exists() else '<none>')
          PY

      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-mediasilo-session-${{ github.sha }}
          path: mediasilo-session/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
