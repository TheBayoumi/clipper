name: Zodiac MediaSilo ingest

on:
  push:
    branches:
      - feat/zodiac-mediasilo-ingest
    paths:
      - "scripts/fetch_mediasilo_public.py"
      - "scripts/fetch_mediasilo_quicklink.py"
      - ".github/workflows/zodiac-mediasilo-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MEDIASILO_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/c8de980b-1330-4c46-971e-1013acd2ad28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Validate helpers
        run: |
          python -m py_compile scripts/fetch_mediasilo_public.py
          python -m py_compile scripts/fetch_mediasilo_quicklink.py

      - name: Fetch authorized Zodiac campaign content
        id: fetch
        continue-on-error: true
        run: |
          rm -rf mediasilo-output
          python scripts/fetch_mediasilo_quicklink.py \
            "$MEDIASILO_URL" \
            --output-dir mediasilo-output

      - name: Inspect acquired content
        if: always()
        run: |
          find mediasilo-output -type f -printf '%P %s bytes\n' | sort || true

      - name: Upload source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-mediasilo-source-${{ github.sha }}
          path: mediasilo-output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Fail if content was not acquired
        if: steps.fetch.outcome != 'success'
        run: exit 1
