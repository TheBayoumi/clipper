name: Zodiac MediaSilo ingest

on:
  push:
    branches:
      - feat/zodiac-mediasilo-ingest
    paths:
      - "scripts/fetch_mediasilo_public.py"
      - ".github/workflows/zodiac-mediasilo-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MEDIASILO_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/c8de980b-1330-4c46-971e-1013acd2ad28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp>=2026.7.4,<2027" "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
          ffmpeg -version | head -n 1
          curl --version | head -n 1

      - name: Validate helper
        run: python -m py_compile scripts/fetch_mediasilo_public.py

      - name: Fetch authorized Zodiac campaign source
        id: fetch
        continue-on-error: true
        run: |
          rm -rf mediasilo-output
          python scripts/fetch_mediasilo_public.py \
            "$MEDIASILO_URL" \
            --output-dir mediasilo-output

      - name: Inspect acquired source
        if: always()
        run: |
          find mediasilo-output -maxdepth 1 -type f -printf '%f %s bytes\n' || true
          if test -f mediasilo-output/campaign-source.mp4; then
            ffprobe -v error -show_streams -show_format -of json \
              mediasilo-output/campaign-source.mp4 > mediasilo-output/ffprobe.json
          fi

      - name: Upload source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-mediasilo-source-${{ github.sha }}
          path: mediasilo-output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Fail if source was not acquired
        if: steps.fetch.outcome != 'success'
        run: exit 1
