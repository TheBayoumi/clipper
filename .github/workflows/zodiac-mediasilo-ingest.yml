name: Zodiac MediaSilo ingest

on:
  push:
    branches:
      - feat/zodiac-mediasilo-ingest
    paths:
      - "scripts/probe_mediasilo_api.py"
      - "scripts/fetch_mediasilo_public.py"
      - "scripts/fetch_mediasilo_quicklink.py"
      - ".github/workflows/zodiac-mediasilo-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUICKLINK_ID: 6a8e379525a8e55a51c595fc
      ROOT_FOLDER_ID: c8de980b-1330-4c46-971e-1013acd2ad28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate API probe
        run: python -m py_compile scripts/probe_mediasilo_api.py

      - name: Crawl authorized Zodiac MediaSilo API
        run: |
          rm -rf mediasilo-api
          python scripts/probe_mediasilo_api.py \
            "$QUICKLINK_ID" "$ROOT_FOLDER_ID" \
            --output-dir mediasilo-api

      - name: Summarize inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('mediasilo-api/inventory.json').read_text())
          print('folders:', len(data['folders']))
          for folder in data['folders']:
              print('FOLDER', folder['id'], folder['path'])
          print('assets:', len(data['assets']))
          for asset in data['assets']:
              print('ASSET', asset['id'], asset['folder_path'], asset['name'])
          PY

      - name: Upload API inventory
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-mediasilo-api-${{ github.sha }}
          path: mediasilo-api/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
