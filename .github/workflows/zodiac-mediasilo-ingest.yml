name: Zodiac MediaSilo ingest

on:
  push:
    branches:
      - feat/zodiac-mediasilo-ingest
    paths:
      - "scripts/capture_mediasilo_session.py"
      - ".github/workflows/zodiac-mediasilo-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MEDIASILO_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/5f8106f9-fa72-4a68-93d9-2ea8f05495eb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser runtime
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Validate session capture
        run: python -m py_compile scripts/capture_mediasilo_session.py

      - name: Download official Gameplay Edit sources
        run: |
          rm -rf mediasilo-session
          python scripts/capture_mediasilo_session.py \
            "$MEDIASILO_URL" \
            --folder "__NO_CHILD_FOLDER__" \
            --output-dir mediasilo-session \
            --download-sources

      - name: Verify source payloads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path = Path('mediasilo-session/downloads-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if len(manifest) != 2:
              raise SystemExit(f'expected 2 source videos, got {len(manifest)}')
          for item in manifest:
              path = Path('mediasilo-session/downloads') / item['file_name']
              if not path.exists() or path.stat().st_size != item['bytes']:
                  raise SystemExit(f'invalid source payload: {path}')
              print(item['file_name'], item['bytes'], item['sha256'])
          PY

      - name: Upload source videos
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-gameplay-sources-${{ github.sha }}
          path: |
            mediasilo-session/downloads/
            mediasilo-session/downloads-manifest.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
