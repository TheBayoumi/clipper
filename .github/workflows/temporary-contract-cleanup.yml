name: Temporary guarded contract cleanup

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/temporary-contract-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact guarded cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "scripts/modal_pipeline.py": [
                  (
                      '            canonical_url = str(item.get("canonical_url") or evidence.get("source_url") or "").strip()\n',
                      '            canonical_url = str(\n'
                      '                item.get("canonical_url") or evidence.get("source_url") or ""\n'
                      '            ).strip()\n',
                  ),
                  (
                      '            raise RuntimeError(f"mounted source master failed SHA-256 verification: {video.video_id}")\n',
                      '            raise RuntimeError(\n'
                      '                "mounted source master failed SHA-256 verification: "\n'
                      '                f"{video.video_id}"\n'
                      '            )\n',
                  ),
              ],
              "src/clipper/brief.py": [
                  (
                      '    if not isinstance(raw_channels, list) or not all(isinstance(item, str) for item in raw_channels):\n',
                      '    if not isinstance(raw_channels, list) or not all(\n'
                      '        isinstance(item, str) for item in raw_channels\n'
                      '    ):\n',
                  ),
              ],
              "src/clipper/canonical.py": [
                  (
                      '            raise ValueError("canonical timeline contract fingerprint does not match runtime contract")\n',
                      '            raise ValueError(\n'
                      '                "canonical timeline contract fingerprint does not match runtime contract"\n'
                      '            )\n',
                  ),
              ],
              "src/clipper/cli.py": [
                  (
                      '    invocations = editorial_meta.get("model_invocations") if isinstance(editorial_meta, dict) else None\n',
                      '    invocations = (\n'
                      '        editorial_meta.get("model_invocations")\n'
                      '        if isinstance(editorial_meta, dict)\n'
                      '        else None\n'
                      '    )\n',
                  ),
                  (
                      '        raise RuntimeError("canonical grounding evidence is missing resolved models: " + ", ".join(missing))\n',
                      '        raise RuntimeError(\n'
                      '            "canonical grounding evidence is missing resolved models: "\n'
                      '            + ", ".join(missing)\n'
                      '        )\n',
                  ),
              ],
              "src/clipper/providers/editorial_prompt.py": [
                  (
                      '        return common + (\n            "All supplied feasible_windows have already been deterministically proven legal. "\n',
                      '        return common + (  # noqa: S608 - editorial prose, not SQL\n            "All supplied feasible_windows have already been deterministically proven legal. "\n',
                  ),
              ],
              "tests/test_brief.py": [
                  (
                      'match="outside rights.authorized_channels"',
                      'match=r"outside rights\\.authorized_channels"',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  expected = 2 if name == "tests/test_brief.py" else 1
                  if count != expected:
                      raise SystemExit(
                          f"guard failed for {name}: expected {expected} matches, found {count}: {old!r}"
                      )
                  text = text.replace(old, new)
                  if expected == 2:
                      break
              path.write_text(text, encoding="utf-8")
          PY
      - name: Format touched files
        run: |
          python -m pip install 'ruff==0.16.4'
          ruff format scripts/modal_pipeline.py src/clipper/brief.py src/clipper/canonical.py src/clipper/cli.py src/clipper/providers/editorial_prompt.py tests/test_brief.py
      - name: Verify Ruff
        run: ruff check .
      - name: Commit guarded cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add scripts/modal_pipeline.py src/clipper/brief.py src/clipper/canonical.py src/clipper/cli.py src/clipper/providers/editorial_prompt.py tests/test_brief.py
          git diff --cached --check
          git commit -m "chore: clear refactor lint blockers"
          git push origin HEAD:feat/word-reveal-face-tracking
