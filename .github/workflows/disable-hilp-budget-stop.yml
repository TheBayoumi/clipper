name: Apply advisory-only HILP budget accounting

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/disable-hilp-budget-stop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply budget-stop removal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          watchdog_path = Path("scripts/modal_hilp_watchdog.py")
          source = watchdog_path.read_text(encoding="utf-8")

          old = '''        remaining_gpu_seconds, remaining_estimated_usd = budget.remaining_budgets()
          if remaining_gpu_seconds <= 0 or remaining_estimated_usd <= 0:
              raise RuntimeError(
                  "source acquisition exhausted the production budget before root execution"
              )
          request = {
              "sources": [source_payload],
              "brief_yaml": scoped_brief_yaml,
              "render": render,
              "editorial_acceptance_probe": not render,
              "fresh_inference": os.environ["CLIPPER_FRESH_INFERENCE"] == "true",
              "resume_from_run_id": os.environ.get("CLIPPER_RESUME_FROM_RUN_ID") or None,
              "resume_provenance": resume_provenance,
              "git_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              "execution_id": execution_id,
              "max_gpu_seconds": remaining_gpu_seconds,
              "max_estimated_usd": remaining_estimated_usd,
          }
'''
          new = '''        # Compute thresholds are retained for accounting/evidence only. They must never
          # prevent root execution or terminate HILP/production once rights and static gates pass.
          request = {
              "sources": [source_payload],
              "brief_yaml": scoped_brief_yaml,
              "render": render,
              "editorial_acceptance_probe": not render,
              "fresh_inference": os.environ["CLIPPER_FRESH_INFERENCE"] == "true",
              "resume_from_run_id": os.environ.get("CLIPPER_RESUME_FROM_RUN_ID") or None,
              "resume_provenance": resume_provenance,
              "git_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              "execution_id": execution_id,
              "max_gpu_seconds": max_gpu_seconds,
              "max_estimated_usd": max_estimated_usd,
          }
'''
          if old not in source:
              raise SystemExit("watchdog pre-root budget block not found")
          source = source.replace(old, new, 1)

          old = '''            elapsed = max(0.0, time.monotonic() - call_started)
          conservative_gpu_seconds, conservative_cost_usd = budget.projected_usage(
              elapsed,
              gpu_count=2.0,
              estimated_usd_per_second=0.000444,
          )
          remaining_wall_seconds = budget.remaining_wall_seconds(
              elapsed,
              gpu_count=2.0,
              estimated_usd_per_second=0.000444,
          )
          if remaining_wall_seconds <= 0:
              reason = (
                  "conservative in-flight production budget reached before completion: "
                  f"gpu_seconds={conservative_gpu_seconds:.3f}/{max_gpu_seconds:.3f} "
                  f"estimated_usd={conservative_cost_usd:.6f}/{max_estimated_usd:.6f}"
              )
              cancel_call(reason)
              raise RuntimeError(reason)
          try:
              result = call.get(timeout=min(poll_seconds, remaining_wall_seconds))
              remote_completed = True
              elapsed = max(0.0, time.monotonic() - call_started)
              budget.charge(
                  elapsed,
                  gpu_count=2.0,
                  estimated_usd_per_second=0.000444,
              )
              root_budget_charged = True
              conservative_gpu_seconds = budget.gpu_seconds
              conservative_cost_usd = budget.estimated_usd
              if conservative_gpu_seconds >= max_gpu_seconds:
                  raise RuntimeError(
                      "conservative GPU budget exceeded by completed production call: "
                      f"{conservative_gpu_seconds:.1f} >= {max_gpu_seconds:.1f}"
                  )
              if conservative_cost_usd >= max_estimated_usd:
                  raise RuntimeError(
                      "conservative cost budget exceeded by completed production call: "
                      f"{conservative_cost_usd:.4f} >= {max_estimated_usd:.4f}"
                  )
              break
          except TimeoutError:
              continue
'''
          new = '''            try:
              # Poll cadence is independent of accounting thresholds. A threshold crossing is
              # observable in the final ledger but is never a cancellation or acceptance signal.
              result = call.get(timeout=poll_seconds)
              remote_completed = True
              elapsed = max(0.0, time.monotonic() - call_started)
              budget.charge(
                  elapsed,
                  gpu_count=2.0,
                  estimated_usd_per_second=0.000444,
              )
              root_budget_charged = True
              break
          except TimeoutError:
              continue
'''
          if old not in source:
              raise SystemExit("watchdog in-flight budget block not found")
          source = source.replace(old, new, 1)

          source = source.replace(
              '''        # budget-enforcement backstop, while still trying to obtain terminal evidence.\n''',
              '''        # termination backstop, while still trying to obtain terminal evidence.\n''',
              1,
          )
          source = source.replace(
              '''            "max_estimated_usd": max_estimated_usd,\n            "spawned_at": datetime.now(UTC).isoformat(),\n''',
              '''            "max_estimated_usd": max_estimated_usd,\n            "budget_enforcement": False,\n            "spawned_at": datetime.now(UTC).isoformat(),\n''',
              1,
          )
          source = source.replace(
              '''                "render": render,\n                "budget": budget.to_dict(),\n''',
              '''                "render": render,\n                "budget_enforcement": False,\n                "budget": budget.to_dict(),\n''',
              1,
          )
          watchdog_path.write_text(source, encoding="utf-8")

          tests_path = Path("tests/test_modal_hilp_watchdog.py")
          tests = tests_path.read_text(encoding="utf-8")

          def replace_test(name: str, replacement: str) -> None:
              global tests
              pattern = re.compile(
                  rf"(?ms)^def {re.escape(name)}\(.*?(?=^def |^@pytest\.mark\.parametrize|\Z)"
              )
              tests, count = pattern.subn(replacement.rstrip() + "\n\n", tests, count=1)
              if count != 1:
                  raise SystemExit(f"test block not found exactly once: {name} ({count})")

          pass_result = '''{
                      "status": "PASS",
                      "execution_mode": "resume",
                      "execution_id": "e" * 32,
                      "deployed_git_sha": "a" * 40,
                      "pipeline_status": "SUCCESS",
                      "review_status": "NOT_RENDERED",
                      "run_volume": "volume",
                      "run_path": "/run",
                  }'''

          replace_test(
              "test_watchdog_counts_successful_hydration_against_compute_budget",
              f'''def test_watchdog_accounting_threshold_does_not_stop_after_hydration(
              tmp_path: Path,
              monkeypatch,
          ) -> None:
              module = _module()
              _environment(tmp_path, monkeypatch)
              monkeypatch.setattr(module, "ModalExecutionSpy", _Spy)
              monkeypatch.setattr(module.uuid, "uuid4", lambda: SimpleNamespace(hex="e" * 32))
              monkeypatch.setenv("CLIPPER_MAX_GPU_SECONDS", "1")
              clock = {{"now": 0.0}}
              monkeypatch.setattr(module.time, "monotonic", lambda: clock["now"])

              class SlowHydrateCall(_Call):
                  def hydrate(self) -> None:
                      clock["now"] = 0.6

                  def get(self, *, timeout: float):
                      assert timeout == pytest.approx(0.001)
                      clock["now"] = 1.0
                      return {pass_result}

              call = SlowHydrateCall({{}})
              monkeypatch.setitem(sys.modules, "modal", _modal(call))

              result = module.run(render=False)

              assert result["status"] == "PASS"
              assert call.cancel_args == []
              summary = json.loads(
                  (tmp_path / "open-evidence" / "modal-spy-summary.json").read_text(
                      encoding="utf-8"
                  )
              )
              assert summary["budget_enforcement"] is False
              assert summary["budget"]["gpu_seconds"] > summary["budget"]["max_gpu_seconds"]
          ''',
          )

          replace_test(
              "test_watchdog_caps_poll_timeout_to_remaining_compute_budget",
              f'''def test_watchdog_poll_timeout_is_not_capped_by_accounting_threshold(
              tmp_path: Path,
              monkeypatch,
          ) -> None:
              module = _module()
              _environment(tmp_path, monkeypatch)
              monkeypatch.setattr(module, "ModalExecutionSpy", _Spy)
              monkeypatch.setattr(module.uuid, "uuid4", lambda: SimpleNamespace(hex="e" * 32))
              monkeypatch.setenv("CLIPPER_MAX_GPU_SECONDS", "1")
              monkeypatch.setenv("CLIPPER_MODAL_SPY_POLL_SECONDS", "5")
              clock = {{"now": 0.0}}
              monkeypatch.setattr(module.time, "monotonic", lambda: clock["now"])

              class AccountingPollCall(_Call):
                  def __init__(self) -> None:
                      super().__init__({{}})
                      self.timeouts: list[float] = []

                  def get(self, *, timeout: float):
                      self.timeouts.append(timeout)
                      if len(self.timeouts) == 1:
                          clock["now"] = 3.0
                          raise TimeoutError
                      return {pass_result}

              call = AccountingPollCall()
              monkeypatch.setitem(sys.modules, "modal", _modal(call))

              result = module.run(render=False)

              assert result["status"] == "PASS"
              assert call.timeouts == [pytest.approx(5.0), pytest.approx(5.0)]
              assert call.cancel_args == []
              summary = json.loads(
                  (tmp_path / "open-evidence" / "modal-spy-summary.json").read_text(
                      encoding="utf-8"
                  )
              )
              assert summary["budget"]["gpu_seconds"] > summary["budget"]["max_gpu_seconds"]
          ''',
          )

          replace_test(
              "test_watchdog_rechecks_budget_after_successful_final_poll",
              f'''def test_watchdog_records_threshold_overrun_without_rejecting_final_poll(
              tmp_path: Path,
              monkeypatch,
          ) -> None:
              module = _module()
              _environment(tmp_path, monkeypatch)
              monkeypatch.setattr(module, "ModalExecutionSpy", _Spy)
              monkeypatch.setattr(module.uuid, "uuid4", lambda: SimpleNamespace(hex="e" * 32))
              monkeypatch.setenv("CLIPPER_MAX_GPU_SECONDS", "1")
              clock = {{"now": 0.0}}
              monkeypatch.setattr(module.time, "monotonic", lambda: clock["now"])

              class AccountingCall(_Call):
                  def get(self, *, timeout: float):
                      assert timeout > 0
                      clock["now"] = 1.0
                      return {pass_result}

              call = AccountingCall({{}})
              monkeypatch.setitem(sys.modules, "modal", _modal(call))

              result = module.run(render=False)

              assert result["status"] == "PASS"
              assert call.cancel_args == []
              summary = json.loads(
                  (tmp_path / "open-evidence" / "modal-spy-summary.json").read_text(
                      encoding="utf-8"
                  )
              )
              assert summary["budget_enforcement"] is False
              assert summary["budget"]["gpu_seconds"] == pytest.approx(2.0)
              assert summary["budget"]["remaining_gpu_seconds"] == pytest.approx(0.0)
          ''',
          )

          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Verify focused change
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py
          ruff format --check scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py
          pytest -q tests/test_modal_hilp_watchdog.py

      - name: Commit verified repair and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/disable-hilp-budget-stop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py .github/workflows/disable-hilp-budget-stop.yml
          git commit -m "fix: make HILP compute budget advisory only"
          git push origin HEAD:feat/contentrewards-campaign-factory
