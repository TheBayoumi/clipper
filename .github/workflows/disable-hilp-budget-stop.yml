name: Apply advisory-only HILP budget accounting

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/disable-hilp-budget-stop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply repair
        run: python .github/disable_hilp_budget_stop.py

      - name: Verify focused repair
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff format scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py
          ruff check scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py
          ruff format --check scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py
          pytest -q tests/test_modal_hilp_watchdog.py

      - name: Commit verified repair and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/disable-hilp-budget-stop.yml .github/disable_hilp_budget_stop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_hilp_watchdog.py tests/test_modal_hilp_watchdog.py .github/workflows/disable-hilp-budget-stop.yml .github/disable_hilp_budget_stop.py
          git commit -m "fix: make HILP compute budget advisory only"
          git push origin HEAD:feat/contentrewards-campaign-factory
