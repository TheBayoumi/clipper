name: Hotfix HILP129 editorial lifecycle v2

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/hotfix-hilp129-editorial-lifecycle-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev,modal]'
      - name: Extract and apply guarded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          source = Path('.github/workflows/hotfix-hilp129-editorial-lifecycle.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          patch = Path('/tmp/hilp129_patch.py')
          patch.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          subprocess.run([sys.executable, str(patch)], check=True)
          PY
      - name: Format and lint repair
        run: |
          python -m ruff check --fix src/clipper/providers/modal.py scripts/modal_pipeline.py scripts/modal_execution_spy.py tests/test_hilp129_editorial_lifecycle_recovery.py
          python -m ruff format src/clipper/providers/modal.py scripts/modal_pipeline.py scripts/modal_execution_spy.py tests/test_hilp129_editorial_lifecycle_recovery.py
          python -m ruff check src/clipper/providers/modal.py scripts/modal_pipeline.py scripts/modal_execution_spy.py tests/test_hilp129_editorial_lifecycle_recovery.py
      - name: Run lifecycle regression suite
        run: |
          python -m pytest --no-cov tests/test_hilp129_editorial_lifecycle_recovery.py tests/test_modal_execution_spy.py tests/test_modal_editorial_recovery.py tests/test_modal_pipeline_probe_lifecycle.py
      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hotfix-hilp129-editorial-lifecycle.yml .github/workflows/hotfix-hilp129-editorial-lifecycle-v2.yml
          git add src/clipper/providers/modal.py scripts/modal_pipeline.py scripts/modal_execution_spy.py tests/test_hilp129_editorial_lifecycle_recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reconcile editorial lifecycle after producer restart"
          git push origin HEAD:feat/contentrewards-campaign-factory
