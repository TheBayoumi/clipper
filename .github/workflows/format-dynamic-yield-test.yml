name: Exact Ruff formatter fix

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/format-dynamic-yield-test.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - name: Apply exact formatter output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_open_models.py")
          source = path.read_text(encoding="utf-8")
          old = '''    assert any(\n        item.get("reasons") == ["no_grounded_hook_variants"]\n        for item in empty_ranked.rejections\n    )'''
          new = '''    assert any(\n        item.get("reasons") == ["no_grounded_hook_variants"] for item in empty_ranked.rejections\n    )'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one formatter target, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
      - name: Commit exact formatter fix
        run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_open_models.py
          git diff --cached --check
          git diff --cached --exit-code && exit 0 || true
          git commit -m "style: apply Ruff formatting to dynamic-yield regression"
          git push origin HEAD:feat/word-reveal-face-tracking
