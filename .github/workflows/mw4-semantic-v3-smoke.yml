name: MW4 semantic V3 smoke

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3
    paths:
      - scripts/mw4_semantic_gameplay_v3.py
      - scripts/mw4_fullframe_retention_v3.py
      - campaigns/mw4-fullframe-retention-v3.json
      - .github/workflows/mw4-semantic-v3-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight dependency
        run: python -m pip install 'numpy==2.1.3'
      - name: Compile semantic and render modules
        run: |
          python -m py_compile scripts/mw4_semantic_gameplay_v3.py
          python -m py_compile scripts/mw4_fullframe_retention_v3.py
      - name: Run deterministic semantic editor self-test
        run: python scripts/mw4_semantic_gameplay_v3.py --self-test
      - name: Validate semantic configuration contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('campaigns/mw4-fullframe-retention-v3.json').read_text())
          assert cfg['semantic_analysis']['engine'] == 'deterministic-gameplay-v1'
          assert cfg['semantic_editor']['engine'] == 'semantic-editor-v1'
          assert cfg['semantic_editor']['max_unexplained_low_interest_run_seconds'] <= 1.0
          assert cfg['editorial']['hook_text'] is False
          assert cfg['editorial']['campaign_text'] is False
          assert cfg['editorial']['campaign_logo'] is False
          assert cfg['output']['width'] == 1920 and cfg['output']['height'] == 1080
          assert cfg['output']['video_bitrate_kbps'] == 250000
          print('semantic configuration: PASS')
          PY
