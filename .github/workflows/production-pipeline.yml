# Exact-head autonomous multimodal production acceptance.
name: Production render and HILP evidence

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm that this run may deploy Modal workers and perform fresh production inference
        required: true
        type: boolean
        default: false
      campaign_brief:
        description: Repository-relative campaign brief under campaigns/
        required: true
        type: string
      target_video_id:
        description: Optional explicit target video ID; required when the brief has multiple targets
        required: false
        type: string
      max_gpu_seconds:
        description: Maximum aggregate recorded GPU seconds for the acceptance run
        required: true
        type: number
        default: 21600
      max_estimated_usd:
        description: Maximum aggregate recorded estimated inference cost in USD
        required: true
        type: number
        default: 10
  pull_request:
    branches:
      - main
    paths:
      - "acceptance/production-run-request.json"

concurrency:
  group: production-hilp-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  CLIPPER_YOUTUBE_COOKIES_B64: ${{ secrets.CLIPPER_YOUTUBE_COOKIES_B64 }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline

jobs:
  production-render-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve exact checked-out source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "CLIPPER_ACCEPTANCE_SHA=$actual" >> "$GITHUB_ENV"
          printf '%s\n' "$actual" > exact-head-sha.txt

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Resolve campaign, explicit target, confirmation, and budget
        env:
          REQUEST_CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUEST_CAMPAIGN_BRIEF: ${{ inputs.campaign_brief }}
          REQUEST_TARGET_VIDEO_ID: ${{ inputs.target_video_id }}
          REQUEST_MAX_GPU_SECONDS: ${{ inputs.max_gpu_seconds }}
          REQUEST_MAX_ESTIMATED_USD: ${{ inputs.max_estimated_usd }}
        run: |
          set -euo pipefail
          mkdir -p open-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import yaml

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              confirmed = os.environ.get("REQUEST_CONFIRM_PRODUCTION", "").lower() == "true"
              brief_value = os.environ.get("REQUEST_CAMPAIGN_BRIEF", "").strip()
              target_value = os.environ.get("REQUEST_TARGET_VIDEO_ID", "").strip()
              gpu_limit_raw = os.environ.get("REQUEST_MAX_GPU_SECONDS", "21600")
              cost_limit_raw = os.environ.get("REQUEST_MAX_ESTIMATED_USD", "10")
          else:
              marker_path = Path("acceptance/production-run-request.json")
              if not marker_path.is_file():
                  raise RuntimeError("production acceptance marker is missing")
              marker = json.loads(marker_path.read_text(encoding="utf-8"))
              if not isinstance(marker, dict):
                  raise RuntimeError("production acceptance marker must be a JSON object")
              confirmed = marker.get("confirm_production") is True
              brief_value = str(marker.get("campaign_brief") or "").strip()
              target_value = str(marker.get("target_video_id") or "").strip()
              gpu_limit_raw = marker.get("max_gpu_seconds", 21600)
              cost_limit_raw = marker.get("max_estimated_usd", 10)

          if not confirmed:
              raise RuntimeError("fresh production acceptance requires confirm_production=true")
          gpu_limit = float(gpu_limit_raw)
          cost_limit = float(cost_limit_raw)
          if gpu_limit <= 0 or cost_limit <= 0:
              raise RuntimeError("production acceptance budget limits must be positive")

          if not brief_value:
              raise RuntimeError("campaign_brief is required")
          relative = Path(brief_value)
          if relative.is_absolute() or ".." in relative.parts:
              raise RuntimeError("campaign_brief must be a repository-relative path")
          if not relative.parts or relative.parts[0] != "campaigns":
              raise RuntimeError("campaign_brief must be stored under campaigns/")
          if relative.suffix.lower() not in {".yaml", ".yml", ".json"}:
              raise RuntimeError("campaign_brief must be YAML or JSON")
          if not relative.is_file():
              raise RuntimeError(f"campaign brief not found: {relative}")

          text = relative.read_text(encoding="utf-8")
          data = json.loads(text) if relative.suffix.lower() == ".json" else yaml.safe_load(text)
          if not isinstance(data, dict):
              raise RuntimeError("campaign brief root must be an object")
          campaign_id = str(data.get("campaign_id") or "").strip()
          if not campaign_id:
              raise RuntimeError("campaign brief campaign_id is required")

          targets = data.get("targets")
          if not isinstance(targets, dict) or str(targets.get("mode") or "").lower() != "explicit":
              raise RuntimeError("production acceptance requires targets.mode=explicit")
          videos = targets.get("videos")
          if not isinstance(videos, list) or not videos or not all(isinstance(v, dict) for v in videos):
              raise RuntimeError("production acceptance requires explicit target videos")

          if target_value:
              matches = [v for v in videos if str(v.get("video_id") or "").strip() == target_value]
              if len(matches) != 1:
                  raise RuntimeError("target_video_id must identify exactly one target in the brief")
              target = matches[0]
          elif len(videos) == 1:
              target = videos[0]
          else:
              raise RuntimeError(
                  "target_video_id is required when a campaign brief contains multiple explicit targets"
              )

          video_id = str(target.get("video_id") or "").strip()
          video_url = str(target.get("url") or "").strip()
          channel_id = str(target.get("channel_id") or "").strip()
          if not video_id or not channel_id or not video_url.startswith("https://"):
              raise RuntimeError("selected target must provide video_id, https url, and channel_id")

          rights = data.get("rights")
          if not isinstance(rights, dict) or rights.get("confirmed") is not True:
              raise RuntimeError("production acceptance requires explicitly confirmed rights")
          authorized = rights.get("authorized_channels")
          if not isinstance(authorized, list) or channel_id not in authorized:
              raise RuntimeError("selected target channel is not authorized by the campaign brief")

          evidence = {
              "acceptance_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              "campaign_id": campaign_id,
              "campaign_brief": relative.as_posix(),
              "campaign_brief_sha256": hashlib.sha256(text.encode("utf-8")).hexdigest(),
              "target_video_id": video_id,
              "target_video_url": video_url,
              "target_channel_id": channel_id,
              "fresh_inference": True,
              "max_gpu_seconds": gpu_limit,
              "max_estimated_usd": cost_limit,
              "event": event,
          }
          Path("open-evidence/acceptance-request.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"CLIPPER_CAMPAIGN_ID={campaign_id}\n")
              handle.write(f"CLIPPER_CAMPAIGN_BRIEF={relative.as_posix()}\n")
              handle.write(f"CLIPPER_TARGET_VIDEO_ID={video_id}\n")
              handle.write(f"CLIPPER_TARGET_VIDEO_URL={video_url}\n")
              handle.write(f"CLIPPER_TARGET_CHANNEL_ID={channel_id}\n")
              handle.write(f"CLIPPER_MAX_GPU_SECONDS={gpu_limit}\n")
              handle.write(f"CLIPPER_MAX_ESTIMATED_USD={cost_limit}\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify Modal credentials before compute
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Stop stale deployed apps without deleting content-addressed caches
        run: |
          modal app stop "$CLIPPER_MODAL_PIPELINE_APP" --yes || true
          modal app stop "$CLIPPER_MODAL_APP" --yes || true

      - name: Deploy exact-head open-model workers
        run: modal deploy scripts/modal_open_models.py

      - name: Verify four production editorial schemas and gated-model access
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          app = os.environ["CLIPPER_MODAL_APP"]
          schema = modal.Function.from_name(app, "editorial_schema_smoke").remote()
          if not isinstance(schema, dict) or schema.get("ok") is not True:
              raise RuntimeError(f"editorial schema smoke failed: {schema}")
          if int(schema.get("task_families", 0)) != 4:
              raise RuntimeError(f"expected exactly four production editorial task families: {schema}")
          Path("open-evidence/modal-editorial-schema-smoke.json").write_text(
              json.dumps(schema, indent=2) + "\n", encoding="utf-8"
          )

          access = modal.Function.from_name(app, "hf_access_smoke").remote()
          if not isinstance(access, dict) or access.get("ok") is not True:
              raise RuntimeError(f"HF access smoke failed: {access}")
          Path("open-evidence/modal-hf-access.json").write_text(
              json.dumps(access, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"schema": schema, "hf_access": access}, indent=2))
          PY

      - name: Deploy exact-head production pipeline worker
        run: modal deploy scripts/modal_pipeline.py

      - name: Verify deployed production function handles
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          app = os.environ["CLIPPER_MODAL_PIPELINE_APP"]
          names = ("acquire_source", "run_full_cycle")
          for name in names:
              modal.Function.from_name(app, name).hydrate()
          Path("open-evidence/modal-deployment.json").write_text(
              json.dumps(
                  {
                      "status": "PASS",
                      "acceptance_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
                      "model_app": os.environ["CLIPPER_MODAL_APP"],
                      "pipeline_app": app,
                      "pipeline_functions": list(names),
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Acquire or reuse highest-quality content-addressed source master
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          payload = {
              "video_id": os.environ["CLIPPER_TARGET_VIDEO_ID"],
              "video_url": os.environ["CLIPPER_TARGET_VIDEO_URL"],
          }
          base = modal.Function.from_name(os.environ["CLIPPER_MODAL_PIPELINE_APP"], "acquire_source")
          variants = [
              ("cloud:gcp", "cloud", "gcp"),
              ("cloud:aws", "cloud", "aws"),
              ("cloud:oci", "cloud", "oci"),
              ("region:eu", "region", "eu"),
              ("region:ap", "region", "ap"),
              ("region:sa", "region", "sa"),
              ("region:af", "region", "af"),
              ("default", "default", "auto"),
          ]
          attempts = []
          result = None
          winner = None
          for label, kind, value in variants:
              try:
                  if kind == "cloud":
                      candidate = base.with_options(cloud=value, timeout=1800).remote(payload)
                  elif kind == "region":
                      candidate = base.with_options(region=value, timeout=1800).remote(payload)
                  else:
                      candidate = base.remote(payload)
              except Exception as exc:
                  attempts.append(
                      {
                          "egress": label,
                          "status": "FAIL",
                          "error_type": type(exc).__name__,
                          "error": str(exc)[-6000:],
                      }
                  )
                  continue
              if not isinstance(candidate, dict):
                  attempts.append({"egress": label, "status": "FAIL", "error": "non-object result"})
                  continue
              result = candidate
              winner = label
              attempts.append(
                  {
                      "egress": label,
                      "status": "PASS",
                      "sha256": candidate.get("sha256"),
                      "bytes": candidate.get("bytes"),
                      "reused": candidate.get("reused"),
                  }
              )
              break
          Path("open-evidence/source-egress-attempts.json").write_text(
              json.dumps({"winner": winner, "attempts": attempts}, indent=2) + "\n",
              encoding="utf-8",
          )
          if result is None:
              raise RuntimeError("all autonomous source egress pools failed: " + json.dumps(attempts))
          if result.get("video_id") != os.environ["CLIPPER_TARGET_VIDEO_ID"]:
              raise RuntimeError("source acquisition returned the wrong explicit target")
          if result.get("quality_policy") != "highest_available_no_transcode":
              raise RuntimeError("source acquisition violated highest-available/no-transcode policy")
          if int(result.get("bytes") or 0) <= 0:
              raise RuntimeError("source master is empty")
          if not str(result.get("volume_path") or "").startswith("/inputs/"):
              raise RuntimeError("source master is not content-addressed on the media volume")
          if len(str(result.get("sha256") or "")) != 64:
              raise RuntimeError("source master SHA-256 evidence is invalid")
          Path("open-evidence/source-master.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"winner": winner, "result": result}, indent=2))
          PY

      - name: Run one fresh-inference current-model production render
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          evidence = json.loads(Path("open-evidence/source-master.json").read_text(encoding="utf-8"))
          source = {
              "video_id": os.environ["CLIPPER_TARGET_VIDEO_ID"],
              "channel_id": os.environ["CLIPPER_TARGET_CHANNEL_ID"],
              "canonical_url": os.environ["CLIPPER_TARGET_VIDEO_URL"],
              "evidence": evidence,
          }
          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "run_full_cycle"
          ).remote(
              {
                  "sources": [source],
                  "brief_yaml": Path(os.environ["CLIPPER_CAMPAIGN_BRIEF"]).read_text(encoding="utf-8"),
                  "render": True,
                  "fresh_inference": True,
                  "git_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              }
          )
          if not isinstance(result, dict) or result.get("status") != "PASS":
              raise RuntimeError(f"production cycle failed: {result}")
          if result.get("pipeline_status") not in {"SUCCESS", "DEGRADED"}:
              raise RuntimeError(f"production pipeline did not complete: {result}")
          if result.get("review_status") != "PENDING_ACTUAL_MP4_REVIEW":
              raise RuntimeError(f"production result bypassed actual-MP4 review: {result}")
          if int(result.get("reviewable") or 0) != int(result.get("rendered") or 0):
              raise RuntimeError("every accepted rendered quality moment must remain reviewable")
          Path("open-evidence/cycle-result.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"CLIPPER_RUN_VOLUME={result['run_volume']}\n")
              handle.write(f"CLIPPER_RUN_PATH={result['run_path']}\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Materialize exact production run from Modal volume
        run: |
          set -euo pipefail
          rm -rf cycle-evidence
          modal volume get --force "$CLIPPER_RUN_VOLUME" "$CLIPPER_RUN_PATH" cycle-evidence

      - name: Validate dynamic yield, fresh inference, cost bounds, and actual media
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from clipper.acceptance import validate_live_run

          roots = list(Path("cycle-evidence").rglob("manifest.json"))
          if len(roots) != 1:
              raise RuntimeError(f"expected exactly one materialized production manifest: {roots}")
          run_dir = roots[0].parent
          manifest = validate_live_run(run_dir)
          metadata = manifest.get("run_metadata")
          if not isinstance(metadata, dict):
              raise RuntimeError("run metadata is missing")
          if metadata.get("git_sha") != os.environ["CLIPPER_ACCEPTANCE_SHA"]:
              raise RuntimeError(
                  f"manifest SHA is not the exact acceptance head: {metadata.get('git_sha')}"
              )

          publication_state = manifest.get("publication_state")
          if publication_state != "READY_FOR_HUMAN_REVIEW":
              raise RuntimeError(
                  f"current rendered acceptance must stop at human review, got {publication_state}"
              )
          if publication_state == "READY_TO_PUBLISH":
              raise RuntimeError("pipeline must never self-authorize publication")

          rendered = manifest.get("rendered_clips") or []
          if not isinstance(rendered, list) or not rendered:
              raise RuntimeError(
                  "contract permits zero quality yield, but this acceptance run produced no MP4 to review"
              )

          cache = manifest.get("cache")
          if not isinstance(cache, dict):
              raise RuntimeError("cache evidence is missing")
          if int(cache.get("hits") or 0) != 0:
              raise RuntimeError(f"fresh inference unexpectedly reused grounding cache: {cache}")
          events = cache.get("events") or []
          if not isinstance(events, list) or any(
              not isinstance(item, dict) or item.get("hit") is not False for item in events
          ):
              raise RuntimeError("fresh grounding cache evidence is incomplete")

          editorial = metadata.get("editorial_inference")
          if not isinstance(editorial, dict):
              raise RuntimeError("editorial inference evidence is missing")
          cache_summary = editorial.get("cache_summary")
          if not isinstance(cache_summary, dict):
              raise RuntimeError("editorial cache summary is missing")
          if int(cache_summary.get("stage_cache_hits") or 0) != 0:
              raise RuntimeError("fresh inference unexpectedly reused editorial DAG cache")
          if int(cache_summary.get("stage_executions") or 0) <= 0:
              raise RuntimeError("fresh acceptance executed no editorial model stages")
          invocations = editorial.get("model_invocations")
          if not isinstance(invocations, list) or not invocations:
              raise RuntimeError("real editorial model invocation evidence is missing")
          allowed_families = {
              "source_hazards",
              "semantic_cores",
              "narrative_envelope",
              "quality_windows",
          }
          observed_families = set()
          for invocation in invocations:
              if not isinstance(invocation, dict) or invocation.get("cache_hit") is not False:
                  raise RuntimeError(f"invalid fresh editorial invocation evidence: {invocation}")
              stage = str(invocation.get("stage") or "")
              family = stage.split(":", 1)[0]
              if family not in allowed_families:
                  raise RuntimeError(f"unknown production editorial family executed: {stage}")
              observed_families.add(family)
          required_families = {"semantic_cores", "narrative_envelope", "quality_windows"}
          if not required_families.issubset(observed_families):
              raise RuntimeError(
                  f"current quality graph did not exercise required editorial stages: {observed_families}"
              )

          usage_records = []
          def collect(value):
              if isinstance(value, dict):
                  if (
                      isinstance(value.get("provider"), str)
                      and isinstance(value.get("duration_seconds"), (int, float))
                      and isinstance(value.get("gpu_seconds"), (int, float))
                      and isinstance(value.get("estimated_cost_usd"), (int, float))
                  ):
                      usage_records.append(value)
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)
          collect(metadata)
          if not usage_records:
              raise RuntimeError("no current-model inference usage records were persisted")
          gpu_seconds = sum(float(item.get("gpu_seconds") or 0.0) for item in usage_records)
          estimated_usd = sum(float(item.get("estimated_cost_usd") or 0.0) for item in usage_records)
          gpu_limit = float(os.environ["CLIPPER_MAX_GPU_SECONDS"])
          cost_limit = float(os.environ["CLIPPER_MAX_ESTIMATED_USD"])
          if gpu_seconds > gpu_limit:
              raise RuntimeError(f"GPU budget exceeded: {gpu_seconds:.2f} > {gpu_limit:.2f}")
          if estimated_usd > cost_limit:
              raise RuntimeError(f"estimated cost budget exceeded: {estimated_usd:.4f} > {cost_limit:.4f}")

          review_root = Path("hilp-review")
          review_root.mkdir(parents=True, exist_ok=True)
          queue = []
          for index, item in enumerate(rendered, start=1):
              if not isinstance(item, dict):
                  raise RuntimeError("rendered clip evidence must be an object")
              remote_output = Path(str(item.get("output_path") or ""))
              clip = run_dir / "clips" / remote_output.name
              if not clip.is_file() or clip.stat().st_size <= 0:
                  raise RuntimeError(f"accepted MP4 is missing: {clip}")
              subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", str(clip), "-f", "null", "-"],
                  check=True,
                  timeout=900,
              )
              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "stream=codec_type,codec_name,width,height",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "json",
                      str(clip),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )
              probe_data = json.loads(probe.stdout)
              streams = probe_data.get("streams") or []
              videos = [s for s in streams if isinstance(s, dict) and s.get("codec_type") == "video"]
              audios = [s for s in streams if isinstance(s, dict) and s.get("codec_type") == "audio"]
              if len(videos) != 1 or len(audios) != 1:
                  raise RuntimeError(f"accepted MP4 stream inventory is invalid: {clip}")
              video = videos[0]
              if (video.get("width"), video.get("height"), video.get("codec_name")) != (1080, 1920, "h264"):
                  raise RuntimeError(f"accepted MP4 video contract failed: {clip}: {video}")
              if audios[0].get("codec_name") != "aac":
                  raise RuntimeError(f"accepted MP4 audio codec contract failed: {clip}")

              duration = float((probe_data.get("format") or {}).get("duration") or 0.0)
              frame_dir = review_root / f"clip-{index:03d}-{clip.stem}"
              frame_dir.mkdir(parents=True, exist_ok=True)
              sample_times = sorted(
                  {
                      max(0.0, min(duration - 0.05, value))
                      for value in (0.5, duration * 0.25, duration * 0.5, duration * 0.75, duration - 0.5)
                      if duration > 0.1
                  }
              )
              frames = []
              for frame_index, timestamp in enumerate(sample_times, start=1):
                  frame = frame_dir / f"frame-{frame_index:02d}-{timestamp:.2f}s.jpg"
                  subprocess.run(
                      [
                          "ffmpeg",
                          "-hide_banner",
                          "-loglevel",
                          "error",
                          "-y",
                          "-ss",
                          f"{timestamp:.3f}",
                          "-i",
                          str(clip),
                          "-frames:v",
                          "1",
                          "-q:v",
                          "2",
                          str(frame),
                      ],
                      check=True,
                      timeout=120,
                  )
                  frames.append(str(frame))
              digest = hashlib.sha256(clip.read_bytes()).hexdigest()
              if digest != str(item.get("render_sha256") or ""):
                  raise RuntimeError(f"materialized MP4 hash disagrees with manifest: {clip}")
              queue.append(
                  {
                      "plan_id": item.get("plan_id"),
                      "concept_id": item.get("concept_id"),
                      "mp4": str(clip),
                      "sha256": digest,
                      "duration_seconds": duration,
                      "frames": frames,
                      "human_review": "PENDING",
                  }
              )

          editorial_review = json.loads((run_dir / "editorial-review.json").read_text(encoding="utf-8"))
          if editorial_review.get("status") != "PENDING_HUMAN_REVIEW":
              raise RuntimeError(f"HILP boundary was bypassed: {editorial_review}")

          summary = {
              "status": "PASS_PENDING_ACTUAL_MP4_REVIEW",
              "acceptance_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              "pipeline_status": manifest.get("status"),
              "publication_state": publication_state,
              "eligible_quality_moments": int((manifest.get("targets") or {}).get("eligible_quality_moments") or 0),
              "accepted_mp4s": len(rendered),
              "editorial_task_families": sorted(observed_families),
              "inference_usage_records": len(usage_records),
              "gpu_seconds": gpu_seconds,
              "max_gpu_seconds": gpu_limit,
              "estimated_cost_usd": estimated_usd,
              "max_estimated_usd": cost_limit,
              "run_dir": str(run_dir),
          }
          Path("open-evidence/production-validation.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          Path("hilp-review/review-queue.json").write_text(
              json.dumps(queue, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload exact-head production evidence and MP4 review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hilp-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            exact-head-sha.txt
            open-evidence
            cycle-evidence
            hilp-review
          if-no-files-found: warn
          retention-days: 14
