# Exact-head autonomous multimodal production acceptance.
name: Production render and HILP evidence

on:
  workflow_dispatch:
    inputs:
      campaign_brief:
        description: Repository-relative campaign brief under campaigns/
        required: true
        type: string
      target_video_id:
        description: Optional explicit target video ID; required when the brief has multiple targets
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "acceptance/production-run-request.json"

concurrency:
  group: production-hilp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  CLIPPER_YOUTUBE_COOKIES_B64: ${{ secrets.CLIPPER_YOUTUBE_COOKIES_B64 }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline

jobs:
  production-render-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Resolve campaign and explicit acceptance target
        env:
          REQUEST_CAMPAIGN_BRIEF: ${{ inputs.campaign_brief }}
          REQUEST_TARGET_VIDEO_ID: ${{ inputs.target_video_id }}
        run: |
          set -euo pipefail
          mkdir -p open-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import yaml

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event == "workflow_dispatch":
              brief_value = os.environ.get("REQUEST_CAMPAIGN_BRIEF", "").strip()
              target_value = os.environ.get("REQUEST_TARGET_VIDEO_ID", "").strip()
          else:
              marker_path = Path("acceptance/production-run-request.json")
              if not marker_path.is_file():
                  raise RuntimeError("production acceptance marker is missing")
              marker = json.loads(marker_path.read_text(encoding="utf-8"))
              if not isinstance(marker, dict):
                  raise RuntimeError("production acceptance marker must be a JSON object")
              brief_value = str(marker.get("campaign_brief") or "").strip()
              target_value = str(marker.get("target_video_id") or "").strip()

          if not brief_value:
              raise RuntimeError("campaign_brief is required")
          relative = Path(brief_value)
          if relative.is_absolute() or ".." in relative.parts:
              raise RuntimeError("campaign_brief must be a repository-relative path")
          if not relative.parts or relative.parts[0] != "campaigns":
              raise RuntimeError("campaign_brief must be stored under campaigns/")
          if relative.suffix.lower() not in {".yaml", ".yml", ".json"}:
              raise RuntimeError("campaign_brief must be YAML or JSON")
          if not relative.is_file():
              raise RuntimeError(f"campaign brief not found: {relative}")

          text = relative.read_text(encoding="utf-8")
          data = json.loads(text) if relative.suffix.lower() == ".json" else yaml.safe_load(text)
          if not isinstance(data, dict):
              raise RuntimeError("campaign brief root must be an object")
          campaign_id = str(data.get("campaign_id") or "").strip()
          if not campaign_id:
              raise RuntimeError("campaign brief campaign_id is required")

          targets = data.get("targets")
          if not isinstance(targets, dict) or str(targets.get("mode") or "").lower() != "explicit":
              raise RuntimeError("production acceptance requires targets.mode=explicit")
          videos = targets.get("videos")
          if not isinstance(videos, list) or not videos or not all(isinstance(v, dict) for v in videos):
              raise RuntimeError("production acceptance requires explicit target videos")

          if target_value:
              matches = [v for v in videos if str(v.get("video_id") or "").strip() == target_value]
              if len(matches) != 1:
                  raise RuntimeError("target_video_id must identify exactly one target in the brief")
              target = matches[0]
          elif len(videos) == 1:
              target = videos[0]
          else:
              raise RuntimeError(
                  "target_video_id is required when a campaign brief contains multiple explicit targets"
              )

          video_id = str(target.get("video_id") or "").strip()
          video_url = str(target.get("url") or "").strip()
          channel_id = str(target.get("channel_id") or "").strip()
          if not video_id or not channel_id or not video_url.startswith("https://"):
              raise RuntimeError("selected target must provide video_id, https url, and channel_id")

          rights = data.get("rights")
          if not isinstance(rights, dict) or rights.get("confirmed") is not True:
              raise RuntimeError("production acceptance requires explicitly confirmed rights")
          authorized = rights.get("authorized_channels")
          if not isinstance(authorized, list) or channel_id not in authorized:
              raise RuntimeError("selected target channel is not authorized by the campaign brief")

          evidence = {
              "campaign_id": campaign_id,
              "campaign_brief": relative.as_posix(),
              "campaign_brief_sha256": hashlib.sha256(text.encode("utf-8")).hexdigest(),
              "target_video_id": video_id,
              "target_video_url": video_url,
              "target_channel_id": channel_id,
              "event": event,
          }
          Path("open-evidence/acceptance-request.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          env_file = Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as handle:
              handle.write(f"CLIPPER_CAMPAIGN_ID={campaign_id}\n")
              handle.write(f"CLIPPER_CAMPAIGN_BRIEF={relative.as_posix()}\n")
              handle.write(f"CLIPPER_TARGET_VIDEO_ID={video_id}\n")
              handle.write(f"CLIPPER_TARGET_VIDEO_URL={video_url}\n")
              handle.write(f"CLIPPER_TARGET_CHANNEL_ID={channel_id}\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify credentials before compute
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Terminate stale production Modal containers without deleting persistent caches
        run: |
          modal app stop "$CLIPPER_MODAL_PIPELINE_APP" --yes || true
          modal app stop "$CLIPPER_MODAL_APP" --yes || true
          modal volume rm -r clipper-media-cache /staging || true

      - name: Deploy exact-HEAD open-model workers
        run: modal deploy scripts/modal_open_models.py

      - name: Verify all 11 structured editorial task schemas and HF access
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          app = os.environ["CLIPPER_MODAL_APP"]
          schema = modal.Function.from_name(app, "editorial_schema_smoke").remote()
          assert isinstance(schema, dict) and schema.get("ok") is True, schema
          assert schema.get("task_families") == 11, schema
          Path("open-evidence/modal-editorial-schema-smoke.json").write_text(
              json.dumps(schema, indent=2) + "\n", encoding="utf-8"
          )

          access = modal.Function.from_name(app, "hf_access_smoke").remote()
          assert isinstance(access, dict) and access.get("ok") is True, access
          Path("open-evidence/modal-hf-access.json").write_text(
              json.dumps(access, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"schema": schema, "hf_access": access}, indent=2))
          PY

      - name: Deploy exact-HEAD source and production pipeline workers
        run: modal deploy scripts/modal_pipeline.py

      - name: Acquire or reuse highest-quality content-addressed source master
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          payload = {
              "video_id": os.environ["CLIPPER_TARGET_VIDEO_ID"],
              "video_url": os.environ["CLIPPER_TARGET_VIDEO_URL"],
          }
          base = modal.Function.from_name(os.environ["CLIPPER_MODAL_PIPELINE_APP"], "acquire_source")
          variants = [
              ("cloud:gcp", "cloud", "gcp"),
              ("cloud:aws", "cloud", "aws"),
              ("cloud:oci", "cloud", "oci"),
              ("region:eu", "region", "eu"),
              ("region:ap", "region", "ap"),
              ("region:sa", "region", "sa"),
              ("region:af", "region", "af"),
              ("default", "default", "auto"),
          ]
          attempts = []
          result = None
          winner = None
          for label, kind, value in variants:
              try:
                  if kind == "cloud":
                      candidate = base.with_options(cloud=value, timeout=1800).remote(payload)
                  elif kind == "region":
                      candidate = base.with_options(region=value, timeout=1800).remote(payload)
                  else:
                      candidate = base.remote(payload)
              except Exception as exc:
                  attempts.append({
                      "egress": label,
                      "status": "FAIL",
                      "error_type": type(exc).__name__,
                      "error": str(exc)[-6000:],
                  })
                  continue
              result = candidate
              winner = label
              attempts.append({
                  "egress": label,
                  "status": "PASS",
                  "sha256": candidate.get("sha256"),
                  "bytes": candidate.get("bytes"),
                  "reused": candidate.get("reused"),
              })
              break
          Path("open-evidence/source-egress-attempts.json").write_text(
              json.dumps({"winner": winner, "attempts": attempts}, indent=2) + "\n",
              encoding="utf-8",
          )
          if result is None:
              raise RuntimeError("all autonomous source egress pools failed: " + json.dumps(attempts))
          assert result["quality_policy"] == "highest_available_no_transcode"
          assert int(result["bytes"]) > 0
          assert result["volume_path"].startswith("/inputs/")
          Path("open-evidence/source-master.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({"winner": winner, "result": result}, indent=2))
          PY

      - name: Planning-only pass using persistent paid cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "run_full_cycle"
          ).remote({
              "source": json.loads(Path("open-evidence/source-master.json").read_text()),
              "brief_yaml": Path(os.environ["CLIPPER_CAMPAIGN_BRIEF"]).read_text(),
              "channel_id": os.environ["CLIPPER_TARGET_CHANNEL_ID"],
              "render": False,
          })
          assert result["status"] == "PASS", result
          assert result["pipeline_status"] != "FAILED", result
          assert int(result["rendered_finalists"]) == 0, result
          Path("open-evidence/planning-result.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          Path("open-evidence/planning-run-path.txt").write_text(
              str(result["run_path"]) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Download and validate planning evidence before rendering
        run: |
          set -euo pipefail
          planning_path="$(tr -d '\n' < open-evidence/planning-run-path.txt)"
          rm -rf planning-evidence
          modal volume get --force clipper-production-artifacts "$planning_path" planning-evidence
          python - <<'PY'
          import json
          from pathlib import Path

          roots = list(Path("planning-evidence").rglob("manifest.json"))
          assert len(roots) == 1, roots
          manifest = json.loads(roots[0].read_text())
          assert manifest["status"] != "FAILED", manifest.get("status_reason")
          targets = manifest.get("targets") or {}
          eligible = int(targets.get("eligible_quality_moments") or 0)
          assert eligible >= 0
          assert not (manifest.get("rendered_clips") or [])
          assert not (manifest.get("submission_shortlist") or [])
          rejections = manifest.get("rejections") or []
          assert all(isinstance(item, dict) for item in rejections)
          Path("open-evidence/planning-validation.json").write_text(
              json.dumps(
                  {
                      "status": "PASS",
                      "eligible_quality_moments": eligible,
                      "rejections": len(rejections),
                      "planning_run": str(roots[0].parent),
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"eligible_quality_moments": eligible, "rejections": len(rejections)}, indent=2))
          PY

      - name: Render only after planning gate passes using the same cache identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "run_full_cycle"
          ).remote({
              "source": json.loads(Path("open-evidence/source-master.json").read_text()),
              "brief_yaml": Path(os.environ["CLIPPER_CAMPAIGN_BRIEF"]).read_text(),
              "channel_id": os.environ["CLIPPER_TARGET_CHANNEL_ID"],
              "render": True,
          })
          assert result["status"] == "PASS", result
          assert result["pipeline_status"] in {"SUCCESS", "DEGRADED"}, result
          rendered = int(result["rendered_finalists"])
          reviewable = int(result["initial_shortlist"])
          assert rendered >= 0, result
          assert reviewable == rendered, result
          Path("open-evidence/cycle-result.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          Path("open-evidence/run-path.txt").write_text(
              str(result["run_path"]) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Download rendered and evidence bundle from Modal
        run: |
          set -euo pipefail
          run_path="$(tr -d '\n' < open-evidence/run-path.txt)"
          rm -rf cycle-evidence
          modal volume get --force clipper-production-artifacts "$run_path" cycle-evidence

      - name: Validate dynamic yield, decode every accepted MP4, and prepare HILP review queue
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          from clipper.acceptance import validate_live_run

          roots = list(Path("cycle-evidence").rglob("manifest.json"))
          assert len(roots) == 1, roots
          run_dir = roots[0].parent
          manifest = validate_live_run(run_dir)
          assert manifest["status"] in {"SUCCESS", "DEGRADED"}, manifest.get("status_reason")
          targets = manifest.get("targets") or {}
          eligible = int(targets["eligible_quality_moments"])
          rendered = manifest.get("rendered_clips") or []
          shortlist = manifest.get("submission_shortlist") or []
          assert len(rendered) <= eligible
          assert len(shortlist) == len(rendered)
          concepts = {
              str(item.get("concept_id"))
              for item in rendered
              if isinstance(item, dict) and item.get("concept_id")
          }
          assert len(concepts) == len(rendered)
          if eligible == 0:
              assert manifest["publication_state"] == "COMPLETED_NO_ELIGIBLE_MOMENTS"
          else:
              assert rendered
              assert manifest["publication_state"] in {
                  "READY_FOR_HUMAN_REVIEW",
                  "READY_TO_PUBLISH",
              }

          shortlist_ids = {
              str(item.get("plan_id"))
              for item in shortlist
              if isinstance(item, dict) and item.get("plan_id")
          }
          queue = []
          for item in rendered:
              assert isinstance(item, dict)
              requested = Path(str(item["output_path"]))
              matches = list(run_dir.rglob(requested.name))
              assert len(matches) == 1, (requested, matches)
              local = matches[0]
              subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", str(local), "-f", "null", "-"],
                  check=True,
                  timeout=1800,
              )
              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_streams",
                      "-show_format",
                      "-of",
                      "json",
                      str(local),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )
              metadata = json.loads(probe.stdout)
              videos = [s for s in metadata.get("streams", []) if s.get("codec_type") == "video"]
              audios = [s for s in metadata.get("streams", []) if s.get("codec_type") == "audio"]
              assert len(videos) == 1 and audios
              video = videos[0]
              assert int(video["width"]) == 1080
              assert int(video["height"]) == 1920
              assert video.get("codec_name") == "h264"
              duration = float(metadata.get("format", {}).get("duration") or 0.0)
              assert duration > 0.0
              digest = hashlib.sha256(local.read_bytes()).hexdigest()
              expected = str(item.get("render_sha256") or "")
              if expected:
                  assert digest == expected
              queue.append(
                  {
                      "plan_id": item.get("plan_id"),
                      "concept_id": item.get("concept_id"),
                      "path": str(local),
                      "sha256": digest,
                      "duration_seconds": duration,
                      "initial_shortlist": str(item.get("plan_id")) in shortlist_ids,
                      "decision": "PENDING_ACTUAL_REVIEW",
                  }
              )
          Path("open-evidence/manual-review-queue.json").write_text(
              json.dumps(
                  {
                      "status": "PENDING_ACTUAL_MP4_REVIEW" if queue else "NO_ELIGIBLE_MOMENTS",
                      "eligible_quality_moments": eligible,
                      "clips": queue,
                      "required_reviewer_actions": ["APPROVE", "REJECT", "REVISE"],
                      "automated_hilp_allowed": False,
                      "dod_complete": False,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"run_dir": str(run_dir), "eligible": eligible, "clips": queue}, indent=2))
          PY

      - name: Upload production renders for actual MP4 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-review-${{ github.sha }}
          path: |
            open-evidence/
            planning-evidence/
            cycle-evidence/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

      - name: Stop production Modal containers
        if: always()
        run: |
          modal app stop "$CLIPPER_MODAL_PIPELINE_APP" --yes || true
          modal app stop "$CLIPPER_MODAL_APP" --yes || true
