# Exact-head autonomous multimodal production acceptance.
name: Production render and HILP evidence

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm that this run may invoke already-deployed exact-head Modal workers and perform production inference
        required: true
        type: boolean
        default: false
      fresh_inference:
        description: Explicitly bypass reusable inference caches; keep false for resumable production
        required: true
        type: boolean
        default: false
      resume_from_run_id:
        description: Optional prior pipeline run ID recorded as resume provenance
        required: false
        type: string
      campaign_brief:
        description: Repository-relative campaign brief under campaigns/
        required: true
        type: string
      target_video_id:
        description: Optional explicit target video ID; required when the brief has multiple targets
        required: false
        type: string
      max_gpu_seconds:
        description: Maximum aggregate recorded GPU seconds for the acceptance run
        required: true
        type: number
        default: 21600
      max_estimated_usd:
        description: Maximum aggregate recorded estimated inference cost in USD
        required: true
        type: number
        default: 10
  pull_request:
    branches: [main]
    paths:
      - "acceptance/production-run-request.json"

concurrency:
  group: production-hilp-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  CLIPPER_YOUTUBE_COOKIES_B64: ${{ secrets.CLIPPER_YOUTUBE_COOKIES_B64 }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline

jobs:
  production-render-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve exact checked-out source SHA
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "CLIPPER_ACCEPTANCE_SHA=$actual" >> "$GITHUB_ENV"
          printf '%s\n' "$actual" > exact-head-sha.txt

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Resolve campaign, explicit target, confirmation, and budget
        env:
          REQUEST_CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          REQUEST_FRESH_INFERENCE: ${{ inputs.fresh_inference }}
          REQUEST_RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
          REQUEST_CAMPAIGN_BRIEF: ${{ inputs.campaign_brief }}
          REQUEST_TARGET_VIDEO_ID: ${{ inputs.target_video_id }}
          REQUEST_MAX_GPU_SECONDS: ${{ inputs.max_gpu_seconds }}
          REQUEST_MAX_ESTIMATED_USD: ${{ inputs.max_estimated_usd }}
        run: |
          set -euo pipefail
          mkdir -p open-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import yaml

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              confirmed = os.environ.get("REQUEST_CONFIRM_PRODUCTION", "").lower() == "true"
              fresh_inference = os.environ.get("REQUEST_FRESH_INFERENCE", "").lower() == "true"
              resume_from_run_id = (
                  os.environ.get("REQUEST_RESUME_FROM_RUN_ID", "").strip() or None
              )
              brief_value = os.environ.get("REQUEST_CAMPAIGN_BRIEF", "").strip()
              target_value = os.environ.get("REQUEST_TARGET_VIDEO_ID", "").strip()
              gpu_limit_raw = os.environ.get("REQUEST_MAX_GPU_SECONDS", "21600")
              cost_limit_raw = os.environ.get("REQUEST_MAX_ESTIMATED_USD", "10")
          else:
              marker = json.loads(
                  Path("acceptance/production-run-request.json").read_text(encoding="utf-8")
              )
              if not isinstance(marker, dict):
                  raise RuntimeError("production acceptance marker must be an object")
              confirmed = marker.get("confirm_production") is True
              fresh_inference = marker.get("fresh_inference") is True
              resume_from_run_id = str(marker.get("resume_from_run_id") or "").strip() or None
              brief_value = str(marker.get("campaign_brief") or "").strip()
              target_value = str(marker.get("target_video_id") or "").strip()
              gpu_limit_raw = marker.get("max_gpu_seconds", 21600)
              cost_limit_raw = marker.get("max_estimated_usd", 10)

          if not confirmed:
              raise RuntimeError("production acceptance requires confirm_production=true")
          if fresh_inference and resume_from_run_id is not None:
              raise RuntimeError("fresh inference cannot be combined with a resume_from_run_id")
          execution_mode = "fresh-inference" if fresh_inference else "content-addressed-resume"
          gpu_limit = float(gpu_limit_raw)
          cost_limit = float(cost_limit_raw)
          if gpu_limit <= 0 or cost_limit <= 0:
              raise RuntimeError("production acceptance budget limits must be positive")

          brief_path = Path(brief_value)
          if (
              not brief_value
              or brief_path.is_absolute()
              or ".." in brief_path.parts
              or not brief_path.parts
              or brief_path.parts[0] != "campaigns"
              or brief_path.suffix.lower() not in {".yaml", ".yml", ".json"}
              or not brief_path.is_file()
          ):
              raise RuntimeError("campaign_brief must name an existing YAML/JSON file under campaigns/")
          text = brief_path.read_text(encoding="utf-8")
          data = json.loads(text) if brief_path.suffix.lower() == ".json" else yaml.safe_load(text)
          if not isinstance(data, dict):
              raise RuntimeError("campaign brief root must be an object")
          targets = data.get("targets")
          if not isinstance(targets, dict) or str(targets.get("mode") or "").lower() != "explicit":
              raise RuntimeError("production acceptance requires targets.mode=explicit")
          videos = targets.get("videos")
          if not isinstance(videos, list) or not videos or not all(isinstance(v, dict) for v in videos):
              raise RuntimeError("production acceptance requires explicit target videos")
          if target_value:
              matches = [v for v in videos if str(v.get("video_id") or "").strip() == target_value]
              if len(matches) != 1:
                  raise RuntimeError("target_video_id must identify exactly one target in the brief")
              target = matches[0]
          elif len(videos) == 1:
              target = videos[0]
          else:
              raise RuntimeError("target_video_id is required for a multi-target acceptance brief")

          video_id = str(target.get("video_id") or "").strip()
          video_url = str(target.get("url") or "").strip()
          channel_id = str(target.get("channel_id") or "").strip()
          rights = data.get("rights")
          if not video_id or not channel_id or not video_url.startswith("https://"):
              raise RuntimeError("selected target requires video_id, channel_id, and https url")
          if not isinstance(rights, dict) or rights.get("confirmed") is not True:
              raise RuntimeError("production acceptance requires confirmed rights")
          authorized = rights.get("authorized_channels")
          if not isinstance(authorized, list) or channel_id not in authorized:
              raise RuntimeError("selected target channel is not authorized")

          campaign_id = str(data.get("campaign_id") or "").strip()
          if not campaign_id:
              raise RuntimeError("campaign_id is required")
          evidence = {
              "acceptance_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              "campaign_id": campaign_id,
              "campaign_brief": brief_path.as_posix(),
              "campaign_brief_sha256": hashlib.sha256(text.encode()).hexdigest(),
              "target_video_id": video_id,
              "target_video_url": video_url,
              "target_channel_id": channel_id,
              "fresh_inference": fresh_inference,
              "resume_from_run_id": resume_from_run_id,
              "execution_mode": execution_mode,
              "max_gpu_seconds": gpu_limit,
              "max_estimated_usd": cost_limit,
          }
          Path("open-evidence/acceptance-request.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"CLIPPER_CAMPAIGN_BRIEF={brief_path.as_posix()}\n")
              handle.write(f"CLIPPER_TARGET_VIDEO_ID={video_id}\n")
              handle.write(f"CLIPPER_TARGET_VIDEO_URL={video_url}\n")
              handle.write(f"CLIPPER_TARGET_CHANNEL_ID={channel_id}\n")
              handle.write(f"CLIPPER_FRESH_INFERENCE={'true' if fresh_inference else 'false'}\n")
              handle.write(f"CLIPPER_RESUME_FROM_RUN_ID={resume_from_run_id or ''}\n")
              handle.write(f"CLIPPER_EXECUTION_MODE={execution_mode}\n")
              handle.write(f"CLIPPER_MAX_GPU_SECONDS={gpu_limit}\n")
              handle.write(f"CLIPPER_MAX_ESTIMATED_USD={cost_limit}\n")
          PY

      - name: Verify Modal credentials before compute
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Require successful exact-head Modal deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["CLIPPER_ACCEPTANCE_SHA"]
          workflow = "modal-workers-deploy.yml"
          query = urllib.parse.urlencode(
              {
                  "head_sha": sha,
                  "status": "success",
                  "per_page": 20,
              }
          )
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{workflow}/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          runs = [
              item
              for item in payload.get("workflow_runs", [])
              if isinstance(item, dict)
              and item.get("head_sha") == sha
              and item.get("conclusion") == "success"
          ]
          if not runs:
              raise RuntimeError(
                  "production requires a successful exact-head Deploy Modal workers run "
                  f"before inference: sha={sha}"
              )
          selected = max(
              runs,
              key=lambda item: int(item.get("run_number") or 0),
          )
          evidence = {
              "status": "PASS",
              "acceptance_sha": sha,
              "workflow": workflow,
              "run_id": selected.get("id"),
              "run_number": selected.get("run_number"),
              "html_url": selected.get("html_url"),
              "head_sha": selected.get("head_sha"),
          }
          Path("open-evidence/modal-deployment-prerequisite.json").write_text(
              json.dumps(evidence, indent=2) + chr(10),
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify four production editorial schemas and gated-model access
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import modal

          app = os.environ["CLIPPER_MODAL_APP"]
          schema = modal.Function.from_name(app, "editorial_schema_smoke").remote()
          if not isinstance(schema, dict) or schema.get("ok") is not True:
              raise RuntimeError(f"editorial schema smoke failed: {schema}")
          if int(schema.get("task_families", 0)) != 4:
              raise RuntimeError(f"expected exactly four production editorial task families: {schema}")
          Path("open-evidence/modal-editorial-schema-smoke.json").write_text(
              json.dumps(schema, indent=2) + "\n", encoding="utf-8"
          )
          access = modal.Function.from_name(app, "hf_access_smoke").remote()
          if not isinstance(access, dict) or access.get("ok") is not True:
              raise RuntimeError(f"HF access smoke failed: {access}")
          Path("open-evidence/modal-hf-access.json").write_text(
              json.dumps(access, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Verify deployed production function handles
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import modal

          app = os.environ["CLIPPER_MODAL_PIPELINE_APP"]
          for name in ("acquire_source", "run_full_cycle"):
              modal.Function.from_name(app, name).hydrate()
          Path("open-evidence/modal-deployment.json").write_text(
              json.dumps(
                  {
                      "status": "PASS",
                      "acceptance_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
                      "model_app": os.environ["CLIPPER_MODAL_APP"],
                      "pipeline_app": app,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Acquire or reuse highest-quality content-addressed source master
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import modal

          payload = {
              "video_id": os.environ["CLIPPER_TARGET_VIDEO_ID"],
              "video_url": os.environ["CLIPPER_TARGET_VIDEO_URL"],
          }
          base = modal.Function.from_name(os.environ["CLIPPER_MODAL_PIPELINE_APP"], "acquire_source")
          variants = [
              ("cloud:gcp", "cloud", "gcp"),
              ("cloud:aws", "cloud", "aws"),
              ("cloud:oci", "cloud", "oci"),
              ("region:eu", "region", "eu"),
              ("region:ap", "region", "ap"),
              ("region:sa", "region", "sa"),
              ("region:af", "region", "af"),
              ("default", "default", "auto"),
          ]
          attempts = []
          result = None
          winner = None
          for label, kind, value in variants:
              try:
                  if kind == "cloud":
                      candidate = base.with_options(cloud=value, timeout=1800).remote(payload)
                  elif kind == "region":
                      candidate = base.with_options(region=value, timeout=1800).remote(payload)
                  else:
                      candidate = base.remote(payload)
              except Exception as exc:
                  attempts.append({"egress": label, "status": "FAIL", "error": str(exc)[-6000:]})
                  continue
              if isinstance(candidate, dict):
                  result = candidate
                  winner = label
                  attempts.append({"egress": label, "status": "PASS"})
                  break
          Path("open-evidence/source-egress-attempts.json").write_text(
              json.dumps({"winner": winner, "attempts": attempts}, indent=2) + "\n",
              encoding="utf-8",
          )
          if result is None:
              raise RuntimeError("all autonomous source egress pools failed")
          if result.get("video_id") != os.environ["CLIPPER_TARGET_VIDEO_ID"]:
              raise RuntimeError("source acquisition returned the wrong explicit target")
          if result.get("quality_policy") != "highest_available_no_transcode":
              raise RuntimeError("source acquisition violated highest-available/no-transcode policy")
          if int(result.get("bytes") or 0) <= 0 or len(str(result.get("sha256") or "")) != 64:
              raise RuntimeError("source master evidence is invalid")
          Path("open-evidence/source-master.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Run current-model production render with explicit inference mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p open-evidence
          python scripts/modal_execution_spy.py             --app "$CLIPPER_MODAL_APP"             --app "$CLIPPER_MODAL_PIPELINE_APP"             --output open-evidence/modal-spy.ndjson &
          SPY_PID=$!
          cleanup_spy() {
            kill -TERM "$SPY_PID" 2>/dev/null || true
            wait "$SPY_PID" 2>/dev/null || true
          }
          trap cleanup_spy EXIT

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import modal

          evidence = json.loads(Path("open-evidence/source-master.json").read_text(encoding="utf-8"))
          source = {
              "video_id": os.environ["CLIPPER_TARGET_VIDEO_ID"],
              "channel_id": os.environ["CLIPPER_TARGET_CHANNEL_ID"],
              "canonical_url": os.environ["CLIPPER_TARGET_VIDEO_URL"],
              "evidence": evidence,
          }
          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "run_full_cycle"
          ).remote(
              {
                  "sources": [source],
                  "brief_yaml": Path(os.environ["CLIPPER_CAMPAIGN_BRIEF"]).read_text(encoding="utf-8"),
                  "render": True,
                  "fresh_inference": os.environ["CLIPPER_FRESH_INFERENCE"] == "true",
                  "resume_from_run_id": os.environ.get("CLIPPER_RESUME_FROM_RUN_ID") or None,
                  "git_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              }
          )
          if not isinstance(result, dict) or result.get("status") != "PASS":
              raise RuntimeError(f"production cycle failed: {result}")
          if result.get("execution_mode") != os.environ["CLIPPER_EXECUTION_MODE"]:
              raise RuntimeError(
                  f"production execution mode drifted from request: {result.get('execution_mode')}"
              )
          rendered = int(result.get("rendered") or 0)
          reviewable = int(result.get("reviewable") or 0)
          if result.get("pipeline_status") not in {"SUCCESS", "DEGRADED"}:
              raise RuntimeError(f"production pipeline did not complete: {result}")
          if result.get("review_status") != "PENDING_ACTUAL_MP4_REVIEW":
              raise RuntimeError(f"production result bypassed actual-MP4 review: {result}")
          if reviewable != rendered:
              raise RuntimeError("every accepted rendered quality moment must remain reviewable")
          Path("open-evidence/cycle-result.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"CLIPPER_RUN_VOLUME={result['run_volume']}\n")
              handle.write(f"CLIPPER_RUN_PATH={result['run_path']}\n")
          PY

          cleanup_spy
          trap - EXIT

      - name: Materialize exact production run from Modal volume
        run: |
          rm -rf cycle-evidence
          modal volume get --force "$CLIPPER_RUN_VOLUME" "$CLIPPER_RUN_PATH" cycle-evidence

      - name: Validate dynamic yield, resumable inference, cost bounds, and actual media
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from clipper.acceptance import validate_live_run

          manifests = list(Path("cycle-evidence").rglob("manifest.json"))
          if len(manifests) != 1:
              raise RuntimeError(f"expected exactly one production manifest: {manifests}")
          run_dir = manifests[0].parent
          manifest = validate_live_run(run_dir)
          metadata = manifest.get("run_metadata")
          if not isinstance(metadata, dict) or metadata.get("git_sha") != os.environ["CLIPPER_ACCEPTANCE_SHA"]:
              raise RuntimeError("manifest does not identify the exact acceptance SHA")
          if manifest.get("publication_state") != "READY_FOR_HUMAN_REVIEW":
              raise RuntimeError(f"pipeline crossed or missed HILP boundary: {manifest.get('publication_state')}")
          if manifest.get("publication_state") == "READY_TO_PUBLISH":
              raise RuntimeError("pipeline must never self-authorize publication")

          targets = manifest.get("targets")
          if not isinstance(targets, dict):
              raise RuntimeError("manifest targets evidence is missing")
          eligible = targets["eligible_quality_moments"]
          if not isinstance(eligible, int) or isinstance(eligible, bool) or eligible < 0:
              raise RuntimeError("eligible quality yield is invalid")
          rendered = manifest.get("rendered_clips") or []
          if not isinstance(rendered, list) or not rendered:
              raise RuntimeError(
                  "contract permits zero quality yield, but this acceptance run produced no MP4 to review"
              )

          if metadata.get("execution_mode") != os.environ["CLIPPER_EXECUTION_MODE"]:
              raise RuntimeError(
                  f"manifest execution mode mismatch: {metadata.get('execution_mode')}"
              )
          resume = metadata.get("resume")
          if os.environ["CLIPPER_EXECUTION_MODE"] == "content-addressed-resume":
              if not isinstance(resume, dict) or resume.get("mode") != "content-addressed-stage-resume":
                  raise RuntimeError(f"resumable production evidence is missing: {resume}")
          elif resume is not None:
              raise RuntimeError("fresh inference must not claim resume evidence")

          cache = manifest.get("cache")
          if not isinstance(cache, dict):
              raise RuntimeError("grounding cache evidence is missing")
          hits = int(cache.get("hits") or 0)
          if hits < 0:
              raise RuntimeError(f"grounding cache hit count is invalid: {cache}")
          events = cache.get("events") or []
          if not isinstance(events, list) or any(
              not isinstance(item, dict) or not isinstance(item.get("hit"), bool)
              for item in events
          ):
              raise RuntimeError("grounding cache evidence is incomplete")
          if os.environ["CLIPPER_EXECUTION_MODE"] == "fresh-inference" and hits != 0:
              raise RuntimeError(f"fresh inference unexpectedly reused grounding cache: {cache}")

          editorial = metadata.get("editorial_inference")
          if not isinstance(editorial, dict):
              raise RuntimeError("editorial inference evidence is missing")
          cache_summary = editorial.get("cache_summary")
          if not isinstance(cache_summary, dict):
              raise RuntimeError("editorial cache summary is missing")
          stage_cache_hits = int(cache_summary.get("stage_cache_hits") or 0)
          stage_executions = int(cache_summary.get("stage_executions") or 0)
          if stage_cache_hits < 0 or stage_executions < 0:
              raise RuntimeError("editorial cache counters are invalid")
          if stage_cache_hits + stage_executions <= 0:
              raise RuntimeError("production produced no editorial stage evidence")
          if os.environ["CLIPPER_EXECUTION_MODE"] == "fresh-inference" and stage_cache_hits != 0:
              raise RuntimeError("fresh inference unexpectedly reused editorial DAG cache")
          invocations = editorial.get("model_invocations")
          if not isinstance(invocations, list):
              raise RuntimeError("editorial invocation/cache evidence is invalid")
          if stage_executions > 0 and not invocations:
              raise RuntimeError("executed editorial stages lack invocation evidence")
          allowed = {"source_hazards", "semantic_cores", "narrative_envelope", "quality_windows"}
          observed = set()
          for invocation in invocations:
              if not isinstance(invocation, dict) or not isinstance(
                  invocation.get("cache_hit"), bool
              ):
                  raise RuntimeError(f"invalid editorial invocation/cache evidence: {invocation}")
              if (
                  os.environ["CLIPPER_EXECUTION_MODE"] == "fresh-inference"
                  and invocation.get("cache_hit") is not False
              ):
                  raise RuntimeError(f"fresh inference reused editorial cache: {invocation}")
              family = str(invocation.get("stage") or "").split(":", 1)[0]
              if family not in allowed:
                  raise RuntimeError(f"unknown production editorial task family: {family}")
              observed.add(family)
          if (
              os.environ["CLIPPER_EXECUTION_MODE"] == "fresh-inference"
              and not {"semantic_cores", "narrative_envelope", "quality_windows"}.issubset(observed)
          ):
              raise RuntimeError(f"required current editorial stages were not executed: {observed}")

          usage_records = []
          def collect(value):
              if isinstance(value, dict):
                  if (
                      isinstance(value.get("provider"), str)
                      and isinstance(value.get("duration_seconds"), (int, float))
                      and isinstance(value.get("gpu_seconds"), (int, float))
                      and isinstance(value.get("estimated_cost_usd"), (int, float))
                  ):
                      usage_records.append(value)
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)
          collect(metadata)
          if not usage_records and os.environ["CLIPPER_EXECUTION_MODE"] == "fresh-inference":
              raise RuntimeError("fresh inference persisted no current-model usage records")
          gpu_seconds = sum(float(item.get("gpu_seconds") or 0) for item in usage_records)
          estimated_usd = sum(float(item.get("estimated_cost_usd") or 0) for item in usage_records)
          gpu_limit = float(os.environ["CLIPPER_MAX_GPU_SECONDS"])
          cost_limit = float(os.environ["CLIPPER_MAX_ESTIMATED_USD"])
          if gpu_seconds > gpu_limit:
              raise RuntimeError(f"GPU budget exceeded: {gpu_seconds} > {gpu_limit}")
          if estimated_usd > cost_limit:
              raise RuntimeError(f"estimated cost budget exceeded: {estimated_usd} > {cost_limit}")

          review_root = Path("hilp-review")
          review_root.mkdir(parents=True, exist_ok=True)
          queue = []
          for item in rendered:
              if not isinstance(item, dict):
                  raise RuntimeError("rendered clip evidence must be an object")
              clip = run_dir / "clips" / Path(str(item.get("output_path") or "")).name
              if not clip.is_file() or clip.stat().st_size <= 0:
                  raise RuntimeError(f"accepted MP4 is missing: {clip}")
              subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", str(clip), "-f", "null", "-"],
                  check=True,
                  timeout=900,
              )
              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "stream=codec_type,codec_name,width,height",
                      "-show_entries", "format=duration", "-of", "json", str(clip),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )
              probe_data = json.loads(probe.stdout)
              streams = probe_data.get("streams") or []
              videos = [s for s in streams if isinstance(s, dict) and s.get("codec_type") == "video"]
              audios = [s for s in streams if isinstance(s, dict) and s.get("codec_type") == "audio"]
              if len(videos) != 1 or len(audios) != 1:
                  raise RuntimeError(f"accepted MP4 stream inventory is invalid: {clip}")
              if (videos[0].get("width"), videos[0].get("height"), videos[0].get("codec_name")) != (1080, 1920, "h264"):
                  raise RuntimeError(f"accepted MP4 video contract failed: {clip}")
              if audios[0].get("codec_name") != "aac":
                  raise RuntimeError(f"accepted MP4 audio contract failed: {clip}")
              duration = float((probe_data.get("format") or {}).get("duration") or 0)
              frame_dir = review_root / clip.stem
              frame_dir.mkdir(parents=True, exist_ok=True)
              frames = []
              for frame_index, timestamp in enumerate(
                  (0.5, duration * 0.25, duration * 0.5, duration * 0.75, max(0.5, duration - 0.5)),
                  start=1,
              ):
                  frame = frame_dir / f"frame-{frame_index:02d}.jpg"
                  subprocess.run(
                      [
                          "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                          "-ss", f"{timestamp:.3f}", "-i", str(clip),
                          "-frames:v", "1", "-q:v", "2", str(frame),
                      ],
                      check=True,
                      timeout=120,
                  )
                  frames.append(str(frame))
              digest = hashlib.sha256(clip.read_bytes()).hexdigest()
              if digest != str(item.get("render_sha256") or ""):
                  raise RuntimeError(f"materialized MP4 hash disagrees with manifest: {clip}")
              queue.append(
                  {
                      "plan_id": item.get("plan_id"),
                      "mp4": str(clip),
                      "sha256": digest,
                      "frames": frames,
                      "human_review": "PENDING_ACTUAL_REVIEW",
                  }
              )

          editorial_review = json.loads((run_dir / "editorial-review.json").read_text(encoding="utf-8"))
          if editorial_review.get("status") != "PENDING_HUMAN_REVIEW":
              raise RuntimeError(f"HILP boundary was bypassed: {editorial_review}")
          summary = {
              "status": "PASS_PENDING_ACTUAL_REVIEW",
              "acceptance_sha": os.environ["CLIPPER_ACCEPTANCE_SHA"],
              "eligible_quality_moments": eligible,
              "accepted_mp4s": len(rendered),
              "editorial_task_families": sorted(observed),
              "gpu_seconds": gpu_seconds,
              "estimated_cost_usd": estimated_usd,
              "automated_hilp_allowed": False,
              "actual_review_status": "PENDING_ACTUAL_REVIEW",
          }
          Path("open-evidence/production-validation.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          Path("hilp-review/manual-review-queue.json").write_text(
              json.dumps(queue, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload exact-head production evidence and MP4 review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-review-${{ github.sha }}
          path: |
            exact-head-sha.txt
            open-evidence
            cycle-evidence
            hilp-review
          if-no-files-found: warn
          retention-days: 14
