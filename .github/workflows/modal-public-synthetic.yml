name: Modal public synthetic CPU one-shot (dormant)

# Activation is a later audited one-file commit. This file is NOT the trigger.
on:
  push:
    branches: [review/unified-tts-cleanup]
    paths:
      - "acceptance/modal-public-synthetic/request.json"

permissions:
  contents: read

concurrency:
  group: modal-public-synthetic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  public-synthetic-modal-cpu:
    if: github.event_name == 'push' && github.ref == 'refs/heads/review/unified-tts-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exactly the activation SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Validate one-commit one-file approved stage request (no secrets)
        shell: bash
        env:
          ACTIVATION_BEFORE: ${{ github.event.before }}
          ACTIVATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True, timeout=10
              ).stdout.strip()

          marker = "acceptance/modal-public-synthetic/request.json"
          workflow = ".github/workflows/modal-public-synthetic.yml"
          approved_source_sha = "7e569303ca8c4b9e6c8a27a038c5870085fdb468"
          head = git("rev-parse", "HEAD")
          parent = git("rev-parse", "HEAD^")
          source_base = git("rev-parse", "HEAD^^")
          assert source_base == approved_source_sha, "unreviewed source base"
          assert git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD^") == workflow, (
              "staging commit must change workflow only"
          )
          assert re.fullmatch(r"[0-9a-f]{40}", head)
          assert head == os.environ["ACTIVATION_SHA"]
          assert parent == os.environ["ACTIVATION_BEFORE"], "not a single-commit push"
          assert git("diff-tree", "--no-commit-id", "--name-status", "-r", "HEAD") == (
              "A\t" + marker
          ), "activation must add only request file"
          assert subprocess.run(
              ["git", "cat-file", "-e", f"HEAD^:{marker}"],
              capture_output=True, check=False, timeout=10
          ).returncode != 0, "request already existed"
          path = Path(marker)
          assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 1024
          raw = path.read_bytes()
          assert 0 < len(raw) <= 1024
          request = json.loads(raw)
          assert isinstance(request, dict) and set(request) == {
              "schema", "request_id", "expected_workspace", "approved_stage_sha"
          }
          assert request["schema"] == "clipper-modal-public-synthetic-request-v1"
          assert request["request_id"] == "public-synthetic1502"
          assert request["expected_workspace"] == "mahmoud-bayoumi-mm"
          assert request["approved_stage_sha"] == parent
          print("PUBLIC_SYNTHETIC_ACTIVATION_REQUEST_VALID")
          PY

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned SDK only (no secrets)
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir "modal==1.5.5"

      - name: Execute one bounded public synthetic rehearsal with existing Actions tokens
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          ACTIVATION_SHA: ${{ github.sha }}
          RUNNER_TEMP_ROOT: ${{ runner.temp }}
          PYTHONUNBUFFERED: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -euo pipefail
          unset MODAL_PROFILE
          test -n "${MODAL_TOKEN_ID:-}" && test -n "${MODAL_TOKEN_SECRET:-}"
          test -n "$RUNNER_TEMP_ROOT"
          export MODAL_APPROVAL_DIR
          MODAL_APPROVAL_DIR="$(mktemp -d "$RUNNER_TEMP_ROOT/clipper-modal-public-XXXXXX")"
          trap 'rm -rf "$MODAL_APPROVAL_DIR"' EXIT
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          sha = os.environ["ACTIVATION_SHA"]
          receipt = "public-synthetic-owner-" + sha
          approval = {
              "schema": "clipper-modal-public-synthetic-approval-v2",
              "intent": "PUBLIC_SYNTHETIC_MODEL_FREE_BOOK_REHEARSAL",
              "source_sha": sha,
              "workspace": "mahmoud-bayoumi-mm",
              "environment": "main",
              "credential_route": "actions-existing-secret-route",
              "expires_utc": (datetime.now(timezone.utc) + timedelta(minutes=5)).isoformat(),
              "included_credit_only": True,
              "paid_overage_authorized": False,
              "owner_request_ref": "2026-11-25T11:09:05+02:00",
              "credit_confirmation_ref": "2026-11-25T15:00:33+02:00",
              "external_control_id": receipt,
              "execution_permission": True,
          }
          target = Path(os.environ["MODAL_APPROVAL_DIR"])
          raw = json.dumps(approval, sort_keys=True, separators=(",", ":")).encode()
          (target / "approval.json").write_bytes(raw)
          (target / "digest").write_text(hashlib.sha256(raw).hexdigest())
          PY
          timeout --signal=TERM --kill-after=10s 160s \
            python tests/book_modal_cpu_launcher.py \
              --execute --expected-sha "$ACTIVATION_SHA" \
              --approval-file "$MODAL_APPROVAL_DIR/approval.json" \
              --approval-sha256 "$(cat "$MODAL_APPROVAL_DIR/digest")" \
              --independent-control-receipt "public-synthetic-owner-$ACTIVATION_SHA"
