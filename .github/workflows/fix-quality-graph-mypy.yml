name: Fix quality graph typing

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/fix-quality-graph-mypy.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact mypy fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          batch = Path("src/clipper/quality_batch.py")
          text = batch.read_text(encoding="utf-8")
          old = '                "forbidden_spans": [item.to_dict() for item in forbidden],\n'
          new = '                "forbidden_spans": [\n                    {"start": item.start, "end": item.end} for item in forbidden\n                ],\n'
          if old not in text:
              raise SystemExit("quality_batch forbidden_spans anchor missing")
          text = text.replace(old, new, 1)
          old = '''            failure = {
                "video_id": video_id,
                "stage": "quality_graph_planning",
'''
          new = '''            failure: dict[str, object] = {
                "video_id": video_id,
                "stage": "quality_graph_planning",
'''
          if old not in text:
              raise SystemExit("quality_batch failure annotation anchor missing")
          text = text.replace(old, new, 1)
          batch.write_text(text, encoding="utf-8")

          pipeline = Path("src/clipper/pipeline.py")
          text = pipeline.read_text(encoding="utf-8")
          old = '''            telemetry.start(f"editorial_analysis:{video.video_id}")
            if open_planner is not None:
'''
          new = '''            telemetry.start(f"editorial_analysis:{video.video_id}")
            moments: list[StoryMoment]
            concepts: list[ClipConcept]
            source_rejections: list[dict[str, object]]
            if open_planner is not None:
'''
          if old not in text:
              raise SystemExit("pipeline branch annotation anchor missing")
          text = text.replace(old, new, 1)
          pipeline.write_text(text, encoding="utf-8")
          PY

          python -m pip install -e ".[dev]"
          ruff format src/clipper/quality_batch.py src/clipper/pipeline.py
          ruff check src/clipper/quality_batch.py src/clipper/pipeline.py
          mypy
          git diff --check
      - name: Commit exact typing fixes
        run: |
          set -euo pipefail
          git config user.name "clipper-quality-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/clipper/quality_batch.py src/clipper/pipeline.py
          git diff --cached --exit-code && exit 0 || true
          git commit -m "fix: type authoritative quality graph integration"
          git push origin HEAD:feat/word-reveal-face-tracking
