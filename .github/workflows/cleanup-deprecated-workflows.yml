name: Cleanup deprecated workflow registrations

on:
  push:
    branches: [feat/word-reveal-face-tracking]
    paths: [.github/workflows/cleanup-deprecated-workflows.yml]

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0

      - name: Disable deprecated workflow registrations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          self_path='.github/workflows/cleanup-deprecated-workflows.yml'
          self_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --jq ".workflows[] | select(.path == \"${self_path}\") | .id")"
          test -n "$self_id"
          echo "SELF_WORKFLOW_ID=$self_id" >> "$GITHUB_ENV"

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .path, .state] | @tsv' |
          while IFS=$'\t' read -r id path state; do
            case "$path" in
              .github/workflows/ci.yml|.github/workflows/deploy-and-smoke.yml|.github/workflows/v10-production-cycle.yml|.github/workflows/cleanup-deprecated-workflows.yml)
                echo "KEEP $id $path $state"
                ;;
              *)
                echo "DISABLE $id $path $state"
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
                ;;
            esac
          done

      - name: Verify only intended workflow registrations remain enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS=$'\t' read -r id path state; do
            case "$path" in
              .github/workflows/ci.yml|.github/workflows/deploy-and-smoke.yml|.github/workflows/v10-production-cycle.yml|.github/workflows/cleanup-deprecated-workflows.yml)
                test "$state" = active || { echo "Expected active: $id $path $state"; bad=1; }
                ;;
              *)
                test "$state" = disabled_manually || { echo "Still enabled: $id $path $state"; bad=1; }
                ;;
            esac
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --jq '.workflows[] | [.id, .path, .state] | @tsv')
          test "$bad" -eq 0

      - name: Remove one-shot cleanup workflow from branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'clipper-workflow-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cleanup-deprecated-workflows.yml
          git commit -m 'ci: remove one-shot workflow registry cleanup'
          git push origin HEAD:feat/word-reveal-face-tracking

      - name: Disable this one-shot registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${SELF_WORKFLOW_ID}/disable"
