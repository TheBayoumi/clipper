name: Temporary Codex findings repair

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/tmp-codex-findings-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Correct temporary watchdog match indentation
        run: |
          sed -i 's/^            "Modal spy did not observe/                "Modal spy did not observe/' scripts/tmp_codex_findings_repair.py
          sed -i 's/^            "before the production terminal barrier"/                "before the production terminal barrier"/' scripts/tmp_codex_findings_repair.py

      - name: Apply all unresolved Codex fixes and regression tests
        run: python scripts/tmp_codex_findings_repair.py

      - name: Normalize touched files
        run: |
          ruff check . --fix --exclude scripts/tmp_codex_findings_repair.py
          ruff format src/clipper/providers/modal.py src/clipper/modal_execution.py src/clipper/editorial_integrity.py scripts/modal_execution_spy.py scripts/modal_hilp_watchdog.py tests/test_modal_execution.py tests/test_modal_execution_spy.py tests/test_vision_runtime_recovery.py tests/test_visual_presence_policy.py tests/test_production_workflow_contract.py

      - name: Ruff
        run: ruff check . --exclude scripts/tmp_codex_findings_repair.py

      - name: Ruff format check
        run: ruff format --check . --exclude scripts/tmp_codex_findings_repair.py

      - name: Mypy
        run: mypy

      - name: Full pytest and coverage gate
        run: pytest

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clipper/providers/modal.py src/clipper/modal_execution.py src/clipper/editorial_integrity.py scripts/modal_execution_spy.py scripts/modal_hilp_watchdog.py .github/workflows/production-pipeline.yml tests/test_modal_execution.py tests/test_modal_execution_spy.py tests/test_vision_runtime_recovery.py tests/test_visual_presence_policy.py tests/test_production_workflow_contract.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: close Codex production safety findings"
          git push origin HEAD:feat/contentrewards-campaign-factory
