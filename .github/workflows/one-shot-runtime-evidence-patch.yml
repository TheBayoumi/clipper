name: One-shot runtime evidence patch

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - .github/workflows/one-shot-runtime-evidence-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-runtime-evidence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - name: Preserve real editorial inference usage and exact remote SHA
        shell: python
        run: |
          from pathlib import Path

          pipeline = Path("src/clipper/pipeline.py")
          text = pipeline.read_text(encoding="utf-8")
          old = '''    manifest.run_metadata["editorial_inference"]["model_invocations"] = [
              {
                  "model": editor.identity.to_dict(),
                  "cache_hit": quality.stage_executions == 0,
                  "stage_cache_hits": quality.stage_cache_hits,
                  "stage_executions": quality.stage_executions,
              }
          ]
          '''
          new = '''    manifest.run_metadata["editorial_inference"]["model_invocations"] = list(
              quality.model_invocations
          )
          manifest.run_metadata["editorial_inference"]["cache_summary"] = {
              "stage_cache_hits": quality.stage_cache_hits,
              "stage_executions": quality.stage_executions,
          }
          '''
          if old not in text:
              raise SystemExit("editorial inference evidence anchor not found")
          pipeline.write_text(text.replace(old, new, 1), encoding="utf-8")

          modal_pipeline = Path("scripts/modal_pipeline.py")
          text = modal_pipeline.read_text(encoding="utf-8")
          old = '''    render = bool(payload.get("render", True))
              fresh_inference = bool(payload.get("fresh_inference", False))
              resume_from_run_id = str(payload.get("resume_from_run_id") or "").strip() or None

              media_cache.reload()
          '''
          new = '''    render = bool(payload.get("render", True))
              fresh_inference = bool(payload.get("fresh_inference", False))
              resume_from_run_id = str(payload.get("resume_from_run_id") or "").strip() or None
              requested_git_sha = str(payload.get("git_sha") or "").strip()
              if requested_git_sha:
                  if len(requested_git_sha) != 40 or any(
                      character not in "0123456789abcdef" for character in requested_git_sha.lower()
                  ):
                      raise ValueError("run_full_cycle git_sha must be a full hexadecimal commit SHA")
                  os.environ["GITHUB_SHA"] = requested_git_sha.lower()

              media_cache.reload()
          '''
          if old not in text:
              raise SystemExit("modal exact-SHA anchor not found")
          modal_pipeline.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit runtime evidence fixes
        run: |
          git config user.name "clipper-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/clipper/pipeline.py scripts/modal_pipeline.py
          git diff --cached --check
          git commit -m "fix: preserve exact-head inference evidence"
          git push origin HEAD:feat/word-reveal-face-tracking
