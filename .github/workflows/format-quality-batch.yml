name: Format quality batch

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/format-quality-batch.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install "ruff>=0.15.22,<1"
          ruff format src/clipper/quality_batch.py tests/test_quality_batch.py
          ruff check src/clipper/quality_batch.py tests/test_quality_batch.py
      - run: |
          set -euo pipefail
          git config user.name "clipper-quality-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/clipper/quality_batch.py tests/test_quality_batch.py
          git diff --cached --exit-code && exit 0 || true
          git commit -m "style: format quality graph batch planning"
          git push origin HEAD:feat/word-reveal-face-tracking
