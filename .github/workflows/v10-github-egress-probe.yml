name: V10 GitHub egress probe

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/v10-github-egress-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp EJS and bgutil provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'yt-dlp[default]>=2026.7.4,<2027' 'bgutil-ytdlp-pot-provider==1.3.1'
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-ytdlp-pot-provider
          cd /tmp/bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc

      - name: Probe exact campaign video without cookies
        run: |
          set -euo pipefail
          yt-dlp \
            --verbose \
            --js-runtimes node \
            --no-playlist \
            --extractor-args 'youtube:player_client=default,mweb' \
            --extractor-args 'youtubepot-bgutilscript:server_home=/tmp/bgutil-ytdlp-pot-provider/server' \
            --simulate \
            --print 'id=%(id)s' \
            --print 'title=%(title)s' \
            --print 'duration=%(duration)s' \
            --print 'format_id=%(format_id)s' \
            'https://www.youtube.com/watch?v=2Y4LP85PTak'
