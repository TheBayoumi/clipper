name: V10 Modal cross-cloud egress probe

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/v10-github-egress-probe.yml"

permissions:
  contents: read

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Invoke deployed source worker across Modal clouds
        run: |
          python -m pip install 'modal>=1.4,<2'
          python - <<'PY'
          import json
          import modal

          payload = {
              "video_id": "2Y4LP85PTak",
              "video_url": "https://www.youtube.com/watch?v=2Y4LP85PTak",
          }
          fn = modal.Function.from_name("clipper-v10-cycle", "acquire_source")
          failures = []
          for cloud in ("gcp", "aws", "oci"):
              try:
                  result = fn.with_options(cloud=cloud, timeout=1800).remote(payload)
              except Exception as exc:
                  failures.append({"cloud": cloud, "error": f"{type(exc).__name__}: {exc}"[-6000:]})
                  print(json.dumps(failures[-1], indent=2))
                  continue
              print(json.dumps({"cloud": cloud, "result": result}, indent=2))
              assert result["video_id"] == payload["video_id"]
              assert result["volume_path"].startswith("/inputs/")
              assert int(result["bytes"]) > 0
              raise SystemExit(0)
          raise SystemExit("all Modal cloud egress variants failed: " + json.dumps(failures))
          PY
