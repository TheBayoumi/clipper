name: Apply authoritative quality graph patch

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/apply-quality-graph-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact pipeline patch
        run: |
          python scripts/patch_quality_graph_pipeline.py
          python -m pip install "ruff>=0.15.22,<1"
          ruff format src/clipper/pipeline.py
          ruff check src/clipper/pipeline.py
          git diff --check
      - name: Commit production authority switch
        run: |
          set -euo pipefail
          git config user.name "clipper-quality-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/clipper/pipeline.py
          git diff --cached --exit-code && exit 0 || true
          git commit -m "feat: make quality graph authoritative in production"
          git push origin HEAD:feat/word-reveal-face-tracking
