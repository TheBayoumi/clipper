name: Provision Modal Hugging Face secret

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/provision-modal-hf-secret.yml"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required credentials
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$HF_TOKEN"

      - name: Install Modal CLI
        run: python -m pip install 'modal>=1.5.2,<2'

      - name: Provision named Hugging Face secret
        run: |
          set -euo pipefail
          modal secret create custom-secret HF_TOKEN="$HF_TOKEN" --force
          modal secret list --json > modal-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("modal-secrets.json").read_text(encoding="utf-8"))
          text = json.dumps(data)
          if "custom-secret" not in text:
              raise RuntimeError("Modal secret provisioning did not create custom-secret")
          print("custom-secret present in Modal main environment")
          PY
