name: HILP 127 mixed output recovery fix

on:
  push:
    branches: [feat/contentrewards-campaign-factory]
    paths: [.github/workflows/hilp127-mixed-output-recovery-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Require staging-only drift
        shell: bash
        run: |
          set -euo pipefail
          base=81ded9d463534c381579b1381c0a9f48cabe6ed9
          test "$(git diff --name-only "$base"..HEAD)" = ".github/workflows/hilp127-mixed-output-recovery-fix.yml"
      - name: Apply Codex P2 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one target in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/clipper/providers/modal.py",
              '''                if not self._is_output_contract_error(exc):
                          raise

                      if exc.error_type == "EditorialOutputInvalid":
                          if invalid_output_retries >= 1:
                              raise
                          invalid_output_retries += 1

                      next_budget = exc.details.get("next_output_budget_tokens")
          ''',
              '''                if not self._is_output_contract_error(exc):
                          raise

                      if invalid_output_retries > 0:
                          raise
                      if exc.error_type == "EditorialOutputInvalid":
                          invalid_output_retries += 1

                      next_budget = exc.details.get("next_output_budget_tokens")
          ''',
          )

          test_path = Path("tests/test_modal_editorial_recovery.py")
          text = test_path.read_text(encoding="utf-8")
          marker = "def test_editorial_provider_does_not_retry_unrelated_remote_error() -> None:\n"
          if text.count(marker) != 1:
              raise RuntimeError("test insertion marker drifted")
          regression = '''def test_editorial_provider_stops_after_malformed_retry_even_if_next_error_is_truncated() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                          },
                      ),
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputTruncated",
                          message="expanded retry exhausted its output budget",
                          details={
                              "generation_budget_tokens": 546,
                              "next_output_budget_tokens": 1092,
                              "generated_sha256": "truncated-second",
                          },
                      ),
                  ]
              )
              with pytest.raises(ModalRemoteError, match="expanded retry exhausted"):
                  provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert len(provider.requests) == 2


          '''
          test_path.write_text(text.replace(marker, regression + marker), encoding="utf-8")
          PY
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'
          python -m pip install pytest pytest-cov ruff
      - name: Verify Codex P2 repair
        run: |
          ruff format src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py
          ruff check src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py
          ruff format --check src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py
          pytest -o addopts='' tests/test_modal_editorial_recovery.py
      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hilp127-mixed-output-recovery-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py .github/workflows/hilp127-mixed-output-recovery-fix.yml
          git diff --cached --check
          git commit -m 'fix: bound malformed editorial recovery across error types'
          git push origin HEAD:feat/contentrewards-campaign-factory
