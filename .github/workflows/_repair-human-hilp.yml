name: Repair actual HILP runtime contract

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/_repair-human-hilp.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded production repair
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path("src/clipper/autonomous_editor.py")
          text = editor.read_text(encoding="utf-8")
          old = '''            except ValueError as exc:\n                rejections.append(\n                    {\n                        "stage": "concept_grounding",'''
          new = '''            except (ValueError, EditorialGroundingError) as exc:\n                rejections.append(\n                    {\n                        "stage": "concept_grounding",'''
          if old not in text:
              raise SystemExit("concept-grounding guard not found")
          text = text.replace(old, new, 1)
          editor.write_text(text, encoding="utf-8")

          cycle = Path("scripts/modal_v10_cycle.py")
          text = cycle.read_text(encoding="utf-8")
          text = text.replace(
              '    """Run the complete podcast pipeline and simulated HILP review in Modal."""',
              '    """Run the complete podcast pipeline and render production finalists in Modal."""',
              1,
          )
          text = text.replace(
              "    from clipper.hilp import simulate_hilp_cycle, validate_hilp_evidence\n",
              "",
              1,
          )
          text = text.replace("    from clipper.render import FFmpegRenderer\n", "", 1)
          start = text.find("    renderer = FFmpegRenderer(\n")
          end_marker = "    validate_hilp_evidence(hilp)\n"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("simulated HILP runtime block not found")
          text = text[:start] + text[end + len(end_marker):]
          old_return = '''        "hilp_status": hilp.get("status"),\n        "branches_exercised": hilp.get("branches_exercised"),\n        "final_shortlist": hilp.get("final_shortlist"),\n'''
          if old_return not in text:
              raise SystemExit("simulated HILP return fields not found")
          text = text.replace(
              old_return,
              '        "review_status": "PENDING_ACTUAL_MP4_REVIEW",\n',
              1,
          )
          cycle.write_text(text, encoding="utf-8")
          PY

      - name: Verify repaired contract
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path("src/clipper/autonomous_editor.py").read_text(encoding="utf-8")
          cycle = Path("scripts/modal_v10_cycle.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/v10-production-cycle.yml").read_text(encoding="utf-8")
          assert 'except (ValueError, EditorialGroundingError) as exc:' in editor
          assert 'simulate_hilp_cycle' not in cycle
          assert 'validate_hilp_evidence' not in cycle
          assert '"review_status": "PENDING_ACTUAL_MP4_REVIEW"' in cycle
          assert 'automated_hilp_allowed' in workflow
          assert 'PENDING_ACTUAL_MP4_REVIEW' in workflow
          PY

      - name: Install quality dependencies
        run: python -m pip install -e '.[dev]'

      - name: Quality gate
        run: |
          ruff format src/clipper/autonomous_editor.py scripts/modal_v10_cycle.py
          ruff check .
          ruff format --check .
          mypy --strict src
          pytest -q

      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name "clipper-acceptance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/clipper/autonomous_editor.py scripts/modal_v10_cycle.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: require actual post-render HILP review"
          git push origin HEAD:feat/word-reveal-face-tracking
