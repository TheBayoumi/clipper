name: Temporary latest Codex cache-write repair

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/tmp-fix-latest-codex-capacity-cache.yml
      - scripts/tmp_fix_latest_codex_capacity_cache.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply only the latest Codex capacity-cache fix
        run: python scripts/tmp_fix_latest_codex_capacity_cache.py

      - name: Normalize touched files
        run: |
          ruff check src/clipper/visual_ai.py tests/test_visual_ai.py --fix
          ruff format src/clipper/visual_ai.py tests/test_visual_ai.py

      - name: Static gates
        run: |
          ruff check . --exclude scripts/tmp_fix_latest_codex_capacity_cache.py
          ruff format --check . --exclude scripts/tmp_fix_latest_codex_capacity_cache.py
          mypy

      - name: Targeted regression
        run: pytest tests/test_visual_ai.py -q --no-cov

      - name: Full test and coverage gate
        run: pytest

      - name: Commit validated latest Codex fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clipper/visual_ai.py tests/test_visual_ai.py
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "fix: make vision capacity cache persistence best-effort"
          git push origin HEAD:feat/contentrewards-campaign-factory
