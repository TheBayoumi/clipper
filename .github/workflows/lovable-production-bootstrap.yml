name: Lovable production bootstrap

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - acceptance/production-run-request.json
  pull_request:
    branches:
      - main
    types:
      - edited

permissions:
  actions: write
  contents: write

jobs:
  dispatch-modal-workers:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.actor == github.repository_owner &&
       contains(github.event.pull_request.body, '<!-- CLIPPER_HILP_TRIGGER sha='))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Create immutable execution tag and dispatch exact-SHA workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            expected_trigger="<!-- CLIPPER_HILP_TRIGGER sha=${EXPECTED_SHA} -->"
            if [[ "$PR_BODY" != *"$expected_trigger"* ]]; then
              echo "PR metadata trigger does not name the exact current head SHA" >&2
              exit 1
            fi
          fi

          tag="clipper-hilp-${EXPECTED_SHA}"
          tag_ref="refs/tags/${tag}"
          ref_url="https://api.github.com/repos/${REPOSITORY}/git/ref/tags/${tag}"
          status="$(curl --silent --show-error --output tag-ref.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$ref_url")"
          if [[ "$status" == "200" ]]; then
            python - "$EXPECTED_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path("tag-ref.json").read_text(encoding="utf-8"))
          actual = str(((payload.get("object") or {}).get("sha") or "")).lower()
          expected = sys.argv[1].lower()
          if actual != expected:
              raise SystemExit(
                  f"immutable HILP tag points at the wrong SHA: expected={expected} actual={actual}"
              )
          PY
          elif [[ "$status" == "404" ]]; then
            payload="$(python - "$tag_ref" "$EXPECTED_SHA" <<'PY'
          import json
          import sys
          print(json.dumps({"ref": sys.argv[1], "sha": sys.argv[2]}))
          PY
          )"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs" \
              --data "$payload" > tag-ref.json
          else
            cat tag-ref.json >&2 || true
            echo "failed to resolve immutable HILP tag: HTTP ${status}" >&2
            exit 1
          fi

          runs_url="https://api.github.com/repos/${REPOSITORY}/actions/workflows/modal-workers-deploy.yml/runs"
          query="head_sha=${EXPECTED_SHA}&branch=${tag}&event=workflow_dispatch&per_page=100"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${runs_url}?${query}" > deploy-runs-before.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("deploy-runs-before.json").read_text(encoding="utf-8"))
          ids = sorted(
              int(item["id"])
              for item in payload.get("workflow_runs", [])
              if isinstance(item, dict) and isinstance(item.get("id"), int)
          )
          Path("deploy-run-ids-before.json").write_text(
              json.dumps(ids) + "\n",
              encoding="utf-8",
          )
          PY

          deploy_payload="$(python - "$tag" "$EXPECTED_SHA" <<'PY'
          import json
          import sys
          print(json.dumps({"ref": sys.argv[1], "inputs": {"deployment_sha": sys.argv[2]}}))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/modal-workers-deploy.yml/dispatches" \
            --data "$deploy_payload"
          echo "Dispatched modal-workers-deploy.yml pinned to ${EXPECTED_SHA} through ${tag}."

          selected_deployment_run_id=""
          for _attempt in $(seq 1 120); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${runs_url}?${query}" > deploy-runs-after.json
            selected_deployment_run_id="$(
              python - <<'PY'
          import json
          from pathlib import Path

          before = set(json.loads(Path("deploy-run-ids-before.json").read_text(encoding="utf-8")))
          payload = json.loads(Path("deploy-runs-after.json").read_text(encoding="utf-8"))
          fresh = [
              item
              for item in payload.get("workflow_runs", [])
              if isinstance(item, dict)
              and isinstance(item.get("id"), int)
              and int(item["id"]) not in before
          ]
          if fresh:
              selected = max(
                  fresh,
                  key=lambda item: (
                      str(item.get("created_at") or ""),
                      int(item["id"]),
                  ),
              )
              print(int(selected["id"]))
          PY
            )"
            if [[ -n "$selected_deployment_run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$selected_deployment_run_id" ]]; then
            echo "failed to resolve the newly dispatched Modal deployment run" >&2
            exit 1
          fi

          deployment_status=""
          deployment_conclusion=""
          for _attempt in $(seq 1 360); do
            run_url="https://api.github.com/repos/${REPOSITORY}/actions/runs/${selected_deployment_run_id}"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$run_url" > selected-deploy-run.json
            read -r deployment_status deployment_conclusion deployment_head_sha deployment_head_branch < <(
              python - "$EXPECTED_SHA" "$tag" <<'PY'
          import json
          import sys
          from pathlib import Path

          item = json.loads(Path("selected-deploy-run.json").read_text(encoding="utf-8"))
          head_sha = str(item.get("head_sha") or "")
          head_branch = str(item.get("head_branch") or "")
          if head_sha != sys.argv[1]:
              raise SystemExit(
                  f"new deployment run SHA drifted: expected={sys.argv[1]} actual={head_sha}"
              )
          if head_branch != sys.argv[2]:
              raise SystemExit(
                  f"new deployment run ref drifted: expected={sys.argv[2]} actual={head_branch}"
              )
          print(str(item.get("status") or ""), str(item.get("conclusion") or ""), head_sha, head_branch)
          PY
            )
            if [[ "$deployment_status" == "completed" ]]; then
              break
            fi
            sleep 15
          done

          if [[ "$deployment_status" != "completed" || "$deployment_conclusion" != "success" ]]; then
            echo "newly dispatched Modal deployment did not succeed: id=${selected_deployment_run_id} status=${deployment_status} conclusion=${deployment_conclusion}" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            production_payload="$(python - "$tag" <<'PY'
          import json
          import sys
          from pathlib import Path

          marker = json.loads(
              Path("acceptance/production-run-request.json").read_text(encoding="utf-8")
          )
          if not isinstance(marker, dict) or marker.get("enabled") is not True:
              raise SystemExit("production acceptance request is disabled")
          if marker.get("confirm_production") is not True:
              raise SystemExit("production acceptance request is not confirmed")
          payload = {
              "ref": sys.argv[1],
              "inputs": {
                  "confirm_production": "true",
                  "fresh_inference": "true" if marker.get("fresh_inference") is True else "false",
                  "resume_from_run_id": str(marker.get("resume_from_run_id") or ""),
                  "campaign_brief": str(marker.get("campaign_brief") or ""),
                  "target_video_id": str(marker.get("target_video_id") or ""),
                  "editorial_acceptance_only": "true" if marker.get("editorial_acceptance_only") is True else "false",
                  "max_gpu_seconds": str(marker.get("max_gpu_seconds", 21600)),
                  "max_estimated_usd": str(marker.get("max_estimated_usd", 10)),
              },
          }
          print(json.dumps(payload))
          PY
          )"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/production-pipeline.yml/dispatches" \
              --data "$production_payload"
            echo "Dispatched production-pipeline.yml only after fresh deploy run ${selected_deployment_run_id} succeeded at exact reviewed SHA ${EXPECTED_SHA}."
          fi
