name: Lovable production bootstrap

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - acceptance/production-run-request.json

permissions:
  actions: read
  contents: write

jobs:
  repair-vision-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply minimal vision contract and CUDA acceptance repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          worker = Path("scripts/modal_open_models.py")
          source = worker.read_text(encoding="utf-8")
          old_task_def = "def _vision_contract(task: str) -> str:"
          new_task_def = "def _vision_task_contract(task: str) -> str:"
          if source.count(old_task_def) != 1:
              raise RuntimeError(
                  f"expected exactly one task-side _vision_contract definition, found {source.count(old_task_def)}"
              )
          source = source.replace(old_task_def, new_task_def, 1)
          old_prompt_call = "+ _vision_contract(task)"
          new_prompt_call = "+ _vision_task_contract(task)"
          if source.count(old_prompt_call) != 1:
              raise RuntimeError(
                  f"expected exactly one task-side _vision_contract prompt call, found {source.count(old_prompt_call)}"
              )
          source = source.replace(old_prompt_call, new_prompt_call, 1)
          tree = ast.parse(source)
          names = [
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          duplicates = sorted({name for name in names if names.count(name) > 1})
          if duplicates:
              raise RuntimeError(f"duplicate module-level worker functions remain: {duplicates}")
          worker.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_modal_model_lifecycle.py")
          tests = test_path.read_text(encoding="utf-8")
          if "import ast\n" not in tests:
              tests = tests.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport ast\n",
                  1,
              )
          marker = "def test_modal_worker_vision_task_and_model_contracts_are_distinct() -> None:"
          if marker not in tests:
              tests += '''\n\ndef test_modal_worker_vision_task_and_model_contracts_are_distinct() -> None:\n    source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")\n    tree = ast.parse(source)\n    names = [node.name for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))]\n    duplicates = sorted({name for name in names if names.count(name) > 1})\n\n    assert duplicates == []\n    assert "def _vision_task_contract(task: str) -> str:" in source\n    assert source.count("def _vision_contract(") == 1\n    prompt_start = source.index("def _vision_prompt(")\n    prompt_end = source.index("\\n\\nclass VisionOutputCapacityError", prompt_start)\n    prompt_source = source[prompt_start:prompt_end]\n    assert "_vision_task_contract(task)" in prompt_source\n    assert "_vision_contract(task)" not in prompt_source\n'''
          test_path.write_text(tests, encoding="utf-8")

          deploy = Path(".github/workflows/modal-workers-deploy.yml")
          workflow = deploy.read_text(encoding="utf-8")
          handle_anchor = '''          required_functions = [\n              "transcribe",\n'''
          handle_replacement = '''          required_functions = [\n              "speech_cuda_smoke",\n              "transcribe",\n'''
          if handle_replacement not in workflow:
              if workflow.count(handle_anchor) != 1:
                  raise RuntimeError("could not uniquely add speech_cuda_smoke to required handles")
              workflow = workflow.replace(handle_anchor, handle_replacement, 1)

          step_anchor = "      - name: Verify immutable deployed SHA identities\n"
          cuda_step = '''      - name: Verify speech CUDA runtime before production\n        timeout-minutes: 5\n        shell: bash\n        run: |\n          set -euo pipefail\n          python - <<'PYCUDA'\n          import json\n          import os\n          from pathlib import Path\n\n          import modal\n\n          result = modal.Function.from_name(\n              os.environ["CLIPPER_MODAL_APP"], "speech_cuda_smoke"\n          ).remote()\n          if not isinstance(result, dict) or result.get("ok") is not True:\n              raise RuntimeError(f"speech CUDA runtime smoke failed: {result!r}")\n          expected = os.environ["CLIPPER_DEPLOYED_GIT_SHA"].lower()\n          if str(result.get("deployed_git_sha") or "").lower() != expected:\n              raise RuntimeError(\n                  "speech CUDA smoke deployed SHA mismatch: "\n                  f"expected={expected} result={result!r}"\n              )\n          if result.get("cuda_available") is not True or int(result.get("device_count") or 0) < 1:\n              raise RuntimeError(f"speech CUDA runtime is unavailable: {result!r}")\n          Path("modal-speech-cuda-smoke.json").write_text(\n              json.dumps(result, indent=2) + "\\n",\n              encoding="utf-8",\n          )\n          print(json.dumps(result, indent=2))\n          PYCUDA\n\n'''
          if "- name: Verify speech CUDA runtime before production" not in workflow:
              if workflow.count(step_anchor) != 1:
                  raise RuntimeError("could not uniquely insert speech CUDA runtime smoke step")
              workflow = workflow.replace(step_anchor, cuda_step + step_anchor, 1)
          deploy.write_text(workflow, encoding="utf-8")
          PY

      - name: Verify complete repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format tests/test_modal_model_lifecycle.py
          ruff check .
          ruff format --check .
          mypy
          pytest tests/test_modal_model_lifecycle.py tests/test_modal_speech_cuda_runtime.py
          pytest

      - name: Commit repaired exact-head source
        env:
          ORIGINAL_HEAD: 9affed64571d2b9026e91f9a843a8f14d5391179
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$ORIGINAL_HEAD" -- .github/workflows/lovable-production-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/modal_open_models.py \
            tests/test_modal_model_lifecycle.py \
            .github/workflows/modal-workers-deploy.yml \
            .github/workflows/lovable-production-bootstrap.yml
          git diff --cached --check
          git commit -m "fix: separate vision task and model contracts"
          git push origin "HEAD:${BRANCH}"
          echo "Created repaired head $(git rev-parse HEAD)"
