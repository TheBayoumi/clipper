name: Lovable production bootstrap

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - acceptance/production-run-request.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch-modal-workers:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch existing Modal deployment workflow at this exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,os; print(json.dumps({"ref": os.environ["BRANCH"]}))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/modal-workers-deploy.yml/dispatches" \
            --data "${payload}"
          echo "Dispatched modal-workers-deploy.yml for ${BRANCH} at expected head ${EXPECTED_SHA}."
