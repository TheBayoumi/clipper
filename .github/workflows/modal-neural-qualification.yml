name: Canonical Clipper neural GPU qualification

on:
  # Feature-only validation. The first addition triggers a bounded GPU smoke;
  # later edits to the canonical workflow are intentionally reviewed/costed.
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/modal-neural-qualification.yml
      - src/clipper_engine/inference/modal_worker.py
      - src/clipper_engine/inference/vision.py
  workflow_dispatch:
    inputs:
      source_wide:
        description: 'Run independently certified source-wide GPU review probes on all six MW4 analysis proxies'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: clipper-neural-gpu-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  neural-source-gpu-smoke:
    name: Isolated Qwen3-VL source/identity smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLIPPER_NEURAL_MODAL_APP: clipper-neural-qualification
      CLIPPER_DEPLOYED_GIT_SHA: ${{ github.sha }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable exact-head and controlled GPU access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLIPPER_DEPLOYED_GIT_SHA"
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo '::error::MODAL_CREDENTIALS_MISSING: GitHub repository Modal secrets unavailable'
            exit 1
          fi
          test "$CLIPPER_NEURAL_MODAL_APP" = clipper-neural-qualification
      - name: Install FFmpeg and FFprobe if missing (bounded)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 480 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -qq
            sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install \
              --no-install-recommends -y ffmpeg
          fi
          command -v ffmpeg || { echo '::error::FFMPEG_NOT_AVAILABLE'; exit 1; }
          command -v ffprobe || { echo '::error::FFPROBE_NOT_AVAILABLE'; exit 1; }
      - name: Install canonical Clipper inference runtime
        run: python -m pip install -e '.[modal]'
      - name: Retrieve previous certified analysis proxy, not 4K master
        uses: actions/download-artifact@v4
        with:
          run-id: 39749647361
          github-token: ${{ github.token }}
          name: MW4-qualification-source-ghost_fight
          path: raw_sources
      - name: Reverify source bytes and frame identity before cloud sampling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from clipper_engine.sources import qa

          video = Path('raw_sources/ghost_fight.mp4')
          manifest = qa.verify(
              video, Path('raw_sources/ghost_fight.source_qa.json'),
              require_original=False,
          )
          if manifest.get('source_key') != 'ghost_fight':
              raise RuntimeError('source key mismatch in certified proxy')
          if manifest.get('derivative_type') != 'proxy':
              raise RuntimeError('neural smoke requires certified analysis proxy')
          if float(manifest['duration_seconds']) < 52:
              raise RuntimeError('expected source-relative 51s sample is unavailable')
          identity = {
              key: str(manifest.get(value) or '')
              for key, value in {
                  'source_key': 'source_key',
                  'provider_asset_id': 'provider_asset_id',
                  'provider_review_url': 'provider_review_url',
                  'analysis_sha256': 'sha256',
                  'derivative_type': 'derivative_type',
              }.items()
          }
          if any(not value for value in identity.values()):
              raise RuntimeError('source identity incomplete')
          Path('neural-source-identity.json').write_text(
              json.dumps(identity, indent=2), encoding='utf-8',
          )
          PY
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -ss 51.000 -i raw_sources/ghost_fight.mp4 \
            -vf "scale=w='min(640,iw)':h='min(640,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
            -frames:v 1 -q:v 3 neural-sample.jpg
          test -s neural-sample.jpg
      - name: Execute isolated Modal GPU model and strict output contract
        shell: bash
        run: |
          set -euo pipefail
          modal run src/clipper_engine/inference/modal_worker.py::smoke \
            --frame-path neural-sample.jpg \
            --source-identity-json neural-source-identity.json \
            --timestamp 51.0 \
            --output-path neural-gpu-smoke.json \
            --max-estimated-usd 1.0
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('neural-gpu-smoke.json').read_text(encoding='utf-8'))
          assert report['status'] == 'GPU_SMOKE_PASS_PROPOSALS_ONLY'
          assert report['deployed_git_sha'] == __import__('os').environ['GITHUB_SHA']
          assert report['readiness']['cuda_available'] is True
          assert report['readiness']['gpu_count'] >= 2
          assert report['source_identity']['source_key'] == 'ghost_fight'
          assert report['usage']['conservative_wall_estimated_gpu_cost_usd'] <= 1.0
          print('ISOLATED_NEURAL_GPU_SMOKE: PASS')
          PY
      - name: Save evidence for source and worker qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clipper-neural-GPU-smoke-${{ github.sha }}
          path: |
            neural-source-identity.json
            neural-gpu-smoke.json
          retention-days: 30
          if-no-files-found: warn

  neural-source-wide-review:
    name: Source-wide proposed visual evidence (${{ matrix.source }})
    # Validation-only and deliberately opt-in due cost. Never deploy or modify
    # shared Modal workers or mutate source; use certified, hash-reverified proxies.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_wide == true }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {source: ghost_fight, run_id: 39827390899}
          - {source: convenience_store, run_id: 39827390899}
          - {source: traffic_chase, run_id: 39827390899}
          - {source: nightclub, run_id: 39827390899}
          - {source: makarov_chase, run_id: 39827390899}
          - {source: refusing_orders, run_id: 39749647361}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CLIPPER_NEURAL_MODAL_APP: clipper-mw4-vision-run
      CLIPPER_DEPLOYED_GIT_SHA: ${{ github.sha }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check checkout, GPU account access and CPU decoder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLIPPER_DEPLOYED_GIT_SHA"
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Install FFmpeg/FFprobe without optional GPU/media driver packages
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 480 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -qq
            sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get install \
              --no-install-recommends -y ffmpeg
          fi
          command -v ffmpeg || { echo '::error::FFMPEG_UNAVAILABLE'; exit 1; }
          command -v ffprobe || { echo '::error::FFPROBE_UNAVAILABLE'; exit 1; }
      - name: Install Clipper and Modal validation dependencies
        run: python -m pip install -e '.[mw4,modal]'
      - name: Retrieve immutable certified MediaSilo analysis proxy
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          name: MW4-qualification-source-${{ matrix.source }}
          path: raw_sources
      - name: Verify certified source bytes, identity and frame timing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from clipper_engine.sources import qa
          name = '${{ matrix.source }}'
          video = Path('raw_sources') / (name + '.mp4')
          cert = Path('raw_sources') / (name + '.source_qa.json')
          source = qa.verify(video, cert, require_original=False)
          if source.get('source_key') != name or source.get('derivative_type') != 'proxy':
              raise RuntimeError('certified MediaSilo analysis proxy identity invalid')
          clock = ((source.get('media_contract') or {}).get('video') or {}).get('timing') or {}
          if not clock.get('nominal_rate'):
              raise RuntimeError('source certificate missing original rational frame timing')
          print('SOURCE_IDENTITY_PASS', name, source['sha256'], clock['nominal_rate'])
          PY
      - name: Analyze complete certified source via Clipper and isolated Qwen3-VL
        shell: bash
        run: |
          set -euo pipefail
          modal run src/clipper_engine/inference/modal_worker.py::source_scout \
            --source-path raw_sources/${{ matrix.source }}.mp4 \
            --manifest-path raw_sources/${{ matrix.source }}.source_qa.json \
            --campaign-config campaigns/campaign-moments-mw4.json \
            --output-dir neural-source-${{ matrix.source }} \
            --sample-interval-seconds 15 \
            --batch-frames 2 \
            --max-refinement-anchors 20 \
            --max-sample-frames 144 \
            --max-gpu-seconds 1800 \
            --max-estimated-usd 2.0
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('neural-source-${{ matrix.source }}')
          report = json.loads((p / 'source_wide_gpu_qualification.json').read_text())
          queue = json.loads((p / 'neural_review_queue.json').read_text())
          assert report['status'] == 'GPU_SOURCE_WIDE_PROPOSALS_ONLY'
          assert report['execution_sha'] == os.environ['GITHUB_SHA']
          assert report['source_key'] == '${{ matrix.source }}'
          assert report['coverage']['expected_samples'] == report['coverage']['observed_samples']
          assert queue['status'] == 'REVIEW_QUEUE_ONLY'
          assert report['may_create_verified_outcomes'] is False
          assert report['requires_independent_source_review'] is True
          print('SOURCE_WIDE_GPU_EVIDENCE_PASS', report['source_key'], report['coverage'])
          PY
      - name: Retain source-wide model output and independent review requirements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MW4-neural-source-wide-${{ matrix.source }}-${{ github.sha }}
          path: neural-source-${{ matrix.source }}/
          retention-days: 30
          if-no-files-found: warn
