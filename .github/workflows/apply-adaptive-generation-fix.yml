name: Apply adaptive vision capacity patch

on:
  push:
    branches:
      - feat/word-reveal-face-tracking

permissions:
  contents: write

jobs:
  apply-fix:
    if: "github.event.head_commit.message == 'chore: fix adaptive vision patch runner'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - name: Apply and verify patch
        shell: bash
        run: |
          git apply --check tools/adaptive-generation-capacity.patch
          git apply tools/adaptive-generation-capacity.patch
          git diff --check
          python -m compileall -q scripts/modal_open_models.py src/clipper/visual_ai.py tests/test_modal_pipeline_source_contract.py tests/test_visual_ai.py
      - name: Push implementation commit
        shell: bash
        run: |
          rm tools/adaptive-generation-capacity.patch
          rm .github/workflows/apply-adaptive-generation-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: adapt vision generation capacity"
          git push origin HEAD:feat/word-reveal-face-tracking
