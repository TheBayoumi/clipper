name: V10 production render and HILP evidence

on:
  workflow_dispatch:
  push:
    branches: [feat/word-reveal-face-tracking]
    paths:
      - ".github/workflows/v10-production-cycle.yml"
      - "scripts/modal_v10_cycle.py"
      - "scripts/modal_open_models.py"
      - "src/clipper/pipeline.py"
      - "src/clipper/autonomous_editor.py"
      - "src/clipper/render.py"
      - "src/clipper/providers/**"
      - "campaigns/reach-double-coverage-dedicated.yaml"
      - "Dockerfile"
      - "pyproject.toml"
      - ".ruff.toml"

concurrency:
  group: v10-production-hilp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  CLIPPER_YOUTUBE_COOKIES_B64: ${{ secrets.CLIPPER_YOUTUBE_COOKIES_B64 }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_V10_MODAL_APP: clipper-v10-cycle

jobs:
  production-render-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify production dependency and ingestion contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/modal_v10_cycle.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/v10-production-cycle.yml").read_text(encoding="utf-8")
          for required in (
              'add_python="3.12"',
              '"numba==0.66.0"',
              '"nemo_toolkit[asr]>=2.5,<3"',
              '"yt-dlp[default]>=2026.7.4,<2027"',
              '"--js-runtimes"',
              '"node"',
              '"bgutil_default_mweb"',
              '"cookies_bgutil_default_mweb"',
          ):
              assert required in source, required
          assert source.index('"bgutil_default_mweb"') < source.index('"cookies_bgutil_default_mweb"')
          assert 'with_options(cloud=value, timeout=1800)' in workflow
          assert 'with_options(region=value, timeout=1800)' in workflow
          assert 'manual-review-queue.json' in workflow
          assert 'automated_hilp_allowed' in workflow
          PY

      - name: Verify credentials before compute
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$HF_TOKEN"

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Terminate stale V10 Modal containers
        run: |
          modal app stop "$CLIPPER_V10_MODAL_APP" --yes || true
          modal app stop "$CLIPPER_MODAL_APP" --yes || true
          modal volume rm -r clipper-media-cache /staging || true

      - name: Deploy exact-HEAD open-model workers
        run: modal deploy scripts/modal_open_models.py

      - name: Deploy exact-HEAD source, Sortformer and cycle workers
        run: modal deploy scripts/modal_v10_cycle.py

      - name: Acquire highest-quality master across autonomous Modal egress pools
        run: |
          set -euo pipefail
          mkdir -p open-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          import modal

          payload = {
              "video_id": "2Y4LP85PTak",
              "video_url": "https://www.youtube.com/watch?v=2Y4LP85PTak",
          }
          base = modal.Function.from_name("clipper-v10-cycle", "acquire_source")
          variants = [
              ("cloud:gcp", "cloud", "gcp"),
              ("cloud:aws", "cloud", "aws"),
              ("cloud:oci", "cloud", "oci"),
              ("region:eu", "region", "eu"),
              ("region:ap", "region", "ap"),
              ("region:sa", "region", "sa"),
              ("region:af", "region", "af"),
              ("default", "default", "auto"),
          ]
          attempts = []
          result = None
          winner = None
          for label, kind, value in variants:
              try:
                  if kind == "cloud":
                      candidate = base.with_options(cloud=value, timeout=1800).remote(payload)
                  elif kind == "region":
                      candidate = base.with_options(region=value, timeout=1800).remote(payload)
                  else:
                      candidate = base.remote(payload)
              except Exception as exc:
                  attempts.append({
                      "egress": label,
                      "status": "FAIL",
                      "error_type": type(exc).__name__,
                      "error": str(exc)[-6000:],
                  })
                  continue
              result = candidate
              winner = label
              attempts.append({
                  "egress": label,
                  "status": "PASS",
                  "sha256": candidate.get("sha256"),
                  "bytes": candidate.get("bytes"),
                  "reused": candidate.get("reused"),
              })
              break
          Path("open-evidence/source-egress-attempts.json").write_text(
              json.dumps({"winner": winner, "attempts": attempts}, indent=2) + "\n"
          )
          if result is None:
              raise RuntimeError("all autonomous source egress pools failed: " + json.dumps(attempts))
          assert result["quality_policy"] == "highest_available_no_transcode"
          assert int(result["bytes"]) > 0
          assert result["volume_path"].startswith("/inputs/")
          Path("open-evidence/source-master.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({"winner": winner, "result": result}, indent=2))
          PY

      - name: Run entire podcast and render production finalists
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import modal

          result = modal.Function.from_name("clipper-v10-cycle", "run_full_cycle").remote({
              "source": json.loads(Path("open-evidence/source-master.json").read_text()),
              "brief_yaml": Path("campaigns/reach-double-coverage-dedicated.yaml").read_text(),
              "channel_id": "UCf1q6dhccWr6eQEcFFnJSbA",
          })
          assert result["status"] == "PASS", result
          assert result["pipeline_status"] == "SUCCESS", result
          assert int(result["rendered_finalists"]) >= 6, result
          assert int(result["initial_shortlist"]) >= 3, result
          Path("open-evidence/cycle-result.json").write_text(json.dumps(result, indent=2) + "\n")
          Path("open-evidence/run-path.txt").write_text(str(result["run_path"]) + "\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Download rendered and evidence bundle from Modal
        run: |
          set -euo pipefail
          run_path="$(tr -d '\n' < open-evidence/run-path.txt)"
          rm -rf cycle-evidence
          modal volume get --force clipper-v10-artifacts "$run_path" cycle-evidence

      - name: Decode finalists and prepare actual HILP review queue
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          roots = list(Path("cycle-evidence").rglob("manifest.json"))
          assert len(roots) == 1, roots
          run_dir = roots[0].parent
          manifest = json.loads((run_dir / "manifest.json").read_text())
          assert manifest["status"] == "SUCCESS", manifest.get("status_reason")
          rendered = manifest.get("rendered_clips") or []
          shortlist = manifest.get("submission_shortlist") or []
          assert len(rendered) >= 6
          assert len(shortlist) >= 3
          shortlist_ids = {
              str(item.get("plan_id")) for item in shortlist
              if isinstance(item, dict) and item.get("plan_id")
          }
          queue = []
          for item in rendered:
              assert isinstance(item, dict)
              requested = Path(str(item["output_path"]))
              matches = list(run_dir.rglob(requested.name))
              assert len(matches) == 1, (requested, matches)
              local = matches[0]
              subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", str(local), "-f", "null", "-"],
                  check=True,
                  timeout=1800,
              )
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(local)],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )
              metadata = json.loads(probe.stdout)
              videos = [s for s in metadata.get("streams", []) if s.get("codec_type") == "video"]
              audios = [s for s in metadata.get("streams", []) if s.get("codec_type") == "audio"]
              assert len(videos) == 1 and audios
              video = videos[0]
              assert int(video["width"]) == 1080
              assert int(video["height"]) == 1920
              assert video.get("codec_name") == "h264"
              duration = float(metadata.get("format", {}).get("duration") or 0.0)
              assert duration >= 20.0
              digest = hashlib.sha256(local.read_bytes()).hexdigest()
              expected = str(item.get("render_sha256") or "")
              if expected:
                  assert digest == expected
              queue.append({
                  "plan_id": item.get("plan_id"),
                  "concept_id": item.get("concept_id"),
                  "path": str(local),
                  "sha256": digest,
                  "duration_seconds": duration,
                  "initial_shortlist": str(item.get("plan_id")) in shortlist_ids,
                  "decision": "PENDING_ACTUAL_REVIEW",
              })
          Path("open-evidence/manual-review-queue.json").write_text(
              json.dumps({
                  "status": "PENDING_ACTUAL_MP4_REVIEW",
                  "clips": queue,
                  "required_reviewer_actions": ["APPROVE", "REJECT", "REVISE"],
                  "automated_hilp_allowed": False,
                  "dod_complete": False,
              }, indent=2) + "\n"
          )
          print(json.dumps({"run_dir": str(run_dir), "clips": queue}, indent=2))
          PY

      - name: Upload production renders for actual MP4 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-production-review-${{ github.sha }}
          path: |
            open-evidence/
            cycle-evidence/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

      - name: Stop V10 Modal containers
        if: always()
        run: |
          modal app stop "$CLIPPER_V10_MODAL_APP" --yes || true
          modal app stop "$CLIPPER_MODAL_APP" --yes || true
