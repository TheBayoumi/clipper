name: Collaborative blocker batch

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/collaborative-blocker-batch.yml

permissions:
  contents: write

concurrency:
  group: collaborative-blocker-batch
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic development gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply complete blocker batch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # P1: default Modal call cancellation must confirm exact terminal state.
          replace_once(
              "src/clipper/modal_execution.py",
              '_RETRY_DELAYS_SECONDS = (2.0, 5.0)\n',
              '''_RETRY_DELAYS_SECONDS = (2.0, 5.0)\n_CANCEL_CONFIRM_TERMINAL_MODAL_ERRORS = frozenset(\n    {\n        "DeserializationError",\n        "ExecutionError",\n        "FunctionTimeoutError",\n        "InputCancellation",\n        "InternalFailure",\n        "OutputExpiredError",\n        "RemoteError",\n    }\n)\n_CANCEL_CONFIRM_UNCONFIRMED_MODAL_ERRORS = frozenset(\n    {\n        "AuthError",\n        "ClientClosed",\n        "ConflictError",\n        "ConnectionError",\n        "DataLossError",\n        "InternalError",\n        "InvalidError",\n        "NotFoundError",\n        "PermissionDeniedError",\n        "RequestSizeError",\n        "ResourceExhaustedError",\n        "ServiceError",\n        "UnimplementedError",\n        "VersionError",\n    }\n)\n''',
          )
          replace_once(
              "src/clipper/modal_execution.py",
              '''def _retry_delay(attempt: int) -> float:\n    index = max(0, min(attempt - 1, len(_RETRY_DELAYS_SECONDS) - 1))\n    return _RETRY_DELAYS_SECONDS[index]\n''',
              '''def _retry_delay(attempt: int) -> float:\n    index = max(0, min(attempt - 1, len(_RETRY_DELAYS_SECONDS) - 1))\n    return _RETRY_DELAYS_SECONDS[index]\n\n\ndef _cancel_confirmation_seconds() -> float:\n    timeout = float(os.getenv("CLIPPER_MODAL_CANCEL_CONFIRM_SECONDS", "30"))\n    if not math.isfinite(timeout) or timeout <= 0:\n        raise ValueError("Modal cancellation confirmation timeout must be finite and positive")\n    return timeout\n\n\ndef _cancellation_confirmation_is_terminal(exc: BaseException) -> bool:\n    names = _exception_class_names(exc)\n    if names & _CANCEL_CONFIRM_TERMINAL_MODAL_ERRORS:\n        return True\n    if names & _CANCEL_CONFIRM_UNCONFIRMED_MODAL_ERRORS:\n        return False\n    return False\n''',
          )
          replace_once(
              "src/clipper/modal_execution.py",
              '''def _cancel_remote_call(call: Any) -> None:\n    """Cancel one exact Modal call and fail closed unless the API confirms cancellation."""\n    call_id = str(getattr(call, "object_id", "") or getattr(call, "id", "") or "")\n    errors: list[str] = []\n    for attempt in range(1, _CONTROL_PLANE_ATTEMPTS + 1):\n        try:\n            call.cancel(terminate_containers=False)\n        except Exception as exc:\n            errors.append(f"{type(exc).__name__}: {exc}")\n            if attempt < _CONTROL_PLANE_ATTEMPTS:\n                time.sleep(_retry_delay(attempt))\n                continue\n            raise ProductionCallNotTerminated(call_id, errors) from exc\n        return\n    raise ProductionCallNotTerminated(call_id, errors)\n''',
              '''def _cancel_remote_call(call: Any) -> None:\n    """Cancel one exact Modal call and return only after terminal state is confirmed."""\n    call_id = str(getattr(call, "object_id", "") or getattr(call, "id", "") or "")\n    errors: list[str] = []\n    requested = False\n    for attempt in range(1, _CONTROL_PLANE_ATTEMPTS + 1):\n        try:\n            call.cancel(terminate_containers=False)\n        except Exception as exc:\n            errors.append(f"cancel {type(exc).__name__}: {exc}")\n            if attempt < _CONTROL_PLANE_ATTEMPTS:\n                time.sleep(_retry_delay(attempt))\n                continue\n            raise ProductionCallNotTerminated(call_id, errors) from exc\n        requested = True\n        break\n    if not requested:\n        raise ProductionCallNotTerminated(call_id, errors)\n\n    confirmation_seconds = _cancel_confirmation_seconds()\n    try:\n        call.get(timeout=confirmation_seconds)\n    except TimeoutError as exc:\n        errors.append(f"terminal confirmation timed out after {confirmation_seconds:.3f}s")\n        raise ProductionCallNotTerminated(call_id, errors) from exc\n    except BaseException as exc:\n        if isinstance(exc, (KeyboardInterrupt, SystemExit, GeneratorExit)):\n            raise\n        if not _cancellation_confirmation_is_terminal(exc):\n            errors.append(f"confirmation {type(exc).__name__}: {exc}")\n            raise ProductionCallNotTerminated(call_id, errors) from exc\n''',
          )

          # P1: vision producer lifecycle is per Modal FunctionCall, never per warm container.
          replace_once(
              "scripts/modal_execution_spy.py",
              '''        compact = self._compact_event(payload)\n        with self.lock:\n''',
              '''        compact = self._compact_event(payload)\n        if app != self.pipeline_app and str(compact.get("event") or "").startswith("vision_"):\n            function_call_id = self._function_call_id(line)\n            if function_call_id:\n                compact["invocation_id"] = function_call_id\n        with self.lock:\n''',
          )
          replace_once(
              "scripts/modal_execution_spy.py",
              '''            else:\n                self._diagnostic_event_counts[name] = self._diagnostic_event_counts.get(name, 0) + 1\n                lifecycle_id = str(compact.get("worker_lifecycle_id") or "")\n                if self._terminal_event is None and name == "vision_generation_start":\n                    if lifecycle_id:\n                        self._active_vision_generations[lifecycle_id] = (\n                            task,\n                            self._positive_int(compact.get("attempt")),\n                            self._positive_int(compact.get("frames")),\n                            observed_at,\n                        )\n                elif (\n                    name in {"vision_generation_complete", "vision_inference_error"}\n                    and lifecycle_id\n                ):\n                    self._active_vision_generations.pop(lifecycle_id, None)\n''',
              '''            else:\n                self._diagnostic_event_counts[name] = self._diagnostic_event_counts.get(name, 0) + 1\n                invocation_id = str(compact.get("invocation_id") or "")\n                if self._terminal_event is None and name == "vision_generation_start":\n                    if not invocation_id:\n                        violation = f"vision producer start omitted function-call identity: {compact}"\n                    elif invocation_id in self._active_vision_generations:\n                        violation = f"vision producer repeated active invocation ID: {compact}"\n                    else:\n                        self._active_vision_generations[invocation_id] = (\n                            task,\n                            self._positive_int(compact.get("attempt")),\n                            self._positive_int(compact.get("frames")),\n                            observed_at,\n                        )\n                elif name in {"vision_generation_complete", "vision_inference_error"}:\n                    if not invocation_id:\n                        violation = f"vision producer terminal omitted function-call identity: {compact}"\n                    else:\n                        active = self._active_vision_generations.get(invocation_id)\n                        if active is None:\n                            violation = f"vision producer terminal has no matching start: {compact}"\n                        elif active[0] != task:\n                            violation = (\n                                "vision producer terminal task does not match start: "\n                                f"started={active[0]!r} event={compact}"\n                            )\n                        else:\n                            self._active_vision_generations.pop(invocation_id, None)\n''',
          )
          replace_once(
              "scripts/modal_execution_spy.py",
              '''        stalled = [\n            (lifecycle_id, task, attempt, frames, now - started)\n            for lifecycle_id, (task, attempt, frames, started) in active\n            if now - started >= self.vision_stall_seconds\n        ]\n        if stalled:\n            lifecycle_id, task, attempt, frames, elapsed = max(stalled, key=lambda item: item[4])\n            self._set_abort(\n                "vision generation made no terminal progress before watchdog deadline",\n                {\n                    "event": "vision_generation_stall",\n                    "worker_lifecycle_id": lifecycle_id,\n''',
              '''        stalled = [\n            (invocation_id, task, attempt, frames, now - started)\n            for invocation_id, (task, attempt, frames, started) in active\n            if now - started >= self.vision_stall_seconds\n        ]\n        if stalled:\n            invocation_id, task, attempt, frames, elapsed = max(\n                stalled, key=lambda item: item[4]\n            )\n            self._set_abort(\n                "vision generation made no terminal progress before watchdog deadline",\n                {\n                    "event": "vision_generation_stall",\n                    "invocation_id": invocation_id,\n''',
          )
          replace_once(
              "scripts/modal_execution_spy.py",
              '''            active_vision = [\n                {\n                    "worker_lifecycle_id": lifecycle_id,\n                    "task": task,\n                    "attempt": attempt,\n                    "frames": frames,\n                }\n                for lifecycle_id, (task, attempt, frames, _started) in sorted(\n                    self._active_vision_generations.items()\n                )\n            ]\n''',
              '''            active_vision = [\n                {\n                    "invocation_id": invocation_id,\n                    "task": task,\n                    "attempt": attempt,\n                    "frames": frames,\n                }\n                for invocation_id, (task, attempt, frames, _started) in sorted(\n                    self._active_vision_generations.items()\n                )\n            ]\n''',
          )

          # P2: unknown/unlisted source hazards honor an explicit allow policy.
          replace_once(
              "src/clipper/quality_pipeline.py",
              '''        if classification in segment_policy.allow:\n            continue\n        buffer = (\n''',
              '''        if classification in segment_policy.allow or (\n            classification not in segment_policy.forbid and segment_policy.unknown == "allow"\n        ):\n            continue\n        buffer = (\n''',
          )

          # Coverage enforcement must fail independently if pytest-cov metadata is misleading.
          replace_once(
              ".github/workflows/ci.yml",
              '''      - run: pytest\n''',
              '''      - run: pytest\n      - name: Enforce measured package coverage floor\n        run: coverage report --fail-under=95\n''',
          )

          # Tests: modal cancellation and reviewed resume-provenance fail-closed contract.
          replace_once(
              "tests/test_modal_execution.py",
              '''    _acquire_remote_source,\n    _BudgetLedger,\n    _class,\n''',
              '''    _acquire_remote_source,\n    _BudgetLedger,\n    _cancel_confirmation_seconds,\n    _cancel_remote_call,\n    _class,\n''',
          )
          replace_once(
              "tests/test_modal_execution.py",
              '''    _local_git_sha,\n    _materialize_remote_run,\n''',
              '''    _load_reviewed_resume_provenance,\n    _local_git_sha,\n    _materialize_remote_run,\n''',
          )
          replace_once(
              "tests/test_modal_execution.py",
              '''class ServiceError(RuntimeError):\n    pass\n\n\n@pytest.fixture''',
              '''class ServiceError(RuntimeError):\n    pass\n\n\nclass InputCancellation(RuntimeError):\n    pass\n\n\n@pytest.fixture''',
          )
          replace_once(
              "tests/test_modal_execution.py",
              '''        call = Mock()\n        call.get.side_effect = RuntimeError(f"{label} blocked")\n''',
              '''        call = Mock()\n        call.get.side_effect = [RuntimeError(f"{label} blocked"), InputCancellation("cancelled")]\n''',
          )
          replace_once(
              "tests/test_modal_execution.py",
              '''        def get(self, *, timeout: float) -> object:\n            assert 0.0 < timeout < 1.0\n            clock["now"] = 1.0\n            raise TimeoutError\n''',
              '''        def get(self, *, timeout: float) -> object:\n            if self.cancelled:\n                raise InputCancellation("cancelled")\n            assert 0.0 < timeout < 1.0\n            clock["now"] = 1.0\n            raise TimeoutError\n''',
          )
          modal_tests = r'''


def test_cancel_remote_call_requires_exact_terminal_confirmation(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setenv("CLIPPER_MODAL_CANCEL_CONFIRM_SECONDS", "7")
    call = Mock()
    call.object_id = "fc-confirmed"
    call.get.side_effect = InputCancellation("cancelled")

    _cancel_remote_call(call)

    call.cancel.assert_called_once_with(terminate_containers=False)
    call.get.assert_called_once_with(timeout=7.0)


def test_cancel_remote_call_rejects_timeout_and_transport_uncertainty(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setenv("CLIPPER_MODAL_CANCEL_CONFIRM_SECONDS", "2")
    for error in (TimeoutError(), ServiceError("control plane unavailable")):
        call = Mock()
        call.object_id = "fc-unconfirmed"
        call.get.side_effect = error
        with pytest.raises(ProductionCallNotTerminated, match="terminal state"):
            _cancel_remote_call(call)
        call.cancel.assert_called_once_with(terminate_containers=False)


def test_cancel_remote_call_retries_cancel_request_and_validates_confirmation_timeout(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setenv("CLIPPER_MODAL_CANCEL_CONFIRM_SECONDS", "3")
    call = Mock()
    call.object_id = "fc-retry"
    call.cancel.side_effect = [ServiceError("retry"), None]
    call.get.side_effect = InputCancellation("cancelled")
    with patch("clipper.modal_execution.time.sleep") as sleep:
        _cancel_remote_call(call)
    assert call.cancel.call_count == 2
    sleep.assert_called_once_with(2.0)

    monkeypatch.setenv("CLIPPER_MODAL_CANCEL_CONFIRM_SECONDS", "nan")
    with pytest.raises(ValueError, match="finite and positive"):
        _cancel_confirmation_seconds()


def _valid_resume_registry(tmp_path: Path) -> tuple[Path, dict[str, object], list[VideoCandidate]]:
    brief_path = tmp_path / "brief.yaml"
    brief_path.write_text("campaign: reviewed\n", encoding="utf-8")
    digest = __import__("hashlib").sha256(brief_path.read_bytes()).hexdigest()
    record: dict[str, object] = {
        "schema_version": "clipper-resume-provenance-v1",
        "workflow_run_id": "123",
        "campaign_id": "campaign",
        "campaign_brief_sha256": digest,
        "artifact_run_path": "/run-123",
        "artifact_origin_workflow_run_id": "122",
        "artifact_origin_head_sha": "a" * 40,
        "cache_root": "/artifacts/_cache",
        "source_hashes": {"v1": "B" * 64},
        "target_video_id": "v1",
    }
    registry: dict[str, object] = {
        "schema_version": "clipper-resume-provenance-registry-v1",
        "records": {"123": record},
    }
    acceptance = tmp_path / "acceptance"
    acceptance.mkdir()
    (acceptance / "resume-provenance.json").write_text(
        json.dumps(registry), encoding="utf-8"
    )
    candidates = [VideoCandidate("v1", "Title", "UC1", "Channel", "https://youtu.be/v1")]
    return brief_path, registry, candidates


def _write_resume_registry(tmp_path: Path, registry: dict[str, object]) -> None:
    (tmp_path / "acceptance" / "resume-provenance.json").write_text(
        json.dumps(registry), encoding="utf-8"
    )


def test_reviewed_resume_provenance_normalizes_source_hashes(
    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
) -> None:
    brief_path, _registry, candidates = _valid_resume_registry(tmp_path)
    monkeypatch.setattr("clipper.modal_execution._repo_root", lambda: tmp_path)
    result = _load_reviewed_resume_provenance(
        requested_run_id="123",
        brief_path=brief_path,
        campaign_id="campaign",
        candidates=candidates,
    )
    assert result is not None
    assert result["source_hashes"] == {"v1": "b" * 64}


def test_reviewed_resume_provenance_rejects_missing_or_malformed_registry(
    tmp_path: Path, monkeypatch: pytest.MonkeyPatch
) -> None:
    brief_path = tmp_path / "brief.yaml"
    brief_path.write_text("campaign: reviewed\n", encoding="utf-8")
    candidates = [VideoCandidate("v1", "Title", "UC1", "Channel", "https://youtu.be/v1")]
    monkeypatch.setattr("clipper.modal_execution._repo_root", lambda: tmp_path)
    with pytest.raises(RuntimeError, match="valid reviewed provenance registry"):
        _load_reviewed_resume_provenance(
            requested_run_id="123",
            brief_path=brief_path,
            campaign_id="campaign",
            candidates=candidates,
        )

    acceptance = tmp_path / "acceptance"
    acceptance.mkdir()
    (acceptance / "resume-provenance.json").write_text("{bad-json", encoding="utf-8")
    with pytest.raises(RuntimeError, match="valid reviewed provenance registry"):
        _load_reviewed_resume_provenance(
            requested_run_id="123",
            brief_path=brief_path,
            campaign_id="campaign",
            candidates=candidates,
        )


