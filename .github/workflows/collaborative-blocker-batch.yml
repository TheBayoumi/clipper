name: Collaborative blocker batch

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/collaborative-blocker-batch.yml
      - scripts/_collaborative_blocker_batch.py
      - scripts/_collaborative_fixture_alignment.py

permissions:
  contents: write

concurrency:
  group: collaborative-blocker-batch
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic development gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply complete blocker batch
        run: python scripts/_collaborative_blocker_batch.py

      - name: Align legacy fixtures with terminal cancellation contract
        run: python scripts/_collaborative_fixture_alignment.py

      - name: Apply formatter and import rules before verification
        run: |
          ruff format . --exclude scripts/_collaborative_blocker_batch.py --exclude scripts/_collaborative_fixture_alignment.py
          ruff check . --fix --exclude scripts/_collaborative_blocker_batch.py --exclude scripts/_collaborative_fixture_alignment.py

      - name: Ruff lint
        run: ruff check . --exclude scripts/_collaborative_blocker_batch.py --exclude scripts/_collaborative_fixture_alignment.py

      - name: Ruff format
        run: ruff format --check . --exclude scripts/_collaborative_blocker_batch.py --exclude scripts/_collaborative_fixture_alignment.py

      - name: Strict mypy
        run: mypy

      - name: Target cancellation and budget regressions
        run: pytest -q --no-cov tests/test_modal_execution.py -k "cancel_remote_call or cancellation_confirmation or reviewed_resume_provenance or invoke_remote_with_budget or acquire_remote_source"

      - name: Target vision lifecycle regression
        run: pytest -q --no-cov tests/test_modal_execution_spy.py tests/test_vision_runtime_recovery.py -k "vision or spy"

      - name: Target unknown-policy regression
        run: pytest -q --no-cov tests/test_coverage_floor_contract_edges.py -k "unknown_hazard"

      - name: Target brief fail-closed coverage
        run: pytest -q --no-cov tests/test_brief.py -k "fail_closed_validation_matrix"

      - name: Full deterministic pytest gate
        run: pytest

      - name: Report exact measured package coverage
        shell: bash
        run: |
          coverage json -o coverage-final.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("coverage-final.json").read_text(encoding="utf-8"))
          percent = float(data["totals"]["percent_covered"])
          print(f"exact package coverage: {percent:.6f}%")
          if percent < 95.0:
              raise SystemExit(f"exact package coverage {percent:.6f}% is below 95.0%")
          PY

      - name: Enforce configured coverage floor
        run: coverage report --fail-under=95

      - name: Push verified source-only tree
        shell: bash
        env:
          BRANCH: feat/contentrewards-campaign-factory
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_TRIGGER_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clipper/modal_execution.py src/clipper/quality_pipeline.py scripts/modal_execution_spy.py \
            tests/test_modal_execution.py tests/test_modal_execution_spy.py \
            tests/test_vision_runtime_recovery.py tests/test_coverage_floor_contract_edges.py \
            tests/test_brief.py
          git commit -m "fix: verified collaborative source tree"
          git push origin "HEAD:${BRANCH}"
