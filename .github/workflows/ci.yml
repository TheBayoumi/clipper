name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-modal-contracts:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply Modal production contract repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline = Path("scripts/modal_pipeline.py")
          text = pipeline.read_text(encoding="utf-8")
          constant_anchor = '_TARGETED_RECOVERY_PLANS = (("c14", "p3"), ("c5", "p1"))\n'
          if '_LEGACY_RECOVERY_PROTOCOL = "v8-six-finalist-recovery"' not in text:
              if constant_anchor not in text:
                  raise SystemExit("legacy recovery constant anchor missing")
              text = text.replace(
                  constant_anchor,
                  '_LEGACY_RECOVERY_PROTOCOL = "v8-six-finalist-recovery"\n' + constant_anchor,
                  1,
              )

          old_recovery = '''def recover_finalists(payload: dict[str, Any]) -> dict[str, Any]:
              """Repair only explicitly selected finalists and revalidate every reused clip."""

              from clipper.acceptance import validate_live_run
          '''.replace("              ", "")
          new_recovery = '''def recover_finalists(payload: dict[str, Any]) -> dict[str, Any]:
              """Run the explicit legacy V8 six-finalist repair protocol only."""

              if str(payload.get("legacy_recovery_protocol") or "") != _LEGACY_RECOVERY_PROTOCOL:
                  raise ValueError(
                      "recover_finalists is restricted to the explicit legacy V8 six-finalist protocol"
                  )

              from clipper.acceptance import validate_live_run
          '''.replace("              ", "")
          if old_recovery in text:
              text = text.replace(old_recovery, new_recovery, 1)
          elif new_recovery not in text:
              raise SystemExit("recover_finalists guard anchor missing")

          old_status = '''    if render and manifest.get("status") != "SUCCESS":
              raise RuntimeError(
                  f"production pipeline did not reach SUCCESS: {manifest.get('status_reason')}"
              )
          '''.replace("          ", "")
          new_status = '''    if render and manifest.get("status") not in {"SUCCESS", "DEGRADED"}:
              raise RuntimeError(
                  "production pipeline did not reach SUCCESS or DEGRADED: "
                  f"{manifest.get('status_reason')}"
              )
          '''.replace("          ", "")
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit("render terminal-status anchor missing")
          pipeline.write_text(text, encoding="utf-8")

          models = Path("scripts/modal_open_models.py")
          text = models.read_text(encoding="utf-8")
          old_tasks = '''        "source_hazards:smoke",
              "boundary_audit:smoke",
          '''.replace("          ", "")
          new_tasks = '''        "source_hazards:smoke",
              "boundary_audit:smoke",
              "semantic_cores:smoke",
              "narrative_envelope:smoke",
              "quality_windows:smoke",
          '''.replace("          ", "")
          if old_tasks in text:
              text = text.replace(old_tasks, new_tasks, 1)
          elif new_tasks not in text:
              raise SystemExit("editorial schema smoke task anchor missing")
          models.write_text(text, encoding="utf-8")

          launcher = Path("scripts/run_modal_finalist_recovery.py")
          text = launcher.read_text(encoding="utf-8")
          plan_anchor = '''PLAN_KEYS = (
          '''
          if 'LEGACY_RECOVERY_PROTOCOL = "v8-six-finalist-recovery"' not in text:
              if plan_anchor not in text:
                  raise SystemExit("launcher protocol anchor missing")
              text = text.replace(
                  plan_anchor,
                  'LEGACY_RECOVERY_PROTOCOL = "v8-six-finalist-recovery"\n\n' + plan_anchor,
                  1,
              )
          request_anchor = '''    request = {
              "source_run_id": args.source_run_id,
          '''.replace("          ", "")
          request_replacement = '''    request = {
              "legacy_recovery_protocol": LEGACY_RECOVERY_PROTOCOL,
              "source_run_id": args.source_run_id,
          '''.replace("          ", "")
          if request_anchor in text:
              text = text.replace(request_anchor, request_replacement, 1)
          elif request_replacement not in text:
              raise SystemExit("launcher request anchor missing")
          text = text.replace(
              'description=(\n            "Repair explicitly selected finalists inside Modal, review only newly rendered "',
              'description=(\n            "Legacy V8 recovery only: repair explicitly selected finalists inside Modal, "',
              1,
          )
          launcher.write_text(text, encoding="utf-8")

          contract = Path("tests/test_modal_pipeline_source_contract.py")
          text = contract.read_text(encoding="utf-8")
          marker = "def test_modal_schema_smoke_covers_all_active_editorial_task_families() -> None:"
          if marker not in text:
              text += '''


def test_modal_schema_smoke_covers_all_active_editorial_task_families() -> None:
    source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
    smoke = source.split("def editorial_schema_smoke(", 1)[1].split("def hf_access_smoke(", 1)[0]
    expected = (
        "episode_editorial_profile",
        "story_moments:smoke",
        "clip_concepts",
        "global_concept_comparison",
        "hook_variants:smoke",
        "edit_plans:smoke",
        "source_hazards:smoke",
        "boundary_audit:smoke",
        "semantic_cores:smoke",
        "narrative_envelope:smoke",
        "quality_windows:smoke",
    )
    assert len(expected) == 11
    assert all(f'"{task}"' in smoke for task in expected)


def test_modal_full_cycle_accepts_dynamic_degraded_yield_but_rejects_failed() -> None:
    source = Path("scripts/modal_pipeline.py").read_text(encoding="utf-8")
    cycle = source.split("def run_full_cycle(", 1)[1]
    assert 'manifest.get("status") not in {"SUCCESS", "DEGRADED"}' in cycle
    assert 'if not render and manifest.get("status") == "FAILED"' in cycle


def test_targeted_finalist_recovery_is_explicit_legacy_protocol_only() -> None:
    pipeline = Path("scripts/modal_pipeline.py").read_text(encoding="utf-8")
    launcher = Path("scripts/run_modal_finalist_recovery.py").read_text(encoding="utf-8")
    recovery = pipeline.split("def recover_finalists(", 1)[1].split("def run_full_cycle(", 1)[0]
    assert '_LEGACY_RECOVERY_PROTOCOL = "v8-six-finalist-recovery"' in pipeline
    assert 'payload.get("legacy_recovery_protocol")' in recovery
    assert "restricted to the explicit legacy V8 six-finalist protocol" in recovery
    assert 'LEGACY_RECOVERY_PROTOCOL = "v8-six-finalist-recovery"' in launcher
    assert '"legacy_recovery_protocol": LEGACY_RECOVERY_PROTOCOL' in launcher
'''
          contract.write_text(text, encoding="utf-8")
          PY
      - name: Verify and commit Modal contract repairs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format \
            scripts/modal_pipeline.py \
            scripts/modal_open_models.py \
            scripts/run_modal_finalist_recovery.py \
            tests/test_modal_pipeline_source_contract.py \
            tests/test_coverage_floor_contract_edges.py
          ruff check .
          ruff format --check .
          mypy
          pytest
          coverage report --fail-under=95
          git diff --check
          git config user.name "clipper-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/modal_pipeline.py \
            scripts/modal_open_models.py \
            scripts/run_modal_finalist_recovery.py \
            tests/test_modal_pipeline_source_contract.py \
            tests/test_coverage_floor_contract_edges.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: align Modal runtime with dynamic quality yield"
          git push origin HEAD:feat/word-reveal-face-tracking

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
