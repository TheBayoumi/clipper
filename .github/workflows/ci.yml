name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Preserve and surface failed grounding diagnostics
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/modal_pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if render and manifest.get("status") not in {"SUCCESS", "DEGRADED"}:
        raise RuntimeError(
            "production pipeline did not reach SUCCESS or DEGRADED: "
            f"{manifest.get('status_reason')}"
        )
    if not render and manifest.get("status") == "FAILED":
        raise RuntimeError(
            f"planning pipeline failed before render: {manifest.get('status_reason')}"
        )
'''
          new = '''    if render and manifest.get("status") not in {"SUCCESS", "DEGRADED"}:
        errors = manifest.get("errors")
        details: list[str] = []
        if isinstance(errors, list):
            for item in errors[-3:]:
                if isinstance(item, dict):
                    stage = str(item.get("stage") or "unknown")
                    message = str(item.get("message") or "unknown error")
                    details.append(f"{stage}: {message}")
        artifact_volume.commit()
        run_relative = "/" + str(run_dir.relative_to(Path(ARTIFACT_ROOT))).replace(os.sep, "/")
        suffix = f"; errors={' | '.join(details)}" if details else ""
        raise RuntimeError(
            "production pipeline did not reach SUCCESS or DEGRADED: "
            f"{manifest.get('status_reason')}; failed_run_path={run_relative}{suffix}"
        )
    if not render and manifest.get("status") == "FAILED":
        artifact_volume.commit()
        run_relative = "/" + str(run_dir.relative_to(Path(ARTIFACT_ROOT))).replace(os.sep, "/")
        raise RuntimeError(
            f"planning pipeline failed before render: {manifest.get('status_reason')}; "
            f"failed_run_path={run_relative}"
        )
'''
          if old not in text:
              raise SystemExit("expected run_full_cycle failure block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_modal_pipeline_failure_diagnostics.py")
          test_path.write_text(
              '''from pathlib import Path\n\n\ndef test_modal_pipeline_persists_and_surfaces_failed_grounding_details() -> None:\n    source = Path("scripts/modal_pipeline.py").read_text(encoding="utf-8")\n\n    assert 'errors = manifest.get("errors")' in source\n    assert 'artifact_volume.commit()' in source\n    assert 'failed_run_path=' in source\n    assert 'details.append(f"{stage}: {message}")' in source\n''',
              encoding="utf-8",
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/modal_pipeline.py tests/test_modal_pipeline_failure_diagnostics.py
          git commit -m "fix: preserve grounding failure diagnostics"
          git push origin HEAD:feat/word-reveal-face-tracking
