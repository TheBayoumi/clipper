name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-quality-graph-tests:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/migrate_quality_graph_pipeline_tests.py
      - run: |
          python -m pip install "ruff>=0.15.22,<1"
          ruff format tests/test_pipeline.py
          ruff check tests/test_pipeline.py
          git diff --check
      - run: |
          set -euo pipefail
          git config user.name "clipper-quality-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_pipeline.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: migrate open pipeline to quality graph contract"
          git push origin HEAD:feat/word-reveal-face-tracking

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
