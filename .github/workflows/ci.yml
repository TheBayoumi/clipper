name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "review/**", "ci/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install pinned public CPU-only Torch for tokenizer adapter checks
        run: |
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Verify exact public Qwen tokenizer and real decoder adapter without weights
        env:
          CLIPPER_TOKENIZER_ONLY_PROBE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          CUDA_VISIBLE_DEVICES: "-1"
          HF_HOME: ${{ runner.temp }}/clipper-tokenizer-only-hf
        run: |
          timeout --signal=TERM --kill-after=15s 6m \
            python -m pytest -q -s -o addopts="" tests/test_books_qwen_tokenizer_only.py
      - run: pytest
      - name: Enforce measured package coverage floor (unrounded to 2 decimals)
        run: coverage report --precision=2 --fail-under=95
      - name: Measure GPU-driving script coverage (baseline)
        run: |
          coverage run --rcfile=.coveragerc.scripts -m pytest -q -o addopts="" \
            tests/test_modal_qwen_cache_dispatch.py \
            tests/test_modal_wan_request_contract.py \
            tests/test_modal_endpoint_identity_contract.py \
            tests/test_modal_endpoint_bootstrap.py \
            tests/test_wan_shot_contract.py \
            tests/test_wan_keyframe_contract.py \
            tests/test_book_assembly_trust_boundary.py
          coverage report --rcfile=.coveragerc.scripts --fail-under=60.84
