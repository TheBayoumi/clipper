name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guarded-contract-cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact guarded cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(name: str, old: str, new: str) -> None:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed for {name}: {count} matches for {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def block(name: str, start: str, end: str, replacement: str) -> None:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f"block guard failed for {name}: {start!r} / {end!r}")
              a = text.index(start)
              b = text.index(end, a)
              path.write_text(text[:a] + replacement + text[b:], encoding="utf-8")

