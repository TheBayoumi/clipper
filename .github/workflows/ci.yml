name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feat/mw4-fullframe-retention-v3-1
      - feat/warzone-operator-toggle

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: mypy --strict --follow-imports=silent src/clipper_engine/montage.py src/clipper_engine/workflow.py src/clipper_engine/rendering/montage.py src/clipper_engine/rendering/portrait_matte.py
      - run: pytest
