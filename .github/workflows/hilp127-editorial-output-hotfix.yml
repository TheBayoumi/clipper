name: HILP 127 editorial output hotfix

on:
  push:
    branches: [feat/contentrewards-campaign-factory]
    paths: [.github/workflows/hilp127-editorial-output-hotfix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require staging-only drift
        shell: bash
        run: |
          set -euo pipefail
          base=bedff7998dce3bf8da8a03c27aecaa9ae5810a1a
          test "$(git diff --name-only "$base"..HEAD)" = ".github/workflows/hilp127-editorial-output-hotfix.yml"

      - name: Apply bounded malformed-output recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def one(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{label}: expected one match, got {n}")
              return text.replace(old, new)

          def sub_one(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, n = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise RuntimeError(f"{label}: expected one match, got {n}")
              if re.search(pattern, updated, flags=re.MULTILINE):
                  raise RuntimeError(f"{label}: target unexpectedly remains")
              return updated

          wp = Path("scripts/modal_open_models.py")
          worker = wp.read_text(encoding="utf-8")
          marker = "\n\ndef _json_text(text: str) -> dict[str, Any]:\n"
          invalid_class = (
              "\n\nclass EditorialOutputInvalid(ValueError):\n"
              "    \"\"\"Editorial generation returned malformed structured output within its budget.\"\"\"\n\n"
              "    def __init__(self, message: str, *, details: dict[str, Any]) -> None:\n"
              "        self.details = dict(details)\n"
              "        super().__init__(message)\n"
          )
          worker = one(worker, marker, invalid_class + marker, "insert EditorialOutputInvalid")
          worker = one(
              worker,
              '    capacity_rejected = error_type == "OutOfMemoryError" or "CapacityError" in error_type\n    if not capacity_rejected:\n        traceback.print_exception(exc)\n',
              '    capacity_rejected = error_type == "OutOfMemoryError" or "CapacityError" in error_type\n    output_retry = error_type in {"EditorialOutputTruncated", "EditorialOutputInvalid"}\n    if not capacity_rejected and not output_retry:\n        traceback.print_exception(exc)\n',
              "transport output-retry classification",
          )
          worker = one(
              worker,
              '    application_status = "CAPACITY_REJECTED" if capacity_rejected else "FAILED"\n    recovery_action = "REPARTITION" if capacity_rejected else "NONE"\n',
              '    if capacity_rejected:\n        application_status = "CAPACITY_REJECTED"\n        recovery_action = "REPARTITION"\n    elif output_retry:\n        application_status = "OUTPUT_RETRY"\n        recovery_action = "REGENERATE"\n    else:\n        application_status = "FAILED"\n        recovery_action = "NONE"\n',
              "transport status mapping",
          )
          pattern = (
              r'^        raise RuntimeError\(\n'
              r'\s*"constrained editorial generation returned invalid JSON despite Outlines "\n'
              r'\s*f"schema enforcement for task=\{task\}: \{exc\}"\n'
              r'\s*\) from exc\n'
          )
          replacement = (
              '        available = int(plan["available_output_tokens"])\n'
              '        next_budget = min(\n'
              '            available,\n'
              '            max(output_budget + 1, output_budget * 2),\n'
              '        )\n'
              '        raise EditorialOutputInvalid(\n'
              '            "constrained editorial generation returned malformed JSON despite Outlines "\n'
              '            f"schema enforcement for task={task}: {exc}",\n'
              '            details={\n'
              '                **plan,\n'
              '                "reason": "invalid_structured_json",\n'
              '                "generated_sha256": generated_sha,\n'
              '                "output_tokens": output_units,\n'
              '                "next_output_budget_tokens": next_budget,\n'
              '                "recovery_action": "REGENERATE",\n'
              '            },\n'
              '        ) from exc\n'
          )
          worker = sub_one(worker, pattern, replacement, "malformed JSON worker mapping")
          wp.write_text(worker, encoding="utf-8")

          pp = Path("src/clipper/providers/modal.py")
          provider = pp.read_text(encoding="utf-8")
          provider = one(
              provider,
              '        if exc.error_type in {"JSONDecodeError", "EditorialOutputTruncated"}:\n',
              '        if exc.error_type in {\n            "JSONDecodeError",\n            "EditorialOutputTruncated",\n            "EditorialOutputInvalid",\n        }:\n',
              "provider output-contract classifier",
          )
          provider = one(
              provider,
              '        seen_recovery_signatures: set[tuple[object, ...]] = set()\n        while True:\n',
              '        seen_recovery_signatures: set[tuple[object, ...]] = set()\n        invalid_output_retries = 0\n        while True:\n',
              "provider retry counter",
          )
          provider = one(
              provider,
              '                if not self._is_output_contract_error(exc):\n                    raise\n\n                next_budget = exc.details.get("next_output_budget_tokens")\n',
              '                if not self._is_output_contract_error(exc):\n                    raise\n\n                if exc.error_type == "EditorialOutputInvalid":\n                    if invalid_output_retries >= 1:\n                        raise\n                    invalid_output_retries += 1\n\n                next_budget = exc.details.get("next_output_budget_tokens")\n',
              "provider bounded malformed-output retry",
          )
          pp.write_text(provider, encoding="utf-8")

          rp = Path("tests/test_modal_editorial_recovery.py")
          recovery = rp.read_text(encoding="utf-8")
          recovery = one(
              recovery,
              '    assert "if not capacity_rejected:" in source\n',
              '    assert "if not capacity_rejected and not output_retry:" in source\n',
              "updated transport guard assertion",
          )
          insertion = "def test_editorial_provider_does_not_retry_unrelated_remote_error() -> None:\n"
          tests = '''def test_editorial_provider_recovers_malformed_structured_json_once() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                              "reason": "invalid_structured_json",
                          },
                      ),
                      _result({"segments": []}),
                  ]
              )
              result = provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert result.value == {"segments": []}
              assert len(provider.requests) == 2
              assert provider.requests[1]["generation_minimum_output_tokens"] == 546
              assert "complete strict JSON object" in provider.requests[1]["generation_recovery_instruction"]


          def test_editorial_provider_fails_closed_after_one_malformed_json_retry() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="first malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                          },
                      ),
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="second malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 546,
                              "next_output_budget_tokens": 1092,
                              "generated_sha256": "invalid-second",
                          },
                      ),
                  ]
              )
              with pytest.raises(ModalRemoteError, match="second malformed constrained JSON"):
                  provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert len(provider.requests) == 2


          '''
          recovery = one(recovery, insertion, tests + insertion, "recovery tests")
          rp.write_text(recovery, encoding="utf-8")

          tp = Path("tests/test_modal_open_models_transport.py")
          transport = tp.read_text(encoding="utf-8")
          transport = one(
              transport,
              '    assert event["application_status"] == "FAILED"\n',
              '    assert event["application_status"] == "OUTPUT_RETRY"\n    assert event["recovery_action"] == "REGENERATE"\n',
              "transport retry assertion",
          )
          transport += '''

          def test_malformed_editorial_json_has_dedicated_bounded_retry_contract() -> None:
              source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
              provider = Path("src/clipper/providers/modal.py").read_text(encoding="utf-8")
              assert "class EditorialOutputInvalid(ValueError):" in source
              assert '"reason": "invalid_structured_json"' in source
              assert "raise EditorialOutputInvalid(" in source
              assert '"EditorialOutputInvalid"' in provider
              assert "invalid_output_retries >= 1" in provider
          '''
          tp.write_text(transport, encoding="utf-8")
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'
          python -m pip install pytest pytest-cov ruff

      - name: Format and verify focused repair
        run: |
          ruff format scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          ruff check scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          ruff format --check scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          pytest -o addopts='' tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py

      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hilp127-editorial-output-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py .github/workflows/hilp127-editorial-output-hotfix.yml
          git diff --cached --check
          git commit -m 'fix: recover malformed editorial structured output'
          git push origin HEAD:feat/contentrewards-campaign-factory
