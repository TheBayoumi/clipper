name: HILP 127 editorial output hotfix

on:
  push:
    branches: [feat/contentrewards-campaign-factory]
    paths: [.github/workflows/hilp127-editorial-output-hotfix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require staging-only drift from failed HILP head
        shell: bash
        run: |
          set -euo pipefail
          base=bedff7998dce3bf8da8a03c27aecaa9ae5810a1a
          test "$(git diff --name-only "$base"..HEAD)" = ".github/workflows/hilp127-editorial-output-hotfix.yml"

      - name: Apply bounded malformed editorial JSON recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              return text.replace(old, new)

          worker_path = Path("scripts/modal_open_models.py")
          worker = worker_path.read_text(encoding="utf-8")
          marker = "\n\ndef _json_text(text: str) -> dict[str, Any]:\n"
          invalid_class = '''

          class EditorialOutputInvalid(ValueError):
              """Editorial generation returned malformed structured output within its budget."""

              def __init__(self, message: str, *, details: dict[str, Any]) -> None:
                  self.details = dict(details)
                  super().__init__(message)
          '''
          worker = replace_once(worker, marker, invalid_class + marker, "insert invalid-output exception")

          worker = replace_once(
              worker,
              '''    capacity_rejected = error_type == "OutOfMemoryError" or "CapacityError" in error_type
              if not capacity_rejected:
                  traceback.print_exception(exc)
          ''',
              '''    capacity_rejected = error_type == "OutOfMemoryError" or "CapacityError" in error_type
              output_retry = error_type in {"EditorialOutputTruncated", "EditorialOutputInvalid"}
              if not capacity_rejected and not output_retry:
                  traceback.print_exception(exc)
          ''',
              "transport output-retry classification",
          )
          worker = replace_once(
              worker,
              '''    application_status = "CAPACITY_REJECTED" if capacity_rejected else "FAILED"
              recovery_action = "REPARTITION" if capacity_rejected else "NONE"
          ''',
              '''    if capacity_rejected:
                  application_status = "CAPACITY_REJECTED"
                  recovery_action = "REPARTITION"
              elif output_retry:
                  application_status = "OUTPUT_RETRY"
                  recovery_action = "REGENERATE"
              else:
                  application_status = "FAILED"
                  recovery_action = "NONE"
          ''',
              "transport status mapping",
          )
          worker = replace_once(
              worker,
              '''        raise RuntimeError(
                  "constrained editorial generation returned invalid JSON despite Outlines "
                  f"schema enforcement for task={task}: {exc}"
              ) from exc
          ''',
              '''        available = int(plan["available_output_tokens"])
              next_budget = min(
                  available,
                  max(output_budget + 1, output_budget * 2),
              )
              raise EditorialOutputInvalid(
                  "constrained editorial generation returned malformed JSON despite Outlines "
                  f"schema enforcement for task={task}: {exc}",
                  details={
                      **plan,
                      "reason": "invalid_structured_json",
                      "generated_sha256": generated_sha,
                      "output_tokens": output_units,
                      "next_output_budget_tokens": next_budget,
                      "recovery_action": "REGENERATE",
                  },
              ) from exc
          ''',
              "worker malformed-JSON mapping",
          )
          worker_path.write_text(worker, encoding="utf-8")

          provider_path = Path("src/clipper/providers/modal.py")
          provider = provider_path.read_text(encoding="utf-8")
          provider = replace_once(
              provider,
              '        if exc.error_type in {"JSONDecodeError", "EditorialOutputTruncated"}:\n',
              '''        if exc.error_type in {
                      "JSONDecodeError",
                      "EditorialOutputTruncated",
                      "EditorialOutputInvalid",
                  }:
          ''',
              "provider invalid-output classifier",
          )
          provider = replace_once(
              provider,
              '''        seen_recovery_signatures: set[tuple[object, ...]] = set()
                  while True:
          ''',
              '''        seen_recovery_signatures: set[tuple[object, ...]] = set()
                  invalid_output_retries = 0
                  while True:
          ''',
              "provider invalid-output retry counter",
          )
          provider = replace_once(
              provider,
              '''                if not self._is_output_contract_error(exc):
                          raise

                      next_budget = exc.details.get("next_output_budget_tokens")
          ''',
              '''                if not self._is_output_contract_error(exc):
                          raise

                      if exc.error_type == "EditorialOutputInvalid":
                          if invalid_output_retries >= 1:
                              raise
                          invalid_output_retries += 1

                      next_budget = exc.details.get("next_output_budget_tokens")
          ''',
              "provider bounded invalid-output retry",
          )
          provider_path.write_text(provider, encoding="utf-8")

          recovery_path = Path("tests/test_modal_editorial_recovery.py")
          recovery = recovery_path.read_text(encoding="utf-8")
          insertion = "def test_editorial_provider_does_not_retry_unrelated_remote_error() -> None:\n"
          if recovery.count(insertion) != 1:
              raise RuntimeError("recovery test insertion marker drifted")
          tests = '''def test_editorial_provider_recovers_malformed_structured_json_once() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                              "reason": "invalid_structured_json",
                          },
                      ),
                      _result({"segments": []}),
                  ]
              )
              result = provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert result.value == {"segments": []}
              assert len(provider.requests) == 2
              assert provider.requests[1]["generation_minimum_output_tokens"] == 546
              assert "complete strict JSON object" in provider.requests[1]["generation_recovery_instruction"]


          def test_editorial_provider_fails_closed_after_one_malformed_json_retry() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="first malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                          },
                      ),
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="second malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 546,
                              "next_output_budget_tokens": 1092,
                              "generated_sha256": "invalid-second",
                          },
                      ),
                  ]
              )
              with pytest.raises(ModalRemoteError, match="second malformed constrained JSON"):
                  provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert len(provider.requests) == 2


          '''
          recovery_path.write_text(recovery.replace(insertion, tests + insertion), encoding="utf-8")

          transport_path = Path("tests/test_modal_open_models_transport.py")
          transport = transport_path.read_text(encoding="utf-8")
          transport = replace_once(
              transport,
              '    assert event["application_status"] == "FAILED"\n',
              '    assert event["application_status"] == "OUTPUT_RETRY"\n    assert event["recovery_action"] == "REGENERATE"\n',
              "transport retry expectation",
          )
          transport += '''

          def test_malformed_editorial_json_has_dedicated_bounded_retry_contract() -> None:
              source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
              provider = Path("src/clipper/providers/modal.py").read_text(encoding="utf-8")
              assert "class EditorialOutputInvalid(ValueError):" in source
              assert '"reason": "invalid_structured_json"' in source
              assert "raise EditorialOutputInvalid(" in source
              assert '"EditorialOutputInvalid"' in provider
              assert "invalid_output_retries >= 1" in provider
          '''
          transport_path.write_text(transport, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'
          python -m pip install pytest pytest-cov ruff

      - name: Format and verify repair
        run: |
          ruff format scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          ruff check scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          ruff format --check scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          pytest -o addopts='' tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py

      - name: Commit clean repair and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hilp127-editorial-output-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py .github/workflows/hilp127-editorial-output-hotfix.yml
          git diff --cached --check
          git commit -m 'fix: recover malformed editorial structured output'
          git push origin HEAD:feat/contentrewards-campaign-factory
