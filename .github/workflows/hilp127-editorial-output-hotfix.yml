name: HILP 127 editorial output hotfix

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/hilp127-editorial-output-hotfix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require staging-only drift from failed HILP head
        shell: bash
        run: |
          set -euo pipefail
          base="bedff7998dce3bf8da8a03c27aecaa9ae5810a1a"
          changed="$(git diff --name-only "$base"..HEAD)"
          test "$changed" = ".github/workflows/hilp127-editorial-output-hotfix.yml"

      - name: Patch malformed editorial JSON recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new)

          worker_path = Path("scripts/modal_open_models.py")
          worker = worker_path.read_text(encoding="utf-8")

          json_marker = "\n\ndef _json_text(text: str) -> dict[str, Any]:\n"
          invalid_class = (
              "\n\nclass EditorialOutputInvalid(ValueError):\n"
              "    \"\"\"Editorial generation returned malformed structured output within its budget.\"\"\"\n\n"
              "    def __init__(self, message: str, *, details: dict[str, Any]) -> None:\n"
              "        self.details = dict(details)\n"
              "        super().__init__(message)\n"
          )
          worker = replace_once(
              worker,
              json_marker,
              invalid_class + json_marker,
              label="insert EditorialOutputInvalid",
          )

          transport_start = worker.index("def _transport_error(\n")
          transport_end = worker.index("\n\ndef _diarization_audio_source", transport_start)
          transport = worker[transport_start:transport_end]
          transport = replace_once(
              transport,
              (
                  '    capacity_rejected = error_type == "OutOfMemoryError" or "CapacityError" in error_type\n'
                  "    if not capacity_rejected:\n"
                  "        traceback.print_exception(exc)\n"
              ),
              (
                  '    capacity_rejected = error_type == "OutOfMemoryError" or "CapacityError" in error_type\n'
                  '    output_retry = error_type in {"EditorialOutputTruncated", "EditorialOutputInvalid"}\n'
                  "    if not capacity_rejected and not output_retry:\n"
                  "        traceback.print_exception(exc)\n"
              ),
              label="transport output retry classification",
          )
          transport = replace_once(
              transport,
              (
                  '    application_status = "CAPACITY_REJECTED" if capacity_rejected else "FAILED"\n'
                  '    recovery_action = "REPARTITION" if capacity_rejected else "NONE"\n'
              ),
              (
                  "    if capacity_rejected:\n"
                  '        application_status = "CAPACITY_REJECTED"\n'
                  '        recovery_action = "REPARTITION"\n'
                  "    elif output_retry:\n"
                  '        application_status = "OUTPUT_RETRY"\n'
                  '        recovery_action = "REGENERATE"\n'
                  "    else:\n"
                  '        application_status = "FAILED"\n'
                  '        recovery_action = "NONE"\n'
              ),
              label="transport application status",
          )
          worker = worker[:transport_start] + transport + worker[transport_end:]

          infer_start = worker.index("def _editorial_infer(\n")
          infer_end = worker.index("\n\ndef _editorial_deadline_probe", infer_start)
          infer = worker[infer_start:infer_end]
          old_invalid = (
              "        raise RuntimeError(\n"
              '            "constrained editorial generation returned invalid JSON despite Outlines "\n'
              '            f"schema enforcement for task={task}: {exc}"\n'
              "        ) from exc\n"
          )
          new_invalid = (
              '        available = int(plan["available_output_tokens"])\n'
              "        next_budget = min(\n"
              "            available,\n"
              "            max(output_budget + 1, output_budget * 2),\n"
              "        )\n"
              "        raise EditorialOutputInvalid(\n"
              '            "constrained editorial generation returned malformed JSON despite Outlines "\n'
              '            f"schema enforcement for task={task}: {exc}",\n'
              "            details={\n"
              "                **plan,\n"
              '                "reason": "invalid_structured_json",\n'
              '                "generated_sha256": generated_sha,\n'
              '                "output_tokens": output_units,\n'
              '                "next_output_budget_tokens": next_budget,\n'
              '                "recovery_action": "REGENERATE",\n'
              "            },\n"
              "        ) from exc\n"
          )
          infer = replace_once(
              infer,
              old_invalid,
              new_invalid,
              label="editorial malformed JSON mapping",
          )
          worker = worker[:infer_start] + infer + worker[infer_end:]
          worker_path.write_text(worker, encoding="utf-8")

          provider_path = Path("src/clipper/providers/modal.py")
          provider = provider_path.read_text(encoding="utf-8")
          complete_start = provider.index("    def complete_json(\n")
          complete_end = provider.index("\n\n\nclass ModalVisionProvider", complete_start)
          complete = provider[complete_start:complete_end]

          provider = replace_once(
              provider,
              '        if exc.error_type in {"JSONDecodeError", "EditorialOutputTruncated"}:\n',
              (
                  "        if exc.error_type in {\n"
                  '            "JSONDecodeError",\n'
                  '            "EditorialOutputTruncated",\n'
                  '            "EditorialOutputInvalid",\n'
                  "        }:\n"
              ),
              label="provider output contract classifier",
          )

          complete = provider[provider.index("    def complete_json(\n"):provider.index("\n\n\nclass ModalVisionProvider", provider.index("    def complete_json(\n"))]
          complete = replace_once(
              complete,
              "        seen_recovery_signatures: set[tuple[object, ...]] = set()\n        while True:\n",
              (
                  "        seen_recovery_signatures: set[tuple[object, ...]] = set()\n"
                  "        invalid_output_retries = 0\n"
                  "        while True:\n"
              ),
              label="bounded invalid output retry counter",
          )
          complete = replace_once(
              complete,
              (
                  "                if not self._is_output_contract_error(exc):\n"
                  "                    raise\n\n"
                  '                next_budget = exc.details.get("next_output_budget_tokens")\n'
              ),
              (
                  "                if not self._is_output_contract_error(exc):\n"
                  "                    raise\n\n"
                  '                if exc.error_type == "EditorialOutputInvalid":\n'
                  "                    if invalid_output_retries >= 1:\n"
                  "                        raise\n"
                  "                    invalid_output_retries += 1\n\n"
                  '                next_budget = exc.details.get("next_output_budget_tokens")\n'
              ),
              label="bounded malformed JSON retry",
          )
          complete = replace_once(
              complete,
              (
                  "                request = {\n"
                  '                    "task": task,\n'
                  '                    "payload": payload,\n'
                  '                    "generation_minimum_output_tokens": next_budget,\n'
                  '                    "generation_recovery_instruction": (\n'
                  '                        "Regenerate the complete strict JSON object from the original source "\n'
                  '                        "evidence using the expanded runtime-derived output capacity. Do not add "\n'
                  '                        "Markdown or prose outside the object."\n'
                  "                    ),\n"
                  "                }\n"
              ),
              (
                  "                recovery_instruction = (\n"
                  '                    "The prior constrained generation returned malformed JSON. Regenerate the "\n'
                  '                    "complete strict JSON object from the original source evidence using the "\n'
                  '                    "expanded runtime-derived output capacity. Do not add Markdown or prose "\n'
                  '                    "outside the object."\n'
                  '                    if exc.error_type == "EditorialOutputInvalid"\n'
                  "                    else (\n"
                  '                        "Regenerate the complete strict JSON object from the original source "\n'
                  '                        "evidence using the expanded runtime-derived output capacity. Do not add "\n'
                  '                        "Markdown or prose outside the object."\n'
                  "                    )\n"
                  "                )\n"
                  "                request = {\n"
                  '                    "task": task,\n'
                  '                    "payload": payload,\n'
                  '                    "generation_minimum_output_tokens": next_budget,\n'
                  '                    "generation_recovery_instruction": recovery_instruction,\n'
                  "                }\n"
              ),
              label="malformed JSON recovery instruction",
          )
          new_complete_start = provider.index("    def complete_json(\n")
          new_complete_end = provider.index("\n\n\nclass ModalVisionProvider", new_complete_start)
          provider = provider[:new_complete_start] + complete + provider[new_complete_end:]
          provider_path.write_text(provider, encoding="utf-8")

          recovery_path = Path("tests/test_modal_editorial_recovery.py")
          recovery = recovery_path.read_text(encoding="utf-8")
          marker = "def test_editorial_provider_does_not_retry_unrelated_remote_error() -> None:\n"
          if recovery.count(marker) != 1:
              raise RuntimeError("editorial recovery insertion marker drifted")
          added = '''def test_editorial_provider_recovers_malformed_structured_json_once() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                              "reason": "invalid_structured_json",
                          },
                      ),
                      _result({"segments": []}),
                  ]
              )
              result = provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert result.value == {"segments": []}
              assert len(provider.requests) == 2
              assert provider.requests[1]["generation_minimum_output_tokens"] == 546
              assert "malformed JSON" in provider.requests[1]["generation_recovery_instruction"]


          def test_editorial_provider_fails_closed_after_one_malformed_json_retry() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="first malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 273,
                              "next_output_budget_tokens": 546,
                              "generated_sha256": "invalid-first",
                          },
                      ),
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputInvalid",
                          message="second malformed constrained JSON",
                          details={
                              "generation_budget_tokens": 546,
                              "next_output_budget_tokens": 1092,
                              "generated_sha256": "invalid-second",
                          },
                      ),
                  ]
              )
              with pytest.raises(ModalRemoteError, match="second malformed constrained JSON"):
                  provider.complete_json(task="source_hazards:range", payload={"words": []})
              assert len(provider.requests) == 2


          '''
          recovery_path.write_text(recovery.replace(marker, added + marker), encoding="utf-8")

          transport_path = Path("tests/test_modal_open_models_transport.py")
          transport_test = transport_path.read_text(encoding="utf-8")
          transport_test = replace_once(
              transport_test,
              '    assert event["application_status"] == "FAILED"\n',
              (
                  '    assert event["application_status"] == "OUTPUT_RETRY"\n'
                  '    assert event["recovery_action"] == "REGENERATE"\n'
              ),
              label="transport output retry expectation",
          )
          static_test = '''\n\ndef test_malformed_editorial_json_has_dedicated_bounded_retry_contract() -> None:
              source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
              provider = Path("src/clipper/providers/modal.py").read_text(encoding="utf-8")
              assert "class EditorialOutputInvalid(ValueError):" in source
              assert '"reason": "invalid_structured_json"' in source
              assert "raise EditorialOutputInvalid(" in source
              assert '"EditorialOutputInvalid"' in provider
              assert "invalid_output_retries >= 1" in provider
          '''
          if "def test_malformed_editorial_json_has_dedicated_bounded_retry_contract" in transport_test:
              raise RuntimeError("transport regression already present")
          transport_path.write_text(transport_test + static_test, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'
          python -m pip install pytest pytest-cov ruff

      - name: Format and verify repair
        run: |
          ruff format scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          ruff check scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          ruff format --check scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py
          pytest -o addopts='' tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py

      - name: Commit clean repair and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hilp127-editorial-output-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py tests/test_modal_open_models_transport.py .github/workflows/hilp127-editorial-output-hotfix.yml
          git diff --cached --check
          git commit -m "fix: recover malformed editorial structured output"
          git push origin HEAD:feat/contentrewards-campaign-factory
