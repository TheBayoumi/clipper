name: Ruff one-shot autofix

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/ruff-autofix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned project Ruff
        run: python -m pip install 'ruff>=0.15.22,<1'
      - name: Apply canonical Ruff formatting
        run: ruff format scripts/modal_open_models.py
      - name: Verify lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Commit formatter-only change
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_open_models.py
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:feat/word-reveal-face-tracking
