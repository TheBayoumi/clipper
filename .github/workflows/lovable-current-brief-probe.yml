name: Lovable current brief probe

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/lovable-current-brief-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current Lovable Notion brief
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.request
          from pathlib import Path

          url = "https://mediamaxxing.notion.site/lovable-clipping"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              body = response.read().decode("utf-8", "replace")
              final_url = response.geturl()
              status = response.status
          Path("current-lovable-brief.html").write_text(body, encoding="utf-8")
          decoded = html.unescape(body).replace("\\u002F", "/").replace("\\/", "/")
          page_ids = list(
              dict.fromkeys(
                  re.findall(
                      r'([0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12})',
                      decoded,
                  )
              )
          )
          keywords = (
              "second",
              "seconds",
              "duration",
              "LovablePartner",
              "Tier 1",
              "comment",
              "Anton",
              "visible",
              "submit",
              "10 min",
              "10 minute",
              "account",
          )
          fragments = []
          for keyword in keywords:
              for match in re.finditer(re.escape(keyword), decoded, flags=re.IGNORECASE):
                  start = max(0, match.start() - 350)
                  end = min(len(decoded), match.end() + 700)
                  fragment = re.sub(r"\s+", " ", decoded[start:end]).strip()
                  if fragment and fragment not in fragments:
                      fragments.append(fragment[:1600])
                  if len(fragments) >= 160:
                      break
          result = {
              "status": status,
              "requested_url": url,
              "final_url": final_url,
              "bytes": len(body.encode("utf-8")),
              "page_id_candidates": page_ids[:50],
              "fragments": fragments,
          }
          Path("current-lovable-brief.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lovable-current-brief
          path: |
            current-lovable-brief.json
            current-lovable-brief.html
          if-no-files-found: error
