name: Repair V10 editorial JSON recovery

on:
  push:
    branches: [feat/word-reveal-face-tracking]
    paths: [.github/workflows/repair-v10-editorial-json-recovery.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply bounded JSON recovery repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          modal_path = Path("src/clipper/providers/modal.py")
          modal_source = modal_path.read_text(encoding="utf-8")
          needle = '        if exc.error_type == "JSONDecodeError":\n            return True'
          replacement = (
              '        if exc.error_type in {"JSONDecodeError", "EditorialOutputTruncated"}:\n'
              '            return True'
          )
          if needle not in modal_source:
              raise SystemExit("ModalEditorialProvider recovery matcher not found")
          modal_path.write_text(modal_source.replace(needle, replacement, 1), encoding="utf-8")

          script_path = Path("scripts/modal_open_models.py")
          source = script_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              if old not in source:
                  raise SystemExit(f"{label} not found")
              source = source.replace(old, new, 1)

          replace_once(
              'def _transport_error(exc: Exception) -> dict[str, Any]:\n'
              '    return {"error": {"type": type(exc).__name__, "message": str(exc)}}\n',
              'def _transport_error(exc: Exception, *, context: str | None = None) -> dict[str, Any]:\n'
              '    message = str(exc)\n'
              '    if context:\n'
              '        message = f"{context}: {message}"\n'
              '    return {"error": {"type": type(exc).__name__, "message": message}}\n',
              "transport helper",
          )
          replace_once(
              'def _json_text(text: str) -> dict[str, Any]:\n'
              '    value = json.loads(text.strip())\n'
              '    if not isinstance(value, dict):\n'
              '        raise ValueError("model output must be a JSON object")\n'
              '    return value\n',
              'class EditorialOutputTruncated(ValueError):\n'
              '    """Editorial generation exhausted its output budget before valid JSON completed."""\n\n\n'
              'def _json_text(text: str) -> dict[str, Any]:\n'
              '    value = json.loads(text.strip())\n'
              '    if not isinstance(value, dict):\n'
              '        raise ValueError("model output must be a JSON object")\n'
              '    return value\n',
              "JSON parser helper",
          )
          replace_once(
              'def _editorial_output_budget(payload: dict[str, Any]) -> int:\n'
              '    task = str(payload.get("task") or "")\n'
              '    if task == "episode_editorial_profile" or task == "global_concept_comparison":\n'
              '        return 768\n'
              '    if task.startswith("story_moments:"):\n'
              '        return 1024\n'
              '    if task.startswith("hook_variants:"):\n'
              '        return 1024\n'
              '    return 1536\n',
              'def _editorial_recovery_attempt(payload: dict[str, Any]) -> int:\n'
              '    raw = payload.get("generation_recovery_attempt")\n'
              '    try:\n'
              '        attempt = int(raw) if raw is not None else 1\n'
              '    except (TypeError, ValueError):\n'
              '        attempt = 1\n'
              '    return max(1, min(attempt, 3))\n\n\n'
              'def _editorial_output_budget(payload: dict[str, Any]) -> int:\n'
              '    task = str(payload.get("task") or "")\n'
              '    if task == "episode_editorial_profile" or task == "global_concept_comparison":\n'
              '        base_budget = 1024\n'
              '    elif task.startswith("story_moments:") or task.startswith("hook_variants:"):\n'
              '        base_budget = 1536\n'
              '    else:\n'
              '        base_budget = 2048\n'
              '    return min(4096, base_budget * _editorial_recovery_attempt(payload))\n',
              "editorial budget helper",
          )
          replace_once(
              'def editorial(payload: dict[str, Any]) -> dict[str, Any]:\n'
              '    global _editorial_model, _editorial_tokenizer\n'
              '    try:\n',
              'def editorial(payload: dict[str, Any]) -> dict[str, Any]:\n'
              '    global _editorial_model, _editorial_tokenizer\n'
              '    task = str(payload.get("task") or "")\n'
              '    recovery_attempt = _editorial_recovery_attempt(payload)\n'
              '    try:\n',
              "editorial function start",
          )
          replace_once(
              '        task = str(payload.get("task") or "")\n'
              '        messages = [\n'
              '            {\n'
              '                "role": "system",\n'
              '                "content": (\n'
              '                    "You are a source-grounded podcast editor. Never invent spoken words or IDs. "\n'
              '                    + _editorial_contract(task)\n'
              '                ),\n'
              '            },\n',
              '        system_content = (\n'
              '            "You are a source-grounded podcast editor. Never invent spoken words or IDs. "\n'
              '            + _editorial_contract(task)\n'
              '        )\n'
              '        if recovery_attempt > 1:\n'
              '            system_content += (\n'
              '                " This is a JSON recovery generation after an invalid or truncated response. "\n'
              '                "Return the complete JSON object and close every string, array, and object. "\n'
              '                "If needed, return fewer valid items with shorter prose rather than truncating."\n'
              '            )\n'
              '        messages = [\n'
              '            {"role": "system", "content": system_content},\n',
              "editorial system message",
          )
          replace_once(
              '        output = _editorial_model.generate(\n'
              '            **inputs,\n'
              '            max_new_tokens=_editorial_output_budget(payload),\n'
              '            do_sample=False,\n'
              '            use_cache=True,\n'
              '        )\n'
              '        generated = output[0][inputs["input_ids"].shape[-1] :]\n'
              '        text = _editorial_tokenizer.decode(generated, skip_special_tokens=True)\n'
              '        value = _json_text(text)\n',
              '        output_budget = _editorial_output_budget(payload)\n'
              '        output = _editorial_model.generate(\n'
              '            **inputs,\n'
              '            max_new_tokens=output_budget,\n'
              '            do_sample=False,\n'
              '            use_cache=True,\n'
              '        )\n'
              '        generated = output[0][inputs["input_ids"].shape[-1] :]\n'
              '        text = _editorial_tokenizer.decode(generated, skip_special_tokens=True)\n'
              '        try:\n'
              '            value = _json_text(text)\n'
              '        except json.JSONDecodeError as exc:\n'
              '            if int(generated.numel()) >= output_budget:\n'
              '                raise EditorialOutputTruncated(\n'
              '                    f"task={task} attempt={recovery_attempt} exhausted "\n'
              '                    f"max_new_tokens={output_budget}: {exc}"\n'
              '                ) from exc\n'
              '            raise\n',
              "editorial generation",
          )
          replace_once(
              '        return _transport_error(exc)\n\n\ndef _vision_infer',
              '        return _transport_error(\n'
              '            exc, context=f"task={task or \'<missing>\'} attempt={recovery_attempt}"\n'
              '        )\n\n\ndef _vision_infer',
              "editorial error context",
          )
          script_path.write_text(source, encoding="utf-8")
          PY

          cat > tests/test_modal_editorial_recovery.py <<'PY'
          from pathlib import Path
          from typing import Any

          from clipper.providers.base import InferenceUsage, ModelIdentity, ProviderResult
          from clipper.providers.modal import ModalEditorialProvider, ModalRemoteError


          class SequenceEditorialProvider(ModalEditorialProvider):
              def __init__(self, outcomes: list[object]) -> None:
                  identity = ModelIdentity("test/editorial", "rev", "none", "test", "prompt", "schema")
                  super().__init__(app_name="test", function_name="editorial", identity=identity)
                  self.outcomes = outcomes
                  self.requests: list[dict[str, Any]] = []

              def invoke(self, payload: dict[str, Any]) -> ProviderResult[dict[str, Any]]:
                  self.requests.append(payload)
                  outcome = self.outcomes.pop(0)
                  if isinstance(outcome, Exception):
                      raise outcome
                  assert isinstance(outcome, ProviderResult)
                  return outcome


          def _success() -> ProviderResult[dict[str, Any]]:
              identity = ModelIdentity("test/editorial", "rev", "none", "test", "prompt", "schema")
              return ProviderResult(
                  {"moments": []},
                  identity,
                  InferenceUsage(provider="modal", started_at="now", duration_seconds=0.0),
              )


          def test_editorial_provider_recovers_from_truncation_then_json_error() -> None:
              provider = SequenceEditorialProvider(
                  [
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="EditorialOutputTruncated",
                          message="task=story_moments:21 attempt=1 exhausted max_new_tokens=1536",
                      ),
                      ModalRemoteError(
                          function_name="editorial",
                          error_type="JSONDecodeError",
                          message="task=story_moments:21 attempt=2 unterminated string",
                      ),
                      _success(),
                  ]
              )
              result = provider.complete_json(task="story_moments:21", payload={"words": []})
              assert result.value == {"moments": []}
              assert [item.get("generation_recovery_attempt") for item in provider.requests] == [None, 2, 3]


          def test_modal_editorial_runtime_has_bounded_expanding_recovery_budget() -> None:
              source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
              assert "class EditorialOutputTruncated(ValueError)" in source
              assert "base_budget * _editorial_recovery_attempt(payload)" in source
              assert "return min(4096," in source
              assert "return fewer valid items with shorter prose rather than truncating" in source
              assert "context=f\"task={task or '<missing>'} attempt={recovery_attempt}\"" in source
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,modal]'
      - name: Full quality gate
        run: |
          ruff format .
          ruff check .
          mypy
          pytest
      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'clipper-v10-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/modal_open_models.py src/clipper/providers/modal.py tests/test_modal_editorial_recovery.py
          git diff --cached --quiet && { echo 'No repair changes to commit'; exit 1; }
          git commit -m 'fix: recover truncated editorial JSON generations'
          git push origin HEAD:feat/word-reveal-face-tracking
