name: Exact phase B coverage formatting

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/format-phase-b-coverage.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply repository Ruff formatter
        run: |
          python -m pip install "ruff>=0.15.22,<1"
          ruff format tests/test_phase_b_contract_edges.py tests/test_runtime_contract_edges.py
          ruff format --check tests/test_phase_b_contract_edges.py tests/test_runtime_contract_edges.py
      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_phase_b_contract_edges.py tests/test_runtime_contract_edges.py
          git diff --cached --check
          git diff --cached --exit-code && exit 0 || true
          git commit -m "style: format phase B coverage regressions"
          git push origin HEAD:feat/word-reveal-face-tracking
