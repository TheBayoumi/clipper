name: Inspect V10 persisted evidence

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/inspect-v10-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal client
        run: python -m pip install 'modal>=1.5.2,<2'
      - name: List persisted V10 artifacts
        run: |
          set -euo pipefail
          modal volume ls --json clipper-v10-artifacts / > /tmp/v10-volume.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/v10-volume.json').read_text())
          print(json.dumps(data, indent=2)[:120000])
          PY
