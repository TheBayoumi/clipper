name: Inspect V10 persisted evidence

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/inspect-v10-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      RUN_DIR: reach-double-coverage-dedicated-1f1adbf3-20260811T101251Z
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Modal client
        run: python -m pip install 'modal>=1.5.2,<2'
      - name: Inspect cached editorial outputs
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          import modal

          volume = modal.Volume.from_name("clipper-v10-artifacts")
          entries = [
              entry
              for entry in volume.listdir("/_cache", recursive=True)
              if entry.path.endswith("open-model-output.json")
          ]
          entries.sort(key=lambda entry: entry.mtime, reverse=True)
          print(f"open-model cache files: {len(entries)}")
          for entry in entries[:24]:
              payload = b"".join(volume.read_file(entry.path)).decode("utf-8")
              stamp = datetime.fromtimestamp(entry.mtime, tz=UTC).isoformat()
              print("===", entry.path, stamp, "===")
              print(payload[:16000])

          print("=== VIDEO WORK TREE ===")
          prefix = f"{__import__('os').environ['RUN_DIR']}/work/2Y4LP85PTak"
          for entry in volume.listdir(prefix, recursive=True):
              print(entry.path, entry.size, entry.mtime)
          PY
