name: Temporary finalizer meta-fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair-finalizer:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - name: Repair finalizer verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temporary-mypy-contract-cleanup.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Verify exact cleanup
                  run: |
                    ruff format src/clipper/youtube.py src/clipper/cli.py src/clipper/hilp.py src/clipper/quality_batch.py src/clipper/pipeline.py
                    ruff check .
          '''.replace('          ', '')
          new = '''      - name: Verify exact cleanup
                  run: |
                    python -c 'from pathlib import Path; p=Path("src/clipper/pipeline.py"); t=p.read_text(encoding="utf-8"); n=t.count("quality: BatchQualityPlanningResult,"); assert n == 2, n; p.write_text(t.replace("quality: BatchQualityPlanningResult,", "quality: QualityBatchResult,"), encoding="utf-8")'
                    ruff check --fix src/clipper/youtube.py
                    ruff format src/clipper/youtube.py src/clipper/cli.py src/clipper/hilp.py src/clipper/quality_batch.py src/clipper/pipeline.py
                    ruff check .
          '''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('finalizer verification block guard failed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-finalizer-meta-fix.yml
      - name: Commit repaired finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: repair autonomous contract finalizer"
          git push origin HEAD:feat/word-reveal-face-tracking
