name: Repair V10 provenance propagation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/repair-v10-git-sha.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Add git to the production runner image
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/modal_v10_cycle.py")
          source = path.read_text(encoding="utf-8")
          old = 'runner_image = (\n    modal.Image.from_dockerfile("Dockerfile")\n    .entrypoint([])\n    .uv_pip_install('
          new = 'runner_image = (\n    modal.Image.from_dockerfile("Dockerfile")\n    .entrypoint([])\n    .apt_install("git")\n    .uv_pip_install('
          if old not in source:
              raise SystemExit("runner image insertion point not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev,modal]'
      - name: Guard provenance runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/modal_v10_cycle.py").read_text(encoding="utf-8")
          start = source.index("runner_image = (")
          end = source.index("\n\nnemo_image = (", start)
          runner = source[start:end]
          assert '.apt_install("git")' in runner
          PY
      - name: Quality gate
        run: |
          ruff check scripts/modal_v10_cycle.py
          ruff format --check scripts/modal_v10_cycle.py
          pytest --no-cov -q tests/test_pipeline.py tests/test_hilp.py
      - name: Commit guarded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/modal_v10_cycle.py
          git commit -m 'fix: include git in V10 production runner image'
          git push origin HEAD:feat/word-reveal-face-tracking
