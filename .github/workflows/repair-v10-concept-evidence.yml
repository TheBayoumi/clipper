name: Repair V10 grounded concept evidence

on:
  push:
    branches: [feat/word-reveal-face-tracking]
    paths:
      - ".github/workflows/repair-v10-concept-evidence.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply provenance-based StoryMoment alias repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/clipper/autonomous_editor.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    def _profile_evidence(self, timeline: CanonicalTimeline) -> list[dict[str, object]]:\n'''
          helper = '''    @staticmethod\n    def _resolve_story_moment_id(\n        requested_id: str,\n        concept: GroundedClipConcept,\n        grounded_moments: dict[str, GroundedStoryMoment],\n    ) -> str | None:\n        \"\"\"Resolve model-local moment aliases using grounded source-word evidence.\n\n        Story-moment generation is chunked, so local IDs such as ``m1`` may be reused\n        by several chunks. Exact namespaced IDs remain authoritative. A local alias is\n        accepted only when it has one suffix match, or when the concept's grounded\n        source words select a unique best-overlap suffix match. Ties remain rejected.\n        \"\"\"\n        if requested_id in grounded_moments:\n            return requested_id\n        candidates = sorted(\n            moment_id\n            for moment_id in grounded_moments\n            if moment_id.endswith(f\":{requested_id}\")\n        )\n        if len(candidates) == 1:\n            return candidates[0]\n        if not candidates:\n            return None\n\n        concept_words = set(concept.supporting_word_ids)\n        scored: list[tuple[tuple[float, float, int], str]] = []\n        for candidate_id in candidates:\n            moment_words = set(grounded_moments[candidate_id].supporting_word_ids)\n            overlap = len(concept_words & moment_words)\n            if overlap == 0:\n                continue\n            score = (\n                overlap / len(moment_words),\n                overlap / len(concept_words),\n                overlap,\n            )\n            scored.append((score, candidate_id))\n        if not scored:\n            return None\n        best_score = max(score for score, _ in scored)\n        winners = [candidate_id for score, candidate_id in scored if score == best_score]\n        return winners[0] if len(winners) == 1 else None\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("profile evidence anchor missing")
              text = text.replace(anchor, helper + anchor, 1)

          old = '''                for moment_id in concept.story_moment_ids:\n                    if moment_id in known_moments:\n                        resolved_moment_ids.append(moment_id)\n                        continue\n                    candidates = sorted(\n                        known_id for known_id in known_moments if known_id.endswith(f\":{moment_id}\")\n                    )\n                    if len(candidates) == 1:\n                        resolved_moment_ids.append(candidates[0])\n                    else:\n                        unknown.add(moment_id)\n'''
          new = '''                for moment_id in concept.story_moment_ids:\n                    resolved = self._resolve_story_moment_id(\n                        moment_id, concept, grounded_moments\n                    )\n                    if resolved is None:\n                        unknown.add(moment_id)\n                    elif resolved not in resolved_moment_ids:\n                        resolved_moment_ids.append(resolved)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("concept alias block missing")
          path.write_text(text, encoding="utf-8")

          tests = Path("tests/test_open_models.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_story_moment_alias_disambiguates_with_grounded_word_overlap() -> None:"
          if marker not in test_text:
              test_text += '''\n\ndef test_story_moment_alias_disambiguates_with_grounded_word_overlap() -> None:\n    timeline = CanonicalTimeline(\n        \"video\",\n        \"hash\",\n        tuple(\n            CanonicalWord(\n                f\"w{i}\",\n                f\"token{i}\",\n                float(i),\n                float(i) + 0.5,\n                None,\n                0.99,\n                \"aligned\",\n                \"test\",\n            )\n            for i in range(1, 9)\n        ),\n    )\n    moments = {\n        \"chunk-0:m1\": GroundedStoryMoment(\n            \"chunk-0:m1\",\n            (\"w1\", \"w2\", \"w3\"),\n            \"first\",\n            \"story\",\n            \"\",\n            \"\",\n            \"grounded\",\n            0.9,\n        ),\n        \"chunk-1:m1\": GroundedStoryMoment(\n            \"chunk-1:m1\",\n            (\"w5\", \"w6\", \"w7\"),\n            \"second\",\n            \"story\",\n            \"\",\n            \"\",\n            \"grounded\",\n            0.9,\n        ),\n    }\n    concept = GroundedClipConcept(\n        \"c1\",\n        (\"m1\",),\n        (\"w5\", \"w6\", \"w7\", \"w8\"),\n        \"second concept\",\n        \"\",\n        \"story\",\n        20.0,\n        (),\n        0.9,\n    )\n    resolved = AutonomousEditorialPlanner._resolve_story_moment_id(\n        \"m1\", concept, moments\n    )\n    assert resolved == \"chunk-1:m1\"\n    assert (\n        AutonomousEditorialPlanner._resolve_story_moment_id(\n            \"chunk-0:m1\", concept, moments\n        )\n        == \"chunk-0:m1\"\n    )\n\n\ndef test_story_moment_alias_keeps_true_overlap_ties_ambiguous() -> None:\n    moments = {\n        \"chunk-0:m1\": GroundedStoryMoment(\n            \"chunk-0:m1\",\n            (\"w1\", \"w2\"),\n            \"first\",\n            \"story\",\n            \"\",\n            \"\",\n            \"grounded\",\n            0.9,\n        ),\n        \"chunk-1:m1\": GroundedStoryMoment(\n            \"chunk-1:m1\",\n            (\"w3\", \"w4\"),\n            \"second\",\n            \"story\",\n            \"\",\n            \"\",\n            \"grounded\",\n            0.9,\n        ),\n    }\n    concept = GroundedClipConcept(\n        \"c1\",\n        (\"m1\",),\n        (\"w1\", \"w3\"),\n        \"ambiguous concept\",\n        \"\",\n        \"story\",\n        20.0,\n        (),\n        0.9,\n    )\n    assert AutonomousEditorialPlanner._resolve_story_moment_id(\n        \"m1\", concept, moments\n    ) is None\n'''
              tests.write_text(test_text, encoding="utf-8")
          PY
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format and validate complete source tree
        run: |
          ruff format src/clipper/autonomous_editor.py tests/test_open_models.py
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit guarded repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clipper/autonomous_editor.py tests/test_open_models.py
          if git diff --cached --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git commit -m "fix: disambiguate chunk-local story moments by evidence"
          git push origin HEAD:feat/word-reveal-face-tracking
