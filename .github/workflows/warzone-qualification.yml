name: Warzone source and montage qualification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/warzone-operator-toggle
  pull_request:

concurrency:
  group: warzone-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify-official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Clipper and public-review discovery runtime
        run: |
          set -euo pipefail
          python -m pip install -e ".[mw4]"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Discover official originals without credentials
        id: source
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle discover --output source_catalog.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          catalog = json.loads(Path("source_catalog.json").read_text())
          profile = json.loads(
              Path("src/clipper_engine/profiles/warzone-operator-toggle.json").read_text()
          )
          calibrated = profile["editorial"]["verified_visual_states"]
          matched = [
              entry for entry in catalog["sources"]
              if (entry.get("file_name") or entry["title"]) in calibrated
              and entry["derivative_type"] == "source"
          ]
          if len(matched) != 1:
              raise RuntimeError(
                  "expected exactly one calibrated official original; "
                  f"found {len(matched)} in public MediaSilo review"
              )
          original = matched[0]
          name = str(original.get("file_name") or original["title"])
          suffix = Path(name).suffix.lower()
          if suffix not in {".mp4", ".mov", ".mxf", ".m4v"}:
              raise RuntimeError(f"unsupported official source extension: {name}")
          print(f"source_key={original['source_key']}")
          print(f"source_file=source/{original['source_key']}{suffix}")
          PY

      - name: Acquire and certify the original from public MediaSilo review
        env:
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle acquire \
            --source-key "$SOURCE_KEY" --output-dir source

      - name: Plan certified-source kinetic Impact Cut
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode impact_cut \
            --approved-text-index 1 \
            --output plan_impact_cut.json

      - name: Render source-native kinetic Impact Cut through Clipper
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_impact_cut.json \
            --output-dir delivery_impact_cut

      - name: Qualify Impact Cut frame grid clarity effects and encoded storyboard
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_impact_cut/render_manifest.json \
            --output delivery_impact_cut/acceptance.json
          python - <<'CHECK'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_impact_cut/render_manifest.json").read_text())
          accepted = json.loads(Path("delivery_impact_cut/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          portrait = manifest["portrait"]
          impact = portrait["impact_cut"]
          expected_windows = [
              {"start_frame": 20, "frames": 16},
              {"start_frame": 55, "frames": 10},
              {"start_frame": 108, "frames": 14},
          ]
          assert accepted["status"] == "PASS", accepted
          assert edit["comparison_mode"] == "impact_cut"
          assert edit["hook"] == {"start_frame": 144, "frames": 15, "state": "after"}
          assert edit["source_windows"] == expected_windows
          assert [shot["frames"] for shot in edit["ending_shots"]] == [3, 3, 3, 11]
          assert edit["output_frames"] == 165
          stage = manifest["staging"]["source_excerpt"]
          assert stage["windows"] == expected_windows
          assert stage["frame_count"] == 40 and stage["source_to_piece_hashes_exact"]
          assert impact["mode"] == "impact_cut"
          assert impact["frame_count"] == 165
          assert impact["source_only"] is True
          assert impact["source_frame_grid_exact"] is True
          assert impact["ai_enhancement"] is False
          assert impact["visual_size"] == [1080, 1152]
          assert impact["bottom_matte_height"] == 112
          assert impact["minimum_source_crop_width_px"] >= 940
          assert impact["storyboard_frames"] == [0, 15, 31, 79, 111, 164]
          assert all(manifest["qa"]["checks"].values()), manifest["qa"]["checks"]
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]["checks"]
          assert all(v > 2.5 for v in portrait["qa"]["impact_cut_pixel_differences"])
          assert portrait["storyboard"]["frames"] == [0, 15, 31, 79, 111, 164]
          assert Path(portrait["storyboard"]["file"]).is_file()
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6
          print("CERTIFIED IMPACT CUT:", portrait["file"])
          CHECK

      - name: Publish distinct high-clarity Impact Cut video storyboard and QA
        uses: actions/upload-artifact@v4
        with:
          name: warzone-impact-cut-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_impact_cut.json
            source/*.source_qa.json
            delivery_impact_cut/*.json
            delivery_impact_cut/*.mp4
            delivery_impact_cut/*.jpg

      - name: Plan certified-source result-first Rebound
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode rebound \
            --approved-text-index 1 \
            --output plan_rebound.json

      - name: Render source-native live-detail Rebound through Clipper
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_rebound.json \
            --output-dir delivery_rebound

      - name: Qualify Rebound source windows large moving crop and encoded transitions
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_rebound/render_manifest.json \
            --output delivery_rebound/acceptance.json
          python - <<'CHECK'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_rebound/render_manifest.json").read_text())
          accepted = json.loads(Path("delivery_rebound/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          stage = manifest["staging"]["source_excerpt"]
          portrait = manifest["portrait"]
          panels = portrait["rebound"]
          expected_windows = [
              {"start_frame": 20, "frames": 16},
              {"start_frame": 55, "frames": 10},
              {"start_frame": 108, "frames": 14},
          ]
          assert accepted["status"] == "PASS", accepted
          assert edit["comparison_mode"] == "rebound"
          assert edit["hook"] == {"start_frame": 144, "frames": 15, "state": "after"}
          assert edit["source_windows"] == expected_windows
          assert edit["full_source_frames"] == 178
          assert edit["output_frames"] == 165
          assert stage["windows"] == expected_windows
          assert stage["frame_count"] == 40 and stage["source_to_piece_hashes_exact"]
          assert panels["phase_frames"] == [55, 75, 91, 121, 145]
          assert panels["live_detail_frames"] == 75
          assert panels["source_only"] and panels["text_synced"]
          assert all(manifest["qa"]["checks"].values()), manifest["qa"]["checks"]
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]["checks"]
          assert all(v > 2.5 for v in portrait["qa"]["rebound_pixel_differences"])
          assert portrait["qa"]["rebound_live_detail_difference"] > 2.5
          assert portrait["storyboard"]["frames"] == [0, 15, 35, 75, 91, 164]
          assert Path(portrait["storyboard"]["file"]).is_file()
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6
          print("CERTIFIED MOBILE REBOUND:", portrait["file"])
          CHECK

      - name: Publish distinct high-clarity Rebound video storyboard and QA
        uses: actions/upload-artifact@v4
        with:
          name: warzone-rebound-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_rebound.json
            source/*.source_qa.json
            delivery_rebound/*.json
            delivery_rebound/*.mp4
            delivery_rebound/*.jpg
            delivery_impact_cut/*.json
            delivery_impact_cut/*.mp4
            delivery_impact_cut/*.jpg

      - name: Plan certified-source Hero Focus
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode hero_focus \
            --approved-text-index 1 \
            --output plan_hero_focus.json

      - name: Render Hero Focus with canonical Clipper
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_hero_focus.json \
            --output-dir delivery_hero_focus

      - name: Qualify Hero Focus phases source fidelity and encoded storyboard
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_hero_focus/render_manifest.json \
            --output delivery_hero_focus/acceptance.json
          python - <<'CHECK'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_hero_focus/render_manifest.json").read_text())
          acceptance = json.loads(Path("delivery_hero_focus/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          portrait = manifest["portrait"]
          panels = portrait["hero_focus"]
          assert acceptance["status"] == "PASS", acceptance
          assert edit["comparison_mode"] == "hero_focus"
          assert edit["full_source_frames"] == 178
          assert edit["source_window"] == {"start_frame": 20, "frames": 90}
          assert edit["output_frames"] == 165
          assert panels["focus_operator_index"] == 1
          assert panels["phase_frames"] == [100, 107, 115, 128, 145]
          assert panels["source_only"] and panels["text_synced"]
          assert manifest["staging"]["source_excerpt"]["source_to_piece_hashes_exact"]
          assert all(manifest["qa"]["checks"].values()), manifest["qa"]["checks"]
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]["checks"]
          assert all(n > 2.5 for n in portrait["qa"]["hero_focus_pixel_differences"])
          assert portrait["storyboard"]["frames"] == [0, 106, 107, 115, 128, 164]
          assert Path(portrait["storyboard"]["file"]).is_file()
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6
          print("CERTIFIED HERO FOCUS:", portrait["file"])
          CHECK

      - name: Publish new Hero Focus MP4 storyboard and QA
        uses: actions/upload-artifact@v4
        with:
          name: warzone-hero-focus-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_hero_focus.json
            source/*.source_qa.json
            delivery_hero_focus/*.json
            delivery_hero_focus/*.mp4
            delivery_hero_focus/*.jpg

      - name: Plan certified-source three-Operator cascade
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode cascade \
            --approved-text-index 1 \
            --output plan_cascade.json

      - name: Render Clipper three-panel cascade using original source
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_cascade.json \
            --output-dir delivery_cascade

      - name: Qualify cascade source, panel synchronization and encoded delivery
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_cascade/render_manifest.json \
            --output delivery_cascade/acceptance.json

      - name: Verify shortened cascade still meets actual campaign minimum
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_cascade/render_manifest.json").read_text())
          acceptance = json.loads(Path("delivery_cascade/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          portrait = manifest["portrait"]
          assert acceptance["status"] == "PASS", acceptance
          assert edit["comparison_mode"] == "cascade"
          assert edit["full_source_frames"] == 178
          assert edit["source_window"] == {"start_frame": 14, "frames": 96}
          assert manifest["staging"]["source_excerpt"]["frame_count"] == 96
          assert manifest["staging"]["source_excerpt"]["source_to_piece_hashes_exact"]
          assert manifest["qa"]["checks"]["source_excerpt_hashes_exact"]
          assert edit["output_frames"] == 165
          assert portrait["qa"]["frame_count"] == 165
          assert portrait["title"]["text_visible_frames"] == 165
          assert portrait["cascade"]["panel_count"] == 3
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6, portrait["qa"]
          print(
              "QUALIFIED 5.5s CASCADE: certified source=178 frames, excerpt=96, output=165, "
              f"encoded duration={portrait['qa']['encoded_duration']}s, "
              f"delivery={portrait['file']}"
          )
          PY

      - name: Publish qualified three-Operator cascade
        uses: actions/upload-artifact@v4
        with:
          name: warzone-cascade-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_cascade.json
            source/*.source_qa.json
            delivery_cascade/*.json
            delivery_cascade/*.mp4

      - name: Plan new source-verified Operator Spotlight
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode spotlight \
            --approved-text-index 1 \
            --output plan_spotlight.json

      - name: Render Operator Spotlight using shared Clipper panel compositor
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_spotlight.json \
            --output-dir delivery_spotlight

      - name: Qualify Spotlight certified source visual states and 5-6 second delivery
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_spotlight/render_manifest.json \
            --output delivery_spotlight/acceptance.json
          python - <<'CHECK'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_spotlight/render_manifest.json").read_text())
          acceptance = json.loads(Path("delivery_spotlight/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          portrait = manifest["portrait"]
          assert acceptance["status"] == "PASS"
          assert edit["comparison_mode"] == "spotlight"
          assert edit["output_frames"] == 165
          assert edit["full_source_frames"] == 178
          assert edit["source_window"] == {"start_frame": 20, "frames": 90}
          assert manifest["staging"]["source_excerpt"]["source_to_piece_hashes_exact"]
          assert portrait["spotlight"]["focus_order"] == [0, 1, 2]
          assert portrait["spotlight"]["switch_frames"] == [105, 117, 129]
          assert portrait["spotlight"]["text_synced"]
          assert portrait["title"]["text_visible_frames"] == 165
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]["checks"]
          assert Path(portrait["storyboard"]["file"]).is_file()
          print("OPERATOR SPOTLIGHT QUALIFIED:", portrait["file"])
          CHECK

      - name: Publish Operator Spotlight video, actual-render storyboard and QA
        uses: actions/upload-artifact@v4
        with:
          name: warzone-spotlight-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_spotlight.json
            source/*.source_qa.json
            delivery_spotlight/*.json
            delivery_spotlight/*.mp4
            delivery_spotlight/*.jpg

      - name: Plan source-verified 5.5-second Toggle Snapback
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode snapback \
            --approved-text-index 1 \
            --output plan_snapback.json

      - name: Render Toggle Snapback through canonical Clipper staging
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_snapback.json \
            --output-dir delivery_snapback

      - name: Qualify encoded Snapback rewind and source fidelity
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_snapback/render_manifest.json \
            --output delivery_snapback/acceptance.json
          python - <<'CHECK'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_snapback/render_manifest.json").read_text())
          acceptance = json.loads(Path("delivery_snapback/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          portrait = manifest["portrait"]
          assert acceptance["status"] == "PASS"
          assert edit["comparison_mode"] == "snapback"
          assert edit["full_source_frames"] == 178
          assert edit["source_window"] == {"start_frame": 20, "frames": 90}
          assert edit["output_frames"] == 165
          assert portrait["qa"]["frame_count"] == 165
          assert portrait["title"]["text_visible_frames"] == 165
          assert portrait["snapback"]["panel_count"] == 2
          assert portrait["snapback"]["switch_frames"] == [107, 120, 124]
          assert len(portrait["qa"]["snapback_pixel_differences"]) == 2
          assert all(d > 2.5 for d in portrait["qa"]["snapback_pixel_differences"])
          assert manifest["staging"]["source_excerpt"]["source_to_piece_hashes_exact"]
          assert all(manifest["qa"]["checks"].values()), manifest["qa"]["checks"]
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]["checks"]
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6
          assert portrait["storyboard"]["frames"] == [0, 106, 107, 119, 124, 164]
          assert Path(portrait["storyboard"]["file"]).is_file()
          print("SOURCE-VERIFIED 5.5s SNAPBACK QUALIFIED:", portrait["file"])
          CHECK

      - name: Publish Snapback MP4, encoded storyboard and qualification
        uses: actions/upload-artifact@v4
        with:
          name: warzone-snapback-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_snapback.json
            source/*.source_qa.json
            delivery_snapback/*.json
            delivery_snapback/*.mp4
            delivery_snapback/*.jpg

      - name: Plan source-grounded legal visual-state comparison
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --output plan.json

      - name: Render full frame FFV1/PCM stage and delivery
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan.json --output-dir delivery

      - name: Qualify original-source and encoded-delivery contracts
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery/render_manifest.json \
            --output delivery/acceptance.json

      - name: Build second approved copy with full-frame A/B cuts
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan             --source "$SOURCE_FILE"             --source-qa "source/$SOURCE_KEY.source_qa.json"             --comparison-mode cuts             --approved-text-index 1             --output plan_cuts.json

      - name: Render alternate full-frame A/B montage from certified source
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render             --source "$SOURCE_FILE"             --source-qa "source/$SOURCE_KEY.source_qa.json"             --plan plan_cuts.json             --output-dir delivery_cuts

      - name: Qualify alternate A/B original-source contract
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify             --render-manifest delivery_cuts/render_manifest.json             --output delivery_cuts/acceptance.json

      - name: Preserve evidence and delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warzone-qualification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            source_catalog.json
            plan*.json
            source/*.source_qa.json
            delivery/*.json
            delivery/*.mp4
            delivery_cuts/*.json
            delivery_cuts/*.mp4
            delivery_cascade/*.json
            delivery_cascade/*.mp4
            delivery_hero_focus/*.json
            delivery_hero_focus/*.mp4
            delivery_hero_focus/*.jpg
            delivery_rebound/*.json
            delivery_rebound/*.mp4
            delivery_rebound/*.jpg
