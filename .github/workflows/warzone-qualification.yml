name: Warzone source and montage qualification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/warzone-operator-toggle
  pull_request:

concurrency:
  group: warzone-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify-official-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Clipper and public-review discovery runtime
        run: |
          set -euo pipefail
          python -m pip install -e ".[mw4]"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Discover official originals without credentials
        id: source
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle discover --output source_catalog.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          catalog = json.loads(Path("source_catalog.json").read_text())
          profile = json.loads(
              Path("src/clipper_engine/profiles/warzone-operator-toggle.json").read_text()
          )
          calibrated = profile["editorial"]["verified_visual_states"]
          matched = [
              entry for entry in catalog["sources"]
              if (entry.get("file_name") or entry["title"]) in calibrated
              and entry["derivative_type"] == "source"
          ]
          if len(matched) != 1:
              raise RuntimeError(
                  "expected exactly one calibrated official original; "
                  f"found {len(matched)} in public MediaSilo review"
              )
          original = matched[0]
          name = str(original.get("file_name") or original["title"])
          suffix = Path(name).suffix.lower()
          if suffix not in {".mp4", ".mov", ".mxf", ".m4v"}:
              raise RuntimeError(f"unsupported official source extension: {name}")
          print(f"source_key={original['source_key']}")
          print(f"source_file=source/{original['source_key']}{suffix}")
          PY

      - name: Acquire and certify the original from public MediaSilo review
        env:
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle acquire \
            --source-key "$SOURCE_KEY" --output-dir source

      - name: Plan certified-source three-Operator cascade
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --comparison-mode cascade \
            --approved-text-index 1 \
            --output plan_cascade.json

      - name: Render Clipper three-panel cascade using original source
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan_cascade.json \
            --output-dir delivery_cascade

      - name: Qualify cascade source, panel synchronization and encoded delivery
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery_cascade/render_manifest.json \
            --output delivery_cascade/acceptance.json

      - name: Verify shortened cascade still meets actual campaign minimum
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("delivery_cascade/render_manifest.json").read_text())
          acceptance = json.loads(Path("delivery_cascade/acceptance.json").read_text())
          edit = manifest["plan"]["montage"]
          portrait = manifest["portrait"]
          assert acceptance["status"] == "PASS", acceptance
          assert edit["comparison_mode"] == "cascade"
          assert edit["full_source_frames"] == 178
          assert edit["source_window"] == {"start_frame": 14, "frames": 96}
          assert manifest["staging"]["source_excerpt"]["frame_count"] == 96
          assert manifest["staging"]["source_excerpt"]["source_to_piece_hashes_exact"]
          assert manifest["qa"]["checks"]["source_excerpt_hashes_exact"]
          assert edit["output_frames"] == 165
          assert portrait["qa"]["frame_count"] == 165
          assert portrait["title"]["text_visible_frames"] == 165
          assert portrait["cascade"]["panel_count"] == 3
          assert all(portrait["qa"]["checks"].values()), portrait["qa"]
          assert 5 <= portrait["qa"]["encoded_duration"] <= 6, portrait["qa"]
          print(
              "QUALIFIED 5.5s CASCADE: certified source=178 frames, excerpt=96, output=165, "
              f"encoded duration={portrait['qa']['encoded_duration']}s, "
              f"delivery={portrait['file']}"
          )
          PY

      - name: Publish qualified three-Operator cascade
        uses: actions/upload-artifact@v4
        with:
          name: warzone-cascade-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            plan_cascade.json
            source/*.source_qa.json
            delivery_cascade/*.json
            delivery_cascade/*.mp4

      - name: Plan source-grounded legal visual-state comparison
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --output plan.json

      - name: Render full frame FFV1/PCM stage and delivery
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render \
            --source "$SOURCE_FILE" \
            --source-qa "source/$SOURCE_KEY.source_qa.json" \
            --plan plan.json --output-dir delivery

      - name: Qualify original-source and encoded-delivery contracts
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify \
            --render-manifest delivery/render_manifest.json \
            --output delivery/acceptance.json

      - name: Build second approved copy with full-frame A/B cuts
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle plan             --source "$SOURCE_FILE"             --source-qa "source/$SOURCE_KEY.source_qa.json"             --comparison-mode cuts             --approved-text-index 1             --output plan_cuts.json

      - name: Render alternate full-frame A/B montage from certified source
        timeout-minutes: 35
        env:
          SOURCE_FILE: ${{ steps.source.outputs.source_file }}
          SOURCE_KEY: ${{ steps.source.outputs.source_key }}
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle render             --source "$SOURCE_FILE"             --source-qa "source/$SOURCE_KEY.source_qa.json"             --plan plan_cuts.json             --output-dir delivery_cuts

      - name: Qualify alternate A/B original-source contract
        run: |
          set -euo pipefail
          clipper campaign warzone-operator-toggle qualify             --render-manifest delivery_cuts/render_manifest.json             --output delivery_cuts/acceptance.json

      - name: Preserve evidence and delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warzone-qualification-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            source_catalog.json
            plan*.json
            source/*.source_qa.json
            delivery/*.json
            delivery/*.mp4
            delivery_cuts/*.json
            delivery_cuts/*.mp4
            delivery_cascade/*.json
            delivery_cascade/*.mp4
