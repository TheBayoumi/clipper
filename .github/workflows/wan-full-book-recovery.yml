name: Clipper full-book targeted recovery and scene-0-only Wan render

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      source_run:
        type: string
        required: true
      scene0_recovery_run:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [render_fresh_scene0, assemble_from_artifacts]
        default: render_fresh_scene0
        required: true
      source_run:
        type: string
        default: '40236460264'
        required: true
      scene0_recovery_run:
        type: string
        default: ''
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: clipper-targeted-recovery-${{ github.ref_name }}-${{ inputs.mode }}-${{ inputs.source_run }}
  cancel-in-progress: false

jobs:
  recover_scene0:
    if: inputs.mode == 'render_fresh_scene0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate isolated scene-zero render source and tests
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=9,<10' 'ruff>=0.15.22,<1' 'Pillow>=11,<13'
          python -m ruff check scripts/wan_full_book_episode.py tests/test_wan_full_book_episode.py
          python -m ruff format --check scripts/wan_full_book_episode.py tests/test_wan_full_book_episode.py
          PYTHONPATH=scripts python -m pytest -q -o addopts='' tests/test_wan_full_book_episode.py
      - name: Recover exact current full-book plan, Qwen frame and updated baritone WAV
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/full-book
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "full-book-prep-$SOURCE_RUN" --dir artifacts/full-book
          test -s artifacts/full-book/source/plan.json
          test -s artifacts/full-book/source/scene-00.wav
          test -s artifacts/full-book/frames/hook.png
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/full-book")
          plan = json.loads((root / "source/plan.json").read_text())
          assert plan["shots"][0]["audio_sha256"] == hashlib.sha256(
              (root / "source/scene-00.wav").read_bytes()
          ).hexdigest()
          assert plan["voice"]["voice_id"] == "am_adam"
          assert plan["voice"]["style"] == "original_warm_low_cinematic_baritone"
          print("SCENE_ZERO_NEW_BARITONE_LOCKED", plan["shots"][0]["audio_sha256"])
          PY
      - name: Render only scene zero on Modal backup 2, never touching other scenes
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_ACCOUNT_SLOT: '3'
          MODAL_TOKEN_ID_3: ${{ secrets.MODAL_TOKEN_ID_3 }}
          MODAL_TOKEN_SECRET_3: ${{ secrets.MODAL_TOKEN_SECRET_3 }}
        run: |
          set -euo pipefail
          python -m pip install 'modal==1.5.5'
          bash scripts/wan_full_book_render_scene_zero.sh \
            artifacts/full-book/source/plan.json \
            artifacts/full-book/frames/hook.png \
            artifacts/full-book/source/scene-00.wav \
            artifacts/full-book/rendered/scene-00
      - name: Archive only fresh-current-audio scene zero, independently of scenes 1-3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-book-shot-0-fresh-${{ github.run_id }}
          path: artifacts/full-book/rendered/
          retention-days: 14
          if-no-files-found: warn

  assemble:
    if: inputs.mode == 'assemble_from_artifacts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only assembly tools
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=11,<13'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Retrieve only source-prep and recovered shot artifacts without GPU
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          ZERO_RUN: ${{ inputs.scene0_recovery_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$ZERO_RUN" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/full-book artifacts/previous
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "full-book-prep-$SOURCE_RUN" --dir artifacts/full-book
          gh run download "$ZERO_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "full-book-shot-0-fresh-$ZERO_RUN" \
            --dir artifacts/previous/scene-0
          for index in 1 2 3; do
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "full-book-shot-$index-$SOURCE_RUN" \
              --dir "artifacts/previous/scene-$index"
          done
          for index in 0 1 2 3; do
            source="artifacts/previous/scene-$index"
            original="$(find "$source" -type f -name wan-s2v-candidate.mp4 -print -quit)"
            test -s "$original" || { echo "::error::Missing scene $index; no final assembly"; exit 1; }
            destination="artifacts/full-book/rendered/scene-$(printf '%02d' "$index")"
            mkdir -p "$destination"
            cp -a "$(dirname "$original")/." "$destination/"
            test -s "$destination/model-evidence.json"
          done
          test -s artifacts/full-book/source/captions.ass
          test -s artifacts/full-book/source/caption-evidence.json
      - name: Assemble the original voice and four verified scenes
        run: |
          set -euo pipefail
          mkdir -p artifacts/full-book/final
          cp artifacts/full-book/source/captions.ass artifacts/full-book/final/captions.ass
          cp artifacts/full-book/source/caption-evidence.json artifacts/full-book/final/caption-evidence.json
          PYTHONPATH=scripts python scripts/wan_full_book_episode.py assemble \
            --plan artifacts/full-book/source/plan.json \
            --shots artifacts/full-book/rendered/scene-00 \
                    artifacts/full-book/rendered/scene-01 \
                    artifacts/full-book/rendered/scene-02 \
                    artifacts/full-book/rendered/scene-03 \
            --output artifacts/full-book/final \
            --captions artifacts/full-book/final/captions.ass
      - name: Archive complete 30-to-60-second candidate for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-book-video-recovery-${{ github.run_id }}
          path: artifacts/full-book/final/
          retention-days: 14
          if-no-files-found: warn
