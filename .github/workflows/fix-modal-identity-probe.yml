name: Repair Modal deployment identity probe

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - ".github/workflows/fix-modal-identity-probe.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - name: Patch lightweight pipeline identity and refresh exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          pipeline = Path("scripts/modal_pipeline.py")
          text = pipeline.read_text(encoding="utf-8")
          old = '''@app.function(image=runner_image, timeout=60, scaledown_window=2)\ndef deployment_identity() -> dict[str, Any]:\n    return {"app": APP_NAME, "deployed_git_sha": DEPLOYED_GIT_SHA}\n'''
          new = '''PIPELINE_IDENTITY_IMAGE = modal.Image.debian_slim(python_version="3.12").env(\n    {"CLIPPER_DEPLOYED_GIT_SHA": DEPLOYED_GIT_SHA}\n)\n\n\n@app.function(image=PIPELINE_IDENTITY_IMAGE, timeout=60, scaledown_window=2)\ndef deployment_identity() -> dict[str, Any]:\n    return {"app": APP_NAME, "deployed_git_sha": DEPLOYED_GIT_SHA}\n'''
          if text.count(old) != 1:
              raise SystemExit("modal_pipeline deployment_identity decorator seam changed")
          pipeline.write_text(text.replace(old, new, 1), encoding="utf-8")

          canary = Path("acceptance/container-canary-request.json")
          payload = json.loads(canary.read_text(encoding="utf-8"))
          payload["requested_for_sha"] = "next_exact_head"
          payload["reason"] = (
              "Revalidate exact-head canary after moving immutable Modal pipeline identity "
              "verification off the heavyweight production runner image"
          )
          canary.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

          marker = Path("acceptance/modal-deploy-request.json")
          payload = json.loads(marker.read_text(encoding="utf-8"))
          payload["request_reason"] = (
              "Deploy exact head after replacing heavyweight pipeline identity cold start with "
              "a dedicated slim immutable SHA probe"
          )
          payload["requested_from_sha"] = "next_exact_head"
          payload["fresh_inference"] = False
          payload["enabled"] = True
          marker.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate patched production code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check scripts/modal_pipeline.py
          ruff format --check scripts/modal_pipeline.py
          python -m compileall -q scripts/modal_pipeline.py
          grep -q 'PIPELINE_IDENTITY_IMAGE = modal.Image.debian_slim' scripts/modal_pipeline.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_pipeline.py \
            acceptance/container-canary-request.json acceptance/modal-deploy-request.json
          git commit -m "fix: move Modal pipeline identity to slim image"
          git push origin HEAD:feat/contentrewards-campaign-factory
