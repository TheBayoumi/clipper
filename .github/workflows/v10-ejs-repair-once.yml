name: V10 repair yt-dlp EJS runtime once

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/v10-ejs-repair-once.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable yt-dlp EJS with Node 22
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/modal_v10_cycle.py")
          source = source_path.read_text(encoding="utf-8")
          old_dep = '        "yt-dlp>=2026.7.4,<2027",\n'
          new_dep = '        "yt-dlp[default]>=2026.7.4,<2027",\n'
          if source.count(old_dep) != 1:
              raise SystemExit("expected exactly one yt-dlp media dependency")
          source = source.replace(old_dep, new_dep, 1)

          old_cmd = '''        "yt-dlp",
                  "--verbose",
          '''
          new_cmd = '''        "yt-dlp",
                  "--verbose",
                  "--js-runtimes",
                  "node",
          '''
          if source.count(old_cmd) != 1:
              raise SystemExit("expected exactly one yt-dlp base command")
          source_path.write_text(source.replace(old_cmd, new_cmd, 1), encoding="utf-8")

          test_path = Path("tests/test_modal_v10_source_contract.py")
          test = test_path.read_text(encoding="utf-8")
          anchor = '    assert "youtube:player_client=web_embedded,android_vr" in source\n'
          addition = (
              anchor
              + '    assert \'"yt-dlp[default]>=2026.7.4,<2027"\' in source\n'
              + '    assert \'"--js-runtimes"\' in source\n'
              + '    assert \'"node"\' in source\n'
          )
          if test.count(anchor) != 1:
              raise SystemExit("expected source contract anchor")
          test_path.write_text(test.replace(anchor, addition, 1), encoding="utf-8")
          PY

      - name: Run canonical quality and focused regression
        run: |
          python -m pip install -e '.[dev]'
          ruff format scripts/modal_v10_cycle.py tests/test_modal_v10_source_contract.py
          ruff check scripts/modal_v10_cycle.py tests/test_modal_v10_source_contract.py
          ruff format --check scripts/modal_v10_cycle.py tests/test_modal_v10_source_contract.py
          pytest -q --no-cov tests/test_modal_v10_source_contract.py
          git diff --check

      - name: Commit EJS runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_v10_cycle.py tests/test_modal_v10_source_contract.py
          git commit -m "fix: enable yt-dlp EJS with Node 22"
          git push origin HEAD:feat/word-reveal-face-tracking
