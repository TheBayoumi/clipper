name: Repair V10 grounding resilience

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/repair-v10-grounding.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply grounding resilience fix
        run: |
          echo '       nCmlmIG9sZCBub3QgaW4gZWRpdG9yOgogICAgcmFpc2UgU3lzdGVtRXhpdCgiaG9vayBwYXJzaW5nIGJsb2NrIG5vdCBmb3VuZCIpCmVkaXRvciA9IGVkaXRvci5yZXBsYWNlKG9sZCwgbmV3LCAxKQoKb2xkID0gJyc  ' | tr -d ' ' | base64 -d > /tmp/repair.py
          python /tmp/repair.py
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Guard source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          canonical = Path('src/clipper/canonical.py').read_text()
          editor = Path('src/clipper/autonomous_editor.py').read_text()
          assert 'base, separator, _suffix = compact.partition(":")' in canonical
          assert 'invalid_grounded_story_moment' in editor
          assert 'namespaced_id = f"chunk-{chunk_index}:{moment.moment_id}"' in editor
          assert 'invalid_grounded_clip_concept' in editor
          assert 'invalid_grounded_hook_variant' in editor
          assert 'invalid_grounded_edit_plan' in editor
          PY
      - name: Quality gate
        run: |
          ruff check src/clipper/canonical.py src/clipper/autonomous_editor.py tests/test_open_models.py
          ruff format --check src/clipper/canonical.py src/clipper/autonomous_editor.py tests/test_open_models.py
          mypy src/clipper/canonical.py src/clipper/autonomous_editor.py
          pytest --no-cov -q tests/test_open_models.py
      - name: Commit guarded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/clipper/canonical.py src/clipper/autonomous_editor.py tests/test_open_models.py
          git commit -m 'fix: preserve valid grounded editorial proposals'
          git push origin HEAD:feat/word-reveal-face-tracking
