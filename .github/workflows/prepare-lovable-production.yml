name: Prepare Lovable production trigger

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/prepare-lovable-production.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0
      - name: Patch deployment trigger and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('.github/workflows/modal-workers-deploy.yml'); s=p.read_text(encoding='utf-8'); old='  push:\n    branches:\n      - feat/word-reveal-face-tracking\n    paths:\n      - \"acceptance/modal-deploy-request.json\"\n'; new='  push:\n    branches:\n      - feat/word-reveal-face-tracking\n      - feat/contentrewards-campaign-factory\n    paths:\n      - \"acceptance/modal-deploy-request.json\"\n      - \"acceptance/production-run-request.json\"\n'; assert s.count(old) == 1, 'Modal deploy trigger anchor drifted'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          rm .github/workflows/prepare-lovable-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/modal-workers-deploy.yml .github/workflows/prepare-lovable-production.yml
          git commit -m 'ci: deploy Modal workers for Lovable production heads'
          git push origin HEAD:feat/contentrewards-campaign-factory
