name: Fix final advisory budget validation

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/fix-final-advisory-budget-validation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply final advisory budget validation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/production-pipeline.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = '''          gpu_seconds = sum(float(item.get("gpu_seconds") or 0) for item in usage_records)\n          estimated_usd = sum(float(item.get("estimated_cost_usd") or 0) for item in usage_records)\n          gpu_limit = float(os.environ["CLIPPER_MAX_GPU_SECONDS"])\n          cost_limit = float(os.environ["CLIPPER_MAX_ESTIMATED_USD"])\n          if gpu_seconds > gpu_limit:\n              raise RuntimeError(f"GPU budget exceeded: {gpu_seconds} > {gpu_limit}")\n          if estimated_usd > cost_limit:\n              raise RuntimeError(f"estimated cost budget exceeded: {estimated_usd} > {cost_limit}")\n'''
          new = '''          gpu_seconds = sum(float(item.get("gpu_seconds") or 0) for item in usage_records)\n          estimated_usd = sum(float(item.get("estimated_cost_usd") or 0) for item in usage_records)\n          gpu_limit = float(os.environ["CLIPPER_MAX_GPU_SECONDS"])\n          cost_limit = float(os.environ["CLIPPER_MAX_ESTIMATED_USD"])\n'''
          if workflow.count(old) != 1:
              raise SystemExit(f'expected one final budget rejection block, found {workflow.count(old)}')
          workflow_path.write_text(workflow.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_production_workflow_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''    assert 'editorial.get("model_invocations")' in workflow\n    assert '\"semantic_cores\", \"narrative_envelope\", \"quality_windows\"' in workflow\n    assert "gpu_seconds > gpu_limit" in workflow\n    assert "estimated_usd > cost_limit" in workflow\n'''
          new_test = '''    assert 'editorial.get("model_invocations")' in workflow\n    assert '\"semantic_cores\", \"narrative_envelope\", \"quality_windows\"' in workflow\n    assert 'gpu_seconds = sum(float(item.get("gpu_seconds") or 0) for item in usage_records)' in workflow\n    assert 'estimated_usd = sum(float(item.get("estimated_cost_usd") or 0) for item in usage_records)' in workflow\n    assert 'gpu_limit = float(os.environ["CLIPPER_MAX_GPU_SECONDS"])' in workflow\n    assert 'cost_limit = float(os.environ["CLIPPER_MAX_ESTIMATED_USD"])' in workflow\n    assert "gpu_seconds > gpu_limit" not in workflow\n    assert "estimated_usd > cost_limit" not in workflow\n    assert "GPU budget exceeded" not in workflow\n    assert "estimated cost budget exceeded" not in workflow\n'''
          if tests.count(old_test) != 1:
              raise SystemExit(f'expected one stale budget contract block, found {tests.count(old_test)}')
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Verify complete repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          mypy
          pytest

      - name: Commit verified repair and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-final-advisory-budget-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/production-pipeline.yml tests/test_production_workflow_contract.py .github/workflows/fix-final-advisory-budget-validation.yml
          git commit -m "fix: make final HILP budget validation advisory"
          git push origin HEAD:feat/contentrewards-campaign-factory
