name: Temporary source-only contract finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize-source:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded source and test cleanup
        run: |
          python scripts/temporary_contract_finalizer.py
          python scripts/temporary_contract_finalizer_v2.py
      - name: Install quality tools
        run: python -m pip install -e '.[dev]'
      - name: Verify cleanup
        run: |
          ruff check --fix src/clipper/youtube.py tests
          ruff format src/clipper/youtube.py src/clipper/cli.py src/clipper/hilp.py src/clipper/quality_batch.py src/clipper/pipeline.py tests
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit source and test cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_contract_finalizer.py scripts/temporary_contract_finalizer_v2.py
          git config user.name "clipper-contract-bot"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add src/clipper/youtube.py src/clipper/cli.py src/clipper/hilp.py src/clipper/quality_batch.py src/clipper/pipeline.py
          git add tests
          git add -u src/clipper/_temporary_cleanup_trigger.py acceptance/temporary-contract-cleanup-trigger.json acceptance/temporary-source-finalizer-trigger.json scripts/temporary_contract_finalizer.py scripts/temporary_contract_finalizer_v2.py || true
          git diff --cached --check
          git commit -m "refactor: finalize autonomous editor contract cleanup"
          git push origin HEAD:feat/word-reveal-face-tracking
