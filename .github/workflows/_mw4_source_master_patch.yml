name: MW4 original-source-only workflow patch

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/_mw4_source_master_patch.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Patch canonical source acquisition
        run: python scripts/_mw4_source_master_patch.py

      - name: Upload patched canonical workflows
        uses: actions/upload-artifact@v4
        with:
          name: mw4-original-source-patched-workflows
          path: |
            .github/workflows/mw4-semantic-v3-1-shadow.yml
            .github/workflows/mw4-fullframe-retention-v3-1.yml
          retention-days: 1
          if-no-files-found: error
