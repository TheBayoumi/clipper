name: MW4 original-source-only workflow patch

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/_mw4_source_master_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical source acquisition in workspace
        run: python scripts/_mw4_source_master_patch.py

      - name: Stage patched workflow blobs outside workflows directory
        run: |
          set -euo pipefail
          mkdir -p .mw4-workflow-patch
          cp .github/workflows/mw4-semantic-v3-1-shadow.yml .mw4-workflow-patch/mw4-semantic-v3-1-shadow.yml
          cp .github/workflows/mw4-fullframe-retention-v3-1.yml .mw4-workflow-patch/mw4-fullframe-retention-v3-1.yml
          git restore .github/workflows/mw4-semantic-v3-1-shadow.yml .github/workflows/mw4-fullframe-retention-v3-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mw4-workflow-patch/mw4-semantic-v3-1-shadow.yml .mw4-workflow-patch/mw4-fullframe-retention-v3-1.yml
          git commit -m "ci(mw4): stage original-source patched workflow blobs"
          git push origin HEAD:feat/mw4-fullframe-retention-v3-1
