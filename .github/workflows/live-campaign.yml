name: Live campaign acceptance

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/live-campaign.yml"
      - "src/clipper/**"
      - "campaigns/reach-double-coverage-dedicated.yaml"
      - "Dockerfile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare private authorized source fixture
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_URL: ${{ secrets.CLIPPER_LIVE_FIXTURE_URL }}
          FIXTURE_SHA256: ${{ secrets.CLIPPER_LIVE_FIXTURE_SHA256 }}
        run: |
          set -euo pipefail
          rm -rf live-fixture fixture.zip
          mkdir -p live-fixture
          reused=false
          while read -r run_id; do
            test -n "$run_id" || continue
            test "$run_id" != "$GITHUB_RUN_ID" || continue
            rm -rf live-fixture/*
            if gh run download "$run_id" -n reach-source-fixture-v10 -D live-fixture; then
              reused=true
              echo "source=actions-artifact:$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
          done < <(
            gh run list \
              --workflow live-campaign.yml \
              --branch feat/word-reveal-face-tracking \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          if [ "$reused" != true ]; then
            test -n "$FIXTURE_URL" || { echo "No private acceptance fixture is available"; exit 1; }
            test -n "$FIXTURE_SHA256" || { echo "Fixture SHA-256 secret is missing"; exit 1; }
            curl --fail --location --retry 3 --silent --show-error "$FIXTURE_URL" -o fixture.zip
            echo "$FIXTURE_SHA256  fixture.zip" | sha256sum --check --strict
            unzip -q fixture.zip -d live-fixture
            echo "source=encrypted-seed-url" >> "$GITHUB_OUTPUT"
          fi
          test -f live-fixture/fixture.json
          test -f live-fixture/source.en.vtt
          python - <<'PY'
          import json
          from pathlib import Path
          fixture = json.loads(Path("live-fixture/fixture.json").read_text())
          assert fixture["video"]["video_id"] == "2Y4LP85PTak"
          assert fixture["video"]["channel_id"] == "UCf1q6dhccWr6eQEcFFnJSbA"
          assert len(fixture["spans"]) >= 10
          print(json.dumps({"video": fixture["video"], "span_count": len(fixture["spans"])}, indent=2))
          PY

      - name: Mirror private fixture into Actions artifact storage
        uses: actions/upload-artifact@v4
        with:
          name: reach-source-fixture-v10
          path: live-fixture/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Build exact candidate image
        run: docker build -t clipper-live:${GITHUB_SHA} .

      - name: Run dedicated Double Coverage campaign through exact HEAD
        id: production
        run: |
          set +e
          mkdir -p live-artifacts
          docker run --rm \
            --env GITHUB_SHA="${GITHUB_SHA}" \
            --env CLIPPER_SOURCE_MAX_HEIGHT=1080 \
            --env CLIPPER_RENDER_PROFILE=production \
            --env CLIPPER_SOURCE_FIXTURE_DIR=/fixture \
            --env CLIPPER_WHISPER_MODEL=base.en \
            --env CLIPPER_WHISPER_DEVICE=cpu \
            --env CLIPPER_WHISPER_COMPUTE_TYPE=int8 \
            -v "$PWD/campaigns:/campaigns:ro" \
            -v "$PWD/live-fixture:/fixture:ro" \
            -v "$PWD/live-artifacts:/artifacts" \
            clipper-live:${GITHUB_SHA} \
            run --brief /campaigns/reach-double-coverage-dedicated.yaml --artifact-root /artifacts
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "$rc" > live-artifacts/pipeline-exit-code.txt
          exit 0

      - name: Summarize production result for diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          manifests = list(Path("live-artifacts").glob("*/manifest.json"))
          if not manifests:
              print("No manifest was produced")
              raise SystemExit(0)
          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          attempts = manifest.get("render_attempts") or []
          rejections = manifest.get("rejections") or []
          summary = {
              "status": manifest.get("status"),
              "status_reason": manifest.get("status_reason"),
              "targets": manifest.get("targets"),
              "actual": manifest.get("actual"),
              "funnel": manifest.get("funnel"),
              "errors": manifest.get("errors"),
              "render_attempt_statuses": dict(Counter(str(item.get("status")) for item in attempts)),
              "rejection_reasons": dict(
                  Counter(str(reason) for item in rejections for reason in (item.get("reasons") or []))
              ),
              "technical_qc": [
                  {
                      "plan_id": item.get("plan_id"),
                      "status": item.get("status"),
                      "issues": item.get("issues"),
                      "caption_alignment": (item.get("captions") or {}).get("alignment"),
                  }
                  for item in (manifest.get("technical_qc") or [])
              ],
          }
          print(json.dumps(summary, indent=2))
          PY

      - name: Prepare small live diagnostics artifact
        if: always()
        run: |
          rm -rf live-diagnostics
          mkdir -p live-diagnostics
          run_dir="$(dirname "$(find live-artifacts -name manifest.json -type f -print -quit)")"
          if [ -n "$run_dir" ] && [ -d "$run_dir" ]; then
            for file in manifest.json funnel.json rejections.json coverage.json transcript.json editorial-review.json; do
              test -f "$run_dir/$file" && cp "$run_dir/$file" live-diagnostics/
            done
            test -d "$run_dir/qc" && cp -R "$run_dir/qc" live-diagnostics/qc
            if [ -d "$run_dir/captions" ]; then
              mkdir -p live-diagnostics/captions
              find "$run_dir/captions" -name '*.caption-audit.json' -type f -exec cp {} live-diagnostics/captions/ \;
            fi
            if [ -d "$run_dir/tracking" ]; then
              mkdir -p live-diagnostics/tracking
              find "$run_dir/tracking" -name '*.tracking.json' -type f -exec cp {} live-diagnostics/tracking/ \;
            fi
          fi
          test -f live-artifacts/pipeline-exit-code.txt && cp live-artifacts/pipeline-exit-code.txt live-diagnostics/

      - name: Upload live diagnostics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reach-live-diagnostics-${{ github.sha }}
          path: live-diagnostics/
          retention-days: 14
          if-no-files-found: warn

      - name: Validate full production manifest and batch invariants
        run: |
          run_dir="$(dirname "$(find live-artifacts -name manifest.json -type f -print -quit)")"
          test -n "$run_dir"
          PYTHONPATH=src python - "$run_dir" <<'PY'
          import json
          import sys
          from pathlib import Path
          from clipper.acceptance import validate_live_run

          run_dir = Path(sys.argv[1])
          manifest = validate_live_run(
              run_dir, expected_finalists=6, expected_shortlist=3
          )
          if manifest.get("run_metadata", {}).get("source_mode") != "private-fixture":
              raise SystemExit("live acceptance did not use the authorized private fixture")
          print(
              json.dumps(
                  {
                      "run_dir": str(run_dir),
                      "targets": manifest["targets"],
                      "actual": manifest["actual"],
                      "funnel": manifest["funnel"],
                  },
                  indent=2,
              )
          )
          PY

      - name: Decode and inspect every finalist MP4
        run: |
          run_dir="$(dirname "$(find live-artifacts -name manifest.json -type f -print -quit)")"
          count=0
          inspection_dir="$RUNNER_TEMP/clipper-live-inspection"
          rm -rf "$inspection_dir"
          mkdir -p "$inspection_dir"
          for clip in "$run_dir"/clips/*.mp4; do
            test -f "$clip"
            count=$((count + 1))
            stem="$(basename "$clip" .mp4)"
            ffprobe -v error -show_streams -show_format -of json "$clip" \
              > "$inspection_dir/$stem.ffprobe.json"
            ffmpeg -v error -i "$clip" -f null -
            ffmpeg -v error -t 3 -i "$clip" -f null -
            ffmpeg -v error -ss 0.25 -i "$clip" -frames:v 1 -y \
              "$inspection_dir/$stem.first-025.png"
          done
          test "$count" -eq 6

      - name: Upload exact-HEAD live acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reach-live-${{ github.sha }}
          path: live-artifacts/
          retention-days: 14
          if-no-files-found: error
