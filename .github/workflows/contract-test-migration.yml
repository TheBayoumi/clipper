name: Contract test migration

on:
  push:
    branches:
      - feat/word-reveal-face-tracking

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate stale tests
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(text: str, old: str, new: str, *, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"missing expected text for {label}")
              return text.replace(old, new)

          def remove_function(text: str, name: str) -> str:
              pattern = rf"(?ms)^def {re.escape(name)}\(.*?(?=^def |^class |\Z)"
              updated, count = re.subn(pattern, "", text, count=1)
              if count != 1:
                  raise RuntimeError(f"expected one function {name}, got {count}")
              return updated

          def replace_function(text: str, name: str, replacement: str) -> str:
              pattern = rf"(?ms)^def {re.escape(name)}\(.*?(?=^def |^class |\Z)"
              updated, count = re.subn(pattern, replacement.rstrip() + "\n\n", text, count=1)
              if count != 1:
                  raise RuntimeError(f"expected one function {name}, got {count}")
              return updated

          # editorial integrity: keep the full modern integrity suite, only drop retired brief knobs.
          path = "tests/test_editorial_integrity.py"
          text = read(path)
          text = replace_required(
              text,
              "from clipper.models import AcceptancePolicy, CampaignBrief, ProductionConfig",
              "from clipper.models import AcceptancePolicy, CampaignBrief",
              label="editorial models import",
          )
          text = text.replace('        keywords=["interview"],\n', "")
          text = text.replace(
              "        production=ProductionConfig(final_render_budget=6, minimum_distinct_finalist_concepts=3),\n",
              "",
          )
          write(path, text)

          # fixture tests: retain fixture validation, drop helpers removed with span-localized rendering.
          path = "tests/test_fixture.py"
          text = read(path)
          text = text.replace("    _localize_render_inputs,\n", "")
          text = text.replace("    _span_media_for_plan,\n", "")
          text = text.replace('        keywords=("podcast",),\n', "")
          text = remove_function(text, "test_localize_render_inputs_preserves_absolute_edit_as_local_media")
          text = remove_function(text, "test_span_media_helper_rejects_invalid_protocol_result")
          write(path, text)

          # Modal editorial recovery: current provider has generic strict-JSON recovery and four task families.
          Path("tests/test_modal_editorial_recovery.py").write_text(
              '''from pathlib import Path
from typing import Any

import pytest

from clipper.providers.base import InferenceUsage, ModelIdentity, ProviderResult
from clipper.providers.editorial_prompt import (
    EDITORIAL_IDENTITY,
    EDITORIAL_SCHEMA_IDENTITY,
    editorial_contract,
    editorial_contract_fingerprint,
    editorial_json_schema,
    editorial_output_budget,
    editorial_task_family,
)
from clipper.providers.modal import ModalEditorialProvider, ModalRemoteError


class SequenceEditorialProvider(ModalEditorialProvider):
    def __init__(self, outcomes: list[object]) -> None:
        identity = ModelIdentity("test/editorial", "rev", "none", "test", "prompt", "schema")
        super().__init__(app_name="test", function_name="editorial", identity=identity)
        self.outcomes = outcomes
        self.requests: list[dict[str, Any]] = []

    def invoke(self, payload: dict[str, Any]) -> ProviderResult[dict[str, Any]]:
        self.requests.append(payload)
        outcome = self.outcomes.pop(0)
        if isinstance(outcome, Exception):
            raise outcome
        assert isinstance(outcome, ProviderResult)
        return outcome


def _result(value: dict[str, Any]) -> ProviderResult[dict[str, Any]]:
    identity = ModelIdentity("test/editorial", "rev", "none", "test", "prompt", "schema")
    return ProviderResult(
        value,
        identity,
        InferenceUsage(provider="modal", started_at="now", duration_seconds=0.0),
    )


def test_editorial_provider_recovers_from_strict_json_contract_errors() -> None:
    provider = SequenceEditorialProvider(
        [
            ModalRemoteError(
                function_name="editorial",
                error_type="EditorialOutputTruncated",
                message="output exhausted generation budget",
            ),
            ModalRemoteError(
                function_name="editorial",
                error_type="JSONDecodeError",
                message="unterminated string",
            ),
            _result({"cores": []}),
        ]
    )
    result = provider.complete_json(task="semantic_cores:0", payload={"words": []})
    assert result.value == {"cores": []}
    assert [item.get("generation_recovery_attempt") for item in provider.requests] == [None, 2, 3]
    assert "strict JSON object" in provider.requests[1]["generation_recovery_instruction"]


def test_editorial_provider_does_not_retry_unrelated_remote_error() -> None:
    provider = SequenceEditorialProvider(
        [ModalRemoteError(function_name="editorial", error_type="RuntimeError", message="gpu failed")]
    )
    with pytest.raises(ModalRemoteError, match="gpu failed"):
        provider.complete_json(task="semantic_cores:0", payload={"words": []})
    assert len(provider.requests) == 1


def test_editorial_provider_stops_after_bounded_recovery_attempts() -> None:
    failures = [
        ModalRemoteError(function_name="editorial", error_type="JSONDecodeError", message="bad json")
        for _ in range(3)
    ]
    provider = SequenceEditorialProvider(failures)
    with pytest.raises(ModalRemoteError, match="bad json"):
        provider.complete_json(task="quality_windows:core", payload={})
    assert len(provider.requests) == 3


def test_editorial_contract_exposes_only_active_content_addressed_task_families() -> None:
    tasks = {
        "source_hazards:0": "source_hazards",
        "semantic_cores:0": "semantic_cores",
        "narrative_envelope:core": "narrative_envelope",
        "quality_windows:core": "quality_windows",
    }
    assert EDITORIAL_IDENTITY == "editor"
    assert EDITORIAL_SCHEMA_IDENTITY == "structured-json"
    for task, family in tasks.items():
        assert editorial_task_family(task) == family
        schema = editorial_json_schema(task)
        assert schema["type"] == "object"
        assert schema["additionalProperties"] is False
        assert editorial_contract(task)
        assert len(editorial_contract_fingerprint(task)) == 64
    assert editorial_output_budget({"task": "source_hazards:0"}) == 2048
    assert editorial_output_budget({"task": "semantic_cores:0"}) == 2048
    assert editorial_output_budget({"task": "narrative_envelope:core"}) == 1536
    assert editorial_output_budget({"task": "quality_windows:core"}) == 1536
    with pytest.raises(ValueError, match="unsupported production editorial task"):
        editorial_task_family("edit_plans:legacy")


def test_modal_editorial_runtime_has_bounded_expanding_recovery_budget() -> None:
    source = Path("scripts/modal_open_models.py").read_text(encoding="utf-8")
    assert "class EditorialOutputTruncated(ValueError)" in source
    assert "base_budget * _editorial_recovery_attempt(payload)" in source
    assert "return min(4096," in source
    assert "exhausting the output budget" in source
''',
              encoding="utf-8",
          )

          # Phase-B contract edges: current task graph only.
          path = "tests/test_phase_b_contract_edges.py"
          text = read(path)
          text = text.replace("    editorial_legacy_cache_compatible,\n", "")
          text = replace_function(
              text,
              "test_editorial_prompt_exposes_every_structured_task_family_and_budget",
              '''def test_editorial_prompt_exposes_every_structured_task_family_and_budget() -> None:
    tasks = {
        "source_hazards:0": "source_hazards",
        "semantic_cores:0": "semantic_cores",
        "narrative_envelope:core": "narrative_envelope",
        "quality_windows:core": "quality_windows",
    }
    for task, family in tasks.items():
        assert editorial_task_family(task) == family
        schema = editorial_json_schema(task)
        assert schema["type"] == "object"
        assert schema["additionalProperties"] is False
        assert editorial_contract(task)
        assert len(editorial_contract_fingerprint(task)) == 64

    assert editorial_output_budget({"task": "source_hazards:0"}) == 2048
    assert editorial_output_budget({"task": "semantic_cores:0"}) == 2048
    assert editorial_output_budget({"task": "narrative_envelope:x"}) == 1536
    assert editorial_output_budget({"task": "quality_windows:x"}) == 1536
    with pytest.raises(ValueError, match="unsupported production editorial task"):
        editorial_output_budget({"task": "other"})
    with pytest.raises(ValueError, match="unsupported production editorial task"):
        editorial_task_family("unsupported")
    with pytest.raises(ValueError, match="unsupported production editorial task"):
        editorial_json_schema("unsupported")''',
          )
          write(path, text)

          # Modal execution: explicit target resolver replaces discovery fallback.
          path = "tests/test_modal_execution.py"
          text = read(path)
          text = text.replace("    _authorized_candidates,\n", "    _explicit_candidates,\n")
          text = remove_function(text, "_brief")
          text = replace_function(
              text,
              "_write_brief",
              '''def _write_brief(path: Path) -> None:
    path.write_text(
        json.dumps(
            {
                "campaign_id": "campaign",
                "title": "Podcast",
                "objective": "Find worthwhile complete clips",
                "targets": {
                    "mode": "explicit",
                    "videos": [
                        {
                            "video_id": "v1",
                            "url": "https://www.youtube.com/watch?v=v1",
                            "channel_id": "UC1",
                        }
                    ],
                },
                "rights": {"confirmed": True, "authorized_channels": ["UC1"]},
                "content_constraints": {"min_clip_seconds": 20, "max_clip_seconds": 45},
            }
        ),
        encoding="utf-8",
    )''',
          )
          text = remove_function(
              text, "test_authorized_candidates_build_direct_youtube_requests_without_download"
          )
          text = replace_function(
              text,
              "test_authorized_candidates_uses_discovery_only_when_ids_are_absent",
              '''def test_explicit_candidates_resolve_only_campaign_targets(tmp_path: Path) -> None:
    brief_path = tmp_path / "brief.json"
    _write_brief(brief_path)
    candidates = _explicit_candidates(brief_path)
    assert [item.video_id for item in candidates] == ["v1"]
    assert candidates[0].url == "https://www.youtube.com/watch?v=v1"
    assert candidates[0].channel_id == "UC1"''',
          )
          text = text.replace("clipper.modal_execution._authorized_candidates", "clipper.modal_execution._explicit_candidates")
          text = replace_function(
              text,
              "test_run_modal_pipeline_rejects_missing_or_multi_source_and_bad_runner",
              '''def test_run_modal_pipeline_fails_closed_for_runtime_empty_targets_and_bad_runner(tmp_path: Path) -> None:
    brief_path = tmp_path / "brief.json"
    _write_brief(brief_path)
    candidate = VideoCandidate("v1", "Title", "UC1", "Channel", "https://youtu.be/v1")

    with (
        patch("clipper.modal_execution.ensure_modal_runtime", side_effect=RuntimeError("model access denied")),
        patch("clipper.modal_execution._function") as function,
        pytest.raises(RuntimeError, match="model access denied"),
    ):
        run_modal_pipeline(
            brief_path,
            artifact_root=tmp_path / "artifacts",
            resume_from_run_id=None,
            render=True,
            fresh_inference=False,
        )
    function.assert_not_called()

    with (
        patch("clipper.modal_execution.ensure_modal_runtime"),
        patch("clipper.modal_execution._function", return_value=Mock()),
        patch("clipper.modal_execution._explicit_candidates", return_value=[]),
        pytest.raises(RuntimeError, match="no explicit authorized targets"),
    ):
        run_modal_pipeline(
            brief_path,
            artifact_root=tmp_path / "artifacts-empty",
            resume_from_run_id=None,
            render=True,
            fresh_inference=False,
        )

    acquire = Mock()
    runner = Mock()
    runner.remote.return_value = "invalid"
    with (
        patch("clipper.modal_execution.ensure_modal_runtime"),
        patch("clipper.modal_execution._explicit_candidates", return_value=[candidate]),
        patch(
            "clipper.modal_execution._function",
            side_effect=lambda _app, name: acquire if name == "acquire_source" else runner,
        ),
        patch(
            "clipper.modal_execution._acquire_remote_source",
            return_value={"quality_policy": "highest_available_no_transcode"},
        ),
        pytest.raises(RuntimeError, match="invalid response"),
    ):
        run_modal_pipeline(
            brief_path,
            artifact_root=tmp_path / "artifacts-invalid",
            resume_from_run_id=None,
            render=True,
            fresh_inference=False,
        )

    runner.remote.return_value = {"run_path": ""}
    with (
        patch("clipper.modal_execution.ensure_modal_runtime"),
        patch("clipper.modal_execution._explicit_candidates", return_value=[candidate]),
        patch(
            "clipper.modal_execution._function",
            side_effect=lambda _app, name: acquire if name == "acquire_source" else runner,
        ),
        patch(
            "clipper.modal_execution._acquire_remote_source",
            return_value={"quality_policy": "highest_available_no_transcode"},
        ),
        pytest.raises(RuntimeError, match="no run path"),
    ):
        run_modal_pipeline(
            brief_path,
            artifact_root=tmp_path / "artifacts-no-path",
            resume_from_run_id=None,
            render=True,
            fresh_inference=False,
        )''',
          )
          write(path, text)

          # Legacy pipeline candidate helper embodied discovery; remove only that obsolete test/import now.
          path = "tests/test_pipeline.py"
          text = read(path)
          text = text.replace("    _campaign_media_candidates,\n", "")
          text = remove_function(text, "test_campaign_media_candidates_and_direct_media_bypass_youtube")
          write(path, text)
          PY
      - name: Validate migrated test syntax
        run: python -m compileall -q tests
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: migrate suite to autonomous multimodal contract"
          git push origin HEAD:feat/word-reveal-face-tracking
