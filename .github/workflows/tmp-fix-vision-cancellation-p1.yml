name: Temporary vision cancellation P1 repair

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/tmp-fix-vision-cancellation-p1.yml
      - scripts/tmp_fix_vision_cancellation_p1.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply only the Codex P1 vision-cancellation repair
        run: python scripts/tmp_fix_vision_cancellation_p1.py

      - name: Normalize touched files
        run: |
          ruff check src/clipper/providers/modal.py tests/test_vision_runtime_recovery.py --fix
          ruff format src/clipper/providers/modal.py tests/test_vision_runtime_recovery.py

      - name: Static gates
        run: |
          ruff check src/clipper/providers/modal.py tests/test_vision_runtime_recovery.py
          ruff format --check src/clipper/providers/modal.py tests/test_vision_runtime_recovery.py
          mypy

      - name: Targeted regression
        run: pytest tests/test_vision_runtime_recovery.py -q --no-cov

      - name: Full test and coverage gate
        run: pytest

      - name: Commit validated P1 fix and remove temporary repair machinery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-fix-vision-cancellation-p1.yml scripts/tmp_fix_vision_cancellation_p1.py
          git add src/clipper/providers/modal.py tests/test_vision_runtime_recovery.py
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "fix: fail closed on unconfirmed vision cancellation"
          git push origin HEAD:feat/contentrewards-campaign-factory
