name: Deploy Modal workers

on:
  workflow_dispatch:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - "acceptance/modal-deploy-request.json"

permissions:
  contents: read

concurrency:
  group: clipper-modal-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline
  CLIPPER_DEPLOYED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CLIPPER_EDITORIAL_EXECUTION_TIMEOUT_SECONDS: 900
  CLIPPER_EDITORIAL_STARTUP_TIMEOUT_SECONDS: 1800
  CLIPPER_EDITORIAL_RUNTIME_SAFE_INPUT_TOKENS: 65536

jobs:
  deploy-modal-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact deployment checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLIPPER_DEPLOYED_GIT_SHA"

      - name: Require enabled Modal deployment request
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          marker = json.loads(
              Path("acceptance/modal-deploy-request.json").read_text(encoding="utf-8")
          )
          if not isinstance(marker, dict) or marker.get("enabled") is not True:
              raise SystemExit("Modal deployment request is disabled")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Modal deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Install Modal orchestration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Deploy exact-HEAD open-model workers
        shell: bash
        run: |
          set -euo pipefail
          modal deploy scripts/modal_open_models.py

      - name: Deploy exact-HEAD production pipeline worker
        shell: bash
        run: |
          set -euo pipefail
          modal deploy scripts/modal_pipeline.py

      - name: Verify both deployed apps exist
        shell: bash
        run: |
          set -euo pipefail
          modal app list --json | tee modal-apps.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          apps = json.loads(Path("modal-apps.txt").read_text(encoding="utf-8"))
          if not isinstance(apps, list):
              raise RuntimeError("modal app list --json did not return an array")
          deployed = {
              str(app.get("description") or "")
              for app in apps
              if isinstance(app, dict) and app.get("state") == "deployed"
          }
          expected = {
              os.environ["CLIPPER_MODAL_APP"],
              os.environ["CLIPPER_MODAL_PIPELINE_APP"],
          }
          missing = expected - deployed
          if missing:
              raise RuntimeError(f"deployed Modal apps missing: {sorted(missing)}")
          PY

      - name: Verify required deployed model handles resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          app = os.environ["CLIPPER_MODAL_APP"]
          required_functions = [
              "transcribe",
              "align",
              "diarize",
              "editorial_schema_smoke",
              "hf_access_smoke",
              "deployment_identity",
          ]
          for name in required_functions:
              modal.Function.from_name(app, name).hydrate()

          required_classes = [
              "EditorialModel",
              "VisionModel",
              "VisionModelLarge",
          ]
          for name in required_classes:
              modal.Cls.from_name(app, name).hydrate()

          evidence = {
              "status": "RESOLVED",
              "app": app,
              "functions": required_functions,
              "classes": required_classes,
          }
          Path("modal-model-handles.json").write_text(
              json.dumps(evidence, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify immutable deployed SHA identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          expected = os.environ["CLIPPER_DEPLOYED_GIT_SHA"].lower()
          model_identity = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "deployment_identity"
          ).remote()
          pipeline_identity = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "deployment_identity"
          ).remote()
          identities = {
              "model": model_identity,
              "pipeline": pipeline_identity,
          }
          for name, value in identities.items():
              if not isinstance(value, dict):
                  raise RuntimeError(f"{name} deployment identity is not an object: {value!r}")
              if str(value.get("deployed_git_sha") or "").lower() != expected:
                  raise RuntimeError(
                      f"{name} deployed SHA mismatch: expected={expected} value={value}"
                  )
          Path("modal-deployed-sha-identities.json").write_text(
              json.dumps(identities, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(identities, indent=2))
          PY

      - name: Verify editorial model spans allocated GPUs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          worker = modal.Cls.from_name(
              os.environ["CLIPPER_MODAL_APP"], "EditorialModel"
          )()
          result = worker.ready.remote()
          if not isinstance(result, dict):
              raise RuntimeError(
                  f"EditorialModel.ready returned {type(result).__name__}, expected object"
              )
          if result.get("error"):
              raise RuntimeError(json.dumps(result["error"], ensure_ascii=False))

          runtime = result.get("runtime")
          if not isinstance(runtime, dict):
              raise RuntimeError("EditorialModel.ready did not return runtime evidence")
          placement = runtime.get("editorial_placement")
          if not isinstance(placement, dict):
              raise RuntimeError("EditorialModel.ready did not return placement evidence")

          expected = placement.get("expected_gpu_count")
          observed = placement.get("model_gpu_indices")
          model_bytes = placement.get("model_bytes_by_device")
          if not isinstance(expected, int) or isinstance(expected, bool) or expected < 1:
              raise RuntimeError(f"invalid expected_gpu_count: {expected!r}")
          if not isinstance(observed, (list, tuple)):
              raise RuntimeError(f"invalid model_gpu_indices: {observed!r}")
          normalized = sorted(
              value
              for value in observed
              if isinstance(value, int) and not isinstance(value, bool) and value >= 0
          )
          required = list(range(expected))
          if normalized != required:
              raise RuntimeError(
                  "editorial model does not span all allocated GPUs: "
                  f"expected={required} observed={normalized} placement={placement}"
              )
          if not isinstance(model_bytes, dict):
              raise RuntimeError("editorial placement did not report model bytes by device")
          empty = [
              index
              for index in required
              if int(model_bytes.get(f"cuda:{index}") or 0) <= 0
          ]
          if empty:
              raise RuntimeError(
                  "editorial placement reports no model bytes on allocated GPUs: "
                  f"empty={empty} placement={placement}"
              )

          Path("modal-editorial-placement.json").write_text(
              json.dumps(placement, indent=2) + chr(10),
              encoding="utf-8",
          )
          print(json.dumps(placement, indent=2))
          PY

      - name: Verify all structured editorial task schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "editorial_schema_smoke"
          ).remote()
          assert isinstance(result, dict) and result.get("ok") is True, result
          assert result.get("task_families") == 4, result
          Path("modal-editorial-schema-smoke.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify named Hugging Face secret access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "hf_access_smoke"
          ).remote()
          assert isinstance(result, dict) and result.get("ok") is True, result
          Path("modal-hf-access.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify production endpoint resolves without invoking paid work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          function = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "run_full_cycle"
          )
          evidence = {
              "status": "RESOLVED",
              "app": os.environ["CLIPPER_MODAL_PIPELINE_APP"],
              "function": "run_full_cycle",
              "handle_type": type(function).__name__,
          }
          Path("modal-pipeline-endpoint.json").write_text(
              json.dumps(evidence, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("modal-worker-deployment.json").write_text(
              json.dumps(
                  {
                      "status": "DEPLOYED",
                      "model_app": os.environ["CLIPPER_MODAL_APP"],
                      "pipeline_app": os.environ["CLIPPER_MODAL_PIPELINE_APP"],
                      "git_sha": os.environ["CLIPPER_DEPLOYED_GIT_SHA"],
                      "model_functions_expected": [
                          "transcribe",
                          "align",
                          "diarize",
                          "editorial_schema_smoke",
                          "hf_access_smoke",
                          "deployment_identity",
                      ],
                      "model_classes_expected": [
                          "EditorialModel",
                          "VisionModel",
                          "VisionModelLarge",
                      ],
                      "pipeline_functions_expected": ["run_full_cycle", "deployment_identity"],
                      "editorial_task_families_expected": 4,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-workers-${{ github.sha }}
          path: |
            modal-apps.txt
            modal-editorial-schema-smoke.json
            modal-hf-access.json
            modal-pipeline-endpoint.json
            modal-model-handles.json
            modal-deployed-sha-identities.json
            modal-worker-deployment.json
          if-no-files-found: warn
          retention-days: 14
