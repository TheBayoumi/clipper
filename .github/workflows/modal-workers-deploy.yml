name: Deploy Modal workers

on:
  workflow_dispatch:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - "acceptance/modal-deploy-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: clipper-modal-workers-${{ github.ref }}
  cancel-in-progress: true

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline
  CLIPPER_DEPLOYED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CLIPPER_EDITORIAL_EXECUTION_TIMEOUT_SECONDS: 900
  CLIPPER_EDITORIAL_STARTUP_TIMEOUT_SECONDS: 1800
  CLIPPER_EDITORIAL_RUNTIME_SAFE_INPUT_TOKENS: 32768
  CLIPPER_EDITORIAL_GENERATION_DEADLINE_SECONDS: 300

jobs:
  deploy-modal-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact deployment checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLIPPER_DEPLOYED_GIT_SHA"

      - name: Require enabled Modal deployment request
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          marker = json.loads(
              Path("acceptance/modal-deploy-request.json").read_text(encoding="utf-8")
          )
          if not isinstance(marker, dict) or marker.get("enabled") is not True:
              raise SystemExit("Modal deployment request is disabled")
          PY

      - name: Wait for successful exact-head CI and smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["CLIPPER_DEPLOYED_GIT_SHA"]
          workflows = ("ci.yml", "deploy-and-smoke.yml")

          def runs_for(workflow: str) -> list[dict[str, object]]:
              query = urllib.parse.urlencode({"head_sha": sha, "per_page": 20})
              url = (
                  f"https://api.github.com/repos/{repository}/actions/workflows/"
                  f"{workflow}/runs?{query}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              return [
                  item
                  for item in payload.get("workflow_runs", [])
                  if isinstance(item, dict) and item.get("head_sha") == sha
              ]

          pending = set(workflows)
          for _attempt in range(180):
              for workflow in tuple(pending):
                  runs = runs_for(workflow)
                  successful = [
                      item
                      for item in runs
                      if item.get("status") == "completed"
                      and item.get("conclusion") == "success"
                  ]
                  if successful:
                      pending.remove(workflow)
                      continue
                  running = [
                      item
                      for item in runs
                      if item.get("status") in {"queued", "in_progress", "waiting", "pending"}
                  ]
                  failed = [
                      item
                      for item in runs
                      if item.get("status") == "completed"
                      and item.get("conclusion") not in {None, "success"}
                  ]
                  if failed and not running:
                      latest = max(
                          failed,
                          key=lambda item: int(item.get("run_number") or 0),
                      )
                      raise RuntimeError(
                          "exact-head static gate failed before Modal deployment: "
                          f"workflow={workflow} sha={sha} "
                          f"run_id={latest.get('id')} conclusion={latest.get('conclusion')}"
                      )
              if not pending:
                  print(
                      json.dumps(
                          {
                              "status": "PASS",
                              "deployment_sha": sha,
                              "workflows": list(workflows),
                          },
                          sort_keys=True,
                      )
                  )
                  break
              time.sleep(10)
          else:
              raise RuntimeError(
                  "timed out waiting for exact-head static gates before Modal deployment: "
                  f"sha={sha} pending={sorted(pending)}"
              )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Modal deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"

      - name: Install Modal orchestration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Deploy exact-HEAD open-model workers
        shell: bash
        run: |
          set -euo pipefail
          modal deploy scripts/modal_open_models.py

      - name: Deploy exact-HEAD production pipeline worker
        shell: bash
        run: |
          set -euo pipefail
          modal deploy scripts/modal_pipeline.py

      - name: Verify both deployed apps exist
        shell: bash
        run: |
          set -euo pipefail
          modal app list --json | tee modal-apps.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          apps = json.loads(Path("modal-apps.txt").read_text(encoding="utf-8"))
          if not isinstance(apps, list):
              raise RuntimeError("modal app list --json did not return an array")
          deployed = {
              str(app.get("description") or "")
              for app in apps
              if isinstance(app, dict) and app.get("state") == "deployed"
          }
          expected = {
              os.environ["CLIPPER_MODAL_APP"],
              os.environ["CLIPPER_MODAL_PIPELINE_APP"],
          }
          missing = expected - deployed
          if missing:
              raise RuntimeError(f"deployed Modal apps missing: {sorted(missing)}")
          PY

      - name: Verify required deployed model handles resolve
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          app = os.environ["CLIPPER_MODAL_APP"]
          required_functions = [
              "transcribe",
              "align",
              "diarize",
              "editorial_schema_smoke",
              "hf_access_smoke",
              "deployment_identity",
          ]
          for name in required_functions:
              modal.Function.from_name(app, name).hydrate()

          required_classes = [
              "EditorialModel",
              "VisionModel",
              "VisionModelLarge",
          ]
          for name in required_classes:
              modal.Cls.from_name(app, name).hydrate()

          evidence = {
              "status": "RESOLVED",
              "app": app,
              "functions": required_functions,
              "classes": required_classes,
          }
          Path("modal-model-handles.json").write_text(
              json.dumps(evidence, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify immutable deployed SHA identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          expected = os.environ["CLIPPER_DEPLOYED_GIT_SHA"].lower()
          model_identity = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "deployment_identity"
          ).remote()
          pipeline_identity = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "deployment_identity"
          ).remote()
          identities = {
              "model": model_identity,
              "pipeline": pipeline_identity,
          }
          for name, value in identities.items():
              if not isinstance(value, dict):
                  raise RuntimeError(f"{name} deployment identity is not an object: {value!r}")
              if str(value.get("deployed_git_sha") or "").lower() != expected:
                  raise RuntimeError(
                      f"{name} deployed SHA mismatch: expected={expected} value={value}"
                  )
          Path("modal-deployed-sha-identities.json").write_text(
              json.dumps(identities, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(identities, indent=2))
          PY

      - name: Verify editorial generation runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "editorial_schema_smoke"
          ).remote()
          if not isinstance(result, dict) or result.get("ok") is not True:
              raise RuntimeError(f"editorial runtime contract smoke failed: {result!r}")
          contract = result.get("generation_runtime_contract")
          if not isinstance(contract, dict):
              raise RuntimeError(
                  f"editorial runtime contract evidence is missing: {result!r}"
              )
          if contract.get("outlines_version") != "1.3.0":
              raise RuntimeError(
                  "deployed Outlines version does not match verified adapter: "
                  f"{contract.get('outlines_version')!r}"
              )
          if contract.get("transformers_version") != "4.57.3":
              raise RuntimeError(
                  "deployed Transformers version does not match verified runtime: "
                  f"{contract.get('transformers_version')!r}"
              )
          if contract.get("outlines_max_time_forwarded") is not True:
              raise RuntimeError(
                  f"Outlines max_time forwarding contract failed: {contract!r}"
              )
          if contract.get("transformers_max_time_supported") is not True:
              raise RuntimeError(
                  f"Transformers max_time contract failed: {contract!r}"
              )
          expected_deadline = float(
              os.environ["CLIPPER_EDITORIAL_GENERATION_DEADLINE_SECONDS"]
          )
          observed_deadline = float(contract.get("max_time_seconds") or 0.0)
          if not math.isclose(
              observed_deadline,
              expected_deadline,
              rel_tol=0.0,
              abs_tol=1e-9,
          ):
              raise RuntimeError(
                  "deployed generation deadline contract drifted: "
                  f"expected={expected_deadline} observed={observed_deadline}"
              )

          Path("modal-editorial-runtime-contract.json").write_text(
              json.dumps(contract, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(contract, indent=2))
          PY

      - name: Verify editorial model spans allocated GPUs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          worker = modal.Cls.from_name(
              os.environ["CLIPPER_MODAL_APP"], "EditorialModel"
          )()
          result = worker.ready.remote()
          if not isinstance(result, dict):
              raise RuntimeError(
                  f"EditorialModel.ready returned {type(result).__name__}, expected object"
              )
          if result.get("error"):
              raise RuntimeError(json.dumps(result["error"], ensure_ascii=False))

          runtime = result.get("runtime")
          if not isinstance(runtime, dict):
              raise RuntimeError("EditorialModel.ready did not return runtime evidence")
          placement = runtime.get("editorial_placement")
          if not isinstance(placement, dict):
              raise RuntimeError("EditorialModel.ready did not return placement evidence")

          expected = placement.get("expected_gpu_count")
          observed = placement.get("model_gpu_indices")
          model_bytes = placement.get("model_bytes_by_device")
          if not isinstance(expected, int) or isinstance(expected, bool) or expected < 1:
              raise RuntimeError(f"invalid expected_gpu_count: {expected!r}")
          if not isinstance(observed, (list, tuple)):
              raise RuntimeError(f"invalid model_gpu_indices: {observed!r}")
          normalized = sorted(
              value
              for value in observed
              if isinstance(value, int) and not isinstance(value, bool) and value >= 0
          )
          required = list(range(expected))
          if normalized != required:
              raise RuntimeError(
                  "editorial model does not span all allocated GPUs: "
                  f"expected={required} observed={normalized} placement={placement}"
              )
          if not isinstance(model_bytes, dict):
              raise RuntimeError("editorial placement did not report model bytes by device")
          empty = [
              index
              for index in required
              if int(model_bytes.get(f"cuda:{index}") or 0) <= 0
          ]
          if empty:
              raise RuntimeError(
                  "editorial placement reports no model bytes on allocated GPUs: "
                  f"empty={empty} placement={placement}"
              )

          Path("modal-editorial-placement.json").write_text(
              json.dumps(placement, indent=2) + chr(10),
              encoding="utf-8",
          )
          print(json.dumps(placement, indent=2))
          PY

      - name: Verify all structured editorial task schemas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "editorial_schema_smoke"
          ).remote()
          assert isinstance(result, dict) and result.get("ok") is True, result
          assert result.get("task_families") == 4, result
          Path("modal-editorial-schema-smoke.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify named Hugging Face secret access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "hf_access_smoke"
          ).remote()
          assert isinstance(result, dict) and result.get("ok") is True, result
          Path("modal-hf-access.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify production endpoint resolves without invoking paid work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import modal

          function = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_PIPELINE_APP"], "run_full_cycle"
          )
          evidence = {
              "status": "RESOLVED",
              "app": os.environ["CLIPPER_MODAL_PIPELINE_APP"],
              "function": "run_full_cycle",
              "handle_type": type(function).__name__,
          }
          Path("modal-pipeline-endpoint.json").write_text(
              json.dumps(evidence, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("modal-worker-deployment.json").write_text(
              json.dumps(
                  {
                      "status": "DEPLOYED",
                      "model_app": os.environ["CLIPPER_MODAL_APP"],
                      "pipeline_app": os.environ["CLIPPER_MODAL_PIPELINE_APP"],
                      "git_sha": os.environ["CLIPPER_DEPLOYED_GIT_SHA"],
                      "model_functions_expected": [
                          "transcribe",
                          "align",
                          "diarize",
                          "editorial_schema_smoke",
                          "hf_access_smoke",
                          "deployment_identity",
                      ],
                      "model_classes_expected": [
                          "EditorialModel",
                          "VisionModel",
                          "VisionModelLarge",
                      ],
                      "pipeline_functions_expected": ["run_full_cycle", "deployment_identity"],
                      "editorial_task_families_expected": 4,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-workers-${{ github.sha }}
          path: |
            modal-apps.txt
            modal-editorial-schema-smoke.json
            modal-editorial-runtime-contract.json
            modal-hf-access.json
            modal-pipeline-endpoint.json
            modal-model-handles.json
            modal-deployed-sha-identities.json
            modal-worker-deployment.json
          if-no-files-found: warn
          retention-days: 14
