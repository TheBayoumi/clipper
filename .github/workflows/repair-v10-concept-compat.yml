name: Repair V10 concept compatibility

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/repair-v10-concept-compat.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply compatibility repair
        run: |
          echo '' | base64 -d > /tmp/repair.py
          python /tmp/repair.py
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Quality gate
        run: |
          ruff format src/clipper/autonomous_editor.py
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/clipper/autonomous_editor.py
          git commit -m 'fix: resolve unique legacy StoryMoment references'
          git push origin HEAD:feat/word-reveal-face-tracking
