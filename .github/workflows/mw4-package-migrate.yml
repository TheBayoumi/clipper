name: MW4 compatibility shim migration

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/mw4-package-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mw4-fullframe-retention-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace legacy MW4 implementations with package shims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scripts = Path("scripts")
          sources = sorted(scripts.glob("mw4_*.py"))
          if len(sources) < 20:
              raise RuntimeError("refusing incomplete MW4 shim migration")

          template = '''from __future__ import annotations

          import importlib
          import sys
          from pathlib import Path
          from types import ModuleType
          from typing import Any

          _SRC = Path(__file__).resolve().parents[1] / "src"
          if str(_SRC) not in sys.path:
              sys.path.insert(0, str(_SRC))

          _IMPL: ModuleType = importlib.import_module("clipper_mw4.{module}")


          def __getattr__(name: str) -> Any:
              return getattr(_IMPL, name)


          def __dir__() -> list[str]:
              return sorted(set(globals()) | set(dir(_IMPL)))


          def _main() -> None:
              entrypoint = getattr(_IMPL, "main", None)
              if not callable(entrypoint):
                  raise RuntimeError("installed MW4 compatibility target has no main()")
              entrypoint()


          if __name__ == "__main__":
              _main()
          '''

          for source in sources:
              source.write_text(
                  template.format(module=source.stem),
                  encoding="utf-8",
              )
          print(f"replaced {len(sources)} legacy MW4 modules with compatibility shims")
          PY
      - name: Verify compatibility shims
        run: |
          python -m pip install "ruff>=0.15.22,<1"
          ruff check scripts/mw4_*.py --fix
          ruff format scripts/mw4_*.py
          ruff check scripts/mw4_*.py
          ruff format --check scripts/mw4_*.py
          git diff --check
      - name: Commit compatibility shims
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mw4_*.py
          git commit -m "refactor(mw4): make legacy scripts package compatibility shims"
          git push origin HEAD:feat/mw4-fullframe-retention-v3-1
