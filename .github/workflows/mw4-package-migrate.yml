name: MW4 package migration

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/mw4-package-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mw4-fullframe-retention-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy canonical MW4 graph into installed package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_root = Path("scripts")
          package_root = Path("src/clipper_mw4")
          package_root.mkdir(parents=True, exist_ok=True)
          (package_root / "__init__.py").write_text(
              '"""Installed Modern Warfare 4 v3.1 implementation package."""\n',
              encoding="utf-8",
          )

          import_pattern = re.compile(
              r"^import (mw4_[A-Za-z0-9_]+)( as [A-Za-z_][A-Za-z0-9_]*)?$",
              re.MULTILINE,
          )
          from_pattern = re.compile(
              r"^from (mw4_[A-Za-z0-9_]+) import ",
              re.MULTILINE,
          )

          copied = []
          for source in sorted(source_root.glob("mw4_*.py")):
              text = source.read_text(encoding="utf-8")
              text = import_pattern.sub(
                  lambda match: (
                      f"from . import {match.group(1)}{match.group(2) or ''}"
                  ),
                  text,
              )
              text = from_pattern.sub(r"from .\1 import ", text)
              target = package_root / source.name
              target.write_text(text, encoding="utf-8")
              copied.append(source.name)

          if len(copied) < 20:
              raise RuntimeError(f"incomplete MW4 package migration: {copied}")
          print(f"copied {len(copied)} MW4 modules into {package_root}")
          PY
      - name: Normalize migrated package
        run: |
          python -m pip install "ruff>=0.15.22,<1"
          ruff check src/clipper_mw4 --fix
          ruff format src/clipper_mw4
          ruff check src/clipper_mw4
          ruff format --check src/clipper_mw4
          git diff --check
      - name: Commit installed MW4 package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clipper_mw4
          git commit -m "refactor(mw4): package canonical implementation graph"
          git push origin HEAD:feat/mw4-fullframe-retention-v3-1
