name: Apply CUDA speech runtime hotfix

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - ".github/workflows/apply-cuda-speech-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0
      - name: Apply exact hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          exec(base64.b64decode("").decode())
          PY
          python -m py_compile scripts/modal_open_models.py
          git diff --check
      - name: Commit hotfix to campaign branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(modal): provision CUDA 12 speech runtime"
          git push origin HEAD:feat/contentrewards-campaign-factory
