name: Apply CUDA speech runtime hotfix

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - ".github/workflows/apply-cuda-speech-hotfix.yml"

permissions:
  contents: write

env:
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
  CLIPPER_MODAL_APP: clipper-open-editor
  CLIPPER_MODAL_PIPELINE_APP: clipper-production-pipeline

jobs:
  patch-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0

      - name: Apply exact speech-runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          exec(base64.b64decode("").decode())
          PY
          python -m py_compile scripts/modal_open_models.py
          git diff --check

      - name: Commit production hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(modal): provision CUDA 12 speech runtime"
          git push origin HEAD:feat/contentrewards-campaign-factory
          echo "CLIPPER_DEPLOYED_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal orchestration dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[modal]'

      - name: Deploy exact hotfixed workers
        shell: bash
        run: |
          set -euo pipefail
          modal deploy scripts/modal_open_models.py
          modal deploy scripts/modal_pipeline.py

      - name: Prove CUDA speech runtime is usable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import modal

          result = modal.Function.from_name(
              os.environ["CLIPPER_MODAL_APP"], "speech_cuda_smoke"
          ).remote()
          if not isinstance(result, dict) or result.get("ok") is not True:
              raise RuntimeError(f"speech CUDA smoke failed: {result!r}")
          if result.get("cublas") != "libcublas.so.12":
              raise RuntimeError(f"cuBLAS 12 not resolved: {result!r}")
          if str(result.get("deployed_git_sha") or "").lower() != os.environ["CLIPPER_DEPLOYED_GIT_SHA"].lower():
              raise RuntimeError(f"deployed SHA mismatch: {result!r}")
          print(json.dumps(result, indent=2))
          PY
