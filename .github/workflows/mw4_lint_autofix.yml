name: MW4 lint unsafe-fix audit

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/mw4_lint_autofix.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Audit non-E501 unsafe Ruff fixes
        run: >-
          ruff check .
          --select RUF046,B905,RUF005,RUF007,RUF012,E731,SIM118,SIM108
          --fix --unsafe-fixes --diff || true
