name: MW4 lint autofix

on:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/workflows/mw4_lint_autofix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mw4-fullframe-retention-v3-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply safe Ruff fixes
        run: ruff check . --fix || true
      - name: Apply Ruff formatter
        run: ruff format .
      - name: Show remaining Ruff findings
        run: ruff check . || true
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit mechanical lint cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(mw4): apply Ruff safe fixes and formatting"
          git push origin HEAD:feat/mw4-fullframe-retention-v3-1
