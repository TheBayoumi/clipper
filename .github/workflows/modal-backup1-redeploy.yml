name: Clipper explicit Modal backup-1 redeploy and execution proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipper-modal-backup1-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-24.04
    env:
      MODAL_TOKEN_ID_2: ${{ secrets.MODAL_TOKEN_ID_2 }}
      MODAL_TOKEN_SECRET_2: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_ENVIRONMENT: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Modal CLI
        run: python -m pip install 'modal==1.5.5'
      - name: Pin credential to actual backup-1 workspace, with fail-closed identity gate
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID_2" && test -n "$MODAL_TOKEN_SECRET_2" || {
            echo "::error::Missing backup-1 API credentials"; exit 2;
          }
          echo "MODAL_TOKEN_ID=$MODAL_TOKEN_ID_2" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$MODAL_TOKEN_SECRET_2" >> "$GITHUB_ENV"
          echo "MODAL_AUTH_SELECTED=BACKUP_SLOT_2"
          # Credentials are never printed. The token's actual workspace is.
          MODAL_TOKEN_ID="$MODAL_TOKEN_ID_2" MODAL_TOKEN_SECRET="$MODAL_TOKEN_SECRET_2" \
            modal token info > /tmp/clipper-modal-token-info.txt
          python - <<'PY'
          import re
          from pathlib import Path
          raw = re.sub(r"\x1b\[[0-9;]*m", "", Path("/tmp/clipper-modal-token-info.txt").read_text())
          matches = [
              re.search(r"(?im)^\s*workspace(?:\s+name)?\s*[:=]\s*([a-zA-Z0-9_.-]+)", raw),
              re.search(r"(?im)authenticated\s+to\s+workspace\s+([a-zA-Z0-9_.-]+)", raw),
              re.search(r"(?im)workspace\s+['\"]([a-zA-Z0-9_.-]+)['\"]", raw),
          ]
          identity = next((m.group(1) for m in matches if m), None)
          print(f"MODAL_AUTH_WORKSPACE={identity or 'UNKNOWN'}")
          if identity != "mahmoud-bayoumi-bb":
              raise SystemExit("::error::Refusing deploy: token does not identify mahmoud-bayoumi-bb")
          print("MODAL_ACCOUNT_IDENTITY_GATE_PASSED=true")
          PY
      - name: Inventory existing applications in the selected workspace
        run: |
          set -euo pipefail
          modal app list --json > /tmp/clipper-modal-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/clipper-modal-before.json").read_text())
          rows=data if isinstance(data,list) else data.get("apps",data.get("items",[]))
          for app in rows if isinstance(rows,list) else []:
              name=str(app.get("name","")) if isinstance(app,dict) else ""
              if "clipper-" in name:
                  print("MODAL_EXISTING_APP",name)
          print("MODAL_APP_INVENTORY_COMPLETED")
          PY
      - name: Redeploy Qwen image generator on backup 1, bypassing local deployment-reuse logic
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          modal secret create clipper-wan-hf "HF_TOKEN=$HF_TOKEN" --force > /dev/null
          SRC=scripts/modal_qwen_keyframes.py
          HASH="$(sha256sum "$SRC" | cut -c1-16)"
          NAME="clipper-qwen-cinematic-keyframes-${HASH}"
          echo "CLIPPER_MODAL_QWEN_APP=$NAME" >> "$GITHUB_ENV"
          echo "MODAL_EXPLICIT_REDEPLOY_START app=$NAME workspace=mahmoud-bayoumi-bb"
          # Always execute modal deploy. No deployment probe, reuse or artifact cache.
          CLIPPER_MODAL_APP_NAME="$NAME" modal deploy --name "$NAME" --env main "$SRC" --timestamps
          echo "MODAL_EXPLICIT_REDEPLOY_SUCCEEDED app=$NAME"
          modal app info --env main "$NAME" --json > /tmp/clipper-qwen-deploy-info.json
          echo "MODAL_QWEN_DEPLOYMENT_INSPECTED app=$NAME"
      - name: Redeploy Wan S2V on backup 1, bypassing local deployment-reuse logic
        run: |
          set -euo pipefail
          SRC=scripts/modal_wan_s2v.py
          HASH="$(sha256sum "$SRC" | cut -c1-16)"
          NAME="clipper-wan-s2v-${HASH}"
          echo "CLIPPER_MODAL_WAN_APP=$NAME" >> "$GITHUB_ENV"
          echo "MODAL_EXPLICIT_REDEPLOY_START app=$NAME workspace=mahmoud-bayoumi-bb"
          CLIPPER_MODAL_APP_NAME="$NAME" modal deploy --name "$NAME" --env main "$SRC" --timestamps
          echo "MODAL_EXPLICIT_REDEPLOY_SUCCEEDED app=$NAME"
          modal app info --env main "$NAME" --json > /tmp/clipper-wan-deploy-info.json
          echo "MODAL_WAN_DEPLOYMENT_INSPECTED app=$NAME"
      - name: Execute short A100 function on backup 1 and capture actual Modal invocation logs
        run: |
          set -euo pipefail
          echo "MODAL_REAL_GPU_INVOCATION_START workspace=mahmoud-bayoumi-bb"
          modal run --env main scripts/modal_a100_access_probe.py --timestamps
          echo "MODAL_REAL_GPU_INVOCATION_PASSED workspace=mahmoud-bayoumi-bb"
      - name: Report and archive only non-secret deployment evidence
        if: always()
        run: |
          echo "MODAL_BACKUP1_REDEPLOY_AUDIT_RUN=$GITHUB_RUN_ID"
          echo "MODAL_BACKUP1_TARGET_WORKSPACE=mahmoud-bayoumi-bb"
          echo "Check earlier steps for explicit deploy completion and GPU invocation outcomes."
      - name: Upload non-secret app metadata when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-backup1-deployment-evidence-${{ github.run_id }}
          path: |
            /tmp/clipper-qwen-deploy-info.json
            /tmp/clipper-wan-deploy-info.json
          if-no-files-found: ignore
          retention-days: 14
