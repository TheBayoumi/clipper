name: V10 pin Sortformer Numba once

on:
  push:
    branches:
      - feat/word-reveal-face-tracking
    paths:
      - ".github/workflows/v10-pin-numba-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking

      - name: Pin Python 3.12-compatible Numba in Sortformer image
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/modal_v10_cycle.py")
          text = path.read_text(encoding="utf-8")
          old = '''        "torch>=2.8,<3",
                  "nemo_toolkit[asr]>=2.5,<3",
          '''
          new = '''        "torch>=2.8,<3",
                  "numba==0.66.0",
                  "nemo_toolkit[asr]>=2.5,<3",
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Sortformer dependency block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit exact dependency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_v10_cycle.py
          git commit -m "fix: pin Python 3.12-compatible Numba for Sortformer"
          git push origin HEAD:feat/word-reveal-face-tracking
