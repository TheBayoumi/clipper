name: Publish tested image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: clipper-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-tested-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Resolve exact source and image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.workflow_run.head_sha }}"
          test "${source_sha}" = "${expected_sha}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/clipper"
          tag="sha-${source_sha::12}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build deployment image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          docker build \
            --pull \
            --build-arg "CLIPPER_SOURCE_SHA=${source_sha}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --tag "${image}:${tag}" \
            .

      - name: Preflight published CLI runtimes inside image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          docker run --rm "${image}:${tag}" preflight --profile balanced
          docker run --rm "${image}:${tag}" preflight --profile local-lite --allow-local-lite
          docker run --rm \
            --env "EXPECTED_SOURCE_SHA=${source_sha}" \
            --entrypoint python \
            "${image}:${tag}" \
            -c 'import os; from clipper.modal_execution import _runtime_source_sha; assert _runtime_source_sha() == os.environ["EXPECTED_SOURCE_SHA"]'

      - name: Run end-to-end smoke test inside image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          mkdir -p smoke-artifacts
          docker run --rm \
            --env "CLIPPER_IMAGE_REF=${image}:${tag}" \
            --env "GITHUB_SHA=${source_sha}" \
            --volume "${PWD}/smoke-artifacts:/artifacts" \
            --entrypoint python \
            "${image}:${tag}" \
            /app/scripts/smoke_e2e.py --output-root /artifacts

      - name: Publish exact tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}:${tag}"

      - name: Verify registry round trip
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          image_ref="${image}:${tag}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          docker image rm "${image_ref}"
          docker pull "${image_ref}"
          revision="$(docker image inspect "${image_ref}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "${revision}" = "${source_sha}"
