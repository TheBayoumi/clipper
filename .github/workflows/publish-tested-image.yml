name: Publish tested image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: clipper-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-tested-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve exact source and image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "${source_sha}" = "${GITHUB_SHA}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/clipper"
          tag="sha-${source_sha::12}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build deployment image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          docker build \
            --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${source_sha}" \
            --tag "${image}:${tag}" \
            .

      - name: Run end-to-end smoke test inside image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          mkdir -p smoke-artifacts
          docker run --rm \
            --env "CLIPPER_IMAGE_REF=${image}:${tag}" \
            --env "GITHUB_SHA=${source_sha}" \
            --volume "${PWD}/smoke-artifacts:/artifacts" \
            --entrypoint python \
            "${image}:${tag}" \
            /app/scripts/smoke_e2e.py --output-root /artifacts

      - name: Publish exact tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${image}:${tag}"
          docker tag "${image}:${tag}" "${image}:latest"
          docker push "${image}:latest"

      - name: Verify registry round trip
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          tag="${{ steps.image.outputs.tag }}"
          image_ref="${image}:${tag}"
          source_sha="${{ steps.image.outputs.source_sha }}"
          docker image rm "${image_ref}"
          docker pull "${image_ref}"
          revision="$(docker image inspect "${image_ref}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "${revision}" = "${source_sha}"
