name: Lovable current brief content probe

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/lovable-current-brief-content-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load current Notion page data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          page_id = "3b4ef8cf-46ec-8000-a7f0-fefa6b69fc67"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
              "Content-Type": "application/json",
          }
          documents = []
          diagnostics = []
          payloads = [
              {"pageId": page_id, "limit": 100, "cursor": {"stack": []}},
              {"pageId": page_id, "limit": 100, "chunkNumber": 0, "verticalColumns": False},
          ]
          for endpoint in ("loadPageChunk", "loadCachedPageChunk"):
              for index, payload in enumerate(payloads):
                  url = f"https://www.notion.so/api/v3/{endpoint}"
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read().decode("utf-8", "replace")
                          documents.append((f"{endpoint}-{index}", body))
                          diagnostics.append(
                              {
                                  "endpoint": endpoint,
                                  "payload": payload,
                                  "status": response.status,
                                  "bytes": len(body.encode("utf-8")),
                              }
                          )
                  except Exception as exc:
                      diagnostics.append(
                          {
                              "endpoint": endpoint,
                              "payload": payload,
                              "error": f"{type(exc).__name__}: {exc}",
                          }
                      )

          combined = "\n".join(body for _, body in documents)
          # Extract Notion rich-text strings and useful surrounding fragments.
          strings = []
          for match in re.finditer(r'"([^"\\]*(?:\\.[^"\\]*)*)"', combined):
              raw = match.group(1)
              try:
                  value = json.loads('"' + raw + '"')
              except Exception:
                  continue
              if not isinstance(value, str):
                  continue
              value = " ".join(value.split())
              if len(value) < 2 or value.startswith(("http://", "https://")):
                  continue
              if value not in strings:
                  strings.append(value)

          keywords = (
              "second", "duration", "LovablePartner", "Tier", "comment", "Anton",
              "visible", "submit", "minute", "account", "TikTok", "Instagram",
              "YouTube", "clip", "rule", "requirement", "source", "video"
          )
          relevant = []
          lower_keywords = tuple(keyword.casefold() for keyword in keywords)
          for value in strings:
              folded = value.casefold()
              if any(keyword in folded for keyword in lower_keywords):
                  relevant.append(value)

          result = {
              "page_id": page_id,
              "diagnostics": diagnostics,
              "relevant_strings": relevant[:500],
              "all_strings": strings[:3000],
          }
          Path("current-lovable-brief-content.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          for name, body in documents:
              Path(f"notion-current-{name}.json").write_text(body, encoding="utf-8")
          print(json.dumps(result, indent=2, ensure_ascii=False))
          if not documents:
              raise SystemExit("Notion page data could not be loaded")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lovable-current-brief-content
          path: |
            current-lovable-brief-content.json
            notion-current-*.json
          if-no-files-found: error
