name: Repair Modal contracts

on:
  push:
    branches:
      - feat/word-reveal-face-tracking

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TheBayoumi/clipper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/_repair_modal_contracts_once.py
      - run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format \
            scripts/modal_pipeline.py \
            scripts/modal_open_models.py \
            scripts/run_modal_finalist_recovery.py \
            tests/test_modal_pipeline_source_contract.py \
            tests/test_coverage_floor_contract_edges.py
          ruff check .
          ruff format --check .
          mypy
          pytest
          coverage report --fail-under=95
          git diff --check
      - run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair-modal-contracts.yml scripts/_repair_modal_contracts_once.py
          git add \
            scripts/modal_pipeline.py \
            scripts/modal_open_models.py \
            scripts/run_modal_finalist_recovery.py \
            tests/test_modal_pipeline_source_contract.py \
            tests/test_coverage_floor_contract_edges.py
          git commit -m "fix: align Modal runtime with dynamic quality yield"
          git push origin HEAD:feat/word-reveal-face-tracking
