name: Lovable guideline source probe

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/lovable-guideline-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official public Notion source list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          page_id = "353e969c-a5a2-80e2-8a13-e053b933250a"
          page_url = "https://www.notion.so/lovabledev/Anton-interviews-for-clipping-353e969ca5a280e28a13e053b933250a"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }
          documents = []
          diagnostics = []

          def request(url: str, *, payload: dict | None = None) -> str:
              data = None
              request_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=request_headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode("utf-8", "replace")
                  diagnostics.append(
                      {"url": url, "status": response.status, "bytes": len(body.encode("utf-8"))}
                  )
                  return body

          try:
              documents.append(("page_html", request(page_url)))
          except Exception as exc:
              diagnostics.append({"url": page_url, "error": f"{type(exc).__name__}: {exc}"})

          payloads = [
              {"pageId": page_id, "limit": 100, "cursor": {"stack": []}},
              {"pageId": page_id, "limit": 100, "chunkNumber": 0, "verticalColumns": False},
          ]
          for endpoint in ("loadPageChunk", "loadCachedPageChunk"):
              for index, payload in enumerate(payloads):
                  url = f"https://www.notion.so/api/v3/{endpoint}"
                  try:
                      documents.append((f"{endpoint}_{index}", request(url, payload=payload)))
                  except Exception as exc:
                      diagnostics.append(
                          {
                              "url": url,
                              "payload": payload,
                              "error": f"{type(exc).__name__}: {exc}",
                          }
                      )

          combined = "\n".join(body for _, body in documents)
          decoded = html.unescape(combined).replace("\\u002F", "/").replace("\\/", "/")
          url_pattern = re.compile(
              r'https?://(?:www\.)?(?:youtube\.com/(?:watch\?v=|live/|shorts/)[A-Za-z0-9_-]+|youtu\.be/[A-Za-z0-9_-]+)[^"\\\\\s<]*',
              re.IGNORECASE,
          )
          urls = list(dict.fromkeys(match.rstrip(",.;)]}") for match in url_pattern.findall(decoded)))
          video_ids = []
          for url in urls:
              match = re.search(r'(?:v=|youtu\.be/|live/|shorts/)([A-Za-z0-9_-]{6,})', url)
              if match:
                  video_ids.append(match.group(1))
          video_ids = list(dict.fromkeys(video_ids))

          text_fragments = []
          for pattern in (
              r'.{0,180}(?:Anton|Lovable|YouTube|interview|podcast).{0,260}',
              r'.{0,180}(?:lJX8VkZg-Vw|DZtGxNs9AVg|DHLczPQj9rA).{0,260}',
          ):
              for match in re.finditer(pattern, decoded, flags=re.IGNORECASE | re.DOTALL):
                  fragment = re.sub(r'\s+', ' ', match.group(0)).strip()
                  if fragment and fragment not in text_fragments:
                      text_fragments.append(fragment[:700])
                  if len(text_fragments) >= 80:
                      break

          result = {
              "page_id": page_id,
              "page_url": page_url,
              "youtube_urls": urls,
              "video_ids": video_ids,
              "candidate_membership": {
                  "lJX8VkZg-Vw": "lJX8VkZg-Vw" in video_ids,
                  "DZtGxNs9AVg": "DZtGxNs9AVg" in video_ids,
                  "DHLczPQj9rA": "DHLczPQj9rA" in video_ids,
              },
              "text_fragments": text_fragments,
              "diagnostics": diagnostics,
          }
          Path("lovable-guideline-probe.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          for name, body in documents:
              Path(f"notion-{name}.txt").write_text(body, encoding="utf-8")
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lovable-guideline-probe
          path: |
            lovable-guideline-probe.json
            notion-*.txt
          if-no-files-found: error
