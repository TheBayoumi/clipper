name: Apply required visual presence policy v4

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/apply-lovable-engine-patch-v4.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply visual policy patch
        run: |
          python scripts/apply_lovable_visual_policy_patch.py
          python scripts/fix_lovable_visual_contextvar_patch.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Static validation of production code
        run: |
          ruff format src tests/test_visual_presence_policy.py
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Full test suite and coverage
        run: pytest -q
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/clipper tests/test_visual_presence_policy.py
          git commit -m 'feat: enforce required visual presence'
          git pull --rebase origin feat/contentrewards-campaign-factory
          git push origin HEAD:feat/contentrewards-campaign-factory
