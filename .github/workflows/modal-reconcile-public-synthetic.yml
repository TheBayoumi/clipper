name: Exact-ID public synthetic App reconciliation (one-shot)

# Temporary incident cleanup only. Pushing THIS file is the sole activation.
on:
  push:
    branches: [review/unified-tts-cleanup]
    paths:
      - ".github/workflows/modal-reconcile-public-synthetic.yml"

permissions:
  contents: read

concurrency:
  group: modal-reconcile-public-synthetic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  exact-app-reconciliation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/review/unified-tts-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Python 3.11 without credentials
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact Modal SDK without credentials
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir "modal==1.5.5"

      - name: Verify workspace, reconcile only the known App ID
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          unset MODAL_PROFILE
          timeout --signal=TERM --kill-after=10s 60s python -I - <<'PY'
          import contextlib
          import json
          import os
          import subprocess
          import sys
          import time

          APP_ID = "ap-8lq3aNsHtFapUbn8f0AQml"
          WORKSPACE = "mahmoud-bayoumi-mm"
          ENV = "main"
          LIST = ["modal", "app", "list", "--json", "--env", ENV]
          STOP = ["modal", "app", "stop", "-y", "--env", ENV, APP_ID]
          errors = []
          observations = []
          stop_attempted = False

          def report(status):
              payload = {
                  "status": status,
                  "workspace_verified": workspace_verified,
                  "target_app_id": APP_ID,
                  "stop_attempted": stop_attempted,
                  "observations": observations,
                  "errors": errors,
                  "provider_removal": "NOT_CLAIMED",
              }
              print(json.dumps(payload, sort_keys=True))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write("Exact-ID public synthetic cleanup: " + status + "\n\n")
                  stream.write("~~~json\n" + json.dumps(payload, sort_keys=True) + "\n~~~\n")

          def command(argv, seconds):
              try:
                  result = subprocess.run(
                      argv, check=False, text=True, capture_output=True, timeout=seconds
                  )
              except (OSError, subprocess.SubprocessError) as exc:
                  errors.append("cli:" + type(exc).__name__)
                  return None
              if result.returncode != 0:
                  errors.append("cli:nonzero:" + str(result.returncode))
                  return None
              return result.stdout

          def observe():
              raw = command(LIST, 8)
              if raw is None:
                  return False
              try:
                  rows = json.loads(raw)
              except (ValueError, TypeError):
                  errors.append("list:invalid_json")
                  return False
              if not isinstance(rows, list):
                  errors.append("list:invalid_schema")
                  return False
              matches = [
                  row for row in rows
                  if isinstance(row, dict) and row.get("app_id") == APP_ID
              ]
              if len(matches) != 1:
                  errors.append("list:exact_id_missing_or_duplicate")
                  return False
              row = matches[0]
              state, tasks = row.get("state"), row.get("tasks")
              observation = {
                  "app_id": APP_ID,
                  "state": state if isinstance(state, str) and len(state) <= 40 else None,
                  "state_type": type(state).__name__,
                  "tasks": tasks if isinstance(tasks, (str, int)) and not isinstance(tasks, bool)
                           and len(str(tasks)) <= 16 else None,
                  "tasks_type": type(tasks).__name__,
              }
              observations.append(observation)
              return state == "stopped" and (
                  (isinstance(tasks, int) and not isinstance(tasks, bool) and tasks == 0)
                  or (isinstance(tasks, str) and tasks == "0")
              )

          workspace_verified = False
          try:
              if not os.environ.get("MODAL_TOKEN_ID") or not os.environ.get("MODAL_TOKEN_SECRET"):
                  errors.append("credentials:missing")
                  report("UNKNOWN")
                  sys.exit(2)
              # SDK stdout/stderr and exception details are never emitted.
              with open(os.devnull, "w") as sink:
                  with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                      import modal
                      client = modal.Client.from_env()
                      ws = modal.Workspace.from_context(client=client)
                      ws.hydrate(client=client)
                      name = ws.name
              if name != WORKSPACE:
                  errors.append("workspace:mismatch")
                  report("UNKNOWN")
                  sys.exit(2)
              workspace_verified = True

              if observe():
                  report("TERMINAL_CONFIRMED")
                  sys.exit(0)

              stop_attempted = True
              command(STOP, 10)
              for attempt in range(3):
                  if attempt:
                      time.sleep(2)
                  if observe():
                      report("TERMINAL_CONFIRMED" if not errors else "UNKNOWN")
                      sys.exit(0 if not errors else 2)
              report("UNKNOWN")
              sys.exit(2)
          except SystemExit:
              raise
          except BaseException as exc:
              errors.append("reconcile:" + type(exc).__name__)
              report("UNKNOWN")
              sys.exit(2)
          PY
