name: MW4 semantic v3.1 shadow analysis

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/mw4-v3-1-shadow-trigger

permissions:
  contents: read

jobs:
  analyze:
    name: analyze-${{ matrix.source }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - source: r1
            runner: ubuntu-24.04
          - source: batch2
            runner: ubuntu-22.04
          - source: week2
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify semantic and source-derived renderer contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/mw4_semantic_gameplay_v3_1_final.py \
            scripts/mw4_fullframe_retention_v3_1.py \
            scripts/mw4_v3_1_contract.py \
            scripts/mw4_v3_1_media_contract.py \
            scripts/mw4_v3_1_render_source_contract.py \
            scripts/mw4_v3_1_render_one.py \
            scripts/mw4_v3_1_source_qa.py \
            scripts/mw4_v3_1_mediasilo_source.py \
            scripts/mw4_v3_1_workflow_support.py
          python scripts/mw4_semantic_gameplay_v3_1_final.py --self-test
          python scripts/mw4_v3_1_contract.py --self-test
          python scripts/mw4_v3_1_render_one.py --self-test

      - name: Resolve original MediaSilo source once
        env:
          SOURCE_KEY: ${{ matrix.source }}
          MEDIASILO_URL: https://app.mediasilo.com/review/6a88a6c15a183a21eeeae9e6/f/3b199368-5974-4eb1-a450-327a4e84c260
        run: |
          set -euo pipefail
          python scripts/mw4_v3_1_mediasilo_source.py resolve \
            --source-key "$SOURCE_KEY" \
            --review-url "$MEDIASILO_URL" \
            --output /tmp/resolved_source.json

      - name: Download and certify original source once
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p raw_sources
          python scripts/mw4_v3_1_mediasilo_source.py download \
            --resolved /tmp/resolved_source.json \
            --target "raw_sources/$SOURCE_KEY.mp4"
          python scripts/mw4_v3_1_source_qa.py certify \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --source-key "$SOURCE_KEY" \
            --resolved /tmp/resolved_source.json \
            --output "raw_sources/$SOURCE_KEY.source_qa.json"

      - name: Analyze canonical V3.1 candidate pool only
        timeout-minutes: 15
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          nice -n 5 python scripts/mw4_fullframe_retention_v3_1.py \
            --source-key "$SOURCE_KEY" \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --output-dir "analysis/$SOURCE_KEY" \
            --mode analysis

      - name: Upload verified source reel for isolated render workspaces
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-source-${{ matrix.source }}
          path: |
            raw_sources/${{ matrix.source }}.mp4
            raw_sources/${{ matrix.source }}.source_qa.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload analysis manifest
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-analysis-${{ matrix.source }}
          path: analysis/${{ matrix.source }}/${{ matrix.source }}_analysis_v3_1.json
          retention-days: 3
          if-no-files-found: error

  allocate:
    name: adaptive-pre-render-allocation
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      render_matrix: ${{ steps.render-matrix.outputs.render_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all analysis manifests
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-v3-1-analysis-*
          path: analysis-manifests
          merge-multiple: true

      - name: Build adaptive important-scene allocation
        run: |
          set -euo pipefail
          python -m py_compile scripts/mw4_v3_1_contract.py scripts/mw4_v3_1_workflow_support.py
          python scripts/mw4_v3_1_contract.py --self-test
          mkdir -p allocation
          python scripts/mw4_v3_1_contract.py \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --allocate-from analysis-manifests \
            --allocation-out allocation/mw4_v3_1_allocation.json

      - name: Build one-workspace-per-clip render matrix
        id: render-matrix
        run: |
          set -euo pipefail
          python scripts/mw4_v3_1_workflow_support.py render-matrix \
            --allocation allocation/mw4_v3_1_allocation.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload approved global allocation
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-allocation
          path: allocation/mw4_v3_1_allocation.json
          retention-days: 3
          if-no-files-found: error

  render-one:
    name: shadow-${{ matrix.clip_id }}
    needs: allocate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.allocate.outputs.render_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight single-clip renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3'
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download approved allocation only
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-shadow-allocation
          path: allocation

      - name: Download already-verified source reel artifact
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-shadow-source-${{ matrix.source }}
          path: raw_sources

      - name: Verify staged source reel against certified input contract
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          set -euo pipefail
          python scripts/mw4_v3_1_source_qa.py verify \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --manifest "raw_sources/$SOURCE_KEY.source_qa.json"

      - name: Render and QA exactly one full-quality qualification clip
        timeout-minutes: 65
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          (
            while true; do
              echo "[heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') source=$SOURCE_KEY clip=${{ matrix.ordinal }}"
              free -h | sed -n '1,2p'
              df -h / | tail -n 1
              sleep 20
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

          nice -n 5 python scripts/mw4_v3_1_render_one.py \
            --source-key "$SOURCE_KEY" \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --allocation allocation/mw4_v3_1_allocation.json \
            --plan-key "${{ matrix.plan_key }}" \
            --ordinal "${{ matrix.ordinal }}" \
            --output-dir one \
            --mode production

      - name: Upload this full-quality qualification video immediately as its own asset
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-video-${{ matrix.clip_id }}
          path: one/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Upload this clip QA metadata separately
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-meta-${{ matrix.clip_id }}
          path: |
            one/*_clip_result_v3_1.json
            one/contact_sheets/*.jpg
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Release workspace storage before next clip
        if: always()
        run: |
          rm -f raw_sources/*.mp4 one/*.mp4 || true
          df -h /

  batch-contract:
    name: shadow-batch-contract
    needs: [allocate, render-one]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download approved allocation
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-shadow-allocation
          path: allocation

      - name: Download metadata only, never the video/source assets
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-v3-1-shadow-meta-*
          path: clip-meta
          merge-multiple: true

      - name: Aggregate per-clip QA into source summaries
        run: |
          set -euo pipefail
          python scripts/mw4_v3_1_workflow_support.py batch-summaries \
            --allocation allocation/mw4_v3_1_allocation.json \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --clip-meta clip-meta \
            --output-dir batch-contract

      - name: Enforce complete adaptive batch contract
        run: |
          set -euo pipefail
          python scripts/mw4_v3_1_contract.py \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --batch-root batch-contract \
            --allocation allocation/mw4_v3_1_allocation.json | tee batch-contract-result.json

      - name: Upload batch contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-batch-contract
          path: |
            batch-contract-result.json
            batch-contract/*_pipeline_summary.json
          retention-days: 3
          if-no-files-found: warn
