name: MW4 semantic v3.1 shadow analysis

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mw4-fullframe-retention-v3-1
    paths:
      - .github/mw4-v3-1-shadow-trigger

permissions:
  contents: read

jobs:
  analyze:
    name: analyze-${{ matrix.source }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - source: r1
            runner: ubuntu-24.04
          - source: batch2
            runner: ubuntu-22.04
          - source: week2
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify canonical V3.1 implementation
        run: |
          python -m py_compile \
            scripts/mw4_semantic_gameplay_v3_1_final.py \
            scripts/mw4_fullframe_retention_v3_1.py \
            scripts/mw4_v3_1_render_one.py \
            scripts/mw4_v3_1_contract.py
          python scripts/mw4_semantic_gameplay_v3_1_final.py --self-test
          python scripts/mw4_v3_1_contract.py --self-test

      - name: Resolve official MediaSilo source once
        env:
          SOURCE_KEY: ${{ matrix.source }}
          MEDIASILO_URL: https://app.mediasilo.com/review/6a88a6c15a183a21eeeae9e6/f/3b199368-5974-4eb1-a450-327a4e84c260
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          source_key = os.environ['SOURCE_KEY']
          wanted = {
              'r1': 'MW4_BetaTopPlays_Stringout_16X9_R1.mp4',
              'batch2': 'BestOfBeta_Stringout_Batch2.mp4',
              'week2': 'BestOfBeta_Week2_Stringout_1_8.28.mp4',
          }
          holder = [None]
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=['--no-sandbox', '--disable-dev-shm-usage'],
              )
              for attempt in range(1, 4):
                  page = browser.new_page(
                      viewport={'width': 1440, 'height': 1000},
                      user_agent=(
                          'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                          'AppleWebKit/537.36 (KHTML, like Gecko) '
                          'Chrome/139.0.0.0 Safari/537.36'
                      ),
                  )
                  def handle(response):
                      if '/folders/3b199368-5974-4eb1-a450-327a4e84c260/assets' not in response.url or response.status != 200:
                          return
                      try:
                          data = response.json()
                      except Exception:
                          return
                      if isinstance(data, list) and data:
                          holder[0] = data
                  page.on('response', handle)
                  try:
                      page.goto(os.environ['MEDIASILO_URL'], wait_until='domcontentloaded', timeout=90000)
                      page.wait_for_timeout(30000)
                  finally:
                      page.close()
                  if holder[0]:
                      print(f'MediaSilo assets resolved on attempt {attempt}')
                      break
              browser.close()

          if not holder[0]:
              raise RuntimeError('MediaSilo assets were not resolved after 3 analysis-stage attempts')
          for asset in holder[0]:
              if asset.get('title') != wanted[source_key]:
                  continue
              derivatives = {item.get('type'): item for item in asset.get('derivatives', [])}
              derivative = derivatives.get('x1080') or derivatives.get('proxy') or {}
              url = derivative.get('url') or (derivative.get('properties') or {}).get('url')
              if not url:
                  raise RuntimeError('No usable derivative')
              Path('/tmp/resolved_source.json').write_text(
                  json.dumps({'title': asset['title'], 'url': url}),
                  encoding='utf-8',
              )
              break
          else:
              raise RuntimeError(f'Official source not found: {wanted[source_key]}')
          PY

      - name: Download and verify official source once
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          mkdir -p raw_sources
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          source_key = os.environ['SOURCE_KEY']
          selected = json.loads(Path('/tmp/resolved_source.json').read_text(encoding='utf-8'))
          target = Path('raw_sources') / f'{source_key}.mp4'
          request = urllib.request.Request(selected['url'], headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=300) as source, target.open('wb') as output:
              while True:
                  block = source.read(8 * 1024 * 1024)
                  if not block:
                      break
                  output.write(block)

          probe = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error',
              '-show_entries', 'stream=width,height,avg_frame_rate:format=duration',
              '-of', 'json', str(target),
          ], text=True))
          video = next(item for item in probe['streams'] if item.get('width'))
          assert (video['width'], video['height']) == (1920, 1080)
          assert video['avg_frame_rate'] == '60000/1001'
          print(f'verified source bytes={target.stat().st_size}')
          PY

      - name: Analyze canonical V3.1 candidate pool only
        timeout-minutes: 15
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          nice -n 5 python scripts/mw4_fullframe_retention_v3_1.py \
            --source-key "$SOURCE_KEY" \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --output-dir "analysis/$SOURCE_KEY" \
            --mode analysis

      - name: Upload verified source reel for isolated render workspaces
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-source-${{ matrix.source }}
          path: raw_sources/${{ matrix.source }}.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload analysis manifest
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-analysis-${{ matrix.source }}
          path: analysis/${{ matrix.source }}/${{ matrix.source }}_analysis_v3_1.json
          retention-days: 3
          if-no-files-found: error

  allocate:
    name: adaptive-pre-render-allocation
    needs: analyze
    runs-on: ubuntu-24.04
    outputs:
      render_matrix: ${{ steps.render-matrix.outputs.render_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all analysis manifests
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-v3-1-analysis-*
          path: analysis-manifests
          merge-multiple: true

      - name: Build adaptive important-scene allocation
        run: |
          set -euo pipefail
          python -m py_compile scripts/mw4_v3_1_contract.py
          python scripts/mw4_v3_1_contract.py --self-test
          mkdir -p allocation
          python scripts/mw4_v3_1_contract.py \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --allocate-from analysis-manifests \
            --allocation-out allocation/mw4_v3_1_allocation.json

      - name: Build one-workspace-per-clip render matrix
        id: render-matrix
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          allocation = json.loads(Path('allocation/mw4_v3_1_allocation.json').read_text(encoding='utf-8'))
          runners = {'r1': 'ubuntu-24.04', 'batch2': 'ubuntu-22.04', 'week2': 'ubuntu-24.04'}
          include = []
          for source in ('r1', 'batch2', 'week2'):
              keys = allocation.get('source_allocations', {}).get(source, {}).get('plan_keys', [])
              for ordinal, key in enumerate(keys, 1):
                  include.append({
                      'source': source,
                      'plan_key': str(key),
                      'ordinal': ordinal,
                      'runner': runners[source],
                      'clip_id': f'{source}-{ordinal:02d}-{str(key)[:8]}',
                  })
          if not include:
              raise RuntimeError('adaptive allocation produced no renderable clips')
          value = json.dumps({'include': include}, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'render_matrix={value}\n')
          print(f'sequential clip workspaces: {len(include)}')
          PY

      - name: Upload approved global allocation
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-allocation
          path: allocation/mw4_v3_1_allocation.json
          retention-days: 3
          if-no-files-found: error

  render-one:
    name: shadow-${{ matrix.clip_id }}
    needs: allocate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.allocate.outputs.render_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight single-clip renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3'
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download approved allocation only
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-shadow-allocation
          path: allocation

      - name: Download already-verified source reel artifact
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-shadow-source-${{ matrix.source }}
          path: raw_sources

      - name: Verify staged source reel before rendering
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source_key = os.environ['SOURCE_KEY']
          source = Path('raw_sources') / f'{source_key}.mp4'
          if not source.is_file():
              raise RuntimeError(f'staged source artifact missing: {source}')
          probe = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error',
              '-show_entries', 'stream=width,height,avg_frame_rate:format=duration',
              '-of', 'json', str(source),
          ], text=True))
          video = next(item for item in probe['streams'] if item.get('width'))
          assert (video['width'], video['height']) == (1920, 1080)
          assert video['avg_frame_rate'] == '60000/1001'
          print(f'staged source verified bytes={source.stat().st_size}')
          PY

      - name: Render and QA exactly one full-quality 250 Mbps qualification clip
        timeout-minutes: 65
        env:
          SOURCE_KEY: ${{ matrix.source }}
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          set -euo pipefail
          (
            while true; do
              echo "[heartbeat] $(date -u +'%Y-%m-%dT%H:%M:%SZ') source=$SOURCE_KEY clip=${{ matrix.ordinal }}"
              free -h | sed -n '1,2p'
              df -h / | tail -n 1
              sleep 20
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true' EXIT

          nice -n 5 python scripts/mw4_v3_1_render_one.py \
            --source-key "$SOURCE_KEY" \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --allocation allocation/mw4_v3_1_allocation.json \
            --plan-key "${{ matrix.plan_key }}" \
            --ordinal "${{ matrix.ordinal }}" \
            --output-dir one \
            --mode production

      - name: Upload this full-quality qualification video immediately as its own asset
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-video-${{ matrix.clip_id }}
          path: one/*.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Upload this clip QA metadata separately
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-meta-${{ matrix.clip_id }}
          path: |
            one/*_clip_result_v3_1.json
            one/contact_sheets/*.jpg
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Release workspace storage before next clip
        if: always()
        run: |
          rm -f raw_sources/*.mp4 one/*.mp4 || true
          df -h /

  batch-contract:
    name: shadow-batch-contract
    needs: [allocate, render-one]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download approved allocation
        uses: actions/download-artifact@v4
        with:
          name: MW4-v3-1-shadow-allocation
          path: allocation

      - name: Download metadata only, never the video/source assets
        uses: actions/download-artifact@v4
        with:
          pattern: MW4-v3-1-shadow-meta-*
          path: clip-meta
          merge-multiple: true

      - name: Aggregate per-clip QA into source summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          allocation = json.loads(Path('allocation/mw4_v3_1_allocation.json').read_text(encoding='utf-8'))
          config = json.loads(Path('campaigns/mw4-fullframe-retention-v3-1.json').read_text(encoding='utf-8'))
          results = [json.loads(path.read_text(encoding='utf-8')) for path in Path('clip-meta').rglob('*_clip_result_v3_1.json')]
          root = Path('batch-contract')
          root.mkdir(parents=True, exist_ok=True)

          for source in ('r1', 'batch2', 'week2'):
              expected = [str(item) for item in allocation.get('source_allocations', {}).get(source, {}).get('plan_keys', [])]
              actual = sorted([item for item in results if item.get('source_key') == source], key=lambda item: int(item.get('ordinal', 0)))
              actual_keys = [str(item.get('plan_key')) for item in actual]
              failures = []
              if actual_keys != expected:
                  failures.append(f'{source}: rendered clip keys {actual_keys} != allocated keys {expected}')
              if any(item.get('status') != 'PASS' for item in actual):
                  failures.append(f'{source}: one or more clip results did not pass')
              summary = {
                  'mode': 'shadow',
                  'source_key': source,
                  'selected_count': len(actual),
                  'rendered_count': len(actual),
                  'selected_plan_keys': actual_keys,
                  'stories': [str(item.get('story_type')) for item in actual],
                  'verified_finishing_move_count': len(config.get('finishing_move_detector', {}).get('verified_spans', {}).get(source, [])),
                  'selected_finishing_move_count': sum(1 for item in actual if bool(item.get('finishing_move'))),
                  'unplanned_source_cut_count': sum(int(item.get('unplanned_source_cut_count', 0)) for item in actual),
                  'technical_qa_passed': bool(actual or not expected) and len(actual) == len(expected) and all(bool(item.get('technical_qa_passed')) for item in actual),
                  'failure': failures or None,
              }
              (root / f'{source}_pipeline_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

      - name: Enforce complete adaptive batch contract
        run: |
          set -euo pipefail
          python scripts/mw4_v3_1_contract.py \
            --config campaigns/mw4-fullframe-retention-v3-1.json \
            --batch-root batch-contract \
            --allocation allocation/mw4_v3_1_allocation.json | tee batch-contract-result.json

      - name: Upload batch contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MW4-v3-1-shadow-batch-contract
          path: |
            batch-contract-result.json
            batch-contract/*_pipeline_summary.json
          retention-days: 3
          if-no-files-found: warn
