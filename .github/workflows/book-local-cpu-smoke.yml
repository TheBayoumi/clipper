name: Public synthetic book CPU smoke (dormant)

# GitHub workflow_dispatch requires default-branch workflow presence.
# This review-branch-only workflow is activated solely by the later audited
# one-file run-request commit; this staging pass MUST NOT add that file.
on:
  push:
    branches: [review/unified-tts-cleanup]
    paths:
      - "acceptance/book-local-cpu-smoke/run-request.json"

permissions:
  contents: read

concurrency:
  group: book-local-cpu-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  public-synthetic-only-cpu:
    if: github.ref == 'refs/heads/review/unified-tts-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: ${{ runner.temp }}/clipper-public-book-cpu-smoke-hf
      CUDA_VISIBLE_DEVICES: "-1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout the exact triggering push
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install Python 3.11 without dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce one-commit one-file pinned public request BEFORE installation
        env:
          SMOKE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/book_local_cpu_smoke.py gate
      - name: Install CPU-only pinned lean runtime (no Kokoro, Modal, or CUDA wheels)
        run: |
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
          python -m pip install --no-cache-dir 'transformers==4.57.3' 'huggingface_hub==0.36.2' 'PyYAML>=6.0.3,<7'
          python -m pip install --no-cache-dir --no-deps -e .
      - name: Execute actual pinned CPU model with shorter hard process timeout
        id: model
        shell: bash
        env:
          SMOKE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 34m \
            python -u scripts/book_local_cpu_smoke.py run
          code=$?
          python scripts/book_local_cpu_smoke.py finish --exit-code "$code" || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify exact completed-cache replay in a fresh process if first pass finished
        if: steps.model.outputs.exit_code == '0'
        id: replay
        shell: bash
        env:
          SMOKE_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 2m \
            python -u scripts/book_local_cpu_smoke.py replay
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Emit bounded exact public evidence only to job logs and summary
        if: always()
        run: python -u scripts/book_local_cpu_smoke.py collect
      - name: Fail if real inference or completed-cache replay failed or timed out
        if: always()
        shell: bash
        env:
          MODEL_EXIT: ${{ steps.model.outputs.exit_code }}
          REPLAY_EXIT: ${{ steps.replay.outputs.exit_code }}
        run: |
          if [[ "$MODEL_EXIT" != "0" || "$REPLAY_EXIT" != "0" ]]; then
            echo "PUBLIC_BOOK_CPU_SMOKE_FAILED: model exit=$MODEL_EXIT replay exit=$REPLAY_EXIT"
            exit 1
          fi
          echo "PUBLIC_BOOK_CPU_SMOKE_COMPLETED: real model and fresh-process replay"
