name: Temporary provider cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - name: Remove retired embedding and legacy provider paths
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub_once(text: str, pattern: str, replacement: str, label: str, *, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return updated

          path = Path("src/clipper/providers/base.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('    embedding_location: Literal["local", "modal"]\n', '')
          text = text.replace('        return ComputeProfile(name, "local", "local", "local", False)\n', '        return ComputeProfile(name, "local", "local", False)\n')
          text = text.replace('        return ComputeProfile(name, "modal", "modal", "modal", False)\n', '        return ComputeProfile(name, "modal", "modal", False)\n')
          text = text.replace('        return ComputeProfile(name, "modal", "modal", "modal", True)\n', '        return ComputeProfile(name, "modal", "modal", True)\n')
          text = sub_once(text, r'\nclass EmbeddingProvider\(Protocol\):\n    identity: ModelIdentity\n\n    def embed\(self, texts: list\[str\]\) -> ProviderResult\[list\[list\[float\]\]\]: \.\.\.\n', '', 'EmbeddingProvider protocol')
          if 'embedding_location' in text or 'EmbeddingProvider' in text:
              raise SystemExit('embedding abstraction remains in base.py')
          path.write_text(text, encoding="utf-8")

          path = Path("src/clipper/providers/__init__.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('    EmbeddingProvider,\n', '')
          text = text.replace('    "EmbeddingProvider",\n', '')
          path.write_text(text, encoding="utf-8")

          path = Path("src/clipper/providers/local.py")
          text = path.read_text(encoding="utf-8")
          text = sub_once(text, r'\nclass LocalEmbeddingProvider:.*?\n\nclass LocalEditorialProvider:', '\n\nclass LocalEditorialProvider:', 'LocalEmbeddingProvider', flags=re.S)
          if 'LocalEmbeddingProvider' in text or 'sentence_transformers' in text:
              raise SystemExit('local embedding provider remains')
          path.write_text(text, encoding="utf-8")

          path = Path("src/clipper/providers/modal.py")
          text = path.read_text(encoding="utf-8")
          text = sub_once(text, r'\n    @staticmethod\n    def _edit_plan_duration_feedback\(.*?\n    def complete_json\(', '\n    def complete_json(', 'legacy edit-plan recovery', flags=re.S)
          text = sub_once(
              text,
              r'\n            duration_feedback = self\._edit_plan_duration_feedback\(task, result\.value, payload\)\n            if duration_feedback is None or attempt >= self\._MAX_OUTPUT_RECOVERY_ATTEMPTS:\n                return result\n            request = \{\n                "task": task,\n                "payload": payload,\n                "generation_recovery_attempt": attempt \+ 1,\n                "generation_recovery_instruction": duration_feedback,\n            \}\n',
              '\n            return result\n',
              'duration feedback branch',
          )
          text = sub_once(text, r'\n\nclass ModalEmbeddingProvider\(ModalJSONProvider\):.*\Z', '\n', 'ModalEmbeddingProvider', flags=re.S)
          if 'ModalEmbeddingProvider' in text or 'edit_plans:' in text:
              raise SystemExit('legacy modal provider path remains')
          path.write_text(text, encoding="utf-8")

          path = Path("src/clipper/providers/factory.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('    EmbeddingProvider,\n', '')
          text = text.replace('from .local import LocalEditorialProvider, LocalEmbeddingProvider, LocalVisionProvider\n', 'from .local import LocalEditorialProvider, LocalVisionProvider\n')
          text = text.replace('from .modal import ModalEditorialProvider, ModalEmbeddingProvider, ModalVisionProvider\n', 'from .modal import ModalEditorialProvider, ModalVisionProvider\n')
          text = sub_once(text, r'\n\ndef embedding_provider\(.*?\n\ndef vision_provider\(', '\n\ndef vision_provider(', 'factory embedding helpers', flags=re.S)
          if 'embedding_provider' in text or 'EmbeddingProvider' in text or 'Embedding-' in text:
              raise SystemExit('embedding factory path remains')
          path.write_text(text, encoding="utf-8")

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('embedding = ["sentence-transformers>=5.6,<6"]\n', '')
          text = text.replace('  "sentence-transformers>=5.6,<6",\n', '')
          path.write_text(text, encoding="utf-8")
      - name: Format and validate
        run: |
          python -m pip install 'ruff>=0.15.22,<1'
          ruff format src/clipper/providers pyproject.toml
          ruff check --fix src/clipper/providers
          ruff check src/clipper/providers
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/clipper/providers pyproject.toml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: remove retired embedding provider surface'
          git push origin HEAD:feat/word-reveal-face-tracking
