name: Temporary guarded contract finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply remaining contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"guard failed {path_name}: expected old once or new already present; "
                      f"found {count}: {old[:100]!r}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          def replace_block(path_name: str, old_start: str, old_end: str, replacement: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if replacement in text:
                  return
              if text.count(old_start) != 1 or text.count(old_end) != 1:
                  raise SystemExit(
                      f"block guard failed {path_name}: {old_start!r} / {old_end!r}"
                  )
              begin = text.index(old_start)
              finish = text.index(old_end, begin)
              path.write_text(text[:begin] + replacement + text[finish:], encoding="utf-8")

          replace_once(
              "src/clipper/youtube.py",
              "import urllib.request\nfrom collections import deque\n",
              "import urllib.request\nfrom collections import deque\nfrom dataclasses import dataclass\n",
          )
          replace_once(
              "src/clipper/youtube.py",
              "from .models import CampaignBrief, VideoCandidate\n",
              "from .models import VideoCandidate\n",
          )
          replace_once(
              "src/clipper/youtube.py",
              'class YouTubeError(RuntimeError):\n    """Raised for YouTube discovery or media acquisition failures."""\n\n\n',
              '''class YouTubeError(RuntimeError):
              """Raised for YouTube discovery or media acquisition failures."""


          @dataclass(frozen=True, slots=True)
          class DiscoveryQuery:
              """Discovery-only search metadata; never used as production target/yield policy."""

              query: str
              channel_ids: tuple[str, ...] = ()
              limit: int = 20
              published_after: str | None = None
              region_code: str = "US"
              language: str = "en"

              def __post_init__(self) -> None:
                  if not self.query.strip():
                      raise YouTubeError("discovery query cannot be empty")
                  if not 1 <= self.limit <= 50:
                      raise YouTubeError("discovery result limit must be between 1 and 50")
                  if any(not item.strip() for item in self.channel_ids):
                      raise YouTubeError("discovery channel IDs cannot be empty")


          '''.replace("          ", ""),
          )
          replace_block(
              "src/clipper/youtube.py",
              "    def discover(self, brief: CampaignBrief) -> list[VideoCandidate]:\n",
              "    def _api_get(self, endpoint: str, params: dict[str, Any]) -> dict[str, Any]:\n",
              '''    def discover(self, request: DiscoveryQuery) -> list[VideoCandidate]:
                  if self.api_key:
                      return self._discover_api(request)
                  return self._discover_ytdlp(request)

          '''.replace("          ", ""),
          )
          replace_block(
              "src/clipper/youtube.py",
              "    def _discover_api(self, brief: CampaignBrief) -> list[VideoCandidate]:\n",
              "    @staticmethod\n    def _candidate_from_api(item: dict[str, Any]) -> VideoCandidate:\n",
              '''    def _discover_api(self, request: DiscoveryQuery) -> list[VideoCandidate]:
                  ids: list[str] = []
                  channels = request.channel_ids or (None,)
                  for channel_id in channels:
                      params: dict[str, Any] = {
                          "part": "snippet",
                          "q": request.query,
                          "type": "video",
                          "order": "relevance",
                          "maxResults": request.limit,
                          "regionCode": request.region_code,
                          "relevanceLanguage": request.language,
                      }
                      if channel_id is not None:
                          params["channelId"] = channel_id
                      if request.published_after:
                          params["publishedAfter"] = request.published_after
                      payload = self._api_get("search", params)
                      for item in _object_list(payload.get("items")):
                          identifier = _object(item.get("id")).get("videoId")
                          if identifier:
                              ids.append(str(identifier))
                  ids = list(dict.fromkeys(ids))[: request.limit]
                  if not ids:
                      return []
                  details = self._api_get(
                      "videos", {"part": "snippet,statistics,contentDetails", "id": ",".join(ids)}
                  )
                  return [self._candidate_from_api(item) for item in _object_list(details.get("items"))]

          '''.replace("          ", ""),
          )
          replace_block(
              "src/clipper/youtube.py",
              "    def _discover_ytdlp(self, brief: CampaignBrief) -> list[VideoCandidate]:\n",
              "    def download_subtitles(\n",
              '''    def _discover_ytdlp(self, request: DiscoveryQuery) -> list[VideoCandidate]:
                  if not shutil.which("yt-dlp"):
                      raise YouTubeError("YOUTUBE_API_KEY is unset and yt-dlp is not installed")
                  command = [
                      "yt-dlp",
                      "--dump-single-json",
                      "--skip-download",
                      "--no-warnings",
                      f"ytsearch{request.limit}:{request.query}",
                  ]
                  payload = _json_object(_run(command, timeout=180).stdout)
                  candidates = [
                      self._candidate_from_ytdlp(entry)
                      for entry in _object_list(payload.get("entries"))
                  ]
                  if request.channel_ids:
                      allowed_channels = set(request.channel_ids)
                      candidates = [item for item in candidates if item.channel_id in allowed_channels]
                  return list({item.video_id: item for item in candidates}.values())[: request.limit]

          '''.replace("          ", ""),
          )

          replace_once(
              "src/clipper/cli.py",
              "from .rights import RightsError, assert_campaign_authorized, assert_video_allowed\n",
              "from .rights import assert_campaign_authorized\n",
          )
          replace_once(
              "src/clipper/cli.py",
              "from .youtube import YouTubeClient\n",
              "from .youtube import DiscoveryQuery, YouTubeClient\n",
          )
          replace_once(
              "src/clipper/cli.py",
              '''    discover = subparsers.add_parser("discover", help="inspect authorized source candidates")
              discover.add_argument("--brief", required=True, type=Path)
          '''.replace("          ", ""),
              '''    discover = subparsers.add_parser(
                  "discover", help="search candidates without changing production targets"
              )
              discover.add_argument("--query", required=True)
              discover.add_argument("--channel-id", action="append", default=[])
              discover.add_argument("--limit", type=int, default=20)
              discover.add_argument("--published-after")
              discover.add_argument("--region", default="US")
              discover.add_argument("--language", default="en")
          '''.replace("          ", ""),
          )
          replace_once(
              "src/clipper/cli.py",
              '''        if args.command == "discover":
                  brief = load_brief(args.brief)
                  assert_campaign_authorized(brief)
                  videos = YouTubeClient().discover(brief)
                  allowed = []
                  for video in videos:
                      try:
                          assert_video_allowed(brief, video)
                      except RightsError:
                          continue
                      allowed.append(video)
                  print(json.dumps([video.to_dict() for video in allowed], indent=2))
                  return 0
          '''.replace("          ", ""),
              '''        if args.command == "discover":
                  request = DiscoveryQuery(
                      query=args.query,
                      channel_ids=tuple(args.channel_id),
                      limit=args.limit,
                      published_after=args.published_after,
                      region_code=args.region,
                      language=args.language,
                  )
                  videos = YouTubeClient().discover(request)
                  print(json.dumps([video.to_dict() for video in videos], indent=2))
                  return 0
          '''.replace("          ", ""),
          )

          replace_once(
              "src/clipper/hilp.py",
              '            cast(BeatType, str(item["beat_type"])),\n',
              '            cast(BeatType, item["beat_type"]),\n',
          )
          replace_once(
              "src/clipper/hilp.py",
              '        hook_mode=cast(HookMode, str(raw["hook_mode"])),\n',
              '        hook_mode=cast(HookMode, raw["hook_mode"]),\n',
          )

          replace_once(
              "src/clipper/pipeline.py",
              "from .quality_batch import BatchQualityPlanningResult, plan_quality_batch\n",
              "from .quality_batch import QualityBatchResult, plan_quality_batch\n",
          )
          replace_once(
              "src/clipper/pipeline.py",
              "    visual_escalation_enabled: bool = False\n    visual_escalation_threshold: float = 0.75\n",
              "    visual_escalation_enabled: bool = False\n    visual_escalation_threshold: float = 0.75\n    quality_chunk_words: int = 900\n    quality_chunk_overlap_words: int = 120\n",
          )
          replace_once(
              "src/clipper/pipeline.py",
              '''            visual_escalation_threshold=float(
                  os.getenv("CLIPPER_VISUAL_ESCALATION_THRESHOLD", "0.75")
              ),
          '''.replace("          ", ""),
              '''            visual_escalation_threshold=float(
                  os.getenv("CLIPPER_VISUAL_ESCALATION_THRESHOLD", "0.75")
              ),
              quality_chunk_words=int(os.getenv("CLIPPER_QUALITY_CHUNK_WORDS", "900")),
              quality_chunk_overlap_words=int(
                  os.getenv("CLIPPER_QUALITY_CHUNK_OVERLAP_WORDS", "120")
              ),
          '''.replace("          ", ""),
          )
          replace_once(
              "src/clipper/pipeline.py",
              "def _funnel_template() -> dict[str, int]:\n",
              "def _funnel_template() -> dict[str, int | float | bool]:\n",
          )
          replace_once(
              "src/clipper/pipeline.py",
              '''            visual_timelines=visual_timelines,
              )
          '''.replace("          ", ""),
              '''            visual_timelines=visual_timelines,
                  max_words_per_chunk=cfg.quality_chunk_words,
                  chunk_overlap_words=cfg.quality_chunk_overlap_words,
              )
          '''.replace("          ", ""),
          )
          replace_once(
              "src/clipper/pipeline.py",
              '''        "semantic_cores_discovered": sum(
                  int(item.get("semantic_cores", 0))
                  for item in quality.source_evidence.values()
                  if isinstance(item, dict)
              ),
          '''.replace("          ", ""),
              '''        "semantic_cores_discovered": sum(
                  value
                  for item in quality.source_evidence.values()
                  if isinstance(item, dict)
                  for value in [item.get("semantic_cores")]
                  if isinstance(value, int) and not isinstance(value, bool)
              ),
          '''.replace("          ", ""),
          )
          replace_once(
              "src/clipper/pipeline.py",
              "        quality = plan_quality_batch(\n",
              "        quality: QualityBatchResult = plan_quality_batch(\n",
          )

          Path(".github/workflows/ci.yml").write_text(
              '''name: CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.11", "3.12"]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: pip
                - run: python -m pip install --upgrade pip
                - run: python -m pip install -e ".[dev]"
                - run: ruff check .
                - run: ruff format --check .
                - run: mypy
                - run: pytest
          '''.replace("          ", ""),
              encoding="utf-8",
          )
          PY
      - name: Remove temporary cleanup artifacts
        shell: bash
        run: |
          rm -f src/clipper/_temporary_cleanup_trigger.py
          rm -f acceptance/temporary-contract-cleanup-trigger.json
          rm -f .github/workflows/temporary-mypy-contract-cleanup.yml
      - name: Install quality tools
        run: python -m pip install -e '.[dev]'
      - name: Format and verify source
        run: |
          ruff format src/clipper/youtube.py src/clipper/cli.py src/clipper/hilp.py src/clipper/quality_batch.py src/clipper/pipeline.py
          ruff check .
          ruff format --check .
          mypy
      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes remain."
            exit 0
          fi
          git commit -m "refactor: finalize autonomous editor contract cleanup"
          git push origin HEAD:feat/word-reveal-face-tracking
