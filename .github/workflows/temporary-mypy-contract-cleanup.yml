name: Temporary guarded contract finalizer

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/word-reveal-face-tracking'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/word-reveal-face-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply remaining source cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"guard failed {path_name}: {old[:100]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def section(path_name: str, pattern: str, replacement: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"section guard failed {path_name}: {pattern[:120]!r}")
              path.write_text(updated, encoding="utf-8")

          exact(
              "src/clipper/youtube.py",
              "from collections import deque\n",
              "from collections import deque\nfrom dataclasses import dataclass\n",
          )
          exact(
              "src/clipper/youtube.py",
              "from .models import CampaignBrief, VideoCandidate\n",
              "from .models import VideoCandidate\n",
          )
          exact(
              "src/clipper/youtube.py",
              'class YouTubeError(RuntimeError):\n    """Raised for YouTube discovery or media acquisition failures."""\n\n\n',
              'class YouTubeError(RuntimeError):\n'
              '    """Raised for YouTube discovery or media acquisition failures."""\n\n\n'
              '@dataclass(frozen=True, slots=True)\n'
              'class DiscoveryQuery:\n'
              '    """Discovery-only search metadata; never used as production target/yield policy."""\n\n'
              '    query: str\n'
              '    channel_ids: tuple[str, ...] = ()\n'
              '    limit: int = 20\n'
              '    published_after: str | None = None\n'
              '    region_code: str = "US"\n'
              '    language: str = "en"\n\n'
              '    def __post_init__(self) -> None:\n'
              '        if not self.query.strip():\n'
              '            raise YouTubeError("discovery query cannot be empty")\n'
              '        if not 1 <= self.limit <= 50:\n'
              '            raise YouTubeError("discovery result limit must be between 1 and 50")\n'
              '        if any(not item.strip() for item in self.channel_ids):\n'
              '            raise YouTubeError("discovery channel IDs cannot be empty")\n\n\n',
          )
          section(
              "src/clipper/youtube.py",
              r"    def discover\(self, brief: CampaignBrief\) -> list\[VideoCandidate\]:\n.*?(?=    def _api_get)",
              "    def discover(self, request: DiscoveryQuery) -> list[VideoCandidate]:\n"
              "        if self.api_key:\n"
              "            return self._discover_api(request)\n"
              "        return self._discover_ytdlp(request)\n\n",
          )
          section(
              "src/clipper/youtube.py",
              r"    def _discover_api\(self, brief: CampaignBrief\) -> list\[VideoCandidate\]:\n.*?(?=    @staticmethod\n    def _candidate_from_api)",
              "    def _discover_api(self, request: DiscoveryQuery) -> list[VideoCandidate]:\n"
              "        ids: list[str] = []\n"
              "        channels = request.channel_ids or (None,)\n"
              "        for channel_id in channels:\n"
              "            params: dict[str, Any] = {\n"
              "                \"part\": \"snippet\",\n"
              "                \"q\": request.query,\n"
              "                \"type\": \"video\",\n"
              "                \"order\": \"relevance\",\n"
              "                \"maxResults\": request.limit,\n"
              "                \"regionCode\": request.region_code,\n"
              "                \"relevanceLanguage\": request.language,\n"
              "            }\n"
              "            if channel_id is not None:\n"
              "                params[\"channelId\"] = channel_id\n"
              "            if request.published_after:\n"
              "                params[\"publishedAfter\"] = request.published_after\n"
              "            payload = self._api_get(\"search\", params)\n"
              "            for item in _object_list(payload.get(\"items\")):\n"
              "                identifier = _object(item.get(\"id\")).get(\"videoId\")\n"
              "                if identifier:\n"
              "                    ids.append(str(identifier))\n"
              "        ids = list(dict.fromkeys(ids))[: request.limit]\n"
              "        if not ids:\n"
              "            return []\n"
              "        details = self._api_get(\n"
              "            \"videos\", {\"part\": \"snippet,statistics,contentDetails\", \"id\": \",\".join(ids)}\n"
              "        )\n"
              "        return [self._candidate_from_api(item) for item in _object_list(details.get(\"items\"))]\n\n",
          )
          section(
              "src/clipper/youtube.py",
              r"    def _discover_ytdlp\(self, brief: CampaignBrief\) -> list\[VideoCandidate\]:\n.*?(?=    def download_subtitles)",
              "    def _discover_ytdlp(self, request: DiscoveryQuery) -> list[VideoCandidate]:\n"
              "        if not shutil.which(\"yt-dlp\"):\n"
              "            raise YouTubeError(\"YOUTUBE_API_KEY is unset and yt-dlp is not installed\")\n"
              "        command = [\n"
              "            \"yt-dlp\",\n"
              "            \"--dump-single-json\",\n"
              "            \"--skip-download\",\n"
              "            \"--no-warnings\",\n"
              "            f\"ytsearch{request.limit}:{request.query}\",\n"
              "        ]\n"
              "        payload = _json_object(_run(command, timeout=180).stdout)\n"
              "        candidates = [\n"
              "            self._candidate_from_ytdlp(entry) for entry in _object_list(payload.get(\"entries\"))\n"
              "        ]\n"
              "        if request.channel_ids:\n"
              "            allowed_channels = set(request.channel_ids)\n"
              "            candidates = [item for item in candidates if item.channel_id in allowed_channels]\n"
              "        return list({item.video_id: item for item in candidates}.values())[: request.limit]\n\n",
          )

          exact(
              "src/clipper/cli.py",
              "from .rights import RightsError, assert_campaign_authorized, assert_video_allowed\n",
              "from .rights import assert_campaign_authorized\n",
          )
          exact(
              "src/clipper/cli.py",
              "from .youtube import YouTubeClient\n",
              "from .youtube import DiscoveryQuery, YouTubeClient\n",
          )
          section(
              "src/clipper/cli.py",
              r"    discover = subparsers\.add_parser\(\"discover\", help=\"inspect authorized source candidates\"\)\n    discover\.add_argument\(\"--brief\", required=True, type=Path\)\n\n(?=    benchmark =)",
              "    discover = subparsers.add_parser(\n"
              "        \"discover\", help=\"search candidates without changing production targets\"\n"
              "    )\n"
              "    discover.add_argument(\"--query\", required=True)\n"
              "    discover.add_argument(\"--channel-id\", action=\"append\", default=[])\n"
              "    discover.add_argument(\"--limit\", type=int, default=20)\n"
              "    discover.add_argument(\"--published-after\")\n"
              "    discover.add_argument(\"--region\", default=\"US\")\n"
              "    discover.add_argument(\"--language\", default=\"en\")\n\n",
          )
          section(
              "src/clipper/cli.py",
              r"        if args\.command == \"discover\":\n.*?(?=        if args\.command == \"benchmark\":)",
              "        if args.command == \"discover\":\n"
              "            request = DiscoveryQuery(\n"
              "                query=args.query,\n"
              "                channel_ids=tuple(args.channel_id),\n"
              "                limit=args.limit,\n"
              "                published_after=args.published_after,\n"
              "                region_code=args.region,\n"
              "                language=args.language,\n"
              "            )\n"
              "            videos = YouTubeClient().discover(request)\n"
              "            print(json.dumps([video.to_dict() for video in videos], indent=2))\n"
              "            return 0\n",
          )

          exact(
              "src/clipper/hilp.py",
              '            cast(BeatType, str(item["beat_type"])),\n',
              '            cast(BeatType, item["beat_type"]),\n',
          )
          exact(
              "src/clipper/hilp.py",
              '        hook_mode=cast(HookMode, str(raw["hook_mode"])),\n',
              '        hook_mode=cast(HookMode, raw["hook_mode"]),\n',
          )

          exact(
              "src/clipper/pipeline.py",
              "from .quality_batch import BatchQualityPlanningResult, plan_quality_batch\n",
              "from .quality_batch import QualityBatchResult, plan_quality_batch\n",
          )
          exact(
              "src/clipper/pipeline.py",
              "    visual_escalation_threshold: float = 0.75\n",
              "    visual_escalation_threshold: float = 0.75\n"
              "    quality_chunk_words: int = 900\n"
              "    quality_chunk_overlap_words: int = 120\n",
          )
          exact(
              "src/clipper/pipeline.py",
              "            visual_escalation_threshold=float(\n"
              "                os.getenv(\"CLIPPER_VISUAL_ESCALATION_THRESHOLD\", \"0.75\")\n"
              "            ),\n",
              "            visual_escalation_threshold=float(\n"
              "                os.getenv(\"CLIPPER_VISUAL_ESCALATION_THRESHOLD\", \"0.75\")\n"
              "            ),\n"
              "            quality_chunk_words=int(os.getenv(\"CLIPPER_QUALITY_CHUNK_WORDS\", \"900\")),\n"
              "            quality_chunk_overlap_words=int(\n"
              "                os.getenv(\"CLIPPER_QUALITY_CHUNK_OVERLAP_WORDS\", \"120\")\n"
              "            ),\n",
          )
          exact(
              "src/clipper/pipeline.py",
              "def _funnel_template() -> dict[str, int]:\n",
              "def _funnel_template() -> dict[str, int | float | bool]:\n",
          )
          exact(
              "src/clipper/pipeline.py",
              "        quality = plan_quality_batch(\n",
              "        quality: QualityBatchResult = plan_quality_batch(\n",
          )
          exact(
              "src/clipper/pipeline.py",
              "            visual_timelines=visual_timelines,\n"
              "        )\n",
              "            visual_timelines=visual_timelines,\n"
              "            max_words_per_chunk=cfg.quality_chunk_words,\n"
              "            chunk_overlap_words=cfg.quality_chunk_overlap_words,\n"
              "        )\n",
          )
          exact(
              "src/clipper/pipeline.py",
              "        \"semantic_cores_discovered\": sum(\n"
              "            int(item.get(\"semantic_cores\", 0))\n"
              "            for item in quality.source_evidence.values()\n"
              "            if isinstance(item, dict)\n"
              "        ),\n",
              "        \"semantic_cores_discovered\": sum(\n"
              "            value\n"
              "            for item in quality.source_evidence.values()\n"
              "            if isinstance(item, dict)\n"
              "            for value in [item.get(\"semantic_cores\")]\n"
              "            if isinstance(value, int) and not isinstance(value, bool)\n"
              "        ),\n",
          )
          PY
      - name: Remove temporary cleanup artifacts
        shell: bash
        run: |
          rm -f src/clipper/_temporary_cleanup_trigger.py
          rm -f acceptance/temporary-contract-cleanup-trigger.json
          rm -f .github/workflows/temporary-mypy-contract-cleanup.yml
      - name: Install quality tools
        run: python -m pip install -e '.[dev]'
      - name: Verify exact cleanup
        run: |
          ruff format src/clipper/youtube.py src/clipper/cli.py src/clipper/hilp.py src/clipper/quality_batch.py src/clipper/pipeline.py
          ruff check .
          ruff format --check .
          mypy
          pytest
      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "clipper-contract-bot"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: finalize autonomous editor contract cleanup"
          git push origin HEAD:feat/word-reveal-face-tracking
