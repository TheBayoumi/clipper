name: Zodiac creative contact sheets

on:
  push:
    branches:
      - feat/zodiac-map-creative
    paths:
      - ".github/workflows/zodiac-creative-contact-sheet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAP_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/6567edb9-06f5-4994-a81c-841694958797
      GAMEPLAY_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/5f8106f9-fa72-4a68-93d9-2ea8f05495eb
      TAC_URL: https://app.mediasilo.com/review/6a8e379525a8e55a51c595fc/f/dcb4eed7-aed3-4c8a-b733-3ee390bc44ac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Capture official asset metadata
        run: |
          python scripts/capture_mediasilo_session.py "$MAP_URL" --folder "__NO_CHILD_FOLDER__" --output-dir inspect-map
          python scripts/capture_mediasilo_session.py "$GAMEPLAY_URL" --folder "__NO_CHILD_FOLDER__" --output-dir inspect-gameplay
          python scripts/capture_mediasilo_session.py "$TAC_URL" --folder "__NO_CHILD_FOLDER__" --output-dir inspect-tac
      - name: Download lightweight review proxies
        run: |
          mkdir -p review-assets
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'
          def all_assets(path):
              bodies=json.loads(Path(path).read_text())
              out=[]; seen=set()
              for body in bodies.values():
                  if not isinstance(body,list): continue
                  for item in body:
                      if isinstance(item,dict) and item.get('id') and item['id'] not in seen:
                          seen.add(item['id']); out.append(item)
              return out
          def pick_video(path, needle):
              for item in all_assets(path):
                  name=(item.get('fileName') or item.get('title') or '')
                  if item.get('type')=='video' and needle.lower() in name.lower():
                      for d in item.get('derivatives') or []:
                          if isinstance(d,dict) and d.get('type')=='proxy' and d.get('url'):
                              return name,d['url']
              raise RuntimeError(f'video not found: {needle}')
          def pick_image(path, needle):
              for item in all_assets(path):
                  name=(item.get('fileName') or item.get('title') or '')
                  if item.get('type')=='image' and needle.lower() in name.lower():
                      for d in item.get('derivatives') or []:
                          if isinstance(d,dict) and d.get('type')=='source' and (d.get('downloadUrlWithAssetTitle') or d.get('url')):
                              return name,d.get('downloadUrlWithAssetTitle') or d.get('url')
              raise RuntimeError(f'image not found: {needle}')
          def dl(url,dst):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=180) as r, open(dst,'wb') as f:
                  while True:
                      b=r.read(4*1024*1024)
                      if not b: break
                      f.write(b)
          mname,murl=pick_video('inspect-map/bodies.json','9x16')
          gname,gurl=pick_video('inspect-gameplay/bodies.json','9x16')
          tname,turl=pick_image('inspect-tac/bodies.json','Tac_Map')
          dl(murl,'review-assets/map_proxy.mp4')
          dl(gurl,'review-assets/gameplay_proxy.mp4')
          dl(turl,'review-assets/tac_map.jpg')
          Path('review-assets/names.json').write_text(json.dumps({'map':mname,'gameplay':gname,'tac':tname},indent=2))
          PY
      - name: Build review sheets
        run: |
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json review-assets/map_proxy.mp4 > review-assets/map_probe.json
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json review-assets/gameplay_proxy.mp4 > review-assets/gameplay_probe.json
          ffmpeg -y -i review-assets/map_proxy.mp4 -vf "fps=1/2.5,scale=240:-1,drawtext=text='%{pts\\:hms}':x=8:y=h-32:fontsize=18:fontcolor=white:borderw=2:bordercolor=black,tile=5x4:padding=6:margin=6" -frames:v 1 review-assets/map_sheet.jpg
          ffmpeg -y -i review-assets/gameplay_proxy.mp4 -vf "fps=1/1.5,scale=240:-1,drawtext=text='%{pts\\:hms}':x=8:y=h-32:fontsize=18:fontcolor=white:borderw=2:bordercolor=black,tile=4x4:padding=6:margin=6" -frames:v 1 review-assets/gameplay_sheet.jpg
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-creative-review-${{ github.sha }}
          path: review-assets/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
