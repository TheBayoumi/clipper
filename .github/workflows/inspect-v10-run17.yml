name: Inspect V10 run 17 grounding evidence

on:
  push:
    branches: [feat/word-reveal-face-tracking]
    paths:
      - ".github/workflows/inspect-v10-run17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Modal client
        run: python -m pip install 'modal>=1.5.2,<2'
      - name: Capture Modal editorial application logs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          modal app logs clipper-open-editor --since 2h --tail 2000 --timestamps --show-function-id --show-container-id 2>&1 | tee diagnostic/modal-app.log || true
      - name: Read latest V10 progress and open-model cache counts
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import modal

          volume = modal.Volume.from_name("clipper-v10-artifacts")
          root = list(volume.listdir("/"))
          runs = []
          for entry in root:
              path = str(getattr(entry, "path", ""))
              if "reach-double-coverage-dedicated" not in path:
                  continue
              match = re.search(r"(2026\d{4}T\d{6}Z)", path)
              runs.append((match.group(1) if match else "", path))
          runs.sort(reverse=True)
          if not runs:
              raise RuntimeError("no V10 run directories found")
          selected = runs[0][1].rstrip("/")
          print(f"SELECTED_RUN={selected}")
          entries = list(volume.listdir(selected, recursive=True))
          paths = {str(getattr(entry, "path", "")) for entry in entries}
          progress_path = f"{selected}/progress.json"
          if progress_path in paths:
              raw = volume.read_file(progress_path)
              data = bytes(raw) if isinstance(raw, (bytes, bytearray)) else b"".join(raw)
              Path("diagnostic/progress.json").write_bytes(data)
              print(data.decode("utf-8", errors="replace"))

          cache_entries = list(volume.listdir("/_cache", recursive=True))
          outputs = []
          for entry in cache_entries:
              remote = str(getattr(entry, "path", ""))
              if not remote.endswith("open-model-output.json"):
                  continue
              try:
                  raw = volume.read_file(remote)
                  data = bytes(raw) if isinstance(raw, (bytes, bytearray)) else b"".join(raw)
                  payload = json.loads(data)
              except Exception:
                  continue
              if not isinstance(payload, dict):
                  continue
              kind = (
                  "concepts" if isinstance(payload.get("concepts"), list)
                  else "moments" if isinstance(payload.get("moments"), list)
                  else "other"
              )
              outputs.append({"remote": remote, "kind": kind, "keys": sorted(payload)})
          Path("diagnostic/cache-summary.json").write_text(json.dumps(outputs, indent=2) + "\n")
          print(json.dumps({
              "open_model_outputs": len(outputs),
              "moment_outputs": sum(item["kind"] == "moments" for item in outputs),
              "concept_outputs": sum(item["kind"] == "concepts" for item in outputs),
          }, indent=2))
          PY
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-run17-grounding-diagnostic
          path: diagnostic/
          retention-days: 7
          if-no-files-found: warn
