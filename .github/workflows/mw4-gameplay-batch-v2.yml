name: MW4 gameplay batch v2

on:
  push:
    branches:
      - feat/mw4-gameplay-batch-v2
    paths:
      - scripts/mw4_gameplay_batch.py
      - campaigns/mw4-gameplay-batch-v2.json
      - .github/workflows/mw4-gameplay-batch-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [r1, batch2, week2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer and MediaSilo resolver dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl

      - name: Resolve official MediaSilo source
        env:
          SOURCE_KEY: ${{ matrix.source }}
          MEDIASILO_URL: https://app.mediasilo.com/review/6a88a6c15a183a21eeeae9e6/f/3b199368-5974-4eb1-a450-327a4e84c260
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          source_key = os.environ['SOURCE_KEY']
          wanted = {
              'r1': 'MW4_BetaTopPlays_Stringout_16X9_R1.mp4',
              'batch2': 'BestOfBeta_Stringout_Batch2.mp4',
              'week2': 'BestOfBeta_Week2_Stringout_1_8.28.mp4',
          }
          holder = [None]
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=['--no-sandbox', '--disable-dev-shm-usage'],
              )
              context = browser.new_context(
                  viewport={'width': 1440, 'height': 1000},
                  user_agent=(
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                      'AppleWebKit/537.36 (KHTML, like Gecko) '
                      'Chrome/139.0.0.0 Safari/537.36'
                  ),
              )
              page = context.new_page()

              def handle(response):
                  if (
                      '/folders/3b199368-5974-4eb1-a450-327a4e84c260/assets'
                      not in response.url
                      or response.status != 200
                  ):
                      return
                  try:
                      data = response.json()
                  except Exception:
                      return
                  if isinstance(data, list) and data:
                      holder[0] = data

              page.on('response', handle)
              page.goto(
                  os.environ['MEDIASILO_URL'],
                  wait_until='domcontentloaded',
                  timeout=90000,
              )
              page.wait_for_timeout(25000)
              browser.close()

          if not holder[0]:
              raise RuntimeError('MediaSilo assets were not resolved')

          selected = None
          for asset in holder[0]:
              if asset.get('title') != wanted[source_key]:
                  continue
              derivatives = {item.get('type'): item for item in asset.get('derivatives', [])}
              derivative = derivatives.get('x1080') or derivatives.get('proxy') or {}
              url = derivative.get('url') or (derivative.get('properties') or {}).get('url')
              if not url:
                  raise RuntimeError(f'No usable derivative for {wanted[source_key]}')
              selected = {
                  'asset_id': asset['id'],
                  'title': asset['title'],
                  'url': url,
              }
              break

          if selected is None:
              raise RuntimeError(f'Official source not found: {wanted[source_key]}')

          Path('/tmp/resolved_source.json').write_text(
              json.dumps(selected),
              encoding='utf-8',
          )
          print(json.dumps({'asset_id': selected['asset_id'], 'title': selected['title']}))
          PY

      - name: Download and verify official source
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          mkdir -p raw_sources
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          source_key = os.environ['SOURCE_KEY']
          selected = json.loads(Path('/tmp/resolved_source.json').read_text(encoding='utf-8'))
          target = Path('raw_sources') / f'{source_key}.mp4'
          request = urllib.request.Request(
              selected['url'],
              headers={'User-Agent': 'Mozilla/5.0'},
          )
          digest = hashlib.sha256()
          with urllib.request.urlopen(request, timeout=300) as source, target.open('wb') as output:
              while True:
                  block = source.read(8 * 1024 * 1024)
                  if not block:
                      break
                  output.write(block)
                  digest.update(block)

          probe = json.loads(
              subprocess.check_output(
                  [
                      'ffprobe', '-v', 'error',
                      '-show_entries',
                      'stream=codec_name,width,height,r_frame_rate,avg_frame_rate:format=duration,size',
                      '-of', 'json', str(target),
                  ],
                  text=True,
              )
          )
          video = next(item for item in probe['streams'] if item.get('width'))
          if (video['width'], video['height']) != (1920, 1080):
              raise RuntimeError(f'Unexpected source resolution: {video}')
          if video['avg_frame_rate'] != '60000/1001':
              raise RuntimeError(f'Unexpected source cadence: {video}')

          manifest = {
              'source_key': source_key,
              'title': selected['title'],
              'asset_id': selected['asset_id'],
              'sha256': digest.hexdigest(),
              'probe': probe,
          }
          Path('raw_sources/source_manifest.json').write_text(
              json.dumps(manifest, indent=2),
              encoding='utf-8',
          )
          print(json.dumps(manifest, indent=2))
          PY

          curl -fL --retry 3 \
            'https://imgs.callofduty.com/content/dam/atvi/callofduty/cod-touchui/mw4/common/CODMW4_LOGO_PRIMARY.webp' \
            -o raw_sources/CODMW4_LOGO_PRIMARY.webp

      - name: Discover unique gameplay windows and render 250 Mbps CBR masters
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          python scripts/mw4_gameplay_batch.py \
            --source-key "$SOURCE_KEY" \
            --source "raw_sources/$SOURCE_KEY.mp4" \
            --config campaigns/mw4-gameplay-batch-v2.json \
            --output-dir "renders/$SOURCE_KEY" \
            --logo raw_sources/CODMW4_LOGO_PRIMARY.webp

      - name: Verify no editorial hook was burned in by this pipeline
        env:
          SOURCE_KEY: ${{ matrix.source }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_key = os.environ['SOURCE_KEY']
          manifest = json.loads(
              (Path('renders') / source_key / f'{source_key}_manifest.json').read_text(
                  encoding='utf-8'
              )
          )
          assert manifest['hook_text_added'] is False
          assert manifest['prior_work_overlap_allowed'] is False
          assert manifest['new_batch_overlap_allowed'] is False
          assert len(manifest['outputs']) == 4
          assert manifest['output_settings']['video_bitrate_kbps'] == 250000
          assert manifest['output_settings']['rate_control'] == 'CBR'
          print(f"{source_key}: manifest gates PASS")
          PY

      - name: Upload source-specific MW4 masters and QA
        uses: actions/upload-artifact@v4
        with:
          name: MW4-gameplay-v2-${{ matrix.source }}-250M
          path: |
            renders/${{ matrix.source }}/*.mp4
            renders/${{ matrix.source }}/*.json
            renders/${{ matrix.source }}/contact_sheets/*.jpg
            raw_sources/source_manifest.json
          retention-days: 1
          compression-level: 0
