name: HILP129 lifecycle gate repair

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/hilp129-lifecycle-gate-repair.yml
      - scripts/apply_hilp129_final_gate_patch.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply guarded lifecycle gate patch
        run: python scripts/apply_hilp129_final_gate_patch.py
      - name: Format and lint permanent repair files
        run: |
          python -m ruff check --fix scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff format scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff check scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff format --check scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
      - name: Run focused lifecycle regressions
        run: python -m pytest --no-cov tests/test_hilp129_editorial_lifecycle_gate.py tests/test_hilp129_editorial_lifecycle_recovery.py tests/test_modal_execution_spy.py tests/test_production_workflow_contract.py
      - name: Publish tested non-workflow payload
        run: |
          set -euo pipefail
          mkdir -p staging
          cp .github/workflows/production-pipeline.yml staging/hilp129-production-pipeline.yml
          git checkout -- .github/workflows/production-pipeline.yml
          git add staging/hilp129-production-pipeline.yml scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: stage validated HILP129 lifecycle gate payload"
          git push origin HEAD:feat/contentrewards-campaign-factory
