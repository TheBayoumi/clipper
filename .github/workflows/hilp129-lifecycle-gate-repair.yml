name: HILP129 lifecycle gate repair

on:
  push:
    branches:
      - feat/contentrewards-campaign-factory
    paths:
      - .github/workflows/hilp129-lifecycle-gate-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/contentrewards-campaign-factory
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply guarded lifecycle gate patch
        run: python scripts/apply_hilp129_final_gate_patch.py
      - name: Format and lint
        run: |
          python -m ruff check --fix scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff format scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          python -m ruff check .
          python -m ruff format --check .
      - name: Run focused lifecycle regressions
        run: python -m pytest --no-cov tests/test_hilp129_editorial_lifecycle_gate.py tests/test_hilp129_editorial_lifecycle_recovery.py tests/test_modal_execution_spy.py tests/test_production_workflow_contract.py
      - name: Commit clean repair
        run: |
          git rm .github/workflows/hotfix-hilp129-final-gate.yml .github/workflows/hilp129-lifecycle-gate-repair.yml scripts/apply_hilp129_final_gate_patch.py
          git add .github/workflows/production-pipeline.yml scripts/validate_editorial_lifecycle.py tests/test_hilp129_editorial_lifecycle_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close reconciled editorial lifecycles in HILP gate"
          git push origin HEAD:feat/contentrewards-campaign-factory
