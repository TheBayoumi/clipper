name: Modal workspace billing metadata (dormant)

# DORMANT STAGING ONLY: this workflow is not triggered by edits to itself.
# Activation requires a later, separate, reviewed one-file request commit.
on:
  push:
    branches:
      - review/unified-tts-cleanup
    paths:
      - acceptance/modal-readonly-metadata/request.json

permissions:
  contents: read

concurrency:
  group: modal-readonly-metadata-${{ github.repository }}
  cancel-in-progress: false

jobs:
  workspace-billing-metadata:
    if: github.event_name == 'push' && github.ref == 'refs/heads/review/unified-tts-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate distinct single-file request activation without secrets
        env:
          METADATA_PUSH_BEFORE_SHA: ${{ github.event.before }}
          METADATA_TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path

          marker = "acceptance/modal-readonly-metadata/request.json"
          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True,
                  text=True, timeout=10,
              ).stdout.strip()

          head = git("rev-parse", "HEAD")
          parent = git("rev-parse", "HEAD^")
          before = os.environ["METADATA_PUSH_BEFORE_SHA"]
          trigger = os.environ["METADATA_TRIGGER_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", head)
          assert head == trigger and parent == before, "not a one-commit activation"
          assert git("diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD") == marker, (
              "activation must change the request file only"
          )
          assert subprocess.run(
              ["git", "cat-file", "-e", f"HEAD^:{marker}"],
              capture_output=True, timeout=10, check=False,
          ).returncode != 0, "request already existed in parent"
          request = Path(marker)
          meta = request.lstat()
          assert stat.S_ISREG(meta.st_mode) and 1 <= meta.st_size <= 1024
          with request.open("rb") as stream:
              raw = stream.read(1025)
          assert 1 <= len(raw) <= 1024
          payload = json.loads(raw)
          assert isinstance(payload, dict)
          assert set(payload) == {
              "schema", "request_id", "expected_workspace", "approved_stage_sha"
          }, "request schema mismatch"
          assert payload["schema"] == "clipper-modal-readonly-metadata-v1"
          assert payload["request_id"] == "metadata1436"
          assert payload["expected_workspace"] == "mahmoud-bayoumi-mm"
          assert payload["approved_stage_sha"] == parent
          print("READONLY_METADATA_REQUEST_VALIDATED")
          PY

      - name: Install pinned Modal client without credentials
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install one SDK only without credentials
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir "modal==1.5.5"

      - name: Verify exact client-bound workspace then read monthly billing summary
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EXPECTED_MODAL_WORKSPACE: mahmoud-bayoumi-mm
          PYTHONWARNINGS: ignore
        run: |
          set -euo pipefail
          # Includes the SDK workspace lookup AND one billing call; no app or model calls.
          # SIGTERM at 60 seconds, SIGKILL 10 seconds later; job hard cutoff 5 minutes.
          timeout --signal=TERM --kill-after=10s 60s python -I - <<'PY'
          import contextlib
          import json
          import os
          import sys
          from collections.abc import Mapping
          from decimal import Decimal

          def bounded(value: object, depth: int = 0) -> object:
              if isinstance(value, Decimal):
                  return str(value)
              if isinstance(value, Mapping) and depth < 2 and len(value) <= 32:
                  if not all(isinstance(k, str) and len(k) <= 96 for k in value):
                      raise ValueError("invalid billing map key")
                  return {k: bounded(v, depth + 1) for k, v in value.items()}
              raise ValueError("unexpected billing summary type")

          try:
              if not os.environ.get("MODAL_TOKEN_ID") or not os.environ.get("MODAL_TOKEN_SECRET"):
                  raise ValueError("required credentials missing")
              # Suppress any unexpected SDK diagnostics, including potential metadata.
              with open(os.devnull, "w") as sink:
                  with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                      import modal
                      client = modal.Client.from_env()
                      workspace = modal.Workspace.from_context(client=client)
                      workspace.hydrate(client=client)
                      name = workspace.name
                      if name != os.environ["EXPECTED_MODAL_WORKSPACE"]:
                          raise ValueError("workspace identity mismatch")
                      summary = workspace.billing.summary(cycle="this month")
                      report = {
                          "metered_cost": bounded(summary.metered_cost),
                          "billed_cost": bounded(summary.billed_cost),
                          "adjustments": bounded(summary.adjustments),
                          "metered_cost_breakdown": bounded(summary.metered_cost_breakdown),
                      }
              output = {
                  "workspace": name,
                  "cycle": "this month",
                  **report,
                  "remaining_balance": "UNVERIFIED",
              }
              rendered = json.dumps(output, sort_keys=True, ensure_ascii=True)
              if len(rendered) > 8192:
                  raise ValueError("billing output exceeds bound")
              print(rendered)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("Modal read-only workspace billing summary\n\n")
                  f.write("Available monthly costs; remaining balance UNVERIFIED.\n\n")
                  f.write("~~~json\n" + rendered + "\n~~~\n")
          except BaseException as exc:
              # Exception CLASS ONLY: no traceback, message, account detail or token.
              print("READONLY_METADATA_FAILED " + type(exc).__name__)
              sys.exit(1)
          PY
