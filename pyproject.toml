[build-system]
requires = ["setuptools>=82,<90", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "whop-clipper"
version = "0.1.0"
description = "Rights-gated Whop brief to YouTube clip pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Mahmoud Bayoumi"}]
dependencies = [
  "PyYAML>=6.0.3,<7",
  "yt-dlp>=2026.7.4,<2027",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2.1,<2"]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15.22,<1",
  "types-PyYAML>=6.0.12.20241230,<7",
]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=clipper --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clipper"]
